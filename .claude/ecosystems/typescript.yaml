# JavaScript in this repository. Contract and schema:
# https://github.com/melodic-software/claude-code-plugins/tree/main/docs/contracts/ecosystem-commands
# Lint is CI's two Biome steps over their fixed scopes: the TypeScript fixture
# with its own config, and .github/scripts with the root biome.json
# (.github/workflows/pr-require-checks.yml; the command is
# .github/actions/biome/action.yml). The test is the node --test steps
# of CI's test-contracts job (pr-require-checks.yml).
# No tsconfig exists and CI builds nothing. Commands run from the repository
# root.
enabled: true
globs: ["*.js", "*.cjs", "*.mjs", "*.jsx", "*.ts", "*.tsx"]
project-discovery: []
build-cmd: null
test-cmd: >-
  node --test .github/scripts/*.test.cjs &&
  node --test .github/actions/report-lane-outcome/*.test.cjs &&
  node --test .github/actions/run-claude-cli/*.test.cjs &&
  node --test .github/actions/check-managed-files/*.test.cjs &&
  node --test .github/actions/check-dependabot-policy/*.test.mjs
requires:
  test-cmd:
    - name: check-dependabot-policy dependencies (ajv, yaml)
      probe: "npm ls --prefix \"$REPO_ROOT/.github/actions/check-dependabot-policy\" --omit=dev --logs-max=0 --no-update-notifier --silent"
      hint: "npm ci --prefix .github/actions/check-dependabot-policy --ignore-scripts --no-audit --no-fund, as CI's step at pr-require-checks.yml runs it"
check-cmd: >-
  biome ci --config-path=fixtures/typescript/good/biome.json --error-on-warnings fixtures/typescript/good &&
  biome ci --config-path=biome.json --error-on-warnings .github/scripts
fix-cmd: >-
  biome format --write --config-path=fixtures/typescript/good/biome.json fixtures/typescript/good &&
  biome format --write --config-path=biome.json .github/scripts
code-fix-cmd: >-
  biome check --write --config-path=fixtures/typescript/good/biome.json fixtures/typescript/good &&
  biome check --write --config-path=biome.json .github/scripts
opt-in: "biome.json at the repository root"
install-hint: "Biome 2.5.11 on PATH (npm i -g @biomejs/biome@2.5.11, the version CI runs); node 24.21.0 (.node-version). The tests need npm ci --ignore-scripts at the root, as CI runs it (pr-require-checks.yml); the subpackage's dependencies are a declared prerequisite (requires)."
tool-pin:
  biome: "2.5.11"
  node: "24.21.0"
gates: []
notes: "Pins: Biome is .github/actions/biome/action.yml's fallback-version, because package.json pins no @biomejs/biome; node is .node-version, as CI's test job reads it (pr-require-checks.yml). CI passes --reporter=github; it changes only the output format and is left out. The JavaScript under .github/actions/** (*.cjs, *.mjs) is never linted in CI: biome.json includes only .github/scripts/**, and these commands keep that scope. The check-cmd and test-cmd stop at the first failure, as CI's Biome and test jobs do (no step there sets continue-on-error). CI's step at pr-require-checks.yml installs the check-dependabot-policy subpackage's dependencies (ajv, yaml) before its test; this record installs nothing and declares them under requires instead. The probe is npm ls on that subpackage, which exits non-zero when a dependency is missing or does not match the exact versions its package.json pins, so it checks against the repository's own pin. While the probe fails, the whole test-cmd is skipped, the other node --test steps included, because an opaque command string cannot be partly run. That node_modules may stay in place: the yaml record's zizmor and ci-fanout-consolidation.test.cjs's hosted-label check read only tracked files, so the third-party workflows inside it are neither audited nor checked (zizmor given a subdirectory collects every nested workflow, https://docs.zizmor.sh/usage/#input-collection). The root install (graphql) is left to /toolchain:check's own npm ci --ignore-scripts rule. node --test exits 0 when a test is skipped; read its skipped count. The test job's last step, check-workflow-call-surface.cjs (pr-require-checks.yml), is a workflow check and runs from yaml.yaml. Glob gaps: CI's typescript filter also fires on any .github/** change, **/biome.json and fixtures/typescript/** (pr-require-checks.yml), and its test job on .node-version, package.json, package-lock.json and schemas/github/**; these globs select only script files."
