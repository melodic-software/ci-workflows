name: uses-only-composite
description: >-
  A composite action whose steps are all `uses:`, so it carries no embedded
  shell for ShellCheck to read. Nothing resolves the reference below — the
  fixture is only ever parsed, never executed. composite-run-shellcheck.test.sh
  points the check at this file and asserts discovery still announces it, so the
  coverage floor cannot fail an action that is legitimately shell-free.

runs:
  using: composite
  steps:
    - name: A step carrying no embedded shell
      uses: ./fixtures/composite-action/bad
