name: custom-shell-composite
description: >-
  Every shell shape the selector must classify, in one file: the two bare
  names, GitHub's custom-shell form (`command [...options] {0}`) for each of
  them, a PATH-QUALIFIED custom shell, and a dialect ShellCheck cannot read.
  The custom and path-qualified forms are the point — GitHub runs all of them
  with bash or sh, so a selector matching only the bare name (actionlint's own
  behaviour) would skip them while the job stayed green.
  composite-run-shellcheck.test.sh asserts every non-pwsh form here is checked
  rather than skipped, and that the independent block count agrees with what
  extraction produced.

runs:
  using: composite
  steps:
    - name: Bare bash
      shell: bash
      run: echo 'bare bash'

    - name: Custom bash
      shell: bash --noprofile --norc -eo pipefail {0}
      run: echo 'custom bash'

    - name: Custom sh
      shell: sh -e {0}
      run: echo 'custom sh'

    - name: Not a shell ShellCheck handles
      shell: pwsh
      run: Write-Output 'skipped out loud'

    - name: Path-qualified bash
      shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
      run: echo 'path-qualified bash'
