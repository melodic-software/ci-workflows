name: lychee-offline
description: Deterministic offline link/anchor reference-integrity check via lychee.

inputs:
  globs:
    description: >-
      File globs to scan, space-separated. Default scans all markdown.
    default: '**/*.md'
  config:
    description: Path to the lychee.toml ruleset in the caller repo.
    default: lychee.toml
  exclude:
    description: >-
      Path-exclude regexes, space-separated (e.g. intentionally-bad fixtures).
      Build/dependency dirs are excluded by the ruleset itself.
    default: ''
  version:
    description: Exact lychee version to install.
    default: 0.24.2
  sha256:
    description: >-
      SHA-256 of the linux x86_64 .tar.gz release asset for `version`. Change
      together with `version`.
    default: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a

runs:
  using: composite
  steps:
    # A warm pin never touches the network. install-release.sh re-verifies the
    # pinned SHA-256 on every restore, so the cache key is never trusted by itself.
    - name: Cache lychee release asset
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ci-workflows-release-cache/lychee
        key: lychee-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ inputs.sha256 }}

    - name: Install lychee
      shell: bash
      env:
        URL: https://github.com/lycheeverse/lychee/releases/download/lychee-v${{ inputs.version }}/lychee-x86_64-unknown-linux-gnu.tar.gz
        SHA256: ${{ inputs.sha256 }}
        BIN: lychee
        ARCHIVE_MEMBER: lychee-x86_64-unknown-linux-gnu/lychee
        STRIP_COMPONENTS: '1'
        ASSET_CACHE_DIR: ${{ runner.temp }}/ci-workflows-release-cache/lychee
      run: bash "$GITHUB_ACTION_PATH/../_shared/install-release.sh"

    - name: Check links (offline)
      shell: bash
      env:
        GLOBS: ${{ inputs.globs }}
        CONFIG: ${{ inputs.config }}
        EXCLUDE: ${{ inputs.exclude }}
      run: |
        set -euo pipefail
        if [[ ! -f "$CONFIG" ]]; then
          echo "::error::lychee-offline: config file not found: $CONFIG"
          exit 2
        fi
        # Anchor checks come from the ruleset's include_fragments (lychee's CLI
        # default is off); the config is intentionally not overridden here.
        args=(--offline --no-progress --config "$CONFIG")
        # $EXCLUDE entries are REGEXES; without set -f bash would pathname-expand
        # an entry containing a metacharacter before lychee sees it.
        set -f
        for e in $EXCLUDE; do
          args+=(--exclude-path "$e")
        done
        set +f
        # -d '' takes the whole value so a multi-line input still splits; read hits
        # EOF without finding that delimiter, hence the `|| true`.
        globs=()
        read -r -d '' -a globs <<<"$GLOBS" || true
        lychee "${args[@]}" "${globs[@]}"
