name: lychee-offline
description: Deterministic offline link/anchor reference-integrity check via lychee.

inputs:
  globs:
    description: >-
      File globs to scan, space-separated. Default scans all markdown.
    default: '**/*.md'
  config:
    description: Path to the lychee.toml ruleset in the caller repo.
    default: lychee.toml
  exclude:
    description: >-
      Path-exclude regexes, space-separated (e.g. intentionally-bad fixtures).
      Build/dependency dirs are excluded by the ruleset itself.
    default: ''
  version:
    description: Exact lychee version to install.
    default: 0.24.2
  sha256:
    description: >-
      SHA-256 of the linux x86_64 .tar.gz release asset for `version`. Change
      together with `version`.
    default: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a

runs:
  using: composite
  steps:
    # Persist the verified tarball across jobs so a warm version+sha256 pin
    # never touches the network — the shellcheck action's #156 pattern,
    # extended here as the primary defence against release-asset outages
    # like 2026-08-12 (#444). install-release.sh re-verifies the pinned
    # SHA-256 on every restore and re-downloads on mismatch, so the cache
    # key is never trusted by itself.
    - name: Cache lychee release asset
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ci-workflows-release-cache/lychee
        key: lychee-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ inputs.sha256 }}

    - name: Install lychee
      shell: bash
      env:
        URL: https://github.com/lycheeverse/lychee/releases/download/lychee-v${{ inputs.version }}/lychee-x86_64-unknown-linux-gnu.tar.gz
        SHA256: ${{ inputs.sha256 }}
        BIN: lychee
        ARCHIVE_MEMBER: lychee-x86_64-unknown-linux-gnu/lychee
        STRIP_COMPONENTS: '1'
        ASSET_CACHE_DIR: ${{ runner.temp }}/ci-workflows-release-cache/lychee
      run: bash "$GITHUB_ACTION_PATH/../_shared/install-release.sh"

    - name: Check links (offline)
      shell: bash
      env:
        GLOBS: ${{ inputs.globs }}
        CONFIG: ${{ inputs.config }}
        EXCLUDE: ${{ inputs.exclude }}
      run: |
        set -euo pipefail
        if [[ ! -f "$CONFIG" ]]; then
          echo "::error::lychee-offline: config file not found: $CONFIG"
          exit 2
        fi
        # --offline skips all network requests, so only local file links and
        # (when the ruleset sets include_fragments, as the standard lychee.toml
        # does) #anchors are checked — fully deterministic. lychee's own CLI
        # default for fragment checking is off, so anchor integrity is ruleset-
        # driven; the config is intentionally not overridden here.
        args=(--offline --no-progress --config "$CONFIG")
        # noglob for the exclude loop: $EXCLUDE entries are --exclude-path
        # REGEXES. Without set -f, GH Actions bash (globstar off) would
        # pathname-expand an entry containing a metacharacter before lychee
        # sees it as a regex.
        set -f
        for e in $EXCLUDE; do
          args+=(--exclude-path "$e")
        done
        set +f
        # Split into an array at the input boundary so multiple globs reach
        # lychee as separate arguments. $GLOBS is lychee's own glob syntax
        # (lychee expands ** itself and documents quoting the pattern); quoting
        # the array keeps bash from touching it at all, so noglob is not needed
        # for this part. -d '' takes the whole value so a caller-authored
        # multi-line input still splits; read hits EOF without finding that
        # delimiter, hence the `|| true`.
        globs=()
        read -r -d '' -a globs <<<"$GLOBS" || true
        lychee "${args[@]}" "${globs[@]}"
