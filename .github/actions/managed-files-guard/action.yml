name: managed-files-guard
description: >-
  Fail when a PR hand-edits files managed by melodic-software/standards'
  sync-manifest (ci-workflows#208). Advisory-first: wire into ci-status only
  after a clean soak.

inputs:
  standards-ref:
    description: >-
      Git ref of melodic-software/standards to resolve the sync-manifest from.
      Pin to a full SHA in callers once soak completes.
    default: main
  repository:
    description: Target repository identity OWNER/REPO (defaults to this repo).
    default: ${{ github.repository }}
  base-ref:
    description: Git ref to diff against for changed files.
    default: ${{ github.event.pull_request.base.sha || github.sha }}
  head-ref:
    description: Git ref of the PR head (or current SHA for non-PR runs).
    default: ${{ github.event.pull_request.head.sha || github.sha }}

runs:
  using: composite
  steps:
    - name: Skip standards-sync PRs
      id: skip
      shell: bash
      env:
        PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        PR_ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
      run: |
        set -euo pipefail
        skip=false
        if [[ ",${PR_LABELS}," == *",standards-sync,"* ]]; then
          skip=true
        fi
        case "$PR_ACTOR" in
          melodic-standards-sync[bot]|melodic-standards-sync) skip=true ;;
        esac
        echo "skip=$skip" >>"$GITHUB_OUTPUT"
        if [[ "$skip" == true ]]; then
          echo "Exempt sync PR/actor — managed-files-guard no-ops."
        fi

    - name: Check out standards manifest source
      if: steps.skip.outputs.skip != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: melodic-software/standards
        ref: ${{ inputs.standards-ref }}
        path: .managed-files-guard-standards
        persist-credentials: false

    # Node-engine prep, gated mechanically on the engine flavor the pinned
    # standards ref carries: a checkout with sync-manifest.mjs needs the
    # engine's locked dependencies before dest-paths can run post-cutover.
    # Uses the runner-preinstalled node/npm — the same runner-image posture
    # this action already takes for yq (recorded in the standards
    # distribution THREAT-MODEL), acceptable for this advisory-first PR
    # check; the sync reusables pin their own Node.
    - name: Install engine dependencies
      if: steps.skip.outputs.skip != 'true'
      shell: bash
      env:
        STANDARDS_ROOT: ${{ github.workspace }}/.managed-files-guard-standards
      run: |
        set -euo pipefail
        if [[ -f "$STANDARDS_ROOT/distribution/sync-manifest.mjs" ]]; then
          npm ci --prefix "$STANDARDS_ROOT/distribution" \
            --omit=dev --ignore-scripts --no-audit --no-fund \
            --fetch-retries=8 --fetch-retry-mintimeout=1000 \
            --fetch-retry-maxtimeout=60000
        else
          echo "Pinned standards ref predates the Node engine — no dependencies to install."
        fi

    - name: Reject hand-edits of managed files
      if: steps.skip.outputs.skip != 'true'
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        BASE_REF: ${{ inputs.base-ref }}
        HEAD_REF: ${{ inputs.head-ref }}
        STANDARDS_ROOT: ${{ github.workspace }}/.managed-files-guard-standards
      run: bash "$GITHUB_ACTION_PATH/run.sh"
