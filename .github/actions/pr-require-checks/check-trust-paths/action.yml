name: check-trust-paths
description: >-
  pr-require-checks-trust-paths' check: posts the commit status `ci-status`
  on the pull request's head SHA, `failure` when an agent App named in the
  default branch's config opened the pull request, wrote one of its commits or
  pushed one of its commits to its head branch, and it changes a privileged
  path the config lists; `success` otherwise. Needs a `pull_request_target` event and a
  token with `statuses: write`, `pull-requests: read` and `contents: read`.
  A read that fails fails the step. check.cjs documents the rules.

inputs:
  config-path:
    description: Path of the JSON config, read at the default branch's last commit.
    required: true

outputs:
  state:
    description: "The posted state: `success` or `failure`."
    value: ${{ steps.check.outputs.state }}

runs:
  using: composite
  steps:
    - name: Check privileged paths
      id: check
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        CONFIG_PATH: ${{ inputs.config-path }}
      with:
        script: |
          const path = require("node:path");
          const { run } = require(path.join(process.env.ACTION_PATH, "check.cjs"));
          await run({ github, context, core });
