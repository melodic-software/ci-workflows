name: ci-status
description: >-
  Aggregate lane results into one pass/fail gate. Fails naming the first result
  that does not pass; whether `skipped` passes is the caller's policy. Records
  the verdict as a commit status so a contract-only pull-request event
  (`edited`, `labeled`, `unlabeled`) can carry it forward without re-running the
  lanes.

inputs:
  results:
    description: >-
      Whitespace-separated job results, one per aggregated lane — the caller
      builds this from `needs.<lane>.result`. Empty fails: a gate with nothing
      to aggregate is a miswired `needs` list, not a pass. Ignored when
      `contract-only` is true, where every lane is `skipped` by construction,
      and when `record-pending` is true.
    required: true
  treat-skipped-as:
    description: >-
      Whether a `skipped` lane passes the gate: `pass` or `fail`. Defaults to
      `pass`. Use `fail` where a skip means a lane that should have run did not
      — for example a runner selector that fell back and left downstream lanes
      skipped, which must go red rather than green.
    default: pass
  contract-only:
    description: >-
      `true` when this run's lanes were gated off because only the pull-request
      contract could have changed, so aggregation is skipped and the recorded
      commit status decides instead. The default is the contract-only predicate
      itself, so a caller passes nothing; it must stay identical to the
      expression the caller's lane jobs are gated on, or the two disagree about
      whether the lanes ran.
    default: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
      (github.event.action == 'edited' && !github.event.changes.base)) }}
  same-repo:
    description: >-
      `false` for a fork pull request, whose token is read-only on
      `pull_request` whatever `permissions:` requests. A fork run aggregates and
      reports the lanes verdict but records no commit status, because it cannot;
      it therefore runs the full workflow on every event, as before.
    default: >-
      ${{ !github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository }}
  status-context:
    description: >-
      Commit-status context this action writes in full mode and reads in
      carry-forward mode. Distinct from the `ci-status` check-run name on
      purpose: a check run cannot say which event produced it, so only a status
      only full runs write can stop a chain of contract-only runs from
      self-certifying.
    default: ci-lanes
  carry-forward-wait-seconds:
    description: >-
      Ceiling, in seconds, on the carry-forward wait. In carry-forward mode this
      action polls every 15 seconds. Each poll lists the runs of this same
      workflow on this same head SHA that are still incomplete, excluding this
      run, and then reads the `status-context` status list. A `success` is a
      settled verdict and ends the poll. A `failure` or `error` ends it too,
      unless the full run that wrote it (the run its `target_url` names) is
      re-running with an attempt that started after the status was created;
      then the poll waits on that run alone. Otherwise the run stops
      when nothing is in flight, which is the immediate fail on an absent status
      that this action has always had when no full run is coming, and sleeps
      when something is.
      ANY in-flight sibling is waited on, at any run id. Waiting only on lower
      run ids, as v0.22.1 did, assumed a full run always outranks the
      contract-only run beside it; a pull request opened with labels already
      applied creates the two together and either may draw the lower id, so the
      contract-only run that drew it read a status not yet written and failed
      instantly. Reading the settled status each poll is what now stops two
      contract-only runs waiting on each other: the full run's verdict releases
      both.
      Listing before reading WITHIN a poll is load-bearing. A sibling writes the
      status and flips to `completed` moments later, and the other order lets
      that completion land between the two calls and report both no status and
      nothing in flight.
      Reaching the ceiling fails the run; there is no pass-on-timeout path. Two
      cases run to the ceiling and fail closed: two or more contract-only runs
      on a SHA with no status and no full run in flight to write one, and a
      writer re-run slower than the ceiling. The ceiling counts elapsed
      wall-clock time from the start of the wait, API calls included, so it
      overruns by at most one poll's calls. Every red names the remedy that
      fits the status it read (see `rerun-contract-only-siblings`).
      `0` reads the status once, never waits, and makes no Actions call.
      `yield-to-full-run` replaces the wait instead and is the recommended
      setting, with `record-pending`, `rerun-contract-only-siblings` and a
      calling-job `timeout-minutes` of 3: no run then waits for another.
      A wait above `0` needs `actions: read` on the calling job: under an
      explicit `permissions:` block the default is none, and a 403 warns
      naming the scope and degrades to the status read alone.
      A WAIT ABOVE `0` IS SIZED FROM THE REPOSITORY'S OWN MEASURED FULL RUN,
      not from the calling job's budget. The ceiling must cover the queue wait
      plus the p95 wall of the full `ci` run; set the calling job's
      `timeout-minutes` to at least that figure plus two minutes, then set
      this input to `timeout-minutes * 60 - 60`. Staying 60 seconds below
      `timeout-minutes` keeps the job timeout from preempting the fail-closed
      error. The `240` default suits only a repository whose full run finishes
      in well under two minutes; see the composite's README section for the
      values in use.
    default: '240'
  rerun-contract-only-siblings:
    description: >-
      `true` to have a full run that records `success` re-run every failed
      contract-only run of this same workflow on the same head SHA, so each
      red `ci-status` check run is replaced by one that reads the success.
      A contract-only run is recognized by its jobs: in its latest attempt
      every job but one was skipped, and that one failed. A full run always
      runs more than its gate and this run is excluded by id, so neither is
      ever re-run. A re-run attempt keeps its original event and is
      contract-only again, so it never re-runs anything itself. A
      carry-forward red then says the full run will re-run it instead of
      telling the reader to. The calling job needs `actions: write`; a
      refusal warns and never changes this run's verdict. Off by default.
    default: 'false'
  record-pending:
    description: >-
      `true` to mark `status-context` `pending` on `sha` and stop, with no
      aggregation and no carry-forward. Call it from the first job of the
      full run: a contract-only run that reads the status while this run is
      in flight then finds `pending` and fails, instead of carrying an older
      run's `success` forward (a draft run's, for example), and this run's
      own gate records the real verdict over it. It writes only on a
      same-repository pull request event that is not contract-only, and
      notes the skip and passes otherwise: a fork's token is read-only, and
      neither a push nor a contract-only run is the full run a contract-only
      run waits for. `results` is ignored. The calling job needs
      `statuses: write`. Off by default.
    default: 'false'
  yield-to-full-run:
    description: >-
      `true` to have a contract-only run never wait: it lists this workflow's
      in-flight runs on the head SHA once, then reads the `status-context`
      status once. A full run in flight supersedes it, so it fails at once
      with `superseded by full run <url>`: that run's own `ci-status` check run
      is newer and decides the merge gate, and with
      `rerun-contract-only-siblings` it re-runs this run once it records
      `success`. With no full run in flight it passes only on a recorded
      `success`. An in-flight sibling whose latest attempt skipped every job
      but one is contract-only and ignored; any other sibling, including one
      whose jobs cannot be read yet, counts as a full run, so a misread goes
      red, never green. The writer of a `success` already on the SHA is
      ignored while the attempt that wrote it finishes. Overrides
      `carry-forward-wait-seconds`. Closes the gap `record-pending` alone
      leaves, a full run queued before its `pending` marker is written. The
      calling job needs `actions: read`; a listing that fails after three
      tries fails the run. Off by default.
    default: 'false'
  token:
    description: >-
      Token used to write and read the commit status. The calling job needs
      `statuses: write`; on a same-repository run the status write is
      load-bearing and a run whose write is refused fails.
    default: ${{ github.token }}
  repository:
    description: Target repository identity OWNER/REPO (defaults to this repo).
    default: ${{ github.repository }}
  sha:
    description: Commit SHA the status is written to and read from.
    default: ${{ github.event.pull_request.head.sha || github.sha }}

runs:
  using: composite
  steps:
    - name: Aggregate lane results
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
        TREAT_SKIPPED_AS: ${{ inputs.treat-skipped-as }}
        CONTRACT_ONLY: ${{ inputs.contract-only }}
        SAME_REPO: ${{ inputs.same-repo }}
        STATUS_CONTEXT: ${{ inputs.status-context }}
        CARRY_FORWARD_WAIT_SECONDS: ${{ inputs.carry-forward-wait-seconds }}
        RERUN_CONTRACT_ONLY_SIBLINGS: ${{ inputs.rerun-contract-only-siblings }}
        RECORD_PENDING: ${{ inputs.record-pending }}
        YIELD_TO_FULL_RUN: ${{ inputs.yield-to-full-run }}
        GH_TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ inputs.repository }}
        SHA: ${{ inputs.sha }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
