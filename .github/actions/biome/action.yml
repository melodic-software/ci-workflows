name: biome
description: Lint and format-check JavaScript/TypeScript with Biome against a caller-supplied config.

inputs:
  paths:
    description: >-
      Files/dirs to check (relative to the caller repo), space-separated.
      Directories recurse. Default checks the whole repo. Biome has no CLI
      exclude flag and treats path arguments as literal (no glob/negation), so
      narrow scope here, or via `files.includes` (with `!` negation) in the
      config.
    default: '.'
  config:
    description: >-
      Path to the biome.json ruleset in the caller repo, passed as Biome's
      --config-path.
    default: biome.json
  version:
    description: Exact Biome version to run.
    # This default governs only a caller with no Biome pin of its own. A caller
    # that carries @biomejs/biome in package.json already has a
    # Dependabot-maintained pin, and that is the version its own lanes run — so
    # keep this in step with the newest such pin in the fleet rather than with
    # upstream latest, or the two disagree about what a finding is. Whether this
    # action should derive the version from the caller's package.json instead of
    # carrying a second authority is #377.
    default: 2.5.6
  node-version:
    description: Node.js version to set up.
    default: 24.18.0

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Lint and format-check
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        CONFIG: ${{ inputs.config }}
        VERSION: ${{ inputs.version }}
      # `biome ci` is the read-only CI command — formatter, linter and import
      # sorting in one non-mutating pass. --error-on-warnings makes any warning
      # fail the build (strict posture, the analog of pyright --warnings).
      # --reporter=github emits inline PR annotations.
      run: |
        set -euo pipefail

        if [[ ! -f "$CONFIG" ]]; then
          echo "::error::biome: config file not found: $CONFIG"
          exit 2
        fi
        # Split into an array at the input boundary so multiple targets reach
        # biome as separate arguments. -d '' takes the whole value so a
        # caller-authored multi-line input still splits; read hits EOF without
        # finding that delimiter, hence the `|| true`.
        paths=()
        read -r -d '' -a paths <<<"$PATHS" || true
        npx --yes "@biomejs/biome@$VERSION" ci --config-path="$CONFIG" --error-on-warnings --reporter=github "${paths[@]}"
