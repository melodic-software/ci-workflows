name: gitleaks
description: Scan a file, directory, or local Git history with gitleaks against a caller-supplied config.

inputs:
  path:
    description: >-
      File or directory to scan (relative to the caller repo). Git mode requires
      a directory within a valid local Git worktree or repository.
    default: '.'
  scan-mode:
    description: >-
      What to scan: `dir` (the working tree, the default) or `git` (commit
      history, scoped by `log-opts`). Git mode requires a valid, non-shallow
      local worktree or repository; check out with fetch-depth: 0.
    default: dir
  log-opts:
    description: >-
      Git-mode revision set passed to gitleaks as --log-opts (split on single
      spaces). Empty picks a default from the triggering event:
      `<pull_request.base.sha>..HEAD` on pull_request and pull_request_target
      (the PR's own commits; an empty range fails closed), `--all` on schedule
      and workflow_dispatch (a sweep of every local ref), and `HEAD` otherwise
      (the checked-out branch's history). PR and push runs do not scan other
      branches, so one branch's fixture cannot fail another branch's run.
      Mark token-shaped test fixtures with an inline `gitleaks:allow` comment;
      the marker travels with the commit into every scan.
    default: ''
  config:
    description: Path to the gitleaks config (.gitleaks.toml) in the caller repo.
    default: .gitleaks.toml
  report-format:
    description: >-
      Report format to emit: json, csv, junit, sarif, or template. Empty emits
      no report file. SARIF enables safe local annotations without uploading an
      artifact. Private callers must not upload it to GitHub code scanning unless
      they have intentionally purchased the required Code Security entitlement.
    default: ''
  report-path:
    description: >-
      Path to write the report when report-format is set. Written before a
      non-zero exit, so it exists even when secrets are found.
    default: ''
  redact:
    description: >-
      Deprecated compatibility input. Secret values are always redacted from
      gitleaks output and reports; false is accepted but cannot disable redaction.
    default: 'true'
  version:
    description: Exact gitleaks version to install.
    default: 8.30.1
  sha256:
    description: >-
      SHA-256 of the linux_x64 .tar.gz release asset for `version`. Change
      together with `version`.
    default: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

runs:
  using: composite
  steps:
    # install-release.sh re-verifies the SHA-256 on every restore and fails
    # closed: a secret scan that silently skipped is worse than a red check.
    - name: Cache gitleaks release asset
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ci-workflows-release-cache/gitleaks
        key: gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ inputs.sha256 }}

    - name: Install gitleaks
      shell: bash
      env:
        URL: https://github.com/gitleaks/gitleaks/releases/download/v${{ inputs.version }}/gitleaks_${{ inputs.version }}_linux_x64.tar.gz
        SHA256: ${{ inputs.sha256 }}
        BIN: gitleaks
        ARCHIVE_MEMBER: gitleaks
        VERSION_CMD: version
        ASSET_CACHE_DIR: ${{ runner.temp }}/ci-workflows-release-cache/gitleaks
      run: bash "$GITHUB_ACTION_PATH/../_shared/install-release.sh"

    - name: Scan for secrets
      shell: bash
      env:
        PATH_TO_SCAN: ${{ inputs.path }}
        SCAN_MODE: ${{ inputs.scan-mode }}
        LOG_OPTS: ${{ inputs.log-opts }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CONFIG: ${{ inputs.config }}
        REPORT_FORMAT: ${{ inputs.report-format }}
        REPORT_PATH: ${{ inputs.report-path }}
        REDACT: ${{ inputs.redact }}
      run: bash "$GITHUB_ACTION_PATH/scan.sh"
