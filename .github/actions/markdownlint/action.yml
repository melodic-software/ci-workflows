name: markdownlint
description: >-
  Lint Markdown with markdownlint-cli2 against the caller's config, or
  standards' when the caller has none.

inputs:
  globs:
    description: >-
      markdownlint-cli2 glob arguments, space-separated (word-split on the
      runner). Prefix a glob with '!' to exclude. Default lints all markdown.
    default: '**/*.md'
  config:
    description: >-
      Path to the markdownlint-cli2 config file in the caller repo. When the
      default path is absent, melodic-software/standards' own
      .markdownlint-cli2.jsonc at `standards-ref` is used instead.
    default: .markdownlint-cli2.jsonc
  standards-ref:
    description: >-
      Branch or full commit SHA of melodic-software/standards the config
      falls back to (see the download-standards action). Pass the run's
      resolved SHA so every job reads one commit.
    default: main
  annotations:
    description: >-
      Register a problem matcher so each finding renders as a GitHub inline
      PR-diff annotation (markdownlint-cli2 has no native GitHub formatter; the
      matcher parses its `file:line:col … MD### …` output). Self-contained — no
      change to the caller's config. Set false for summary output only.
    default: 'true'
  version:
    description: Exact markdownlint-cli2 version to run.
    # Authority: melodic-software/standards' markdownlint-cli2 pin. Absorb bumps
    # to match that pin, never past it; npm latest can lead standards.
    default: 0.23.3
  node-version:
    description: Exact X.Y.Z Node.js version to set up (Linux X64 runners).
    default: 24.21.0

runs:
  using: composite
  steps:
    # Not actions/setup-node: on a tool-cache miss it reads the node-versions
    # manifest through the GitHub API with the job token (see
    # setup-pinned-node's README).
    - name: Set up Node
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
      run: |
        set -euo pipefail
        printf '%s\n' "$NODE_VERSION" >"$RUNNER_TEMP/markdownlint-node-version"
        bash "$GITHUB_ACTION_PATH/../setup-pinned-node/install-node.sh" "$RUNNER_TEMP/markdownlint-node-version"

    - name: Lint markdown
      shell: bash
      env:
        GLOBS: ${{ inputs.globs }}
        CONFIG: ${{ inputs.config }}
        STANDARDS_REF: ${{ inputs.standards-ref }}
        ANNOTATIONS: ${{ inputs.annotations }}
        VERSION: ${{ inputs.version }}
        MATCHER: ${{ github.action_path }}/markdownlint-problem-matcher.json
      run: bash "$GITHUB_ACTION_PATH/run.sh"
