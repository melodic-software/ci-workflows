name: editorconfig
description: >-
  Validate files against the repo .editorconfig with editorconfig-checker,
  using a caller-supplied config.

inputs:
  paths:
    description: >-
      Files/dirs to check (relative to the caller repo), space-separated.
      Empty (the default) runs editorconfig-checker in its native git-aware
      mode: only files tracked by git are checked, so ignored or generated
      artifacts present in a dirty/post-build tree are never gated. Pass
      explicit paths to check exactly those files instead — a raw filesystem
      walk that does NOT consult .gitignore (the tool's documented behavior
      when given FILE arguments).
    default: ''
  config:
    description: Path to the editorconfig-checker JSON config in the caller repo.
    default: .editorconfig-checker.json
  exclude:
    description: >-
      A single regular expression of paths to skip (e.g. intentionally-bad
      fixtures). Unlike most lanes this is one regex, not space-split globs;
      combine multiple patterns with '|'. Additive on top of the config's own
      Exclude list.
    default: ''
  format:
    description: >-
      Output format: default, gcc, github-actions, or codeclimate. Empty uses
      the tool default. Use github-actions for inline PR annotations.
    default: ''
  version:
    description: Exact editorconfig-checker version to install.
    default: 3.11.2
  sha256:
    description: >-
      SHA-256 of the ec-linux-amd64.tar.gz release asset for `version`. Change
      together with `version`.
    default: bc815e5b3b1891a0ee9e1242fe3475312655f8b0f4c4a79510be0a009294571a

runs:
  using: composite
  steps:
    # Persist the verified tarball across jobs so a warm version+sha256 pin
    # never touches the network — the shellcheck action's #156 pattern,
    # extended here as the primary defence against release-asset outages
    # like 2026-08-12 (#444). install-release.sh re-verifies the pinned
    # SHA-256 on every restore and re-downloads on mismatch, so the cache
    # key is never trusted by itself.
    - name: Cache editorconfig-checker release asset
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ci-workflows-release-cache/editorconfig-checker
        key: editorconfig-checker-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ inputs.sha256 }}

    - name: Install editorconfig-checker
      shell: bash
      env:
        URL: https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${{ inputs.version }}/ec-linux-amd64.tar.gz
        SHA256: ${{ inputs.sha256 }}
        BIN: ec
        ARCHIVE_MEMBER: bin/ec-linux-amd64
        ASSET_CACHE_DIR: ${{ runner.temp }}/ci-workflows-release-cache/editorconfig-checker
      run: bash "$GITHUB_ACTION_PATH/../_shared/install-release.sh"

    - name: Check editorconfig conformance
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        CONFIG: ${{ inputs.config }}
        EXCLUDE: ${{ inputs.exclude }}
        FORMAT: ${{ inputs.format }}
      run: |
        set -euo pipefail
        if [[ ! -f "$CONFIG" ]]; then
          echo "::error::editorconfig: config file not found: $CONFIG"
          exit 2
        fi
        args=(-config "$CONFIG")
        # -exclude takes ONE regex (quoted, never word-split).
        if [[ -n "${EXCLUDE// }" ]]; then args+=(-exclude "$EXCLUDE"); fi
        if [[ -n "${FORMAT// }" ]]; then args+=(-format "$FORMAT"); fi
        # Split into an array at the input boundary so multiple targets reach
        # ec as separate arguments. -d '' takes the whole value so a
        # caller-authored multi-line input still splits; read hits EOF without
        # finding that delimiter, hence the `|| true`.
        paths=()
        read -r -d '' -a paths <<<"$PATHS" || true
        ec "${args[@]}" "${paths[@]}"
