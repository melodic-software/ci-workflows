name: check-jsonschema
description: >-
  Validate JSON/YAML files against one JSON Schema with check-jsonschema. One
  invocation = one schema source + one-or-more files; call once per schema group.

inputs:
  files:
    description: >-
      Space-separated files or shell globs to validate (relative to the caller
      repo). A glob matching nothing is dropped, so patterns may be listed
      defensively (e.g. both *.yml and *.yaml); the step fails if the whole
      list expands to no files.
    required: true
  builtin-schema:
    description: >-
      Name of a built-in vendored schema (e.g. vendor.dependabot,
      vendor.github-workflows, vendor.github-actions). Mutually exclusive with
      schemafile; set exactly one.
    default: ''
  schemafile:
    description: >-
      Path or URL of a caller-supplied JSON Schema. Mutually exclusive with
      builtin-schema; set exactly one.
    default: ''
  no-cache:
    description: Disable schema/$ref caching (true/false).
    default: 'false'
  output-format:
    description: 'Output format: TEXT or JSON. Empty uses the tool default (TEXT).'
    default: ''
  default-filetype:
    description: >-
      Parser for files whose extension is not json/yaml/toml (e.g. yaml for
      WinGet `.winget` documents). Empty (the default) leaves the tool's own
      behavior, which parses such a file as JSON and fails on a YAML document.
    default: ''
  version:
    description: Exact check-jsonschema version to run.
    default: 0.38.0
  python-version:
    description: Exact Python patch version uv provisions for the ephemeral tool environment.
    default: '3.14.7'

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Validate
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        BUILTIN: ${{ inputs.builtin-schema }}
        SCHEMAFILE: ${{ inputs.schemafile }}
        NO_CACHE: ${{ inputs.no-cache }}
        OUTPUT_FORMAT: ${{ inputs.output-format }}
        DEFAULT_FILETYPE: ${{ inputs.default-filetype }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [[ -z "${FILES// }" ]]; then
          echo '::error::files is required.'; exit 1
        fi
        if [[ -n "${BUILTIN// }" && -n "${SCHEMAFILE// }" ]]; then
          echo '::error::Set only one of builtin-schema or schemafile, not both.'; exit 1
        fi
        if [[ -z "${BUILTIN// }" && -z "${SCHEMAFILE// }" ]]; then
          echo '::error::Set one of builtin-schema or schemafile.'; exit 1
        fi
        args=()
        if [[ -n "${BUILTIN// }" ]]; then args+=(--builtin-schema "$BUILTIN"); fi
        if [[ -n "${SCHEMAFILE// }" ]]; then args+=(--schemafile "$SCHEMAFILE"); fi
        if [[ "$NO_CACHE" == "true" ]]; then args+=(--no-cache); fi
        if [[ -n "${OUTPUT_FORMAT// }" ]]; then args+=(--output-format "$OUTPUT_FORMAT"); fi
        if [[ -n "${DEFAULT_FILETYPE// }" ]]; then args+=(--default-filetype "$DEFAULT_FILETYPE"); fi
        # nullglob drops non-matching patterns; the guard below keeps that from
        # degrading into a zero-file invocation, which would exit 0 (false green).
        shopt -s nullglob
        # shellcheck disable=SC2206
        targets=($FILES)
        shopt -u nullglob
        if [[ ${#targets[@]} -eq 0 ]]; then
          echo "::error::files expanded to no existing paths: ${FILES}"; exit 1
        fi
        uvx "check-jsonschema@${VERSION}" "${args[@]}" "${targets[@]}"
