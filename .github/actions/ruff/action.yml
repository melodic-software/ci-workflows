name: ruff
description: Lint and format-check Python with Ruff against a caller-supplied config.

inputs:
  paths:
    description: >-
      Files/dirs to check (relative to the caller repo), space-separated.
      Directories recurse. Default checks the whole repo.
    default: '.'
  config:
    description: Path to the ruff.toml ruleset in the caller repo.
    default: ruff.toml
  exclude:
    description: >-
      Path patterns to skip, space-separated (e.g. intentionally-bad fixtures).
      Added on top of the config's own excludes and Ruff's defaults, never
      replacing them.
    default: ''
  version:
    description: Exact Ruff version to run.
    # Keep in step with the fleet pin in melodic-software/dotfiles
    # (.chezmoidata/uv-tools.yaml). A caller whose developers run the fleet ruff
    # while this action runs an older one gets findings CI cannot see, and — as
    # of 0.16.0, which changed the DEFAULT rule set — findings that differ in
    # both directions. Callers pass an explicit `config`, so a default-set change
    # cannot reach them; the parity that matters here is version, not rules.
    default: 0.16.5
  python-version:
    description: Exact Python patch version uv provisions for the ephemeral tool environment.
    default: '3.14.7'

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: ${{ inputs.python-version }}

    - name: Lint and format-check
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        CONFIG: ${{ inputs.config }}
        EXCLUDE: ${{ inputs.exclude }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [[ ! -f "$CONFIG" ]]; then
          echo "::error::ruff: config file not found: $CONFIG"
          exit 2
        fi
        args=(--config "$CONFIG")
        # Translate the excludes into an additive extend-exclude TOML override so
        # the config's own excludes (and Ruff's defaults) survive. extend-exclude
        # is the one exclude mechanism both `check` and `format` honour via
        # --config; `ruff format` has no --extend-exclude flag, and a bare
        # --exclude would replace the defaults rather than add to them.
        if [[ -n "${EXCLUDE// }" ]]; then
          quoted=()
          # set -f: $EXCLUDE is unquoted to word-split, but its entries are Ruff
          # extend-exclude PATTERNS (e.g. fixtures/**) — without noglob bash would
          # pathname-expand them to today's matching paths before Ruff sees them.
          set -f
          for e in $EXCLUDE; do quoted+=("'$e'"); done
          set +f
          IFS=,; joined="${quoted[*]}"; unset IFS
          args+=(--config "extend-exclude=[$joined]")
        fi
        # Split into an array at the input boundary so multiple targets reach
        # ruff as separate arguments. -d '' takes the whole value so a
        # caller-authored multi-line input still splits; read hits EOF without
        # finding that delimiter, hence the `|| true`.
        paths=()
        read -r -d '' -a paths <<<"$PATHS" || true
        rc=0
        # Run both checks even if the first fails, so a single run surfaces
        # every issue. --output-format=github emits inline PR annotations for
        # lint findings (the formatter has no such format; its diff goes to the
        # log).
        uvx "ruff@${VERSION}" check "${paths[@]}" "${args[@]}" --output-format=github || rc=1
        uvx "ruff@${VERSION}" format --check "${paths[@]}" "${args[@]}" || rc=1
        exit $rc
