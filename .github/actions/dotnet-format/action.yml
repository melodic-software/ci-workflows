name: .NET Format
description: >-
  Verify C# formatting that the build does not own: whitespace/layout via `dotnet
  format whitespace --verify-no-changes`, and using-directive organization via
  `dotnet format style --diagnostics IDE0055 --verify-no-changes`. The build-time
  analyzers own code-style (IDExxxx) and code-quality (CAxxxx); these two lanes
  cover only formatting and import ordering, so none of the three double-report.

inputs:
  project:
    description: >-
      Project or solution to check (relative to the caller repo). Leave empty to
      use the project/solution in the working directory.
    default: ''
  dotnet-version:
    description: >-
      .NET SDK version to install. Left empty (the default),
      `actions/setup-dotnet` falls back to reading the caller's own
      global.json, so the installed SDK always matches what the caller's repo
      declares instead of a version hardcoded here. Pass an explicit value to
      override that. With neither, the action fails.
    default: ''

runs:
  using: composite
  steps:
    - name: Set up .NET
      id: setup-dotnet
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Require a .NET SDK version
      # setup-dotnet installs nothing and exits 0 when given no version and no
      # global.json; fail rather than format on whatever SDK the runner ships.
      if: steps.setup-dotnet.outputs.dotnet-version == ''
      shell: bash
      run: |
        echo '::error::dotnet-format: no .NET SDK version; set dotnet-version or commit a global.json at the repository root.'
        exit 1

    - name: Verify whitespace
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
      run: |
        set -euo pipefail
        args=()
        if [[ -n "${PROJECT// }" ]]; then args+=("$PROJECT"); fi
        dotnet format whitespace "${args[@]}" --verify-no-changes

    - name: Verify import ordering
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
      # The OrganizeImports pass runs regardless of IDE0055's configured severity,
      # so --diagnostics IDE0055 gates import ordering and nothing the build owns.
      run: |
        set -euo pipefail
        args=()
        if [[ -n "${PROJECT// }" ]]; then args+=("$PROJECT"); fi
        dotnet format style "${args[@]}" --diagnostics IDE0055 --verify-no-changes
