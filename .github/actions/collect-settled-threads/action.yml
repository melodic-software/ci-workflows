name: Collect Settled Threads
description: >-
  pr-review-cli's settled-threads step, with no model: collects the pull
  request's review threads that a trusted-actor-listed account resolved or a
  listed person answered into a file the model reads, keeping only text
  claude-code-plugins' select-trusted-text keeps, and records for each thread whether the lines under it changed since the
  head it was settled at. The trusted-actor list is standards' own at
  `standards-ref`, read only when the base commit's
  docs/conventions/source-control.yaml names melodic-software/standards as its
  standards_repository; a synced copy is never read. When no standards
  repository is named or the list cannot be read, the step fails and writes
  nothing. settled-threads.cjs documents the env it reads.

inputs:
  source:
    description: The claude-code-plugins clone holding .github/actions/select-trusted-text and plugins/review/lib/lane-binding.mjs.
    required: true
  output-file:
    description: Where the threads file is written, inside the checkout.
    required: true
  pr-number:
    description: The pull request's number. Defaults to the pull_request event's.
    default: ${{ github.event.pull_request.number }}
  head-sha:
    description: The head commit. Defaults to the pull_request event's.
    default: ${{ github.event.pull_request.head.sha }}
  base-sha:
    description: The base commit whose source-control.yaml names the standards repository. Defaults to the pull_request event's.
    default: ${{ github.event.pull_request.base.sha }}
  head-ref:
    description: The head branch. Defaults to the pull_request event's.
    default: ${{ github.event.pull_request.head.ref }}
  standards-ref:
    description: >-
      Branch or full commit SHA of melodic-software/standards whose
      trusted-actor list applies (see the download-standards action).
    default: main

outputs:
  note:
    description: The prompt line naming the file, or empty when none was written.
    value: ${{ steps.threads.outputs.note }}

runs:
  using: composite
  steps:
    - name: Write the settled review threads
      id: threads
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_REF: ${{ inputs.head-ref }}
        SOURCE: ${{ inputs.source }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        STANDARDS_REF: ${{ inputs.standards-ref }}
        GIT_TOKEN: ${{ github.token }}
      with:
        script: |
          const path = require("node:path");
          require(path.join(process.env.ACTION_PATH, "..", "report-api-budget", "api-budget.cjs")).watch(github, "github-token");
          const { run } = require(path.join(process.env.ACTION_PATH, "settled-threads.cjs"));
          await run({ github, context, core });
