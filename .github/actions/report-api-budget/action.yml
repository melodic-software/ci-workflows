name: Log API budget
description: >
  At the end of a job, write the hub collector's notices for each named
  token, from the rate-limit readings the job's own API responses left in
  $RUNNER_TEMP/api-budget: Octokit's, through api-budget.cjs's watch, and
  the `gh api -i` output files named in `responses` (route `other`). First
  an `api-calls` notice per token, `<name>=N not-modified=M graphql=K`: N is
  this job's own requests, which cost (the rise in a counter every
  concurrent job shares) is not, M its 304 answers, which GitHub does not
  count, and K the GraphQL requests among N. Then an `api-routes` notice per
  token, `<name> <route>=<count> ... rest=<count>`: N by templated request
  path, most first, at most 15 routes. Last the api-budget notices: one per
  refused (403/429) response and one for the last of each resource; no
  rate-limit endpoint is read, so the step spends no request. Also writes
  each line and a `<name>-cost=N` line to the step summary. A token with no
  reading gets only its api-calls line, at 0, and its api-routes line.
  Never fails the job.

inputs:
  tokens:
    description: >
      Token names, space or newline separated, in lower-case kebab case:
      `github-token` for the job token.
    required: true
  responses:
    description: >
      `gh api -i` output files, space or newline separated, from job-token
      calls made after every Octokit reading, read as `github-token`
      readings in order before the notice. A missing file is skipped.
    required: false
    default: ""

outputs:
  costs:
    description: "`<name>-cost=N` for each named token with a reading, `unknown` when its cost is na."
    value: ${{ steps.log.outputs.costs }}

runs:
  using: composite
  steps:
    - name: Log the API budget
      id: log
      shell: bash
      env:
        TOKENS: ${{ inputs.tokens }}
        RESPONSES: ${{ inputs.responses }}
      run: |
        # shellcheck source=/dev/null
        . "$GITHUB_ACTION_PATH/api-budget.bash" || exit 0
        for file in $RESPONSES; do
          [[ -f $file ]] && api_budget_read github-token "$file" >/dev/null
        done
        # GitHub turns at most 10 of one step's notices into annotations, so
        # the counting lines go first: each token's api-calls, then their
        # api-routes, and the per-reading api-budget lines last, which the
        # log and summary keep in full.
        costs=() names=() budget=()
        for name in $TOKENS; do
          [[ $name =~ ^[a-z][a-z0-9-]{0,39}$ ]] || { echo "::warning::api-budget: skipped a token name that is not lower-case kebab case"; continue; }
          names+=("$name")
          # A notice, as the hub reads annotations, not the log; 0 with no reading.
          calls=$(api_budget_emit_calls "$name")
          printf '%s\n' "$calls"
          echo "api-calls ${calls#*title=api-calls::}" >>"$GITHUB_STEP_SUMMARY"
          lines=$(api_budget_emit "$name")
          [[ -n $lines ]] || continue
          budget+=("$lines")
          cost=${lines##*cost=}
          costs+=("$name-cost=${cost/na/unknown}")
        done
        lines=$(api_budget_emit_routes "${names[@]}")
        if [[ -n $lines ]]; then
          printf '%s\n' "$lines"
          printf '%s\n' "${lines//::notice title=api-routes::/api-routes }" >>"$GITHUB_STEP_SUMMARY"
        fi
        for lines in "${budget[@]}"; do
          printf '%s\n' "$lines"
          printf '%s\n' "${lines//::notice title=api-budget::/api-budget: }" >>"$GITHUB_STEP_SUMMARY"
        done
        if ((${#costs[@]} > 0)); then
          echo "${costs[*]}" >>"$GITHUB_STEP_SUMMARY"
          echo "costs=${costs[*]}" >>"$GITHUB_OUTPUT"
        fi
        exit 0
