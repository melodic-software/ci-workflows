name: lefthook-validate
description: Validate the caller's composed Lefthook configuration.

inputs:
  config-file:
    description: >-
      Path to the caller's main Lefthook config. Empty (default) uses
      Lefthook's native config discovery. Extends, remotes, and the matching
      lefthook-local config remain part of the composed validation input.
    default: ''
  version:
    description: >-
      Exact Lefthook version to install. Keep this aligned with the version
      used by the standards-managed consumer toolchain.
    default: 2.1.12
  sha256:
    description: >-
      SHA-256 of the Linux_x86_64 release binary for `version`. Change
      together with `version`.
    default: 22ff1ad48d1a0f4dca8d6b7e920056c6a9015f9204e5b693858ed9c2db759a16

runs:
  using: composite
  steps:
    # Persist the verified binary across jobs so a warm version+sha256 pin
    # never touches the network — the shellcheck action's #156 pattern,
    # extended here as the primary defence against release-asset outages
    # like 2026-08-12 (#444). install-release.sh re-verifies the pinned
    # SHA-256 on every restore and re-downloads on mismatch, so the cache
    # key is never trusted by itself.
    - name: Cache Lefthook release asset
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ci-workflows-release-cache/lefthook
        key: lefthook-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ inputs.sha256 }}

    - name: Install Lefthook
      shell: bash
      env:
        URL: https://github.com/evilmartians/lefthook/releases/download/v${{ inputs.version }}/lefthook_${{ inputs.version }}_Linux_x86_64
        SHA256: ${{ inputs.sha256 }}
        BIN: lefthook
        ASSET_CACHE_DIR: ${{ runner.temp }}/ci-workflows-release-cache/lefthook
      run: bash "$GITHUB_ACTION_PATH/../_shared/install-release.sh"

    - name: Validate composed Lefthook config
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
      run: |
        set -euo pipefail
        if [[ -n "${CONFIG_FILE// }" ]]; then
          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "::error::lefthook-validate: config file not found: $CONFIG_FILE"
            exit 2
          fi
          export LEFTHOOK_CONFIG="$CONFIG_FILE"
        else
          unset LEFTHOOK_CONFIG
        fi
        lefthook validate
