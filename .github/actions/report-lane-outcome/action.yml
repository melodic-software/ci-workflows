name: claude-lane-outcome
description: >-
  Outcome reporter for the Claude lanes. On a successful action outcome WITH
  execution evidence it records review-failed=false / review-ran=true and
  stops. A successful outcome WITHOUT an execution file is the shape of
  claude-code-action skipping itself — its workflow-validation guard exits 0
  with only a warning annotation when the caller's workflow file differs from
  the default branch's copy, so the step concludes green while nothing ran
  and nothing was reviewed (ci-workflows#363); that shape gets the distinct
  `class=skipped-validation` warning annotation so the silent no-review is
  machine-visible, with review-failed staying false (the skip is expected on
  exactly the PRs that edit the caller workflow, and self-corrects on merge)
  and review-ran false (so callers do not count or credit a review that never
  happened). With require-completion, a success with evidence counts only
  when the lane's completion check says "complete"; anything else is a red
  `class=incomplete`. On any other outcome it projects the last SDK result message
  from the execution file into safe, structured metadata (classify.cjs — the
  sole reader of the file's free-text fields; see its header for the
  projection and classification contract), emits the machine-readable
  `class=<token>` ::error annotation, and
  records the failure class and detail. Every annotation it writes,
  a success notice included, carries the run record as bare tokens:
  `turns=`, `max-turns=`, `credential=`, `fallback=`, `models=` (the result
  message's modelUsage keys) and, on class rate-limit, `resets=<ISO>` and
  `resets-window=<rateLimitType>` from the newest rejected
  rate_limit_event; an unknown value is omitted. Runs
  entirely on the github-script Node runtime — no jq or other runner-image
  tool dependency.

inputs:
  outcome:
    description: >-
      The Claude action step's `outcome` (e.g. steps.claude-review.outcome).
      Anything other than "success" is treated as an infrastructure failure.
    required: true
  execution-file:
    description: >-
      The Claude action step's execution_file output. Unset or missing
      classifies as `no-execution` (or `timeout`/`install-failed`);
      unparsable degrades to `other`.
    required: false
    default: ""
  lane:
    description: >-
      Human-readable lane name used in the annotation text, e.g.
      "Claude review" or "Claude security review".
    required: true
  step-started-at:
    description: >-
      Unix epoch seconds taken just before the Claude action step started.
      With step-timeout-minutes, a failed step that ran its whole budget
      classifies as `timeout`. Empty never classifies as timeout.
    required: false
    default: ""
  step-timeout-minutes:
    description: The Claude action step's timeout-minutes.
    required: false
    default: ""
  require-completion:
    description: >-
      "true" makes a successful outcome with execution evidence count as a
      review only when `completion` is "complete". Anything else concludes
      class `incomplete`: review-failed "true", review-ran "false". Empty
      keeps the plain success rule (intake triage).
    required: false
    default: ""
  completion:
    description: >-
      The lane's completion check: "complete", or the reason no completed
      review was found. A fixed-vocabulary string the lane computes, never
      model text; it is printed in the annotation.
    required: false
    default: ""
  credential:
    description: >-
      Name (never the value) of the secret the run authenticated with, e.g.
      CLAUDE_CODE_OAUTH_TOKEN. Printed as `credential=<name>` on the lane's
      annotation line; empty, or anything but an upper-case secret name, is
      omitted.
    required: false
    default: ""
  fallback-reason:
    description: >-
      Why this run used a fallback credential: `credit-stop` (the key job
      credit-stopped) or `no-key` (the key was empty). Printed as
      `fallback=<reason>` right after `credential=`. Empty prints nothing;
      any other value fails the step before it reports.
    required: false
    default: ""
  install-outcome:
    description: >-
      "failure" when the Claude action's Bun install did not put bun on PATH.
      With a failed outcome and no execution file it classifies as
      `install-failed`: Claude never started.
    required: false
    default: ""
  max-turns:
    description: >-
      The run's --max-turns cap, printed as `max-turns=<n>` beside
      `turns=<n>` so turn headroom shows per run. A failed run whose result
      reports more turns than this cap classifies as `max-turns`. Empty or
      non-numeric is omitted.
    required: false
    default: ""
  known-failure-class:
    description: >-
      A failure class the caller already decided, such as run-claude-cli's
      `lane-class`. When set, a failed run reports it instead of
      reclassifying execution-file, which cannot see the launcher's
      credit-stop or leg-timeout decisions. Empty reclassifies as before.
    required: false
    default: ""

outputs:
  review-failed:
    description: >-
      "true" on a genuine infrastructure failure, else "false". A
      validation skip is NOT a failure (it is expected on caller-editing
      PRs), so it reports "false" here and "false" on review-ran.
    value: ${{ steps.outcome.outputs.review_failed }}
  review-ran:
    description: >-
      "true" only when the action succeeded WITH execution evidence — the
      one shape in which a review actually happened — and, under
      require-completion, the completion check found the review. Gate
      anything that counts, credits, or tidies up after "a successful
      review" on this, not on review-failed == "false", or a validation skip
      reads as a review.
    value: ${{ steps.outcome.outputs.review_ran }}
  failure-class:
    description: >-
      auth | rate-limit | overloaded | max-turns | timeout |
      install-failed | no-execution | other (empty on
      a genuine success; skipped-validation when the action skipped itself;
      incomplete when require-completion found no completed review).
    value: ${{ steps.outcome.outputs.failure_class }}
  review-detail:
    description: >-
      Compact JSON projection of the last SDK result message (safe fields
      only), or a parenthesized placeholder string (empty on success).
    value: ${{ steps.outcome.outputs.review_detail }}
  resets-at:
    description: >-
      On class rate-limit, the ISO 8601 UTC time the limit resets, from the
      run's newest rejected rate_limit_event; empty when it carried none.
    value: ${{ steps.outcome.outputs.resets_at }}

runs:
  using: composite
  steps:
    - name: Report review outcome
      id: outcome
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        LANE_OUTCOME: ${{ inputs.outcome }}
        EXECUTION_FILE: ${{ inputs.execution-file }}
        LANE_NAME: ${{ inputs.lane }}
        STEP_STARTED_AT: ${{ inputs.step-started-at }}
        STEP_TIMEOUT_MINUTES: ${{ inputs.step-timeout-minutes }}
        REQUIRE_COMPLETION: ${{ inputs.require-completion }}
        COMPLETION: ${{ inputs.completion }}
        CREDENTIAL: ${{ inputs.credential }}
        FALLBACK_REASON: ${{ inputs.fallback-reason }}
        MAX_TURNS: ${{ inputs.max-turns }}
        INSTALL_OUTCOME: ${{ inputs.install-outcome }}
        KNOWN_FAILURE_CLASS: ${{ inputs.known-failure-class }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const fs = require("node:fs");
          const path = require("node:path");
          const { classifyExecutionFile, FALLBACK_REASONS, readRunRecord, recordTokens } =
            require(path.join(process.env.ACTION_PATH, "classify.cjs"));

          // A caller wiring error, not a lane outcome: fail before reporting.
          const fallbackReason = process.env.FALLBACK_REASON ?? "";
          if (fallbackReason !== "" && !FALLBACK_REASONS.includes(fallbackReason)) {
            core.setFailed(
              `fallback-reason must be empty or one of: ${FALLBACK_REASONS.join(", ")}.`,
            );
            return;
          }

          const outcome = process.env.LANE_OUTCOME ?? "";
          const lane = process.env.LANE_NAME ?? "Claude review";
          const executionFile = process.env.EXECUTION_FILE ?? "";
          // The run record (turns, max-turns, credential, models, and on a
          // limit stop resets) rides on the same annotation line as class=.
          const runRecord = readRunRecord(executionFile);
          const record = (failureClass = "") => {
            const tokens = recordTokens(runRecord, {
              failureClass,
              maxTurns: process.env.MAX_TURNS ?? "",
              credential: process.env.CREDENTIAL ?? "",
              fallbackReason,
            });
            return tokens === "" ? "" : ` ${tokens}`;
          };

          if (outcome === "success") {
            if (executionFile !== "" && fs.existsSync(executionFile)) {
              // A green step proves the action ran, not that a review was
              // posted: the model can stop before its summary. A lane that
              // checks completion passes its verdict here, and anything but
              // "complete" is class `incomplete`, red, with no review-ran.
              const completion = process.env.COMPLETION ?? "";
              if (process.env.REQUIRE_COMPLETION === "true" && completion !== "complete") {
                core.error(
                  `${lane} concluded: ${outcome} class=incomplete${record()} — no completed ` +
                    `review was found: ${completion || "the completion check reported nothing"}.`,
                );
                core.setOutput("failure_class", "incomplete");
                core.setOutput("review_detail", "(no completed review was found)");
                core.setOutput("review_failed", "true");
                core.setOutput("review_ran", "false");
                return;
              }
              // A notice, so the record reaches the check run on a success too.
              core.notice(
                `${lane} completed:${record() || " (no run record)"}. ` +
                  "Findings (if any) are in the PR comments.",
              );
              core.setOutput("review_failed", "false");
              core.setOutput("review_ran", "true");
              return;
            }
            // A green step with NO execution evidence: claude-code-action
            // skipped itself before running anything — its workflow-validation
            // guard exits 0 when the caller's workflow file differs from the
            // default branch's copy (any PR editing the caller hits this, as
            // does the PR first adding it). Nothing was reviewed, so this must
            // not read as a review: the class token below makes the shape
            // machine-visible on the check run, where a skip would otherwise
            // leave no `class=` annotation at all. A warning, and
            // review_failed stays false: the skip is expected and
            // self-correcting on the PRs that edit the caller. The lanes'
            // status steps still go red on this class, since nothing ran.
            core.warning(
              `${lane} concluded: ${outcome} class=skipped-validation${record()} with no ` +
                "execution evidence — the action skipped itself before running " +
                "(workflow-validation skip: the caller's workflow file must " +
                "match the default branch's copy). Nothing was reviewed.",
            );
            core.setOutput("failure_class", "skipped-validation");
            core.setOutput("review_detail", "(no execution file was produced)");
            core.setOutput("review_failed", "false");
            core.setOutput("review_ran", "false");
            return;
          }

          // A step killed at its timeout-minutes ran its whole budget. An
          // empty input is NaN, and a NaN comparison is never true.
          const startedAt = Number(process.env.STEP_STARTED_AT || Number.NaN);
          const budgetMinutes = Number(process.env.STEP_TIMEOUT_MINUTES || Number.NaN);
          const timedOut = Date.now() / 1000 - startedAt >= budgetMinutes * 60;
          const classified = classifyExecutionFile(executionFile, {
            timedOut,
            maxTurns: process.env.MAX_TURNS ?? "",
            installFailed: process.env.INSTALL_OUTCOME === "failure",
          });
          const { reviewDetail } = classified;
          // A caller's own decision wins, as a closed kebab token only.
          const known = (process.env.KNOWN_FAILURE_CLASS ?? "").trim();
          const failureClass = /^[a-z][a-z-]{0,39}$/u.test(known)
            ? known
            : classified.failureClass;

          // `class=<token>` is a machine-readable term, not prose: this
          // annotation is the detection surface a receiver polls through the
          // check-run API, so keep it bare and greppable.
          //
          // The disclaimer names what the failure is NOT, so the noun must
          // match the lane: a security lane's infra failure is not a
          // security signal, any other lane's is not a code-quality signal.
          // Derived from the lane name so callers need no extra wiring.
          const signal = /security/iu.test(lane) ? "security" : "code-quality";
          // A usage limit stays an error (the check goes red) but reads as a
          // skipped run; the `class=rate-limit` token is unchanged. A lane
          // that is not a review (intake triage) names itself instead.
          const skipped = /review/iu.test(lane) ? "AI review" : lane;
          core.error(
            failureClass === "rate-limit"
              ? `${skipped} skipped: usage limit reached; re-run after it resets ` +
                  `(${lane} exited with: ${outcome} class=rate-limit${record(failureClass)}). ` +
                  `Last SDK result: ${reviewDetail}`
              : `${lane} exited with: ${outcome} class=${failureClass}${record(failureClass)} ` +
                  `(infrastructure error, not a ${signal} signal — e.g. usage limit, ` +
                  "OIDC failure, SDK crash, is_error result, or max-turns exhaustion). " +
                  `Last SDK result: ${reviewDetail}`,
          );

          core.setOutput("failure_class", failureClass);
          core.setOutput("review_detail", reviewDetail);
          if (failureClass === "rate-limit" && runRecord.resetsAt) {
            core.setOutput("resets_at", runRecord.resetsAt);
          }
          core.setOutput("review_failed", "true");
          core.setOutput("review_ran", "false");
