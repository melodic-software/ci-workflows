name: run-claude-cli
description: >-
  Run one prompt with headless `claude -p` for an agent-mode CI lane, on a
  Linux runner, on exactly one credential: set one of `api-key`,
  `subscription-token` and `fallback-token` (the action fails closed
  otherwise). A
  key leg that ends in a credit stop (classify.cjs isCreditStop, lane-class
  `credit-stop`) or a key the API refused with status 401 or 402
  (lane-class `auth`) sets handoff `true`; a 403 stops the run;
  a caller that falls back to the subscription runs it as a second job on a
  fixed GitHub-hosted runner, gated on that exact value (see the README's
  two-job pattern), never in this job. With `fallback-ready: true`, a
  subscription leg that ends in a limit stop (a rejected rate_limit_event
  with its reset), a credit stop, or a 401 or 402 sets handoff `true` too,
  and the caller runs the fallback leg on `fallback-token` as a third job;
  that leg never hands off. handoff-reason names the stop.
  The leg's CLI environment has every credential and file-command variable
  removed and its one credential set, and the CLI runs with `--restricted`
  and `--strict-mcp-config`; the step's GITHUB_ENV, GITHUB_PATH, GITHUB_OUTPUT,
  GITHUB_STEP_SUMMARY and GITHUB_STATE files are bound read-only for the leg
  and restored to their exact content after it ends, before the action
  writes its own outputs, and
  the installed CLI tree and `_work/_actions` have their write bits removed
  while it runs. Code the leg runs still runs as the runner user, so a
  lane that gives the model unrestricted
  Bash, or any code-running tool beyond fixed read-only command rules, must
  run this action in a job that holds no other secret or write token and do
  its reporting and uploads in a downstream job that validates its inputs; a
  lane whose Bash is limited to fixed read-only rules may stay in one job.
  Input contract, in this order: the caller runs
  `apply-claude-managed-settings` while sudo still works, then removes sudo and
  docker access, installs bubblewrap and lets it create user namespaces
  (runner isolation), and runs no head code in the job before this action.
  This action fails closed when the settings are missing or unpinned, sudo
  works, the docker socket is writable, `bwrap --unshare-pid` fails, or the
  step environment sets NODE_OPTIONS, LD_PRELOAD, LD_LIBRARY_PATH, BASH_ENV,
  NODE_EXTRA_CA_CERTS, NODE_TLS_REJECT_UNAUTHORIZED or a `*_PROXY` variable
  other than NO_PROXY. It writes the outputs report-check-run reads, a JSONL
  execution log (one object for the leg) and, with json-schema-file, the
  result's structured output, each written only after a scan finds no
  credential in it, and a job summary table of closed tokens. The log holds
  the leg's token usage and each subscription window's highest utilization,
  reset and last status; pass it to report-lane-outcome's log-file for the
  lane-outcome record. A window at allowed_warning or rejected, or at 0.70
  utilization or more, adds one warning annotation naming the secret.
  Uploading the log is the caller's choice. The step fails, after writing its outputs,
  whenever lane-class is not empty.

inputs:
  lane:
    description: The lane, lower-case kebab (for example `intake` or `fix-ci`); recorded in the log.
    required: true
  role:
    description: >-
      The funding role whose secret the caller passes, lower-case kebab (for
      example `automations`); recorded in the log. It names the secret,
      `<ROLE>_CLAUDE_API_KEY` or `<ROLE>_CLAUDE_CODE_OAUTH_TOKEN` with the
      role upper-snake (`issue-lane` gives `ISSUE_LANE_CLAUDE_API_KEY`).
    required: true
  prompt-file:
    description: Path to the prompt file. Never inline head text.
    required: true
  preamble:
    description: Text prepended to the prompt, separated by a blank line. Empty sends the prompt alone.
    required: false
    default: >-
      You are running unattended in GitHub Actions: no person can answer a
      question or approve a prompt during this run. Report what you did, and
      anything left undone, on the issue or pull request you were given. When
      a step needs a person's decision, say so there and apply the
      repository's human-gated label instead of guessing.
  api-key:
    description: The role's Console API key secret. Set exactly one of this and subscription-token.
    required: false
    default: ""
  subscription-token:
    description: >-
      The role's subscription OAuth token secret. Set exactly one of this and
      api-key; pass it only in the job that runs the subscription leg.
    required: false
    default: ""
  fallback-token:
    description: >-
      The central fallback subscription's OAuth token, the org secret
      FALLBACK_CLAUDE_CODE_OAUTH_TOKEN, recorded under that name for every
      role. Set it instead of the other two, only in the job that runs the
      fallback leg after a subscription leg handed off.
    required: false
    default: ""
  fallback-ready:
    description: >-
      `true` when the caller runs a fallback leg after this one, so a
      subscription leg may hand off to it; pass
      `secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != ''`. `false` or empty
      keeps the subscription leg the last. Any other value fails the step.
    required: false
    default: ""
  model:
    description: Model alias or full name passed to `--model`.
    required: true
  effort:
    description: Effort level passed to `--effort`. Empty passes none, so the model's default applies.
    required: false
    default: ""
  max-turns:
    description: Positive whole number passed to `--max-turns`.
    required: true
  permission-mode:
    description: >-
      `--permission-mode`: default, acceptEdits, plan, auto or dontAsk.
      bypassPermissions is refused. Prompts are always answered `none`.
    required: true
  allowed-tools:
    description: Permission rules passed to `--allowedTools`, one per line. Empty passes none.
    required: false
    default: ""
  disallowed-tools:
    description: Permission rules passed to `--disallowedTools`, one per line. Empty passes none.
    required: false
    default: ""
  tools:
    description: >-
      Built-in tools the model may use, one per line, passed to `--tools`.
      Empty leaves the CLI's default set. The CLI runs with `--restricted`,
      which removes Bash, PowerShell, the other code-running tools and
      WebFetch unless this input names them: list Bash here for the model to
      run commands.
    required: false
    default: ""
  plugin-dirs:
    description: >-
      Plugin directories, one per line, each passed to `--plugin-dir` and
      also to `--add-dir`, so under `--restricted` a plugin's skills can read
      their own files. Each entry is relative to GITHUB_WORKSPACE (or absolute
      inside it), has no `..` part, and must resolve to an existing directory
      inside the workspace. Empty passes none.
    required: false
    default: ""
  add-dirs:
    description: >-
      Extra working directories, one per line, passed to `--add-dir`, checked
      the same way as plugin-dirs. Empty passes none.
    required: false
    default: ""
  json-schema-file:
    description: >-
      Path to a JSON Schema the final result must match (`--json-schema`); the
      result's `structured_output` is in structured-output-file. Empty passes
      none.
    required: false
    default: ""
  cli-version:
    description: >-
      `latest` (the default) resolves the newest @anthropic-ai/claude-code
      release with `npm view` at run time; an exact major.minor.patch
      reproduces a run. The resolved version is logged and output. The
      install fails unless `npm audit signatures` verifies the wrapper and
      platform packages and the binary matches the release's GPG-signed
      manifest.json, so the version must be 2.1.89 or later.
    required: false
    default: latest
  watchdog-max-wait-ms:
    description: CLAUDE_CODE_RETRY_WATCHDOG_MAX_WAIT_MS, the most each request waits out 429 and 529 errors.
    required: false
    default: "1800000"
  leg-timeout-minutes:
    description: >-
      Wall-clock cap for the leg, in whole minutes (30 by default); a leg that
      reaches it ends with class `timeout`. Empty means none.
    required: false
    default: "30"

outputs:
  lane-class:
    description: >-
      The leg's failure class; empty on success. `credit-stop` (key leg only)
      means the key's credits are used up; a caller that does not fall back
      reports it as `rate-limit`, the class report-lane-outcome knows.
      `auth` means the credential is unusable: API status 401 (disabled or
      deleted), 402 (billing) or 403 (permission). On a failed leg the
      step's error line, the job summary's Error cell and the log record add
      `api_error_status`, and the API error body's `error_type`,
      `error_code` (error.details.error_code) and `request_id` when the
      CLI's own text carries them. Otherwise it is
      report-lane-outcome's class: a failed install or integrity check
      reports `install-failed`, and any other failure before the leg ran, or a leg whose stdout passes
      256 MiB, reports `other`. Report this class; do not reclassify execution-file, which
      cannot see the credit-stop or leg-timeout rules. Set after the step
      files are restored, so the leg cannot set it.
    value: >-
      ${{ steps.run.outputs.lane-class
      || (steps.isolation.outcome == 'success' && steps.install.outcome == 'failure' && 'install-failed')
      || (steps.run.outcome != 'success' && 'other')
      || '' }}
  handoff:
    description: >-
      `true` when a key leg ended in `credit-stop`, or in `auth` with the
      numeric API status 401 or 402, so the caller may run the subscription
      leg in a separate job; `true` when a subscription leg with
      fallback-ready `true` ended in a limit stop, a credit stop, or a 401
      or 402, so the caller may run the fallback leg in a third job (403
      stops it the same way); `false` otherwise; empty when the step failed
      before the leg ran. A 403 (permission_error) does not hand off: a
      Console key is bound to a workspace, or acts across several, and
      carries its identity's workspace role
      (https://platform.claude.com/docs/en/manage-claude/authentication), so
      a 403 is a key or workspace setting the owner fixes
      (https://platform.claude.com/docs/en/api/errors), and the run stops
      with its error type, error_code and request_id instead of hiding it
      behind the subscription. lane-class keeps the reason. Set after the
      step files are restored, so the leg cannot set it.
    value: ${{ steps.run.outputs.handoff }}
  lane-resets:
    description: ISO 8601 time the blocking limit lifts, when the CLI's structured output gives it; else empty.
    value: ${{ steps.run.outputs.lane-resets }}
  lane-turns:
    description: Turns the leg took, from the CLI result.
    value: ${{ steps.run.outputs.lane-turns }}
  lane-models:
    description: Comma list of models in the leg's modelUsage.
    value: ${{ steps.run.outputs.lane-models }}
  handoff-reason:
    description: >-
      Why the leg handed off, a closed token: `credit-stop` or `auth` from a
      key leg; `limit-stop`, `credit-stop` or `auth` from a subscription leg
      with fallback-ready; empty when handoff is not `true`. The next job
      passes it as report-lane-outcome's fallback-reason.
    value: ${{ steps.run.outputs.handoff-reason }}
  credential:
    description: Secret NAME the leg ran on, never its value.
    value: ${{ steps.run.outputs.credential }}
  execution-file:
    description: >-
      The leg's CLI messages as a JSON array (the execution_file shape
      claude-code-action writes). It holds every tool result and model reply
      and is never scanned for credentials, so do not upload it.
    value: ${{ steps.run.outputs.execution-file }}
  log-file:
    description: JSONL execution log, one object for the leg; empty when the credential scan failed.
    value: ${{ steps.run.outputs.log-file }}
  structured-output-file:
    description: >-
      The final result's `structured_output` as a JSON file, written only when
      json-schema-file is set, lane-class is empty, the result carries an
      object, and a scan finds no credential in it; else empty. A scan hit
      fails the step.
    value: ${{ steps.run.outputs.structured-output-file }}
  cli-version:
    description: The Claude Code CLI version that ran.
    value: ${{ steps.install.outputs.cli-version }}

runs:
  using: composite
  steps:
    - name: Verify the isolation contract
      id: isolation
      shell: bash
      env:
        LANE_MANAGED_SETTINGS: /etc/claude-code/managed-settings.json
      run: node "$GITHUB_ACTION_PATH/lane.cjs" verify-isolation

    - name: Prepare the work directory
      id: workdir
      shell: bash
      run: |
        dir="$(mktemp -d "$RUNNER_TEMP/run-claude-cli-XXXXXX")"
        echo "path=$dir" >>"$GITHUB_OUTPUT"

    - name: Install and verify the Claude Code CLI
      id: install
      shell: bash
      env:
        LANE_CLI_VERSION_INPUT: ${{ inputs.cli-version }}
        LANE_WORK_DIR: ${{ steps.workdir.outputs.path }}
      run: node "$GITHUB_ACTION_PATH/lane.cjs" install

    - name: Run the lane
      id: run
      shell: bash
      env:
        LANE_NAME: ${{ inputs.lane }}
        LANE_ROLE: ${{ inputs.role }}
        LANE_PROMPT_FILE: ${{ inputs.prompt-file }}
        LANE_PREAMBLE: ${{ inputs.preamble }}
        LANE_API_KEY: ${{ inputs.api-key }}
        LANE_SUBSCRIPTION_TOKEN: ${{ inputs.subscription-token }}
        LANE_FALLBACK_TOKEN: ${{ inputs.fallback-token }}
        LANE_FALLBACK_READY: ${{ inputs.fallback-ready }}
        LANE_MODEL: ${{ inputs.model }}
        LANE_EFFORT: ${{ inputs.effort }}
        LANE_MAX_TURNS: ${{ inputs.max-turns }}
        LANE_PERMISSION_MODE: ${{ inputs.permission-mode }}
        LANE_ALLOWED_TOOLS: ${{ inputs.allowed-tools }}
        LANE_DISALLOWED_TOOLS: ${{ inputs.disallowed-tools }}
        LANE_TOOLS: ${{ inputs.tools }}
        LANE_PLUGIN_DIRS: ${{ inputs.plugin-dirs }}
        LANE_ADD_DIRS: ${{ inputs.add-dirs }}
        LANE_JSON_SCHEMA_FILE: ${{ inputs.json-schema-file }}
        LANE_WATCHDOG_MAX_WAIT_MS: ${{ inputs.watchdog-max-wait-ms }}
        LANE_LEG_TIMEOUT_MINUTES: ${{ inputs.leg-timeout-minutes }}
        LANE_CLI_VERSION: ${{ steps.install.outputs.cli-version }}
        LANE_CLI_PATH: ${{ steps.install.outputs.cli-path }}
        LANE_WORK_DIR: ${{ steps.workdir.outputs.path }}
      run: node "$GITHUB_ACTION_PATH/lane.cjs" run
