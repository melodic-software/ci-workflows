name: shfmt
description: Check shell script formatting with shfmt, driven by the repo .editorconfig.

inputs:
  paths:
    description: >-
      Roots to search for shell scripts (*.sh, *.bash), space-separated.
      Empty (the default) runs git-tracked discovery: only files tracked by
      git are checked, so ignored or generated artifacts present in a dirty or
      post-build tree are never gated (mirrors the shellcheck and editorconfig
      actions' git-aware default). Pass explicit roots to opt into a raw
      filesystem walk that does NOT consult .gitignore — checking exactly what
      is found under those roots, including untracked files.
    default: ''
  exclude:
    description: >-
      Path substrings to skip, space-separated (e.g. intentionally-bad
      fixtures). The .git directory is always skipped.
    default: ''
  version:
    description: Exact shfmt version to install.
    default: 3.14.0
  sha256:
    description: >-
      SHA-256 of the linux_amd64 release binary for `version`. Change together
      with `version`.
    default: fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66

runs:
  using: composite
  steps:
    # Persist the verified binary across jobs so a warm version+sha256 pin
    # never touches the network — the shellcheck action's #156 pattern,
    # extended here as the primary defence against release-asset outages
    # like 2026-08-12 (#444). install-release.sh re-verifies the pinned
    # SHA-256 on every restore and re-downloads on mismatch, so the cache
    # key is never trusted by itself.
    - name: Cache shfmt release asset
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ci-workflows-release-cache/shfmt
        key: shfmt-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ inputs.sha256 }}

    - name: Install shfmt
      shell: bash
      env:
        URL: https://github.com/mvdan/sh/releases/download/v${{ inputs.version }}/shfmt_v${{ inputs.version }}_linux_amd64
        SHA256: ${{ inputs.sha256 }}
        BIN: shfmt
        ASSET_CACHE_DIR: ${{ runner.temp }}/ci-workflows-release-cache/shfmt
      run: bash "$GITHUB_ACTION_PATH/../_shared/install-release.sh"

    - name: Check formatting
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        EXCLUDE: ${{ inputs.exclude }}
        # The fan-out shape is PINNED here, not left to the environment. A
        # composite action inherits the caller's workflow-, job- and step-level
        # env, so without these two lines an unrelated `SHFMT_JOBS` in a
        # consumer's workflow would silently change how this action formats,
        # and a typo like `auto` or `0` would abort it. Step-level env wins
        # over everything inherited, so setting them here makes the action's
        # behaviour a property of the action. run.sh reads the same names
        # with these values as its defaults; that path exists for its
        # self-test, which invokes the script directly rather than through
        # this file.
        SHFMT_BATCH_SIZE: '40'
        SHFMT_JOBS: '4'
      run: bash "$GITHUB_ACTION_PATH/run.sh"
