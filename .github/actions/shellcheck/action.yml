name: shellcheck
description: Lint shell scripts with ShellCheck against a caller-supplied rcfile.

inputs:
  files:
    description: >-
      An explicit list of files to check, one per line or space-separated,
      each relative to the workspace. Set and non-blank, this WINS over
      `paths`: no discovery runs and ShellCheck sees exactly the listed files
      that still exist on disk and end in .sh or .bash. A listed path that was
      deleted, or that is not a shell script by that rule, is skipped rather
      than failing the action, so a caller can hand over a raw diff. A
      non-blank list that keeps nothing after filtering prints a notice and
      exits 0. Blank (the default) reads as unset and changes nothing. Because
      the list is whitespace-separated, a path containing a space cannot be
      expressed here; use `paths` or `extra-globs` for those. This exists so a
      caller can diff-scope the scan on pull requests; see the README for the
      caller pattern and its fail-closed caveat.
    default: ''
  paths:
    description: >-
      Roots to search for shell scripts (*.sh, *.bash), space-separated.
      Empty (the default) runs git-tracked discovery: only files tracked by
      git are linted, so ignored or generated artifacts present in a dirty or
      post-build tree are never gated (mirrors the editorconfig action's
      git-aware default). Pass explicit roots to opt into a raw filesystem walk
      that does NOT consult .gitignore — checking exactly what is found under
      those roots, including untracked files. Ignored entirely when `files` is
      set and non-blank.
    default: ''
  extra-globs:
    description: >-
      Additional tracked shell inputs, one Git pathspec per line. Use this for
      extensionless sourced files that the default *.sh/*.bash discovery cannot
      see (for example, `dot_bash*`). Blank by default. Matches are always read
      from Git's index, even when `paths` opts the primary discovery into a raw
      filesystem walk, so ignored or generated files are not pulled in silently.
      When `files` is set, matches are additionally narrowed to paths that
      appear in that list, so "exactly the listed files" holds for this lane
      too rather than the extra lane quietly staying repository-wide.
    default: ''
  extra-exclude-codes:
    description: >-
      Optional comma-separated ShellCheck codes to suppress only while checking
      files selected by `extra-globs` (for example, SC1090,SC1091). This keeps a
      sourced extensionless-file exception from weakening the ordinary
      *.sh/*.bash lane. Requires at least one non-blank `extra-globs` entry.
    default: ''
  rcfile:
    description: Path to the .shellcheckrc ruleset in the caller repo.
    default: .shellcheckrc
  exclude:
    description: >-
      Path substrings to skip, space-separated (e.g. intentionally-bad
      fixtures). The .git directory is always skipped.
    default: ''
  severity:
    description: >-
      Minimum severity to report and fail on: error, warning, info, or style.
      Empty (the default) omits --severity, so ShellCheck applies its own
      default (style) and reports everything. Set e.g. warning to ignore
      info/style findings. Not expressible via the rcfile, hence an input.
    default: ''
  version:
    description: Exact ShellCheck version to install.
    default: 0.11.0
  sha256:
    description: >-
      SHA-256 of the linux x86_64 .tar.gz release asset for `version`. Change
      together with `version`.
    default: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6

runs:
  using: composite
  steps:
    # Persist the verified tarball across jobs so every consumer skips the
    # ~53s download when the version+sha256 pin is unchanged (#156).
    - name: Cache ShellCheck release asset
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ci-workflows-release-cache/shellcheck
        key: shellcheck-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ inputs.sha256 }}

    - name: Install ShellCheck
      shell: bash
      env:
        URL: https://github.com/koalaman/shellcheck/releases/download/v${{ inputs.version }}/shellcheck-v${{ inputs.version }}.linux.x86_64.tar.gz
        SHA256: ${{ inputs.sha256 }}
        BIN: shellcheck
        ARCHIVE_MEMBER: shellcheck-v${{ inputs.version }}/shellcheck
        ASSET_CACHE_DIR: ${{ runner.temp }}/ci-workflows-release-cache/shellcheck
      run: bash "$GITHUB_ACTION_PATH/../_shared/install-release.sh"

    - name: Run ShellCheck
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        PATHS: ${{ inputs.paths }}
        EXTRA_GLOBS: ${{ inputs.extra-globs }}
        EXTRA_EXCLUDE_CODES: ${{ inputs.extra-exclude-codes }}
        RCFILE: ${{ inputs.rcfile }}
        EXCLUDE: ${{ inputs.exclude }}
        SEVERITY: ${{ inputs.severity }}
        # The fan-out shape is PINNED here, not left to the environment. A
        # composite action inherits the caller's workflow-, job- and step-level
        # env, so without these two lines an unrelated `SHELLCHECK_JOBS` in a
        # consumer's workflow would silently change how this action lints, and
        # a typo like `auto` or `0` would abort it. Step-level env wins over
        # everything inherited, so setting them here makes the action's
        # behaviour a property of the action. run.sh reads the same names with
        # these values as its defaults; that path exists for its self-test,
        # which invokes the script directly rather than through this file.
        SHELLCHECK_BATCH_SIZE: '40'
        SHELLCHECK_JOBS: '4'
      run: bash "$GITHUB_ACTION_PATH/run.sh"
