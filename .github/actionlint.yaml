# actionlint 1.7.12 (current pin) rejects the GA `concurrency.queue` key
# (upstream gap: https://github.com/rhysd/actionlint/issues/654). GitHub
# accepts and honors the key at both workflow and job level — verified by
# live probe runs recorded in docs/topics/claude-review-lanes/PLAN.md
# (Phase 0). Suppression approved 2026-07-26 (PLAN.md Approval record,
# item 3), scoped to exactly that one syntax-check message.
#
# REMOVAL TRIGGER: delete this ignore (and this file, if nothing else has
# accrued) when rhysd/actionlint#654 ships in the pinned actionlint version.
paths:
  .github/workflows/**/*.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/**/*.yaml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
