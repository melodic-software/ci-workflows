name: Fixture missing lane-id
on: workflow_call
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - name: Run Claude
        uses: anthropics/claude-code-action@0000000000000000000000000000000000000000 # v1.0.0
        with:
          prompt: hello
      - name: Report outcome
        id: report
        uses: $/.github/actions/report-lane-outcome
        with:
          outcome: ${{ steps.claude.outcome }}
          credential: ${{ inputs.credential-name }}
