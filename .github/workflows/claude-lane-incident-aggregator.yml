name: claude-lane-incident-aggregator

# Watchdog for the Claude review lanes (PLAN.md Phase 4 / ci-workflows#238).
#
# The lanes are advisory by contract: an infrastructure failure — a dead org
# credential, a rate limit, an SDK instant-fail, a runner the selector could not
# resolve — concludes the check GREEN and posts a marker comment. That is the
# right posture for a PR gate and the wrong posture for a fleet: nothing
# aggregates those markers, so "every PR in every repo went unreviewed for two
# days" looks exactly like "everything is fine". This workflow is the aggregate
# view. It polls consumer repositories for the machine-readable `class=<token>`
# annotation .github/actions/claude-lane-outcome emits, and maintains ONE
# incident issue in this repository: opened on the first escalating class, kept
# current in place, closed by itself after three consecutive clean cycles.
#
# TOKEN MATRIX — TWO CREDENTIALS, DISJOINT ROLES.
# The incident issue lives in THIS repository, so maintaining it is a same-repo
# write, and the `issues` write scope on the ambient GITHUB_TOKEN is the entire
# authority it needs. What the ambient token CANNOT do is read a private repository it is
# not scoped to — those reads 404 — and that, and only that, is what the App
# credential seam exists for:
#
#   - Ambient GITHUB_TOKEN, always present: authors every write to this
#     repository's incident issue, and performs every cross-repository read of a
#     PUBLIC consumer.
#   - App installation token, only when `CLAUDE_LANE_INCIDENT_APP_PRIVATE_KEY`
#     is configured: cross-repository reads of PRIVATE consumers. It is minted
#     READ-ONLY and authors nothing. Absent it, the poll scopes to this
#     repository alone (see POLLING SCOPE) and the write path is unaffected.
#     Minting it with any write permission would hand a write-capable
#     credential to a job that holds no write scope, so the audit refuses one
#     anywhere in this file.
#
# THE WRITE GATE IS THE JOB SPLIT.
# `poll` does the work and holds NO write scope, so nothing in it can mutate
# this repository however its steps are wired — the structural guarantee the
# dry-run-only design had, kept rather than replaced. `write` holds the
# `issues` write scope and is three steps long: download the body `poll`
# rendered, hand it to create-issue-from-file, close a recovered incident. It
# checks out nothing, runs no shell, and loads no repository code.
#
# The dry-run gate is `write`'s job-level `if:`, written inline rather than
# shared through a job env var because `env` is NOT an available context in
# `jobs.<job_id>.if` — that key sees four contexts and `env` is not among them.
# The list is upstream's to change, so read it there rather than here:
# https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability
# The dry-run report step in `poll` is gated on the exact negation,
# so no run can both write the issue and report that it wrote nothing; the test
# pins both conditions and asserts one is the negation of the other.
#
# `!= 'true'` FAILS OPEN, deliberately: anything that is not exactly the string
# `true` enables writes. `github.event.inputs` is absent on `schedule`, so the
# hourly cycle writes, and only a dispatch that explicitly asked for a dry run
# does not.
#
# .github/scripts/claude-lane-incident-write-gate.cjs holds that shape. It
# resolves every job's effective permissions, requires EXACTLY ONE write-scoped
# job, and pins that job byte-for-byte against a literal — so any edit to it, of
# any kind, fails CI rather than being classified as safe or unsafe. It also
# refuses a token minted with a write permission anywhere in this file, which is
# the one way a job holding no write scope can still write.
#
# TRUST BOUNDARY, stated precisely. `poll` cannot mutate anything itself, but it
# does decide two things `write` then acts on, and neither is checked by `write`
# or by the audit:
#   - the BODY, through the artifact it uploads. Its safety is `poll`'s own
#     sanitization (claude-lane-incident.cjs), not anything downstream.
#   - the TARGET, through `issue-number`. `write` updates, comments on and closes
#     whatever number that output carries; the only guard is that it parses as a
#     positive safe integer. A wrong number is a wrong issue in this repository.
# So "nothing in `poll` can mutate anything" is about `poll`'s own token. What
# `poll` selects, `write` performs.
#
# POLLING SCOPE is the App credential's own installation (`GET
# /installation/repositories`, one call): the org owner grants the App access to
# exactly the consumer repositories, and this workflow polls exactly those.
# There is no second, hand-maintained inventory to drift. An uncredentialed run
# has no installation, so it scopes to this repository alone — which is a real
# consumer of its own lanes (claude-review-self.yml), so it still exercises the
# whole pipeline against live data rather than a fixture. "Uncredentialed" is a
# statement about polling breadth only: such a run writes exactly as a
# credentialed one does, because `write` never sees the App token at all.
#
# SCOPE IS NOT FIXED, AND A NARROWED SCOPE CANNOT CLOSE AN INCIDENT. Because
# the scope IS the installation, it narrows to this repository alone the moment
# the App credential goes missing — a deleted or rotated secret skips the mint
# step — and that narrowing raises no read error, because nothing failed. So an
# incident caused by PRIVATE consumer repositories would meet three clean
# cycles that never read those repositories at all, and close itself. The poll
# therefore publishes the scope it observed, not just how many repositories
# were in it, and a clean cycle advances the clean-cycle counter only when that
# scope covers every repository the open incident's own evidence names.
# Anything less holds the incident open and annotates the run with what went
# unobserved. The rule, its limits, and why it fails toward holding rather than
# closing live with the check: see coverageGap in
# .github/scripts/claude-lane-incident.cjs.
#
# PUBLIC-SAFETY: this repository is public and the incident body is its output.
# Annotation text is untrusted (any workflow in any polled repository can write
# one) and embeds a projection of model-authored content, so nothing derived
# from it is ever rendered. The allowlist-and-validate discipline that enforces
# that lives in .github/scripts/claude-lane-incident.cjs; read its header before
# adding any field to the body.

on:
  schedule:
    # Hourly. The clean-cycle counter is denominated in cycles, so this also
    # sets the auto-close latency: three consecutive clean hours.
    - cron: '17 * * * *'
  # Deliberately no `push` trigger. An out-of-band cycle counts toward the three
  # consecutive clean cycles that auto-close an incident, so merging an unrelated
  # edit to this workflow during an outage would shorten the recovery window and
  # falsify the "three consecutive clean hours" the cron above defines. Use the
  # dispatch below to exercise a change.
  workflow_dispatch:
    inputs:
      dry-run:
        description: Poll and render the report without writing the incident issue, even when the credential is present.
        type: boolean
        default: false
      repositories:
        description: Comma-separated owner/name list to poll instead of the credential's installation (smoke tests).
        type: string
        default: ''

concurrency:
  group: claude-lane-incident-aggregator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    name: Poll the Claude lanes and render the incident body
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Declaring `permissions:` at all sets every scope not listed to `none`,
      # so this block IS this job's whole authority — and every entry is READ.
      # That is the guarantee the whole design rests on: no step here can mutate
      # anything however it is wired, so none of them has to be classified.
      #
      # `checks` and `pull-requests` are what the poll reads locally. Do not size
      # the App credential from an assumption that omitting Checks:read always
      # 403s: PUBLIC cross-repository reads work with the ambient token, while
      # PRIVATE repositories typically 404 when that token cannot see them.
      # `issues: read` finds and parses the open incident issue; maintaining it
      # is `write`'s job.
      checks: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      action: ${{ steps.state.outputs.action }}
      issue-number: ${{ steps.incident.outputs.number }}
    env:
      # Same presence-probe seam select-runner.yml uses for its observer
      # credential: the secret's existence, not a checked-in flag, decides
      # whether this run can reach PRIVATE consumer repositories.
      HAS_APP_CREDENTIAL: ${{ secrets.CLAUDE_LANE_INCIDENT_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # THE ONLY CREDENTIAL-MINTING STEP, and the only place either App secret
      # is spent. Pinned byte-for-byte alongside the write job, because a minted
      # token is authority `permissions:` does not govern: any step that can
      # mint one can write regardless of this job holding no write scope.
      #
      # Minted without `repositories:` so the token carries the installation's
      # full access, which is also what defines the polling scope below. Every
      # permission requested is READ: this token exists to reach private
      # consumer repositories the ambient token 404s on, and it authors no write,
      # so asking for `issues: write` would be authority nothing spends.
      #
      # Minted on a dry run too, so a dry run polls the full installation and
      # renders the body a live run would have written — which is what the
      # `dry-run` input's own description promises.
      - name: Mint the aggregator App token
        id: credential
        if: env.HAS_APP_CREDENTIAL == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLAUDE_LANE_INCIDENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDE_LANE_INCIDENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-checks: read
          permission-pull-requests: read
          permission-issues: read

      - name: Poll consumer repositories for lane failure signals
        id: poll
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LOOKBACK_HOURS: '24'
          REPOSITORIES_OVERRIDE: ${{ github.event.inputs.repositories }}
          HAS_INSTALLATION: ${{ steps.credential.outputs.token != '' }}
        with:
          github-token: ${{ steps.credential.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const path = require("node:path");
            const {
              classifyCycle,
              extractSignals,
              isLaneCheckRun,
              tallyObservations,
            } = require(
              path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/claude-lane-incident.cjs"),
            );

            // Every bound below exists so one pathological repository cannot
            // turn a watchdog into an unbounded API spend. Hitting a bound is
            // a read error, never a silent truncation: a truncated poll that
            // reported "clean" is exactly how a live incident gets auto-closed.
            const MAX_PULLS_PER_REPOSITORY = 300;
            const MAX_LANE_CHECK_RUNS_PER_PULL = 12;
            const MAX_PAGES_PER_READ = 10;
            const PER_PAGE = 100;

            const lookbackHours = Number(process.env.LOOKBACK_HOURS);
            const since = Date.now() - lookbackHours * 3_600_000;

            let apiCalls = 0;
            let readErrors = 0;
            let laneRunsObserved = 0;
            let pullsExamined = 0;
            const observations = [];

            // Read errors are counted and the poll continues: one unreadable
            // repository must neither abort the scan (losing every other
            // repository's evidence) nor be mistaken for a healthy one. The
            // count reaches classifyCycle, which refuses to call any cycle
            // clean while it is non-zero.
            const read = async (description, call) => {
              apiCalls += 1;
              try {
                return await call();
              } catch (error) {
                readErrors += 1;
                core.warning(`read failed (${description}): ${error.message}`);
                return null;
              }
            };

            // Paginated reads walk the iterator rather than `github.paginate`,
            // for two reasons the deliverable line depends on. `paginate`
            // returns one flattened array and hides how many requests it made,
            // so the reported API budget would silently undercount the
            // dominant per-pull-request term; and it follows Link headers to
            // exhaustion, so a consumer publishing thousands of annotations
            // (annotation text is untrusted — see the module header) could walk
            // the poll past its own job timeout. A killed job reports nothing,
            // which is the same pinned-at-`indeterminate` failure as refusing
            // to read at all. So: count every real request, cap the walk, and
            // treat the cap as a read error rather than a silent trim.
            const readAll = async (description, endpoint, params) => {
              const items = [];
              let pages = 0;
              try {
                for await (const response of github.paginate.iterator(endpoint, params)) {
                  apiCalls += 1;
                  pages += 1;
                  items.push(...response.data);
                  if (pages >= MAX_PAGES_PER_READ) {
                    readErrors += 1;
                    core.warning(
                      `read truncated (${description}): more than ${MAX_PAGES_PER_READ} pages of ${PER_PAGE}; the poll is incomplete.`,
                    );
                    break;
                  }
                }
              } catch (error) {
                // The request that threw was issued but never yielded a page,
                // so the loop above never counted it. Counting it here keeps
                // this helper's accounting identical to `read`'s, which counts
                // before it can fail: a budget that SHRANK once reads started
                // 403ing would understate spend on exactly the cycles most
                // worth diagnosing.
                apiCalls += 1;
                readErrors += 1;
                core.warning(`read failed (${description}): ${error.message}`);
                return null;
              }
              return items;
            };

            const overrideNames = (process.env.REPOSITORIES_OVERRIDE ?? "")
              .split(",")
              .map((name) => name.trim())
              .filter((name) => name.length > 0);

            let repositories;
            if (overrideNames.length > 0) {
              repositories = overrideNames;
            } else if (process.env.HAS_INSTALLATION === "true") {
              // The installation's repository list IS the consumer inventory:
              // granting the App access to a repository is what enrols it.
              const installation = await readAll(
                "installation repositories",
                github.rest.apps.listReposAccessibleToInstallation,
                { per_page: PER_PAGE },
              );
              repositories = (installation ?? [])
                .filter((repository) => !repository.archived)
                .map((repository) => repository.full_name);
            } else {
              // Uncredentialed: no installation exists, so the only repository
              // the ambient token is guaranteed to read is this one. This says
              // nothing about writing — see the workflow header's write gate.
              repositories = [`${context.repo.owner}/${context.repo.repo}`];
            }

            for (const fullName of repositories) {
              const [owner, repo] = fullName.split("/");
              if (!owner || !repo) {
                readErrors += 1;
                core.warning(`skipping unparsable repository name: ${fullName}`);
                continue;
              }

              // Sorted by update recency and stopped at the lookback edge, so
              // a repository with years of history costs one page in the
              // common case. `state: all` is deliberate — a PR closed inside
              // the window still evidences whether its lanes ran.
              const pulls = [];
              let page = 1;
              let exhausted = false;
              while (!exhausted && pulls.length < MAX_PULLS_PER_REPOSITORY) {
                const response = await read(`${fullName} pulls page ${page}`, () =>
                  github.rest.pulls.list({
                    owner,
                    repo,
                    state: "all",
                    sort: "updated",
                    direction: "desc",
                    per_page: PER_PAGE,
                    page,
                  }),
                );
                if (response === null) break;
                for (const pull of response.data) {
                  if (Date.parse(pull.updated_at) < since) {
                    exhausted = true;
                    break;
                  }
                  pulls.push(pull);
                }
                if (response.data.length < PER_PAGE) exhausted = true;
                page += 1;
              }
              if (!exhausted && pulls.length >= MAX_PULLS_PER_REPOSITORY) {
                readErrors += 1;
                core.warning(
                  `${fullName} has more than ${MAX_PULLS_PER_REPOSITORY} pull requests updated in the lookback window; the poll is incomplete.`,
                );
              }

              for (const pull of pulls) {
                const headSha = pull.head?.sha;
                if (!headSha) continue;
                // A fork PR's head repository ships its own workflow files, so
                // any job it declares can write a `class=` annotation onto a
                // check run in the base repository. The lanes deliberately do
                // not review fork PRs at all (CLAUDE.md's fork-PR rule), so a
                // lane-shaped check run on a fork head is never this fleet's
                // signal — counting one would let an outside contributor open
                // a false incident here, or vote a wedged fleet healthy.
                // Case-insensitive: GitHub repository names are, and the
                // `repositories` dispatch input is typed by a human, so an
                // exact compare would silently classify every pull request in
                // a smoke run as a fork and report nothing.
                if (
                  (pull.head?.repo?.full_name ?? "").toLowerCase() !==
                  fullName.toLowerCase()
                ) {
                  continue;
                }
                pullsExamined += 1;

                // `filter: latest` (the default) collapses re-runs to the
                // current attempt per check name, which is the attempt whose
                // annotation describes the head's real state.
                //
                // Paginated, not single-page-with-a-guard. A busy consumer's
                // head already carries dozens of check runs; refusing to read
                // one past 100 would make that repository raise a read error on
                // every cycle forever, which pins the whole fleet at
                // `indeterminate` and means no incident can ever auto-close —
                // trading silent truncation for a permanent stall.
                const checkRuns = await readAll(
                  `${fullName}#${pull.number} check runs`,
                  github.rest.checks.listForRef,
                  { owner, repo, ref: headSha, per_page: PER_PAGE },
                );
                if (checkRuns === null) continue;

                const matched = checkRuns.filter((checkRun) =>
                  isLaneCheckRun(checkRun.name),
                );
                if (matched.length > MAX_LANE_CHECK_RUNS_PER_PULL) {
                  readErrors += 1;
                  core.warning(
                    `${fullName}#${pull.number} has ${matched.length} lane check runs, past the per-pull bound of ${MAX_LANE_CHECK_RUNS_PER_PULL}; the poll is incomplete.`,
                  );
                }
                const laneRuns = matched.slice(0, MAX_LANE_CHECK_RUNS_PER_PULL);

                // Liveness needs a lane that actually RAN. A skipped lane job
                // still publishes a check run under the same name — that is the
                // kill-switch's whole design (a name-stable skip reads as
                // success), and draft PRs and skip-actors produce the same
                // shape. Counting one as evidence of health is how flipping
                // CLAUDE_LANES_DISABLED to quiet the noise during a credential
                // outage would auto-close the very incident tracking it, three
                // cycles later, with nothing being reviewed. `completed` also
                // excludes an in-flight run whose annotation has not landed yet.
                const NON_EVIDENCE_CONCLUSIONS = new Set(["skipped", "cancelled", "neutral"]);
                laneRunsObserved += laneRuns.filter(
                  (laneRun) =>
                    laneRun.status === "completed" &&
                    !NON_EVIDENCE_CONCLUSIONS.has(laneRun.conclusion),
                ).length;

                for (const laneRun of laneRuns) {
                  // Annotations ARE read from every lane check run, including
                  // ones that prove nothing about liveness: the lane concludes
                  // SUCCESS on an infrastructure failure by design, so the
                  // annotation is the only signal and conclusion must never
                  // filter it out.
                  if ((laneRun.output?.annotations_count ?? 0) === 0) continue;
                  const annotations = await readAll(
                    `${fullName}#${pull.number} annotations for ${laneRun.name}`,
                    github.rest.checks.listAnnotations,
                    { owner, repo, check_run_id: laneRun.id, per_page: PER_PAGE },
                  );
                  if (annotations === null) continue;
                  for (const annotation of annotations) {
                    const signals = extractSignals(annotation.message);
                    if (signals.classes.length === 0 && signals.unrecognized === 0) continue;
                    observations.push({
                      repository: fullName,
                      pullNumber: pull.number,
                      ...signals,
                    });
                  }
                }
              }
            }

            const tally = tallyObservations(observations);
            const cycle = classifyCycle({
              laneRunsObserved,
              escalating: tally.escalating,
              readErrors,
            });

            core.setOutput("cycle", cycle);
            core.setOutput("tally", JSON.stringify(tally));
            // The scope this cycle set out to read, by name rather than as a
            // count. A clean verdict is only as wide as the poll behind it,
            // and this scope narrows silently when the App credential goes
            // missing, so the state step needs the names to check them against
            // the open incident's own evidence. Attempted and observed coincide
            // wherever this list is consulted: anything the poll failed to read
            // raises a read error, and that caps the cycle at `indeterminate`
            // before coverage is reached. See coverageGap in
            // claude-lane-incident.cjs.
            core.setOutput("polled-repositories", JSON.stringify(repositories));
            core.setOutput("api-calls", String(apiCalls));
            core.setOutput("read-errors", String(readErrors));
            core.setOutput("lane-runs", String(laneRunsObserved));
            core.setOutput("repositories", String(repositories.length));
            core.setOutput("pulls", String(pullsExamined));

      # Open issues only. A closed incident is superseded by a fresh one rather
      # than reopened, so this never paginates closed history; see nextState's
      # `issueOpen` contract in claude-lane-incident.cjs.
      - name: Find the open incident issue
        id: incident
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.credential.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const path = require("node:path");
            const { SELECTOR_MARKER } = require(
              path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/claude-lane-incident.cjs"),
            );

            // Walked page by page so the count folded into the run's reported
            // API budget is the number of requests actually made, not a
            // division that assumes every page came back full.
            const openIssues = [];
            let apiCalls = 0;
            for await (const response of github.paginate.iterator(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100,
              },
            )) {
              apiCalls += 1;
              openIssues.push(...response.data);
            }
            core.setOutput("api-calls", String(apiCalls));
            // The marker is a public string in a public repository, so anyone
            // able to open an issue here could plant a decoy carrying it. Only
            // a bot-authored issue is ever a candidate, and the ambiguity
            // check runs after that filter so a pile of decoys cannot fail the
            // lookup closed and suppress a real incident.
            const candidates = openIssues.filter(
              (issue) =>
                !issue.pull_request &&
                issue.user?.type === "Bot" &&
                (issue.body ?? "").includes(SELECTOR_MARKER),
            );
            if (candidates.length > 1) {
              core.setFailed(
                `found ${candidates.length} open issues carrying the incident marker; reconcile them manually.`,
              );
              return;
            }
            core.setOutput("number", candidates.length === 1 ? String(candidates[0].number) : "");
            core.setOutput("body", candidates.length === 1 ? (candidates[0].body ?? "") : "");

      - name: Advance the incident state
        id: state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CYCLE: ${{ steps.poll.outputs.cycle }}
          TALLY: ${{ steps.poll.outputs.tally }}
          ISSUE_BODY: ${{ steps.incident.outputs.body }}
          ISSUE_NUMBER: ${{ steps.incident.outputs.number }}
          POLLED_REPOSITORIES: ${{ steps.poll.outputs.polled-repositories }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { describeCoverageGap, nextState, parseStateBlock, renderIssueBody } = require(
              path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/claude-lane-incident.cjs"),
            );

            // Defaulted rather than trusted: an absent or malformed scope
            // parses to an empty one, which proves no coverage and therefore
            // closes nothing. A plumbing mistake here must hold incidents
            // open, never auto-close them.
            let polledRepositories = [];
            try {
              polledRepositories = JSON.parse(process.env.POLLED_REPOSITORIES || "[]");
            } catch (error) {
              core.warning(`polled repository scope did not parse: ${error.message}`);
            }

            const { state, action, coverageGap } = nextState({
              previous: parseStateBlock(process.env.ISSUE_BODY),
              tally: JSON.parse(process.env.TALLY),
              cycle: process.env.CYCLE,
              now: new Date().toISOString(),
              issueOpen: process.env.ISSUE_NUMBER !== "",
              polledRepositories,
            });

            core.setOutput("action", action);
            core.setOutput("coverage", coverageGap ? "incomplete" : "complete");
            if (coverageGap) core.warning(describeCoverageGap(coverageGap));
            if (state === null) return;
            fs.writeFileSync(
              path.join(process.env.GITHUB_WORKSPACE, ".claude-lane-incident.md"),
              renderIssueBody(state),
            );

      # PLAN.md Phase 4 requires the run to log its total API-call count as an
      # explicit deliverable line; the rest of the counters make an unexpected
      # budget diagnosable from the same line.
      - name: Report the poll budget
        env:
          POLL_API_CALLS: ${{ steps.poll.outputs.api-calls }}
          LOOKUP_API_CALLS: ${{ steps.incident.outputs.api-calls }}
          READ_ERRORS: ${{ steps.poll.outputs.read-errors }}
          LANE_RUNS: ${{ steps.poll.outputs.lane-runs }}
          REPOSITORIES: ${{ steps.poll.outputs.repositories }}
          PULLS: ${{ steps.poll.outputs.pulls }}
          CYCLE: ${{ steps.poll.outputs.cycle }}
          ACTION: ${{ steps.state.outputs.action }}
          # `cycle=clean action=none` is the shape of a held incident, and
          # without this it is also the shape of nothing having happened. The
          # step's own warning names the repositories.
          COVERAGE: ${{ steps.state.outputs.coverage }}
        run: |
          set -euo pipefail
          api_calls=$(( POLL_API_CALLS + LOOKUP_API_CALLS ))
          echo "claude-lane-incident: api-calls=${api_calls} repositories=${REPOSITORIES} pull-requests=${PULLS} lane-check-runs=${LANE_RUNS} read-errors=${READ_ERRORS} cycle=${CYCLE} coverage=${COVERAGE} action=${ACTION}"

      # The dry run's deliverable: the exact body a live run would have written,
      # in the job summary, where it costs nothing and leaks nothing. This
      # condition is the exact negation of the `write` job's, so the report and
      # the writes are mutually exclusive by construction — no run can both
      # write the issue and claim it wrote nothing. The test pins both.
      - name: Publish the dry-run report
        if: github.event.inputs.dry-run == 'true'
        env:
          ACTION: ${{ steps.state.outputs.action }}
        run: |
          set -euo pipefail
          {
            echo "## Claude lane incident aggregator — DRY RUN"
            echo
            echo "This run was dispatched with \`dry-run\`, so it wrote nothing."
            echo "The incident issue write it would have performed is \`${ACTION}\`."
            echo
            if [ -f .claude-lane-incident.md ]; then
              echo '<details><summary>Rendered incident body</summary>'
              echo
              echo '```markdown'
              cat .claude-lane-incident.md
              echo '```'
              echo
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The hand-off. `write` holds no checkout and no repository code, so the
      # rendered body reaches it as an artifact rather than as a path. Skipped
      # when there is nothing to write, which is also when `write` is skipped.
      - name: Publish the rendered incident body
        if: steps.state.outputs.action != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-lane-incident-body
          path: .claude-lane-incident.md
          # Required, not decorative: the body's name is dot-prefixed and
          # upload-artifact ignores hidden files by default, so without this the
          # upload collects nothing and `if-no-files-found: error` fails the run.
          # Renaming the file instead would also have to change the byte-pinned
          # write job and its pin file; keeping the fix here leaves the diff off
          # the one write-scoped surface. Do not set `archive: false` alongside
          # it — see the test that pins both.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # THE ONLY WRITE-SCOPED JOB. Pinned byte-for-byte by
  # .github/scripts/claude-lane-incident-write-gate.cjs: every line below,
  # comments included, is compared against a literal in the test, so any edit
  # here fails CI and is read by a human rather than classified by a scanner.
  #
  # `labels` is applied on creation only. `claude-lane-incident` is declared in
  # github-iac (`GovernedRepositories.cs`, this repository's `ExtraLabels`), so
  # the taxonomy apply keeps it rather than pruning it. Issue SELECTION never
  # keys on the label (the body marker and bot authorship do), so a label that
  # is later renamed or pruned degrades a sanity query and nothing else.
  #
  # `repository` is left at its default of `${{ github.repository }}`, which is
  # what makes `issues: write` on the ambient token sufficient: the incident
  # issue is created and updated in the repository this workflow runs in.
  # Setting it elsewhere would need a credential this job does not have.
  write:
    name: Maintain the incident issue
    needs: poll
    if: github.event.inputs.dry-run != 'true' && needs.poll.outputs.action != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # `issues: write` is the only WRITE, and it is the whole authority this
      # job needs. `contents: read` is carried because the previous single-job
      # form ran these two actions with it and neither documents its scope
      # requirement; a read can widen nothing that matters here, and dropping it
      # on an inference would trade a security property for a runtime risk.
      contents: read
      issues: write
    steps:
      - name: Download the rendered incident body
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claude-lane-incident-body

      - name: Open or update the incident issue
        if: needs.poll.outputs.action == 'open' || needs.poll.outputs.action == 'update'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: '[Incident] Claude lane infrastructure failure'
          issue-number: ${{ needs.poll.outputs.issue-number }}
          content-filepath: ${{ github.workspace }}/.claude-lane-incident.md
          labels: claude-lane-incident

      - name: Close the recovered incident issue
        if: needs.poll.outputs.action == 'close'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ needs.poll.outputs.issue-number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) return;

            // The final body lands before the close so the closed issue is a
            // complete record rather than one cycle stale.
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: fs.readFileSync(
                path.join(process.env.GITHUB_WORKSPACE, ".claude-lane-incident.md"),
                "utf8",
              ),
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: "The Claude lanes have reported three consecutive clean cycles with no escalating failure class; closing this rolling incident.",
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: "closed",
              state_reason: "completed",
            });
