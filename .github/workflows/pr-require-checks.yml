name: pr-require-checks

on:
  push:
    branches: [main]
  pull_request:
    # `edited`, `labeled` and `unlabeled` can change the pr-title /
    # do-not-merge / issue-linkage answers without a new commit, so the required
    # check has to re-evaluate. Such an event is CONTRACT-ONLY (lanes gated off,
    # ci-status carrying the recorded `ci-lanes` verdict forward) by one
    # predicate, repeated verbatim in `concurrency.group` and every job's `if:`.
    # A base-branch `edited` changes the merge commit, so it runs in full. A
    # fork pull request is never contract-only: its read-only token cannot
    # record lane state.
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  # Only `intake-label-needs-triage` runs on an issue event; every other job,
  # `ci-status` included, guards on `github.event_name != 'issues'`.
  issues:
    types: [opened, reopened]

permissions:
  contents: read

# Contract-only runs get a group unique per run: GitHub evicts a PENDING run
# in a shared group regardless of `cancel-in-progress`, which can leave the
# head with no `ci-status` check run at all (dotfiles#647). They then race the
# full run they carry forward; `yield-to-full-run` below closes that: while a
# full run is in flight a contract-only run fails at once, and the full run's
# newer ci-status decides the gate.
#
# Full runs key on the PR number (not head_ref, so same-named fork branches do
# not cancel each other); pushes key on `github.run_id`.
#
# Hazard: re-running a STALE run on a superseded head SHA lands in the current
# head's group and cancels the run that is reporting. Re-run on the current head.
concurrency:
  group: >-
    ${{ (github.event.pull_request.head.repo.full_name == github.repository &&
    (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
    (github.event.action == 'edited' && !github.event.changes.base)))
    && format('ci-contract-{0}-{1}', github.event.pull_request.number, github.run_id)
    || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: true

# Dogfood: this repo is the first consumer of its own composite actions. Local
# (./) action refs work here because the checkout IS this repo.
#
# File-type-scoped lanes gate on `changes` at JOB level, never workflow-level
# `paths:`, which would wedge the required check Pending. Each gate reads
# `!= 'false'`, never `== 'true'`: with `!cancelled()` a failed or unset
# detection output runs the lane rather than skipping it, and `ci-status`
# aggregates `changes` so a broken detection goes red.
jobs:
  detect-changes:
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      results: ${{ steps.detect.outputs.results }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect relevant lanes
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          # Every group includes `.github/**`, so any workflow, action, or
          # bundled script change re-runs every scoped lane.
          filters: |
            powershell:
              .github/**
              fixtures/composite-action/**
              **/*.ps1
              **/*.psm1
              **/*.psd1
            reference-integrity:
              .github/**
              fixtures/reference-integrity/**
            python:
              .github/**
              fixtures/python/**
              **/*.py
            typescript:
              .github/**
              fixtures/typescript/**
              **/*.js
              **/*.cjs
              **/*.mjs
              **/*.jsx
              **/*.ts
              **/*.tsx
              **/biome.json
            dotnet:
              .github/**
              fixtures/dotnet/**
              **/*.cs
              **/*.csproj
              **/*.props
              **/*.targets
              **/packages.lock.json
              **/nuget.config
              **/NuGet.config
              **/NuGet.Config
              **/.editorconfig
              global.json
            shell:
              .github/**
              fixtures/shell/**
              **/*.sh
              **/*.bash
              **/.editorconfig
              .shellcheckrc
            actionlint:
              .github/**
              fixtures/composite-action/**
            workflow-naming:
              .github/**
              fixtures/workflow-naming/**
            jsonschema:
              .github/**
            selector-contract:
              .github/**
              .node-version
            go:
              .github/**
              fixtures/go/**
              **/*.go
              **/go.mod
              **/go.sum
              **/.golangci.yml
            # Repo-wide `**/action.yml`: zizmor audits composite metadata
            # anywhere (`paths: .`); `action.yaml` is rejected repo-wide (#267).
            zizmor:
              .github/**
              fixtures/composite-action/**
              **/action.yml

  # A local reusable-workflow reference executes pr-run-checks.yml from this exact
  # commit, so the dogfood proves the contract a consumer pins by tag.
  pr-run-checks:
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
      # change-detection lists the pull request's files. A called workflow
      # cannot elevate, so the grant has to be here as well as in pr-run-checks.yml.
      pull-requests: read
    uses: ./.github/workflows/pr-run-checks.yml
    with:
      # This public repository's hosted lane is free; private consumers pass
      # their hardcoded fleet label instead.
      runner: ubuntu-24.04
      # actionlint and shellcheck keep their own jobs here: both carry extra
      # dogfood steps that run against the pinned binary the composite installs.
      actionlint: false
      shellcheck: false
      # One schema family per call. The remaining two (workflow and action
      # metadata) stay in the `jsonschema` job.
      check-jsonschema: true
      check-jsonschema-files: .github/dependabot.yml
      check-jsonschema-builtin-schema: vendor.dependabot
      # Each scan skips its own action's source, whose pattern script and
      # marker policy contain the literal bodies it matches.
      machine-specific-paths-exclude: ':(exclude).github/actions/check-machine-paths/**'
      comment-hygiene-exclude: ':(exclude).github/actions/check-comment-markers/**'
      # Composites without a group here run ungated.
      filters: |
        markdown:
          .github/**
          **/*.md
          **/.markdownlint*
        check-jsonschema:
          .github/**

  psscriptanalyzer:
    needs: detect-changes
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && !cancelled() && fromJSON(needs.detect-changes.outputs.results || '{}')['powershell'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze PowerShell
        uses: ./.github/actions/psscriptanalyzer
      - name: Analyze composite action PowerShell
        # pwsh embedded in composite metadata is invisible to the lane action
        # and to actionlint; the lane action installed the pinned analyzer.
        run: pwsh -File .github/scripts/Invoke-CompositeRunPssa.ps1
      - name: Prove a broken composite pwsh block fails
        run: pwsh -File .github/scripts/Invoke-CompositeRunPssa.test.ps1

  check-markdown-references:
    needs: detect-changes
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && !cancelled() && fromJSON(needs.detect-changes.outputs.results || '{}')['reference-integrity'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve heading citations
        # Scope to the fixture corpus: the repo's own docs use no `file.md`
        # "Anchor" prose-cite convention, so the fixture is what exercises it.
        uses: ./.github/actions/check-markdown-references
        with:
          globs: fixtures/reference-integrity/*.md

  ruff:
    needs: detect-changes
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && !cancelled() && fromJSON(needs.detect-changes.outputs.results || '{}')['python'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint and format-check Python
        uses: ./.github/actions/ruff
        with:
          paths: fixtures/python/good
          config: fixtures/python/good/ruff.toml

  pyright:
    needs: detect-changes
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && !cancelled() && fromJSON(needs.detect-changes.outputs.results || '{}')['python'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Type-check Python
        uses: ./.github/actions/pyright
        with:
          config: fixtures/python/good/pyrightconfig.json

  biome:
    needs: detect-changes
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && !cancelled() && fromJSON(needs.detect-changes.outputs.results || '{}')['typescript'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint and format-check JS/TS
        # Biome has no CLI exclude, so scope at the conforming fixture and the
        # selector's tested CommonJS source/generator/tests.
        uses: ./.github/actions/biome
        with:
          paths: fixtures/typescript/good .github/scripts
          config: fixtures/typescript/good/biome.json

  dotnet-build:
    needs: detect-changes
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && !cancelled() && fromJSON(needs.detect-changes.outputs.results || '{}')['dotnet'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build .NET contract fixture
        # Scope at a self-contained fixture project; this lane verifies the
        # action contract without mirroring the standards catalog.
        uses: ./.github/actions/dotnet-build
        with:
          project: fixtures/dotnet/good/good.csproj

  dotnet-format:
    needs: detect-changes
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && !cancelled() && fromJSON(needs.detect-changes.outputs.results || '{}')['dotnet'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify .NET whitespace
        uses: ./.github/actions/dotnet-format
        with:
          project: fixtures/dotnet/good/good.csproj

  actionlint:
    needs: detect-changes
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && !cancelled() && fromJSON(needs.detect-changes.outputs.results || '{}')['actionlint'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: ./.github/actions/actionlint
      - name: Prove embedded scripts are checked by ShellCheck
        run: |
          set -euo pipefail
          expected_version="$(awk '
            $0 == "  shellcheck-version:" { in_input=1; next }
            in_input && /^  [^ ]/ { exit }
            in_input && /^    default: / { sub(/^    default: /, ""); print; exit }
          ' .github/actions/actionlint/action.yml)"
          actual_version="$(shellcheck --version | awk '$1 == "version:" { print $2 }')"
          if [[ -z "$expected_version" || "$actual_version" != "$expected_version" ]]; then
            echo "::error::Expected ShellCheck $expected_version, got $actual_version."
            exit 1
          fi
          output="$RUNNER_TEMP/actionlint-shellcheck.txt"
          if actionlint .github/actions/actionlint/fixtures/shellcheck.yml >"$output" 2>&1; then
            echo '::error::The intentional ShellCheck fixture unexpectedly passed actionlint.'
            exit 1
          fi
          cat "$output"
          grep -F '[shellcheck]' "$output"
          grep -F 'SC2086' "$output"
      - name: Lint composite action shell
        # actionlint cannot read composite metadata; the lane action already
        # put the pinned ShellCheck on PATH.
        run: bash .github/scripts/composite-run-shellcheck.sh
      - name: Prove a broken composite shell block fails
        run: bash .github/scripts/composite-run-shellcheck.test.sh

  jsonschema:
    needs: detect-changes
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && !cancelled() && fromJSON(needs.detect-changes.outputs.results || '{}')['jsonschema'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dependabot.yml is validated by the `checks` lane: one check-jsonschema
      # call carries one schema family.
      - name: Validate workflows
        uses: ./.github/actions/check-jsonschema
        with:
          builtin-schema: vendor.github-workflows
          files: .github/workflows/*.yml
      - name: Validate composite actions
        uses: ./.github/actions/check-jsonschema
        with:
          builtin-schema: vendor.github-actions
          files: .github/actions/*/action.yml .github/actions/*/*/action.yml

  check-action-filename:
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject action.yaml metadata (action.yml is enforced exclusively)
        uses: ./.github/actions/check-action-filename

  # Enforcing on this repository's own workflows and actions, against the
  # standards naming conventions at a pinned SHA (standards#672).
  check-workflow-naming:
    needs: detect-changes
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && !cancelled() && fromJSON(needs.detect-changes.outputs.results || '{}')['workflow-naming'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflow and action naming
        uses: ./.github/actions/check-workflow-naming
        with:
          standards-ref: d4ce69bef0c6140d761a4d9f2986e15906b5cedb
      - name: Run a misnamed workflow fixture in enforcing mode
        id: bad-enforcing
        continue-on-error: true
        uses: ./.github/actions/check-workflow-naming
        with:
          root: fixtures/workflow-naming/bad
          standards-ref: d4ce69bef0c6140d761a4d9f2986e15906b5cedb
      - name: Prove the misnamed workflow fixture failed
        env:
          OUTCOME: ${{ steps.bad-enforcing.outcome }}
        run: |
          if [[ "$OUTCOME" != failure ]]; then
            echo "::error::The misnamed workflow fixture passed enforcing mode (outcome: $OUTCOME)."
            exit 1
          fi
      - name: Test the runner against the real analyzer
        # The action above left the pinned standards checkout, its installed
        # dependencies and Node in place; the runner test reuses them for the
        # good-fixture and advisory cases.
        env:
          REAL_STANDARDS_ROOT: ${{ github.workspace }}/.check-workflow-naming-standards
        run: bash .github/actions/check-workflow-naming/run.test.sh

  # Advisory (#208): reject hand-edits of sync-manifest-managed files. Not in
  # ci-status yet: promote after a clean soak.
  check-managed-files:
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Guard managed files
        uses: ./.github/actions/check-managed-files
        with:
          standards-ref: c4d865bb123f476cf1cb36d8f8a1ffb588204f00

  shellcheck:
    needs: detect-changes
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && !cancelled() && fromJSON(needs.detect-changes.outputs.results || '{}')['shell'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell scripts
        uses: ./.github/actions/shellcheck
      - name: Test ShellCheck discovery and scoped exclusions
        run: bash .github/actions/shellcheck/run.test.sh
      - name: Test exec-bit shebang mode scan
        run: bash .github/actions/check-exec-bit/check-exec-bit.test.sh

  shfmt:
    needs: detect-changes
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && !cancelled() && fromJSON(needs.detect-changes.outputs.results || '{}')['shell'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell formatting
        # Includes the selector/OSV shell sources so their generated security
        # boundary cannot bypass the required formatter.
        uses: ./.github/actions/shfmt
        with:
          paths: fixtures/shell/good .github/scripts .github/actions/verify-pulumi-deploy-policy .github/actions/detect-changes .github/actions/pr-require-checks/check-contract .github/actions/pr-require-checks/aggregate-results .github/actions/check-exec-bit .github/actions/check-workflow-naming .github/actions/shfmt
      - name: Test shfmt discovery and fan-out
        run: bash .github/actions/shfmt/run.test.sh

  test-contracts:
    needs: detect-changes
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && !cancelled() && fromJSON(needs.detect-changes.outputs.results || '{}')['selector-contract'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Test selector and generated workflow contracts
        run: node --test .github/scripts/*.test.cjs
      - name: Test change-detection matcher
        run: bash .github/actions/detect-changes/match.test.sh
      - name: Test Claude lane outcome classifier
        run: node --test .github/actions/report-lane-outcome/*.test.cjs
      - name: Test OSV scan policy guard
        run: bash .github/scripts/osv-scan-guard.test.sh
      - name: Test Gitleaks scan policy guard
        run: bash .github/actions/gitleaks/scan.test.sh
      - name: Verify the comment-hygiene prefilter is a superset of the policy library
        # The git-grep prefilter must admit every line the policy flags, or the
        # gate fails open. The checks reusable cannot run a repo-local script.
        run: bash .github/actions/check-comment-markers/superset-test.sh
      - name: Test machine-specific path span filtering
        # Repo-local driver contract. The checks reusable cannot run this
        # script, same as the comment-hygiene superset test above.
        run: bash .github/actions/check-machine-paths/check-machine-specific-paths.test.sh
      - name: Test comment-hygiene scan-tree collection contracts
        run: bash .github/actions/check-comment-markers/scan-tree.test.sh
      - name: Test the workflow-naming runner
        run: bash .github/actions/check-workflow-naming/run.test.sh
      - name: Test the pull-request contract runner
        run: bash .github/actions/pr-require-checks/check-contract/run.test.sh
      - name: Test the ci-status aggregation and carry-forward runner
        run: bash .github/actions/pr-require-checks/aggregate-results/run.test.sh
      - name: Test Pulumi deployment guard
        run: bash .github/actions/verify-pulumi-deploy-policy/guard.test.sh
      - name: Test govulncheck SARIF classification
        run: bash .github/scripts/govulncheck-sarif-guard.test.sh

  pr-audit-workflows:
    needs: detect-changes
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && !cancelled() && fromJSON(needs.detect-changes.outputs.results || '{}')['zizmor'] != 'false' }}
    permissions:
      contents: read
      # pr-audit-workflows.yml always declares this and a called workflow cannot elevate,
      # so grant it although the dogfood stays annotations-only.
      security-events: write
    # Audit this repo's own workflows AND composite actions (paths: .) — strong
    # dogfood. Advisory: findings annotate without blocking ci-status.
    uses: ./.github/workflows/pr-audit-workflows.yml
    with:
      paths: .

  pr-scan-dependencies:
    # Not change-gated: a filter enumerating every lockfile format OSV
    # discovers would drift and skip an unlisted new one.
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    uses: ./.github/workflows/pr-scan-dependencies.yml
    with:
      # This public repository's hosted lane is free; private consumers must pass
      # their strict selector output instead.
      runner: ubuntu-24.04
      # This repo has no lockfiles; the dogfood proves the wrapper's wiring
      # without inventing a fixture manifest.
      allow-no-lockfiles: true

  pr-run-checks-go:
    needs: detect-changes
    if: ${{ github.event_name != 'issues' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && !cancelled() && fromJSON(needs.detect-changes.outputs.results || '{}')['go'] != 'false' }}
    permissions:
      contents: read
    # The fixture asserts on Windows that the test binary was built with the
    # race detector: behavioral evidence, not a source-text contract alone.
    uses: ./.github/workflows/pr-run-checks-go.yml
    with:
      config: .golangci.yml
      working-directory: fixtures/go/windows-race
      go-version-file: fixtures/go/windows-race/go.mod

  # Dogfood of the Claude lanes and the issue labeler, pinned to a merged SHA
  # rather than `./` so a pull request cannot redefine the reusable that
  # reviews it. Advisory: none of the three is in `ci-status`. Each passes only
  # the one named secret its reusable declares.
  pr-review:
    if: ${{ github.event_name != 'issues' && github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && (contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) || (github.event.action == 'edited' && github.event.changes.base)) }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: melodic-software/ci-workflows/.github/workflows/pr-review.yml@cf316d12b4a14fbdb96a339b7ad00ce935a8cad4 # v0.38.2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  pr-review-security:
    if: ${{ github.event_name != 'issues' && github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && (contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) || (github.event.action == 'edited' && github.event.changes.base)) }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: melodic-software/ci-workflows/.github/workflows/pr-review-security.yml@cf316d12b4a14fbdb96a339b7ad00ce935a8cad4 # v0.38.2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Labels with the real `needs-triage` label (the reusable's default), so the
  # label-set guard and the fail-closed existence check run end to end.
  intake-label-needs-triage:
    if: ${{ github.event_name == 'issues' }}
    permissions:
      issues: write
    uses: melodic-software/ci-workflows/.github/workflows/intake-label-needs-triage.yml@cf316d12b4a14fbdb96a339b7ad00ce935a8cad4 # v0.38.2

  # Arms auto-merge on this repo's vendor Dependabot bumps, pinned so a bump
  # cannot redefine the code holding the write token. Never in `ci-status`:
  # the arm waits on it, so a dependency would deadlock.
  pr-automerge-dependabot:
    if: ${{ github.event_name != 'issues' && github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && (contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) || (github.event.action == 'edited' && github.event.changes.base)) }}
    permissions:
      contents: write # enablePullRequestAutoMerge
      pull-requests: write # Arm or disarm auto-merge; list the PR's commits.
    uses: melodic-software/ci-workflows/.github/workflows/pr-automerge-dependabot.yml@cf316d12b4a14fbdb96a339b7ad00ce935a8cad4 # v0.38.2
    with:
      runner: ubuntu-24.04

  ci-status:
    if: ${{ github.event_name != 'issues' && always() }}
    # `changes` is aggregated so a failed detection fails ci-status even though
    # every gated lane fails open and runs.
    needs: [detect-changes, pr-run-checks, psscriptanalyzer, check-markdown-references, ruff, pyright, biome, dotnet-build, dotnet-format, shellcheck, shfmt, test-contracts, actionlint, jsonschema, check-action-filename, check-workflow-naming, pr-run-checks-go, pr-audit-workflows, pr-scan-dependencies]
    runs-on: ubuntu-24.04
    # No run waits for another: with `yield-to-full-run` a contract-only run
    # lists in-flight runs once and reads the status once, and a full run's
    # ci-status runs after its lanes, so either finishes in seconds.
    timeout-minutes: 3
    permissions:
      contents: read
      # pr-contract upserts the linkage comment and label; ci-status records
      # the `ci-lanes` status the next contract-only run reads back.
      pull-requests: write
      statuses: write
      # `yield-to-full-run` lists this workflow's runs on the head SHA, and
      # `rerun-contract-only-siblings` re-runs the red contract-only ones once
      # the full run records `success`. Under an explicit permissions block every
      # unlisted scope defaults to none; write covers the read.
      actions: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the pull-request contract
        uses: ./.github/actions/pr-require-checks/check-contract
        with:
          # Dependabot pull requests link no issue.
          exempt-authors: 'dependabot[bot]'
      - name: Aggregate lane results
        # `!cancelled()` so a failing pr-contract step does not skip the
        # `ci-lanes` status write the next contract-only run needs.
        if: ${{ !cancelled() }}
        uses: ./.github/actions/pr-require-checks/aggregate-results
        with:
          # A contract-only run never waits: while a full run on the SHA is in
          # flight it fails with "superseded by full run <url>", and that run's
          # newer ci-status decides the gate. Once the full run records
          # `success` it re-runs those red contract-only runs, which then read
          # the `success` and replace their red check runs.
          yield-to-full-run: 'true'
          rerun-contract-only-siblings: 'true'
          carry-forward-wait-seconds: '0'
          results: ${{ needs.detect-changes.result }} ${{ needs.pr-run-checks.result }} ${{ needs.psscriptanalyzer.result }} ${{ needs.check-markdown-references.result }} ${{ needs.ruff.result }} ${{ needs.pyright.result }} ${{ needs.biome.result }} ${{ needs.dotnet-build.result }} ${{ needs.dotnet-format.result }} ${{ needs.shellcheck.result }} ${{ needs.shfmt.result }} ${{ needs.test-contracts.result }} ${{ needs.actionlint.result }} ${{ needs.jsonschema.result }} ${{ needs.check-action-filename.result }} ${{ needs.check-workflow-naming.result }} ${{ needs.pr-run-checks-go.result }} ${{ needs.pr-audit-workflows.result }} ${{ needs.pr-scan-dependencies.result }}
