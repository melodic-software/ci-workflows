name: standards-sync-stuck-automerge-alert

# Reusable workflow: scans the standards-sync target repos (read from the
# standards manifest at run time — never hardcoded) for open, App-authored
# standards-sync pull requests in two states that keep a sync PR from merging
# itself, both silent without this watchdog:
#
#   1. ARMED BUT STUCK — auto-merge is on, but GraphQL reports
#      `mergeStateStatus: BLOCKED` past a threshold (observed:
#      melodic-software/medley#1619, an armed sync PR blocked for hours by an
#      unrelated pre-existing ci-status failure, with nothing watching).
#   2. NEVER ARMED — the PR is past the threshold, its target is marked
#      `automerge: true`, and auto-merge was never successfully armed on it.
#      standards-sync.yml downgrades every arming rejection to a
#      `core.warning`, so a failed arm leaves a PR that looks exactly like the
#      pre-arming status quo while the operator's mental model says "armed".
#      Failing closed is fine; failing closed INVISIBLY is the defect, because
#      the PR then waits on a human who was never told to look.
#
# Not exhaustive: an armed PR reporting a non-BLOCKED unmergeable state (DIRTY,
# for one) is out of scope here and stays unreported.
#
# standards-sync.yml arms auto-merge on any PR the manifest marks armed that has
# never been armed, on a body that is gate-compliant by construction; this
# workflow is the second half of that contract — the watchdog for arming that
# did not take, or did not stick.
#
# The target repo list is derived by checking out standards and running its
# own sync-manifest.sh interpreter, the same way standards-sync.yml's plan job
# does — never a second, hand-maintained inventory.
#
# The tracking issue is opened in ONE repository the caller names through
# `tracking-issue-repository`, authored by a second App token this workflow
# mints scoped to issues:write on exactly that repository — not scattered
# across the scanned targets, and NOT implicitly the calling repository.
# Naming it is required rather than defaulted because the App is what writes
# the issue, so the destination must be a repository the App is installed on,
# and the caller is not necessarily one: melodic-software/standards is the
# sync SOURCE and deliberately not a target, so defaulting to the caller made
# the token mint 404 on every run (melodic-software/standards#273). A default
# would have made the reachable case the exception; a required input makes an
# unreachable destination a caller-side error stated up front instead of a
# 404 discovered when the alert first has something to report.
#
# The name is a bare repository name, not `owner/repo`: the mint below leaves
# `owner` unset, which resolves it to the calling repository's owner — the
# same owner that owns the App installation the caller's secrets belong to.
# A tracking issue in a different owner's repository would need a different
# installation and therefore different secrets, which is a different caller,
# not a different input value.
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label selected by the caller's governed selector.
        type: string
        default: ubuntu-24.04
      tracking-issue-repository:
        description: >-
          Bare name (never `owner/repo`) of the repository this workflow's
          rolling tracking issue lives in, under the calling repository's own
          owner. The App named by `app-client-id`/`app-private-key` must be
          installed on it, because that App authors the issue — see the
          header. Required, and deliberately not defaulted to the calling
          repository.
        type: string
        required: true
      manifest:
        description: Repository-relative manifest path in the standards checkout.
        type: string
        default: distribution/sync-manifest.yml
      standards-ref:
        description: Ref (branch, tag, or SHA) of standards whose manifest names the scanned targets.
        type: string
        default: main
      threshold-hours:
        description: Minimum hours before an armed-but-BLOCKED or never-armed PR is reported.
        type: number
        default: 4
      test-mode:
        description: >-
          When true, skip live target scanning and fabricate synthetic
          candidates instead, filing under a test-only marker and title so the
          production rolling issue is never touched or adopted. Proves the
          tracking-issue create/update/close/fail paths without a real stuck
          PR.
        type: boolean
        default: false
      test-synthetic-candidates:
        description: >-
          Synthetic candidate count when test-mode is true, as a string ('0',
          '1', or '2') — 2 fabricates one armed-stuck and one never-armed row,
          1 the armed-stuck row only, 0 the all-clear that closes the test
          issue. A string deliberately: workflow_dispatch inputs arrive as
          strings, and '0' must survive the caller's empty-string fallback (a
          numeric falsy would be swallowed). Ignored when test-mode is false.
        type: string
        default: '1'
    secrets:
      app-client-id:
        description: GitHub App client ID for cross-repository pull-request reads.
        required: true
      app-private-key:
        description: GitHub App private key for cross-repository pull-request reads.
        required: true

permissions:
  contents: read

env:
  YQ_VERSION: v4.53.3
  YQ_LINUX_AMD64_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
  # The one App identity standards-sync.yml opens sync PRs as. GraphQL's
  # `author.login` omits the REST-only `[bot]` suffix; `__typename` is the
  # authoritative bot-vs-human discriminator, so both are checked together.
  BOT_LOGIN: melodic-standards-sync
  # The identity that opens/updates/closes this workflow's own tracking
  # issue: a second App token (minted below, scoped to issues:write on only
  # `tracking-issue-repository`) authors every REST write this workflow makes,
  # so its bot login is the adoption filter — not the ambient GITHUB_TOKEN's
  # shared github-actions[bot] identity every workflow in a repo can author
  # as. App authorship is strictly tighter decoy resistance: a decoy from any
  # other workflow in the caller repo no longer qualifies. It also drops the
  # caller's need to grant issues:write to the ambient token at all, which
  # resolves a runner-policy contract conflict in melodic-software/standards
  # (components/runner-policy): a contract with a write allowedCallerPermissions
  # entry must map its secrets as an exact identity passthrough
  # `${{ secrets.<name> }}`, which this reusable's kebab-case App-secret
  # inputs (app-client-id/app-private-key) can never satisfy. Login format
  # (`<app-slug>[bot]`, type Bot) is empirically verified: `gh api
  # users/melodic-standards-sync%5Bbot%5D` returns login
  # "melodic-standards-sync[bot]", type "Bot".
  ISSUE_AUTHOR_LOGIN: melodic-standards-sync[bot]
  # Marker and title diverge under test-mode so a dispatched proof run files a
  # separate rolling issue the production lookup never adopts — the identity
  # filter alone cannot distinguish them, because the same App authors both.
  # Every marker/title consumer below reads these two values; no step carries
  # its own literal.
  ALERT_MARKER: ${{ inputs.test-mode && '<!-- ci-workflows:standards-sync-stuck-automerge-alert:v1:test -->' || '<!-- ci-workflows:standards-sync-stuck-automerge-alert:v1:active -->' }}
  ALERT_ISSUE_TITLE: ${{ inputs.test-mode && '[Test] standards-sync auto-merge PR(s) needing attention' || '[Alert] standards-sync auto-merge PR(s) needing attention' }}

jobs:
  detect-stuck-armed-prs:
    name: Detect standards-sync auto-merge PRs that cannot merge themselves
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read # The ambient token no longer authors any issue write; see ISSUE_AUTHOR_LOGIN above.
    steps:
      # First step, before the checkout and the scan: a malformed destination
      # otherwise fails LATE and confusingly rather than not at all. An
      # `owner/repo` value mints a token fine (create-github-app-token accepts
      # that form and checks the owner half matches), then breaks downstream —
      # `listForRepo` 404s on a repo name containing a slash, and the issue
      # write concatenates a second owner onto it.
      - name: Reject a malformed tracking-issue repository
        env:
          TRACKING_ISSUE_REPOSITORY: ${{ inputs.tracking-issue-repository }}
        run: |
          set -euo pipefail
          # GitHub's own repository-name character set, minus the two names it
          # forbids: `.` and `..` match the character class but would reach the
          # REST client as a path segment rather than a name.
          if [[ ! "$TRACKING_ISSUE_REPOSITORY" =~ ^[A-Za-z0-9._-]+$ ]] \
            || [[ "$TRACKING_ISSUE_REPOSITORY" == "." || "$TRACKING_ISSUE_REPOSITORY" == ".." ]]; then
            echo "::error::tracking-issue-repository must be a bare repository name under the caller's own owner, not '${TRACKING_ISSUE_REPOSITORY}'."
            exit 1
          fi

      - name: Check out standards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: melodic-software/standards
          ref: ${{ inputs.standards-ref }}
          persist-credentials: false

      - name: Install checksum-verified yq
        # Mirrors standards-sync.yml's install rather than independently
        # taking the runner-preinstalled exception this workflow's own,
        # advisory-only blast radius might otherwise justify (ratified,
        # melodic-software/ci-workflows#265): this workflow is the watchdog
        # half of standards-sync.yml's arm-then-verify contract, reads the
        # same manifest, and is meant to stay toolchain-identical to it
        # rather than drift to a second, independently-reasoned yq.
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/standards-sync-alert-bin"
          install -d "$install_dir"
          # Nine attempts under curl's exponential backoff (~4-5 minutes,
          # capped by --retry-max-time) instead of a burst that ends within
          # seconds, and --retry-all-errors so a mid-body connection death
          # (curl exit 56) retries like an HTTP 5xx does — the two failure
          # classes of the 2026-08-12 release-asset outage (#444). Kept
          # flag-for-flag identical to standards-sync.yml's install per the
          # toolchain-identical contract above. The pinned SHA-256 below
          # stays the integrity gate.
          curl --fail --location --proto '=https' --silent --show-error \
            --connect-timeout 10 --max-time 120 \
            --retry 8 --retry-all-errors --retry-max-time 300 \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            --output "$install_dir/yq"
          printf '%s  %s\n' "$YQ_LINUX_AMD64_SHA256" "$install_dir/yq" \
            | sha256sum --check --strict -
          chmod 0755 "$install_dir/yq"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Read target repositories from the manifest
        id: targets
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          matrix="$(bash distribution/sync-manifest.sh matrix --source-root . --manifest "$MANIFEST")"
          repo_names="$(jq -r '[.include[].repo_name] | join(",")' <<<"$matrix")"
          echo "repo-names=${repo_names}" >> "$GITHUB_OUTPUT"
          # Only targets the manifest expects to be armed can be reported
          # unarmed. `automerge: false` is a deliberate per-target opt-out
          # (rollout windows set it while a target is staged), so scanning an
          # opted-out target would turn the intended state into an alert.
          automerge_names="$(jq -r '[.include[] | select(.automerge) | .repo_name] | join(",")' <<<"$matrix")"
          echo "automerge-repo-names=${automerge_names}" >> "$GITHUB_OUTPUT"

      - name: Mint read-only App token scoped to every target
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: melodic-software
          repositories: ${{ steps.targets.outputs.repo-names }}
          permission-pull-requests: read

      - name: Scan targets for stuck or never-armed pull requests
        id: scan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPO_NAMES: ${{ steps.targets.outputs.repo-names }}
          AUTOMERGE_REPO_NAMES: ${{ steps.targets.outputs.automerge-repo-names }}
          THRESHOLD_HOURS: ${{ inputs.threshold-hours }}
          GRAPHQL_RETRY_ATTEMPTS: '4'
          GRAPHQL_RETRY_BASE_MS: '1000'
          TEST_MODE: ${{ inputs.test-mode }}
          TEST_SYNTHETIC_CANDIDATES: ${{ inputs.test-synthetic-candidates }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const owner = 'melodic-software';
            const botLogin = process.env.BOT_LOGIN;
            const thresholdHours = Number(process.env.THRESHOLD_HOURS);
            const repoNames = process.env.REPO_NAMES.split(',').filter((name) => name.length > 0);
            const automergeRepoNames = new Set(
              (process.env.AUTOMERGE_REPO_NAMES ?? '').split(',').filter((name) => name.length > 0),
            );
            const retryAttempts = Number(process.env.GRAPHQL_RETRY_ATTEMPTS ?? 4);
            const retryBaseMs = Number(process.env.GRAPHQL_RETRY_BASE_MS ?? 1000);

            // Test mode fabricates candidates instead of probing live targets;
            // everything downstream — report file, outputs, issue write, the
            // deliberate failure — runs unchanged, and that equivalence is what
            // a dispatched proof run demonstrates. Off unless TEST_MODE is the
            // literal string 'true': undefined in the contract tests' replayed
            // environments and 'false' on production runs.
            const testMode = process.env.TEST_MODE === 'true';
            // Validated against the exact legal set: Number() would map an
            // empty, negative, or garbled count to 0/NaN, silently taking the
            // all-clear path — a typo'd create/update proof would then CLOSE
            // the test issue while appearing to succeed.
            const rawSyntheticCandidates = process.env.TEST_SYNTHETIC_CANDIDATES ?? '1';
            if (testMode && !['0', '1', '2'].includes(rawSyntheticCandidates)) {
              core.setFailed(`test-synthetic-candidates must be '0', '1', or '2'; got '${rawSyntheticCandidates}'.`);
              return;
            }
            const testSyntheticCandidates = Number(rawSyntheticCandidates);

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            // GitHub intermittently answers a GraphQL query with an opaque
            // server-side error instead of data (github.graphql throws), most
            // often when the query forces an on-demand mergeability computation.
            // One such error must not abort the whole scan and falsely clear the
            // tracking issue, so every call is retried with exponential backoff;
            // only a persistent failure propagates, failing the run loudly.
            const graphqlWithRetry = async (query, variables, description) => {
              for (let attempt = 1; ; attempt += 1) {
                try {
                  return await github.graphql(query, variables);
                } catch (error) {
                  if (attempt >= retryAttempts) throw error;
                  const delayMs = retryBaseMs * 2 ** (attempt - 1);
                  core.info(`GraphQL ${description} failed (attempt ${attempt}/${retryAttempts}): ${error.message}; retrying in ${delayMs}ms.`);
                  await sleep(delayMs);
                }
              }
            };

            const armedHoursSince = (enabledAt) =>
              enabledAt ? (Date.now() - Date.parse(enabledAt)) / 3_600_000 : null;

            const isSyncPullRequest = (pullRequest) =>
              pullRequest.author?.__typename === 'Bot' && pullRequest.author?.login === botLogin;

            const isArmedCandidate = (pullRequest) => {
              if (!isSyncPullRequest(pullRequest)) return false;
              const armedHours = armedHoursSince(pullRequest.autoMergeRequest?.enabledAt);
              return armedHours !== null && armedHours >= thresholdHours;
            };

            // The arming step swallows every mutation rejection into a
            // core.warning, so a failure to arm produces a sync PR that simply
            // sits unarmed — a state indistinguishable, from the outside, from
            // the pre-arming behavior nobody was watching. That is the blind
            // spot this predicate closes: an open sync PR in a target the
            // manifest says should be armed, never armed, and older than the
            // threshold. Only a PR that was NEVER armed is a failure — a PR
            // armed and later disarmed is somebody's decision, or GitHub's
            // (see the arming-history probe below).
            const isUnarmedCandidate = (pullRequest) => {
              if (!isSyncPullRequest(pullRequest)) return false;
              if (pullRequest.autoMergeRequest?.enabledAt) return false;
              const openHours = (Date.now() - Date.parse(pullRequest.createdAt)) / 3_600_000;
              return openHours >= thresholdHours;
            };

            // @actions/github bundles @octokit/plugin-paginate-rest but not a
            // GraphQL pagination plugin (verified: its package.json lists no
            // @octokit/plugin-paginate-graphql dependency), so github.paginate
            // cannot walk this query — the cursor loop is manual. A silently
            // truncated single page would make the watchdog itself unsound: a
            // stuck PR sorted past the page boundary is invisible, and an
            // empty/false "all clear" result on this scan closes the existing
            // tracking issue, so under-paginating can convert a real incident
            // into a false recovery signal. MAX_PAGES bounds the loop so a
            // pathological repo cannot hang this workflow indefinitely.
            const PAGE_SIZE = 50;
            const MAX_PAGES = 50;
            const listQuery = `
              query($owner: String!, $repo: String!, $after: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequests(states: OPEN, first: ${PAGE_SIZE}, after: $after, orderBy: {field: CREATED_AT, direction: ASC}) {
                    nodes {
                      number
                      url
                      createdAt
                      author { login __typename }
                      autoMergeRequest { enabledAt }
                    }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }`;

            // mergeStateStatus is deliberately absent from the page query above
            // and fetched one PR at a time here: GitHub computes it on demand,
            // and selecting it across a 50-node page fans that computation out
            // and reliably trips the opaque server-side error. Only armed,
            // past-threshold PRs can be stuck, so only they are probed.
            // autoMergeRequest.enabledAt is re-read alongside it because a PR
            // can be disarmed or re-armed in the interval between the page
            // fetch and this probe; the stuck decision below re-validates armed
            // state and threshold against this fresh value, not the page value.
            const mergeStateQuery = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    autoMergeRequest { enabledAt }
                    mergeStateStatus
                  }
                }
              }`;

            // An arming failure is the one state that leaves NO auto-merge
            // enabled event behind, because the mutation never succeeded.
            // Absence of that event is therefore direct positive
            // evidence, where "no disarm event" would only be an inference —
            // and it does not conflate a reviewer disarming a PR with GitHub
            // disabling auto-merge on its own (a push from someone without
            // write access, or a base-branch switch), both of which leave the
            // PR armed at some point and are not arming failures. Probing only
            // already-unarmed candidates keeps the extra query off the common
            // path.
            //
            // `nodes`, never `totalCount`: totalCount counts the WHOLE timeline
            // and ignores itemTypes (verified live — a PR with four timeline
            // items and no arming event reports totalCount 4). All three
            // enabled-event types are listed because which one GitHub records
            // depends on the merge method: standards-sync.yml arms with SQUASH,
            // which emits AutoSquashEnabledEvent, not AutoMergeEnabledEvent
            // (verified live), so naming only the latter would report every
            // armed PR as an arming failure.
            const armingHistoryQuery = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    state
                    autoMergeRequest { enabledAt }
                    timelineItems(first: 1, itemTypes: [AUTO_MERGE_ENABLED_EVENT, AUTO_SQUASH_ENABLED_EVENT, AUTO_REBASE_ENABLED_EVENT]) {
                      nodes { __typename }
                    }
                  }
                }
              }`;

            const stuck = [];
            const unarmed = [];
            // Test mode empties the scan list rather than branching around the
            // loop, so the loop body needs no reindent and the real-scan code
            // path is byte-identical either way.
            const scanRepoNames = testMode ? [] : repoNames;
            for (const repo of scanRepoNames) {
              const candidates = [];
              const unarmedCandidates = [];
              let after = null;
              let hasNextPage = true;
              let page = 0;
              while (hasNextPage) {
                page += 1;
                if (page > MAX_PAGES) {
                  core.setFailed(`${repo} has more than ${MAX_PAGES * PAGE_SIZE} open pull requests; refusing to scan an unbounded number of pages.`);
                  return;
                }
                const result = await graphqlWithRetry(listQuery, { owner, repo, after }, `scan ${repo} page ${page}`);
                const pullRequests = result.repository?.pullRequests;
                const nodes = pullRequests?.nodes ?? [];
                for (const pullRequest of nodes) {
                  if (isArmedCandidate(pullRequest)) candidates.push(pullRequest);
                  else if (automergeRepoNames.has(repo) && isUnarmedCandidate(pullRequest)) {
                    unarmedCandidates.push(pullRequest);
                  }
                }
                hasNextPage = pullRequests?.pageInfo?.hasNextPage ?? false;
                after = pullRequests?.pageInfo?.endCursor ?? null;
              }

              for (const candidate of candidates) {
                const result = await graphqlWithRetry(
                  mergeStateQuery,
                  { owner, repo, number: candidate.number },
                  `merge state for ${repo}#${candidate.number}`,
                );
                const pullRequest = result.repository?.pullRequest;
                if (pullRequest?.mergeStateStatus !== 'BLOCKED') continue;
                const armedHours = armedHoursSince(pullRequest.autoMergeRequest?.enabledAt);
                if (armedHours === null || armedHours < thresholdHours) continue;
                stuck.push({ repo, number: candidate.number, url: candidate.url, armedHoursAgo: Math.floor(armedHours) });
              }

              for (const candidate of unarmedCandidates) {
                const result = await graphqlWithRetry(
                  armingHistoryQuery,
                  { owner, repo, number: candidate.number },
                  `arming history for ${repo}#${candidate.number}`,
                );
                const pullRequest = result.repository?.pullRequest;
                // Re-read state and armed state: between the page fetch and
                // this probe the PR may have been armed, merged, or closed. A
                // PR merged or closed by hand while still unarmed keeps
                // reporting no autoMergeRequest and no arming event, so without
                // the state guard a resolved PR is reported forever.
                if (pullRequest?.state !== 'OPEN') continue;
                if (pullRequest.autoMergeRequest?.enabledAt) continue;
                if (pullRequest.timelineItems.nodes.length > 0) continue;
                const openHours = (Date.now() - Date.parse(candidate.createdAt)) / 3_600_000;
                unarmed.push({
                  repo,
                  number: candidate.number,
                  url: candidate.url,
                  openHoursAgo: Math.floor(openHours),
                });
              }
            }

            if (testMode) {
              // SYNTHETIC rows: the fake "PR" links point at this very run, so
              // the filed table is self-documenting and dangles no dead link.
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              if (testSyntheticCandidates >= 1) {
                stuck.push({ repo: 'SYNTHETIC-test-candidate', number: 0, url: runUrl, armedHoursAgo: 99 });
              }
              if (testSyntheticCandidates >= 2) {
                unarmed.push({ repo: 'SYNTHETIC-test-candidate', number: 0, url: runUrl, openHoursAgo: 99 });
              }
            }

            core.setOutput('stuck-count', String(stuck.length));
            core.setOutput('unarmed-count', String(unarmed.length));
            if (stuck.length === 0 && unarmed.length === 0) {
              core.info('No stuck armed or silently unarmed standards-sync pull requests found.');
              return;
            }

            const marker = process.env.ALERT_MARKER;
            const body = [marker, ''];

            if (stuck.length > 0) {
              body.push(
                '## standards-sync stuck auto-merge pull request(s)',
                '',
                `${stuck.length} pull request(s) opened by \`${botLogin}[bot]\` have had auto-merge armed for at`,
                `least ${thresholdHours}h while GraphQL reports \`mergeStateStatus: BLOCKED\` — auto-merge cannot`,
                'complete until whatever is blocking it (a failing required check, a missing required review, an',
                'out-of-date branch) is resolved.',
                '',
                '| Repository | Pull request | Armed for |',
                '| --- | --- | --- |',
                ...stuck.map(
                  (entry) => `| \`${entry.repo}\` | [#${entry.number}](${entry.url}) | ${entry.armedHoursAgo}h |`,
                ),
                '',
                '### Recover',
                '',
                '1. Open the pull request and read its checks tab for the specific blocking reason.',
                '2. Resolve it (push a fix, re-run the failing check, request the missing review) or close the PR',
                '   if the sync is no longer wanted; the next scheduled sync recreates and re-arms it.',
                '',
              );
            }

            if (unarmed.length > 0) {
              body.push(
                '## standards-sync pull request(s) that were never armed',
                '',
                `${unarmed.length} pull request(s) opened by \`${botLogin}[bot]\` have been open for at least`,
                `${thresholdHours}h in a target the manifest marks \`automerge: true\`, yet auto-merge has never`,
                'been armed on them. `standards-sync.yml` arms auto-merge on every such PR and downgrades every',
                'mutation rejection to a warning, so the arming step failing leaves exactly this state — a sync PR',
                'that waits for a human who was never told to look.',
                '',
                '| Repository | Pull request | Open for |',
                '| --- | --- | --- |',
                ...unarmed.map(
                  (entry) => `| \`${entry.repo}\` | [#${entry.number}](${entry.url}) | ${entry.openHoursAgo}h |`,
                ),
                '',
                '### Recover',
                '',
                "1. Open that target's most recent `standards-sync` run. If the arming step ran and was",
                "   rejected, its warning carries the message GitHub returned. If the step was skipped, the",
                '   caller pins a `standards-sync.yml` that predates arming on already-open PRs, and re-pinning',
                '   it is the fix.',
                '2. If the App identity cannot arm auto-merge at all, every target is affected and the fix belongs',
                '   in `standards-sync.yml`, not in one PR. Otherwise merge this PR by hand.',
                '',
              );
            }

            body.push(
              '---',
              '*Updated automatically by `standards-sync-stuck-automerge-alert.yml`. Closing this issue without',
              'resolving the underlying block reopens it on the next scheduled scan.*',
            );

            const reportBody = body.join('\n');

            require('node:fs').writeFileSync(process.env.GITHUB_WORKSPACE + '/.stuck-automerge-report.md', reportBody);

      # `owner` omitted, `repositories` named: with `owner` unset the action
      # resolves a repository entry's owner to the current (calling)
      # repository's owner, so this scopes to exactly one repository under the
      # caller's own owner — the narrow scope this token needs, distinct from
      # the read-only every-target token minted above. Leaving BOTH unset is
      # what defaulted the scope to the calling repository and 404'd on every
      # run (melodic-software/standards#273).
      #
      # Runs unconditionally, and must: the three consumers below partition
      # the outcome space rather than sharing one condition — the lookup and
      # the open/update run when a count is non-zero, and the recovery close
      # runs when BOTH are zero. Guarding this step on the non-zero condition
      # would leave the close branch with no token on exactly the runs it is
      # for.
      - name: Mint App token for the tracking-issue repository
        id: issue-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          repositories: ${{ inputs.tracking-issue-repository }}
          permission-issues: write

      # A marker embedded in the body (not a title search) is exact and
      # survives a retitle, and matches the mechanism pulumi-version-drift-
      # check.yml, link-check.yml, and queue-monitor-liveness.yml already use.
      #
      # actions/github-script rather than a `gh api` run step: this reusable
      # runs on whatever runner the caller selected, and a self-hosted image
      # is not guaranteed to ship the gh CLI (the same reason link-check.yml
      # was ported off the shared find-tracking-issue.sh bash block — that
      # block stays a generated consumer only for the two workflows that run
      # on a fixed hosted runner).
      - name: Find existing tracking issue
        id: tracking
        if: steps.scan.outputs.stuck-count != '0' || steps.scan.outputs.unarmed-count != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MARKER: ${{ env.ALERT_MARKER }}
          ISSUE_TITLE: ${{ env.ALERT_ISSUE_TITLE }}
          # Read through env, never interpolated into the script text: an
          # input reaching a `script:` body as `${{ }}` is template injection
          # by construction, however trusted the value looks.
          TRACKING_ISSUE_REPOSITORY: ${{ inputs.tracking-issue-repository }}
        with:
          github-token: ${{ steps.issue-token.outputs.token }}
          script: |
            const marker = process.env.MARKER;
            const issueTitle = process.env.ISSUE_TITLE;
            const issueAuthorLogin = process.env.ISSUE_AUTHOR_LOGIN;
            // The caller's owner, not the caller's repository: the token above
            // is scoped to `tracking-issue-repository` under that same owner.
            const owner = context.repo.owner;
            const repo = process.env.TRACKING_ISSUE_REPOSITORY;

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            // The marker and title strings are public (embedded verbatim in
            // this workflow file), so matching on them alone would let anyone
            // with issue-creation permission in the caller repo craft a decoy
            // this automation adopts. Restricting to issues this workflow's
            // own identity authored closes that: an attacker's issue is never
            // a candidate at all, no matter what text it carries.
            const candidates = openIssues.filter(
              (issue) => !issue.pull_request && issue.user?.login === issueAuthorLogin && issue.user?.type === 'Bot',
            );

            let matches = candidates.filter((issue) => (issue.body ?? '').includes(marker));
            if (matches.length > 1) {
              core.setFailed(`found ${matches.length} issues carrying marker '${marker}'; reconcile them manually.`);
              return;
            }
            if (matches.length === 0) {
              // One-time migration fallback: a still-open issue created by an
              // earlier, pre-marker version of this workflow has no marker
              // yet, so the search above can't find it. Adopt it by exact
              // title match so the update step below reuses (and
              // marker-backfills) that issue instead of orphaning it behind
              // a newly opened duplicate.
              matches = candidates.filter((issue) => issue.title === issueTitle);
              if (matches.length > 1) {
                core.setFailed(`found ${matches.length} pre-marker issues titled '${issueTitle}'; reconcile them manually.`);
                return;
              }
            }
            core.setOutput('issue-number', matches.length === 1 ? String(matches[0].number) : '');

      - name: Open or update tracking issue
        id: issue
        if: steps.scan.outputs.stuck-count != '0' || steps.scan.outputs.unarmed-count != '0'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          token: ${{ steps.issue-token.outputs.token }}
          # Defaults to ${{ github.repository }} — the caller — so naming it is
          # what keeps this write on the same repository the token is scoped to.
          repository: ${{ github.repository_owner }}/${{ inputs.tracking-issue-repository }}
          title: ${{ env.ALERT_ISSUE_TITLE }}
          issue-number: ${{ steps.tracking.outputs.issue-number }}
          content-filepath: ${{ github.workspace }}/.stuck-automerge-report.md

      # actions/github-script rather than a `gh issue close` run step, for
      # the same runner-tool-availability reason as the lookup step above.
      - name: Close recovered tracking issue
        if: steps.scan.outputs.stuck-count == '0' && steps.scan.outputs.unarmed-count == '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MARKER: ${{ env.ALERT_MARKER }}
          TRACKING_ISSUE_REPOSITORY: ${{ inputs.tracking-issue-repository }}
        with:
          github-token: ${{ steps.issue-token.outputs.token }}
          script: |
            const marker = process.env.MARKER;
            const issueAuthorLogin = process.env.ISSUE_AUTHOR_LOGIN;
            const owner = context.repo.owner;
            const repo = process.env.TRACKING_ISSUE_REPOSITORY;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            // Same author restriction as the lookup step: only ever act on an
            // issue this workflow's own identity opened, never a decoy.
            const match = openIssues.find(
              (issue) =>
                !issue.pull_request &&
                issue.user?.login === issueAuthorLogin &&
                issue.user?.type === 'Bot' &&
                (issue.body ?? '').includes(marker),
            );
            if (!match) return;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: match.number,
              body: 'No standards-sync pull request is currently armed and blocked, or unarmed past the threshold; closing this rolling report.',
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: match.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Fail so the scheduled run notifies
        if: steps.scan.outputs.stuck-count != '0' || steps.scan.outputs.unarmed-count != '0'
        env:
          STUCK_COUNT: ${{ steps.scan.outputs.stuck-count }}
          UNARMED_COUNT: ${{ steps.scan.outputs.unarmed-count }}
        run: |
          echo "::error::${STUCK_COUNT} standards-sync pull request(s) are armed and stuck; ${UNARMED_COUNT} were never armed. See the tracking issue."
          exit 1
