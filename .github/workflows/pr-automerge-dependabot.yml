name: PR Automerge Dependabot

# Reusable workflow: arms GitHub auto-merge (squash) on a Dependabot pull
# request whose every update is a patch or minor bump of an allowlisted GitHub
# Actions publisher or of an npm, pip, uv or NuGet package. Arming never merges: GitHub merges once every required check,
# `ci-status` included, passes. Nothing here calls a merge mutation, so this
# workflow cannot bypass the required check. A repository without a required
# check makes GitHub refuse the arm (the pull request is already mergeable),
# and the job fails rather than merging. A GITHUB_TOKEN arm never enters a
# merge queue; a repository whose default branch has one queues these pull
# requests with an App token on a schedule instead, as this repository does in
# pr-automerge-dependabot-queue.yml with the same gate.
#
# Canonical caller (the caller owns the trigger, concurrency and the
# permission grant; a called workflow can only downgrade the caller's grant):
#
#     on:
#       pull_request:
#     concurrency:
#       group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
#       cancel-in-progress: true
#     permissions: {}
#     jobs:
#       pr-automerge-dependabot:
#         permissions:
#           contents: write        # enablePullRequestAutoMerge
#           pull-requests: write   # enable/disable auto-merge on the PR
#         uses: melodic-software/ci-workflows/.github/workflows/pr-automerge-dependabot.yml@main
#
# A repository where a merge can lead to a deploy passes
# `package-auto-merge: false`, which leaves only the GitHub Actions path.
#
# GATES (all must hold, or the pull request is left for a human):
#   - the event is `pull_request` and the PR author's id is 49699333
#     (dependabot[bot]); an id, not a login, so no look-alike account matches;
#   - every update is `github_actions`, or, unless the caller passes
#     `package-auto-merge: false`, `npm_and_yarn`, `pip`, `uv` or `nuget`; any
#     other ecosystem (docker, dotnet_sdk and the rest) is left for a human;
#   - every GitHub Actions dependency name matches a glob in the allowlist.
#     When the caller leaves `publisher-allowlist` at its default (which
#     mirrors standards `components/dependabot-policy/policy.json` `autoMerge`)
#     and the base commit holds the synced copy of that policy at
#     `.github/standards/dependabot-policy/policy.json`, the allowlist is the
#     copy's `tier: auto` publishers plus its `fastTrack` `github-actions` and
#     `own` globs. With no synced copy, or a caller list other than the
#     default, the input is the allowlist. A copy that cannot be read or
#     parsed, or an input that is not a JSON array of non-empty strings, arms
#     nothing;
#   - no package dependency name is in the caller's `review-only-dependencies`
#     (its entries in that policy's `autoMerge.reviewOnly`);
#   - every update is a semver patch or minor, and a version below 1.0 keeps
#     its minor component (the policy's non-major rule); a grouped PR with one
#     major bump, or an update type Dependabot could not compute, is skipped;
#   - the updates in the metadata are exactly those the title or the body's
#     `Updates` lines name, each with the same from and to version
#     (standards dependabot-policy README, auto tier);
#   - the event's sender (the pusher on opened/synchronize/reopened) is
#     49699333, so a push or reopen by anyone else is skipped;
#   - fetch-metadata succeeded; it fails when the first commit is not
#     Dependabot's, and missing or invalid metadata is a skip;
#   - every commit on the PR, the head included, has author 49699333,
#     committer 19864447 (web-flow, GitHub's signing identity for Dependabot
#     commits) and a signature verified with reason `valid`. "Verified" vouches
#     for the committer only, so the author id alone is forgeable.
#
# A skipped PR that is already armed is disarmed: GitHub keeps auto-merge on
# when a user with write access pushes to the branch, so the commit gate
# would otherwise hold only until the first arm. The gate step runs even when
# fetch-metadata fails, so that disarm still happens. The arm also passes the
# verified head SHA as `expectedHeadOid`, so a push that lands between the
# check and the arm makes the arm fail instead of covering the new commit.
#
# TRUST: every PR-derived value (dependency names, versions, the metadata
# JSON) is untrusted. Values reach the script through `env:` only, never a
# `${{ }}` expansion inside script text. No checkout: nothing from the pull
# request is executed, and the synced policy is read through the contents API
# at the pull request's base commit, so the pull request cannot change it. The gate is the automerge-dependabot composite, reached
# through `$/`, so it runs at the commit of this workflow the caller calls.
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label selected by the caller.
        type: string
        default: ubuntu-24.04
      package-auto-merge:
        description: >-
          Also arm npm, pip, uv and NuGet patch and minor bumps. Pass false where a
          merge can lead to a deploy.
        type: boolean
        default: true
      review-only-dependencies:
        description: >-
          JSON array of package dependency names never armed: the caller's
          entries in standards dependabot-policy autoMerge.reviewOnly.
        type: string
        default: "[]"
      publisher-allowlist:
        description: >-
          JSON array of GitHub Actions publisher globs (`*` matches any run of
          characters) whose patch and minor bumps are armed. At this default,
          a synced standards dependabot-policy copy at the base sets the list
          instead. Narrow it to keep a publisher's bumps for a person.
        type: string
        default: '["actions/*","github/*","anthropics/*"]'

permissions: {}

jobs:
  enable-auto-merge:
    name: Arm auto-merge for safe Dependabot bumps
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.id == 49699333 }}
    runs-on: ${{ inputs.runner }}
    # One metadata fetch, one commit listing and one GraphQL mutation. Ten
    # minutes bounds a hung API call without the six-hour default.
    timeout-minutes: 10
    permissions:
      contents: write # enablePullRequestAutoMerge requires it.
      pull-requests: write # Arm or disarm auto-merge; list the PR's commits.
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        # dependabot/* is GitHub's own verified organization, and this is the
        # documented parser for Dependabot's update metadata. Its bumps stay
        # manual. fetch-metadata fails when the PR's first commit is not
        # Dependabot's (a force-push by another user). The gate must still
        # run then, to disarm, so a failure here is a skip, not a stop.
        continue-on-error: true
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Gate and arm auto-merge
        if: ${{ !cancelled() }}
        uses: $/.github/actions/automerge-dependabot
        with:
          metadata-outcome: ${{ steps.metadata.outcome }}
          sender-id: ${{ github.event.sender.id }}
          updated-dependencies-json: ${{ steps.metadata.outputs.updated-dependencies-json }}
          publisher-allowlist: ${{ inputs.publisher-allowlist }}
          package-auto-merge: ${{ inputs.package-auto-merge }}
          review-only-dependencies: ${{ inputs.review-only-dependencies }}
