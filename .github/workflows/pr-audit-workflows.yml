name: PR Audit Workflows

# Reusable workflow — GitHub Actions security/static analysis with zizmor
# (supply-chain risks, dangerous triggers, excessive permissions, template
# injection). zizmor runs in its own native --format=github mode: it emits a
# GitHub annotation for every finding directly (no SARIF intermediate for
# gating, no hand-rolled parser) and reports its own graduated exit code
# keyed to the highest severity found (11 informational, 12 low, 13 medium,
# 14 high). ADVISORY by default (fail-on-severity: never): findings annotate
# without blocking. Callers opt in to blocking by raising fail-on-severity to
# low, medium, or high; the legacy fail-on-findings boolean stays a
# back-compat alias for low (blocks on any finding, informational and up —
# zizmor's own note-level docs: https://docs.zizmor.sh/usage/).
# Opt-in upload-sarif (default false) also runs --format=sarif and uploads
# via github/codeql-action/upload-sarif for durable code-scanning alerts.
# SARIF mode always exits 0 for findings (see exit-codes docs cited below),
# so it is visibility-only and composes with (does not replace)
# fail-on-severity gating. The job requests security-events: write
# unconditionally (job permissions cannot be expressions), so every caller
# must grant it on the calling job whether or not it sets upload-sarif;
# reusable workflows cannot elevate caller permissions. The upload step's
# input gate keeps annotations-only callers off the code-scanning API. The ci-status
# gateway stays consumer-local — this is a lane, not the gateway.
#
# Config, always passed with --config so zizmor discovers nothing itself: the
# caller's own (.github/zizmor.yml or .yaml, or zizmor.yml or .yaml at the
# root), read on a pull request from its base commit through the contents API,
# never from the head, so a pull request cannot audit itself under a config it
# adds or edits; on any other event, from the checkout. With none, the lane
# checks out melodic-software/standards at one resolved commit (the
# download-standards action, which records it in the step summary) and passes
# that commit's .github/zizmor.yml, so a repository with no copy of its own is
# audited under the org policy, third-party refs hash-pinned included.
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label selected by the caller.
        type: string
        default: ubuntu-24.04
      paths:
        description: >-
          Whitespace-separated paths to audit. zizmor discovers workflow and
          composite-action definitions under them. A .github/actions entry
          that does not exist in the checkout is skipped.
        type: string
        default: .github/workflows .github/actions
      version:
        description: >-
          Exact zizmor CLI version, 1.7.0 or newer (this workflow's
          --format=github and --strict-collection flags require it). 'latest'
          is a compatibility alias for the workflow's reviewed default, never
          a mutable download.
        type: string
        # Keep in step with the fleet pin in melodic-software/dotfiles
        # (.chezmoidata/uv-tools.yaml), or local and lane findings diverge.
        default: v1.32.0
      sha256:
        description: >-
          SHA-256 of the x86_64-unknown-linux-gnu release archive. Change
          together with version.
        type: string
        default: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
      online-audits:
        description: Run online audits (uses the workflow token).
        type: boolean
        default: true
      persona:
        description: 'Audit persona: regular, pedantic, or auditor.'
        type: string
        default: regular
      fail-on-severity:
        description: >-
          Blocking threshold: one of never, low, medium, or high. When above
          'never', the job fails on zizmor's own graduated exit code for any
          finding at or above that severity (low also blocks on
          informational-level findings, matching zizmor's note-level
          annotation kind — see https://docs.zizmor.sh/usage/). Default
          'never' keeps the lane advisory. Takes precedence over
          fail-on-findings.
        type: string
        default: never
      fail-on-findings:
        description: >-
          Back-compat alias. When true and fail-on-severity is 'never', the job
          blocks on any finding (equivalent to fail-on-severity: low). Prefer
          fail-on-severity. Default false keeps the lane advisory.
        type: boolean
        default: false
      upload-sarif:
        description: >-
          When true, also run zizmor with --format=sarif and upload results to
          GitHub code scanning (durable, per-line, dismissable alerts).
          Visibility-only: SARIF mode exits 0 for findings and does not replace
          fail-on-severity / fail-on-findings gating. Doubles audit cost (a
          second zizmor pass). Callers must grant security-events: write on
          the calling job — this reusable cannot elevate permissions. Default
          false keeps the lane annotations-only. category is the static
          literal 'zizmor' (one upload-sarif call site per ref).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  zizmor:
    name: Zizmor
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      # Always granted (expressions fail to parse here); the upload step's input
      # gate keeps annotations-only callers off the code-scanning API.
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the caller's zizmor config
        id: config
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=
          for candidate in .github/zizmor.yml .github/zizmor.yaml zizmor.yml zizmor.yaml; do
            if [[ -n "$BASE_SHA" ]]; then
              copy="$RUNNER_TEMP/zizmor-base-config.yml"
              errors="$RUNNER_TEMP/zizmor-base-config.err"
              if gh api -H 'Accept: application/vnd.github.raw' \
                "repos/$REPOSITORY/contents/$candidate?ref=$BASE_SHA" >"$copy" 2>"$errors"; then
                file=$copy
                echo "zizmor config: $candidate at the base commit $BASE_SHA (the caller's own)"
                break
              fi
              if ! grep -q 'HTTP 404' -- "$errors"; then
                cat -- "$errors" >&2
                echo "::error::$candidate could not be read at the base commit $BASE_SHA."
                exit 2
              fi
            elif [[ -f "$candidate" ]]; then
              file=$candidate
              echo "zizmor config: $candidate (the caller's own)"
              break
            fi
          done
          echo "file=$file" >>"$GITHUB_OUTPUT"

      - name: Check out the standards zizmor config
        id: standards
        if: ${{ steps.config.outputs.file == '' }}
        uses: $/.github/actions/download-standards

      - name: Run zizmor
        id: zizmor
        shell: bash
        env:
          CALLER_CONFIG: ${{ steps.config.outputs.file }}
          STANDARDS_CHECKOUT: ${{ steps.standards.outputs.path }}
          PATHS: ${{ inputs.paths }}
          REQUESTED_VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          ONLINE_AUDITS: ${{ inputs.online-audits }}
          PERSONA: ${{ inputs.persona }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
          ZIZMOR_TOKEN: ${{ github.token }}
          PINNED_VERSION: 1.32.0
          ASSET_NAME: zizmor-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail

          # Keep the token out of curl/tar's environment. It is exported only
          # to the already checksum-verified zizmor process below.
          token=$ZIZMOR_TOKEN
          unset ZIZMOR_TOKEN

          if [[ "${RUNNER_OS:-}" != Linux || "${RUNNER_ARCH:-}" != X64 ]]; then
            echo '::error::The native zizmor release requires a Linux X64 runner.'
            exit 2
          fi

          case "$REQUESTED_VERSION" in
            latest) resolved_version=$PINNED_VERSION ;;
            *)
              resolved_version=${REQUESTED_VERSION#v}
              if [[ ! "$resolved_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::zizmor version must be 'latest' or an exact X.Y.Z version."
                exit 2
              fi
              ;;
          esac
          IFS='.' read -r zizmor_major zizmor_minor _ <<<"$resolved_version"
          if ((zizmor_major < 1 || (zizmor_major == 1 && zizmor_minor < 7))); then
            echo "::error::zizmor version must be 1.7.0 or newer (this workflow requires --format=github, added in v1.6.0, and --strict-collection, added in v1.7.0)."
            exit 2
          fi
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::zizmor sha256 must be exactly 64 lowercase hexadecimal characters.'
            exit 2
          fi
          case "$ONLINE_AUDITS:$FAIL_ON_FINDINGS:$UPLOAD_SARIF" in
            true:true:true|true:true:false|true:false:true|true:false:false|false:true:true|false:true:false|false:false:true|false:false:false) ;;
            *)
              echo '::error::zizmor boolean inputs must resolve to true or false.'
              exit 2
              ;;
          esac
          case "$FAIL_ON_SEVERITY" in
            never|low|medium|high) ;;
            *)
              echo '::error::zizmor fail-on-severity must be never, low, medium, or high.'
              exit 2
              ;;
          esac

          work_dir=$(mktemp -d "${RUNNER_TEMP:?}/zizmor.XXXXXX")
          trap 'rm -rf -- "$work_dir"' EXIT
          archive="$work_dir/$ASSET_NAME"
          url="https://github.com/zizmorcore/zizmor/releases/download/v${resolved_version}/${ASSET_NAME}"
          curl --fail --show-error --location --proto '=https' \
            --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 120 \
            --retry 8 --retry-all-errors --retry-max-time 300 \
            --output "$archive" "$url"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$archive" \
            | sha256sum --check --strict -
          tar --extract --gzip --file="$archive" --directory="$work_dir" \
            --no-same-owner zizmor
          binary="$work_dir/zizmor"
          if [[ ! -x "$binary" ]]; then
            echo '::error::Verified zizmor archive did not contain an executable zizmor binary.'
            exit 2
          fi
          version_output=$("$binary" --version)
          actual_version=${version_output##* }
          if [[ "$actual_version" != "$resolved_version" ]]; then
            echo "::error::Expected zizmor $resolved_version, got $version_output."
            exit 2
          fi
          mkdir -- "$work_dir/cache"

          config_args=()
          if [[ -n "${CALLER_CONFIG:-}" ]]; then
            config_args=("--config=$CALLER_CONFIG")
          elif [[ -n "${STANDARDS_CHECKOUT:-}" ]]; then
            standards_config="$STANDARDS_CHECKOUT/.github/zizmor.yml"
            if [[ ! -f "$standards_config" ]]; then
              echo "::error::melodic-software/standards at ${STANDARDS_CHECKOUT##*/} has no .github/zizmor.yml."
              exit 2
            fi
            echo "zizmor config: .github/zizmor.yml from melodic-software/standards at ${STANDARDS_CHECKOUT##*/}"
            config_args=("--config=$standards_config")
          fi

          normalized_paths=${PATHS//$'\n'/ }
          targets=()
          read -r -a raw_targets <<< "$normalized_paths"
          for target in "${raw_targets[@]}"; do
            if [[ "$target" == .github/actions && ! -d "$target" ]]; then
              continue
            fi
            targets+=("$target")
          done
          if [[ ${#targets[@]} -eq 0 ]]; then
            echo '::error::zizmor paths must contain at least one input.'
            exit 2
          fi

          if [[ "$FAIL_ON_SEVERITY" != never ]]; then
            effective_severity=$FAIL_ON_SEVERITY
          elif [[ "$FAIL_ON_FINDINGS" == true ]]; then
            effective_severity=low
          else
            effective_severity=never
          fi

          args=(
            --format=github
            --strict-collection
            "--persona=$PERSONA"
            --color=never
            "--cache-dir=$work_dir/cache"
            "${config_args[@]}"
          )
          if [[ "$ONLINE_AUDITS" == false ]]; then
            args+=(--no-online-audits)
          fi

          # tee, not a redirect: the runner must see zizmor's stdout workflow commands to annotate.
          annotations="$work_dir/zizmor-annotations.txt"
          set +e
          GH_TOKEN="$token" "$binary" "${args[@]}" -- "${targets[@]}" | tee -- "$annotations"
          status=${PIPESTATUS[0]}
          set -e

          case "$status" in
          0 | 11 | 12 | 13 | 14) ;;
          *)
            echo "::error::zizmor exited $status; results are not trusted."
            unset token
            exit 2
            ;;
          esac

          # --format=sarif exits 0 for findings (docs.zizmor.sh/usage/#exit-codes), so nonzero
          # is a tool failure. Written outside work_dir so the EXIT trap spares it for upload.
          if [[ "$UPLOAD_SARIF" == true ]]; then
            sarif_args=(
              --format=sarif
              --strict-collection
              "--persona=$PERSONA"
              --color=never
              "--cache-dir=$work_dir/cache"
              "${config_args[@]}"
            )
            if [[ "$ONLINE_AUDITS" == false ]]; then
              sarif_args+=(--no-online-audits)
            fi
            sarif_path="${GITHUB_WORKSPACE:?}/zizmor.sarif"
            set +e
            GH_TOKEN="$token" "$binary" "${sarif_args[@]}" -- "${targets[@]}" >"$sarif_path"
            sarif_status=$?
            set -e
            if ((sarif_status != 0)); then
              echo "::error::zizmor SARIF generation exited $sarif_status; results are not trusted."
              unset token
              exit 2
            fi
            if [[ ! -s "$sarif_path" ]]; then
              echo '::error::zizmor SARIF output was empty.'
              unset token
              exit 2
            fi
            echo "sarif-file=zizmor.sarif" >>"$GITHUB_OUTPUT"
          fi
          unset token

          blocking=false
          case "$effective_severity" in
          never) ;;
          low)
            if ((status >= 11)); then blocking=true; fi
            ;;
          medium)
            if ((status >= 13)); then blocking=true; fi
            ;;
          high)
            if ((status == 14)); then blocking=true; fi
            ;;
          *)
            echo '::error::fail-on-severity must resolve to never, low, medium, or high.'
            exit 2
            ;;
          esac

          total_count=$(grep -c '^::' -- "$annotations" || true)

          if [[ "$blocking" == true ]]; then
            echo "::error::zizmor reported $total_count finding(s) at or above severity $effective_severity."
            exit 1
          fi

          if ((total_count == 0)); then
            echo 'zizmor completed with no findings.'
          elif [[ "$effective_severity" == never ]]; then
            echo "::notice::zizmor reported $total_count finding(s); advisory mode keeps this lane successful."
          else
            echo "::notice::zizmor reported $total_count finding(s); none at or above severity $effective_severity."
          fi

      - name: Upload zizmor SARIF
        if: ${{ always() && !cancelled() && inputs.upload-sarif && steps.zizmor.outputs.sarif-file != '' }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: ${{ steps.zizmor.outputs.sarif-file }}
          category: zizmor
