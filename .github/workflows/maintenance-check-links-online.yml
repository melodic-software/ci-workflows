name: maintenance-check-links-online

# Reusable workflow: runs lychee with the network on over the caller's
# Markdown, with the caller's lychee.toml (the standards-synced config the
# offline lane also reads) and the .lycheeignore lychee picks up from the
# working directory. The report goes to the job summary and any broken link
# fails the job red. Links the caller's lychee.toml accepts as transient (a
# 429 or 5xx in `accept`, a timeout under `accept_timeouts`) do not fail it but
# are listed in the summary, so a host that stays down is still noticed. It
# never opens an issue or posts a comment.
#
# Every run that checked links also uploads its broken links, the ones that
# fail the run, as a small JSON artifact kept for three days, and names it in
# the `dead-links-artifact` output, so the caller can route them: a job in the
# caller reads the output, and a separate workflow on `workflow_run` downloads
# the artifact by that name. The artifact holds an array of
# {url, status, detail, locations: [{path, line, column}]}, one entry per URL,
# sorted by URL; an empty array means the run found none.
#
# GITHUB_TOKEN only: it lifts the github.com rate limit, and it cannot read
# another private repository, so lychee never reports a link into one as OK.
# A broader token would. This workflow declares no secrets.
#
# OPT-IN BY REPOSITORY PROPERTY. A `schedule` run reads the caller
# repository's custom property named by `opt-in-property` and does nothing
# unless its value is `true`; an unset property means off. Any other event,
# `workflow_dispatch` included, always runs, so a repository proves a green
# dispatched run before its property turns the schedule on. A property read
# that errors fails the job red rather than skipping, so a broken gate shows.
#
# The caller owns the trigger: `schedule` with a cron minute and day no other
# opted-in repository uses, plus `workflow_dispatch`. Informational: keep it
# out of `ci-status`.
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label selected by the caller.
        type: string
        required: true
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 40
      opt-in-property:
        description: >-
          Org custom property (true_false) that turns scheduled runs on for
          the caller repository. Unset or false skips a scheduled run.
        type: string
        default: link-check-online
      config:
        description: Path to the lychee.toml ruleset in the caller repository.
        type: string
        default: lychee.toml
      extra-args:
        description: >-
          Extra lychee arguments appended before the globs, such as
          `--exclude-path` regexes for intentionally broken fixtures.
          lychee-action evaluates `args` in a shell, so single-quote each
          regex and glob.
        type: string
        default: ''
      globs:
        description: Input globs, shell-quoted. Default scans all Markdown.
        type: string
        default: "'**/*.md'"
      lychee-version:
        description: Exact lychee release tag lychee-action installs.
        type: string
        default: v0.24.2
    outputs:
      dead-links-artifact:
        description: >-
          Name of the artifact holding this run's broken links as JSON, kept
          for three days; empty when the run checked no links or lychee wrote
          no readable report.
        value: ${{ jobs.check-links.outputs.dead-links-artifact }}
      dead-links-count:
        description: >-
          Number of distinct broken URLs in that artifact; empty when the
          artifact name is.
        value: ${{ jobs.check-links.outputs.dead-links-count }}

permissions: {}

jobs:
  check-links:
    name: check-links
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      dead-links-artifact: ${{ steps.upload.outcome == 'success' && steps.dead.outputs.artifact || '' }}
      dead-links-count: ${{ steps.upload.outcome == 'success' && steps.dead.outputs.count || '' }}
    steps:
      - name: Read the opt-in property
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPT_IN_PROPERTY: ${{ inputs.opt-in-property }}
        with:
          script: |
            const property = process.env.OPT_IN_PROPERTY || "";
            if (context.eventName !== "schedule") {
              core.info(`Event '${context.eventName}' always runs.`);
              core.setOutput("run", "true");
              return;
            }
            if (property.length === 0) {
              core.setFailed("The 'opt-in-property' input must be non-empty.");
              return;
            }
            // An error here throws and fails the job: a gate that cannot read
            // the property must not pass as an opted-out skip.
            const { data } = await github.request(
              "GET /repos/{owner}/{repo}/properties/values",
              context.repo,
            );
            const value = data.find((entry) => entry.property_name === property)?.value;
            if (value !== "true") {
              core.notice(
                `Property '${property}' is ${JSON.stringify(value ?? null)}, not "true"; ` +
                  "skipping the scheduled online link check.",
              );
              core.setOutput("run", "false");
              return;
            }
            core.setOutput("run", "true");

      - name: Check out
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pacing: some hosts throttle lychee's default per-host burst from a
      # runner IP, so each host gets fewer parallel requests, spaced out, with
      # longer retries and timeout. Pacing did not stop every 429
      # (standards#775, #776); a page proven alive that still blocks the
      # checker gets an exact-URL .lycheeignore entry with a dated reason.
      #
      # JSON with -v, because only that output lists accepted responses
      # (lychee 0.24.2 fills `success_map` at -v and above; the markdown report
      # never lists them). The next step writes the summary and decides the
      # job's result, so this step neither fails nor writes a summary.
      - name: Check links (online)
        id: lychee
        if: steps.gate.outputs.run == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: ${{ inputs.lychee-version }}
          token: ${{ github.token }}
          fail: false
          failIfEmpty: false
          jobSummary: false
          format: json
          output: ${{ runner.temp }}/lychee/report.json
          args: >-
            --no-progress
            --verbose
            --config '${{ inputs.config }}'
            --host-concurrency 4
            --host-request-interval 250ms
            --max-retries 4
            --retry-wait-time 5
            --timeout 40
            ${{ inputs.extra-args }}
            ${{ inputs.globs }}

      # Broken links fail the job; accepted 429 and 5xx responses are listed but
      # do not. Timeouts are listed too, and fail the job only when the
      # caller's config does not set accept_timeouts (lychee check.rs decides
      # the exit code). lychee-action creates the report file before lychee
      # runs, so a config error or a panic leaves it empty; that fails the job
      # with a pointer to the lychee step's log. Each section is capped so the
      # summary stays under the 1 MiB per-step limit
      # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#step-isolation-and-limits).
      - name: Write the report
        if: steps.gate.outputs.run == 'true' && !cancelled()
        env:
          REPORT: ${{ runner.temp }}/lychee/report.json
          LYCHEE_EXIT: ${{ steps.lychee.outputs.exit_code }}
          MAX_ROWS: 200
        run: |
          set -euo pipefail
          if [ ! -s "$REPORT" ]; then
            echo "::error::lychee exited ${LYCHEE_EXIT} without writing a report: see the 'Check links (online)' step log."
            exit 1
          fi
          if ! jq -e 'type == "object"' "$REPORT" >/dev/null 2>&1; then
            echo "::error::lychee exited ${LYCHEE_EXIT} and its report is not JSON: see the 'Check links (online)' step log."
            exit 1
          fi
          jq -r --argjson max "$MAX_ROWS" '
            # A code span whose fence is longer than any backtick run inside it.
            def code: ([scan("`+") | length] | max // 0) as $n
              | ("`" * ($n + 1)) as $fence
              | if $n > 0 then "\($fence) \(.) \($fence)" else "\($fence)\(.)\($fence)" end;
            def rows($map):
              [$map | to_entries | sort_by(.key)[] | .key as $input
                | .value | sort_by(.url)[]
                | "* [\(.status.code // .status.text)] <\(.url)> in \($input | code)"
                  + (if .span then " at \(.span.line)" + (if .span.column then ":\(.span.column)" else "" end) else "" end)
                  + " | \(.status.details // .status.text | gsub("[\r\n]+"; " "))"];
            def section($title; $map):
              rows($map)
              | if length == 0 then empty
                else "\n## \($title)\n\n" + (.[:$max] | join("\n"))
                  + (if length > $max then "\n* +\(length - $max) more" else "" end)
                end;
            "# Online link check\n",
            "| Total | OK | Broken | Timeouts | Excluded |",
            "| --- | --- | --- | --- | --- |",
            "| \(.total) | \(.successful) | \(.errors) | \(.timeouts) | \(.excludes) |",
            section("Broken links (fail the run)"; .error_map),
            section("Timeouts"; .timeout_map),
            section("Accepted 429 and 5xx responses (do not fail the run)";
              .success_map
              | map_values(map(select(.status.code == 429
                  or (.status.code >= 500 and .status.code <= 599))))
              | with_entries(select(.value | length > 0)))
          ' "$REPORT" >>"$GITHUB_STEP_SUMMARY"
          if ! jq -e '.total > 0' "$REPORT" >/dev/null; then
            echo "::error::No links were found. This usually indicates a configuration error."
            exit 1
          fi
          if [ "$LYCHEE_EXIT" != 0 ]; then
            if jq -e '.errors == 0 and .timeouts > 0' "$REPORT" >/dev/null; then
              echo "::error::lychee exited ${LYCHEE_EXIT}: timeouts failed the run: the config does not set accept_timeouts."
            else
              echo "::error::lychee exited ${LYCHEE_EXIT}: see the broken links in the job summary."
            fi
            exit 1
          fi

      # The broken links for the caller to route, written after the report
      # step so they upload on the red runs that matter. A missing or non-JSON
      # report, which the report step already failed, uploads nothing.
      - name: Extract the dead links
        id: dead
        if: steps.gate.outputs.run == 'true' && !cancelled()
        env:
          REPORT: ${{ runner.temp }}/lychee/report.json
          DEAD_LINKS: ${{ runner.temp }}/dead-links/dead-links.json
          ARTIFACT: link-check-online-dead-links
        run: |
          set -euo pipefail
          if [ ! -s "$REPORT" ] || ! jq -e 'type == "object"' "$REPORT" >/dev/null 2>&1; then
            echo "No readable lychee report: no dead-links artifact."
            exit 0
          fi
          mkdir -p "$(dirname "$DEAD_LINKS")"
          jq -c '
            [(.error_map // {}) | to_entries[] | .key as $path | .value[]
              | {url, status: (.status.code // null),
                 detail: (.status.details // .status.text // "" | gsub("[\r\n]+"; " ")),
                 location: {path: $path, line: (.span.line // null), column: (.span.column // null)}}]
            | group_by(.url)
            | map({url: .[0].url, status: .[0].status, detail: .[0].detail,
                   locations: (map(.location) | unique_by([.path, .line, .column]))})
          ' "$REPORT" >"$DEAD_LINKS"
          {
            echo "artifact=$ARTIFACT"
            echo "count=$(jq 'length' "$DEAD_LINKS")"
          } >>"$GITHUB_OUTPUT"

      - name: Upload the dead links
        id: upload
        if: steps.dead.outputs.artifact != '' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.dead.outputs.artifact }}
          path: ${{ runner.temp }}/dead-links/dead-links.json
          if-no-files-found: error
          retention-days: 3
