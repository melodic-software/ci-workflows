name: Claude Assistant

# Dogfood caller: first consumer of the org @claude mention-responder reusable
# (ci-workflows#255). Caller owns `on:` + `@claude` contains() guards +
# permissions; reusable owns the action pin, tool-allowlist floor, timeout,
# per-entity concurrency, and model pin. Local `./` ref works because the
# checkout IS this repo.
#
# V1 is answer/re-review only — contents:read (no commit/push/merge).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Manual prompt (dogfood / ops when no @claude mention event)
        required: true
        type: string

permissions:
  contents: read

jobs:
  assist:
    # Trigger guards live here (reusable cannot own `on:`). Self-trigger and
    # allowlist gates live inside the reusable so every consumer gets them.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || (github.event_name == 'issue_comment'
              && contains(github.event.comment.body, '@claude'))
          || (github.event_name == 'pull_request_review_comment'
              && contains(github.event.comment.body, '@claude')) }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/claude-assistant.yml
    with:
      # Empty on mention events (tag mode reads the comment). Required on
      # workflow_dispatch — see the reusable's prompt input.
      prompt: ${{ inputs.prompt }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
