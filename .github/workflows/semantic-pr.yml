name: semantic-pr

# Reusable workflow — validates that the pull request TITLE follows the
# Conventional Commits spec (https://www.conventionalcommits.org). GATING by
# design: a non-conforming title fails the job, so a caller that requires this
# check blocks the merge until the title is fixed.
#
# Why the title (not the commits): governed repos are squash-merge-only with the
# squash commit title set to PR_TITLE, so the PR title becomes the subject line
# on the default branch. Enforcing Conventional Commits here is therefore the
# single lever that produces a Conventional-Commits history — branch commits are
# squashed away and need no separate commit-msg hook.
#
# The caller owns the triggers and must include `edited` so a re-titled PR
# re-validates; see the consumer-side caller example in the README. This is a
# standalone required check, NOT a ci-status lane: title edits should not re-run
# the file-lint lanes, so it lives in its own thin caller workflow.
on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label selected by the caller for every prerequisite outcome.
          Direct callers that omit it use the public hosted default. A caller
          passing a dynamic expression must ensure it resolves to a non-empty
          label; the reusable applies no implicit fallback, so an empty value
          fails runner allocation.
        type: string
        default: ubuntu-24.04
      prerequisite-result:
        description: >-
          Result of an optional prerequisite job. Callers with `needs` must pass
          its exact result and use `if: always()`. `failure`, `skipped`, and any
          unrecognized value fail this required check before title validation
          (fail-closed: selector breakage stays loud). `cancelled` proceeds to
          validation only after the Actions Jobs API confirms the prerequisite
          truly concluded `cancelled`, not `timed_out` — GitHub collapses
          timeouts into `needs.*.result == cancelled` (#458). True cancel is
          the routine per-PR concurrency-supersede signal; this reporter is
          already running on the caller-resolved runner and the pinned action
          reads the LIVE PR title, so the check reports the real gate answer
          instead of a synthetic failure (#446). Lookup failure or missing
          `actions: read` fails closed.
        type: string
        default: success
      types:
        description: >-
          Allowed Conventional Commits types (newline-delimited regex patterns,
          auto-wrapped in `^ $`). Empty uses the action's spec-aligned defaults
          (build, chore, ci, docs, feat, fix, perf, refactor, revert, style,
          test).
        type: string
        default: ''
      scopes:
        description: >-
          Allowed scopes (newline-delimited regex patterns). Empty allows any
          scope.
        type: string
        default: ''
      require-scope:
        description: Require a scope to always be present in the title.
        type: boolean
        default: false
      subject-pattern:
        description: >-
          Optional regex the subject must match (e.g. `^(?![A-Z]).+$` to forbid
          a leading uppercase). Empty disables the extra subject check.
        type: string
        default: ''
      subject-pattern-error:
        description: >-
          Error message shown when `subject-pattern` does not match; the
          `subject` and `title` variables are interpolated.
        type: string
        default: ''
      validate-single-commit:
        description: >-
          Also validate the lone commit message on single-commit PRs. Off by
          default: governed repos set the squash title to PR_TITLE, so the
          branch commit never becomes the subject and validating it would fail a
          one-commit PR with a valid title for no gain. Enable it only on repos
          that squash from the commit message rather than PR_TITLE.
        type: boolean
        default: false
      ignore-labels:
        description: >-
          Skip validation when the PR carries one of these labels
          (newline-delimited). Add `labeled`/`unlabeled` to the caller's
          triggers to re-validate on label changes.
        type: string
        default: ''

permissions:
  pull-requests: read
  actions: read

jobs:
  pr-title:
    # Always honor the caller-selected runner, including for a failed, skipped,
    # cancelled, or empty prerequisite result. The caller owns any recovery
    # fallback passed through `runner`; direct callers that omit it retain the
    # public `ubuntu-24.04` default above. The caller's `if: always()` keeps this
    # reporter eligible after every prerequisite outcome so the required context
    # materializes; the first step then fails closed on failure/skipped, while
    # a cancelled prerequisite proceeds to real title validation (see the
    # cancelled-prerequisite step below and #446).
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - name: Reject failed prerequisite
        # `cancelled` is deliberately NOT rejected here — see the next step.
        # Every other non-success result (failure, skipped, empty/unrecognized)
        # still fails closed before title validation: those mean the runner
        # selector broke or the caller wired the contract wrong, and masking
        # that behind a green check would hide real infrastructure breakage.
        if: >-
          inputs.prerequisite-result != 'success' &&
          inputs.prerequisite-result != 'cancelled'
        env:
          PREREQUISITE_RESULT: ${{ inputs.prerequisite-result }}
        run: |
          echo "::error::Required prerequisite did not succeed (result: ${PREREQUISITE_RESULT})."
          exit 1

      - name: Resolve cancelled prerequisite
        # GitHub reports timed-out jobs as `needs.*.result == cancelled`. The
        # Actions Jobs API exposes the distinct `conclusion: timed_out`, so a
        # delivered cancellation must be resolved before validation proceeds
        # (#458). Selector-dependent callers must grant `actions: read` on this
        # job; lookup failure fails closed.
        if: ${{ inputs.prerequisite-result == 'cancelled' }}
        uses: ./.github/actions/resolve-cancelled-prerequisite

      - name: Note cancelled prerequisite
        # A cancelled prerequisite is normal supersede behavior, not a fault:
        # the caller's per-PR `concurrency.cancel-in-progress` cancels the
        # in-flight run when a newer event arrives for the same PR, and the
        # caller's mandatory `if: always()` reporter contract (README) still
        # materializes this required check for the superseded run.
        #
        # Failing closed on `cancelled` (the pre-#446 behavior) turned every
        # routine supersede into a RED required check that operators had to
        # clear by hand-re-running jobs (observed fleet-wide 2026-08-12:
        # medley#1769, dotfiles#453 — the superseding run's green did NOT
        # reliably displace the superseded run's failure in the merge box, and
        # in medley#1769 the superseding run's own selector was cancelled too,
        # so both runs sat red). Passing vacuously instead (skip validation,
        # exit 0) would be worse: a cancelled result alone does not prove a
        # successor covers this check — a manual run cancellation has no
        # successor — so an unvalidated green could let an unchecked PR
        # through. Validating for real is strictly stronger than both: this
        # job is already running on the caller-resolved fallback runner, and
        # the pinned action re-fetches the PR from the API rather than
        # trusting the stale event payload, so the step below reports the
        # real, current gate answer for this SHA — red only when the title is
        # actually invalid.
        #
        # This ::notice keeps a superseded-run validation distinguishable in
        # the job log from an ordinary success-path run, and from the hard
        # `::error` above, for whoever debugs the next incident.
        if: ${{ inputs.prerequisite-result == 'cancelled' }}
        run: |
          echo "::notice::Prerequisite was cancelled in needs context and resolved to true cancel via the Actions Jobs API — routine concurrency supersede or a manual run cancellation. A timed-out prerequisite would have failed closed above (#458). Proceeding with live-title validation on the caller-resolved runner; this check reports the real validation result, not a synthetic prerequisite failure."

      - name: Validate PR title against Conventional Commits
        # Runs ONLY on the two PR-context events, `pull_request` AND
        # `pull_request_target`; skipped (job still green) on anything else. Both
        # must be accepted: a caller on `pull_request_target` (base-branch
        # definition, so a head-branch edit to the caller cannot bypass the gate)
        # would otherwise be skipped, the job would pass vacuously, and the gate
        # would be silently disabled. The guard must NOT be a bare `!= 'merge_group'`
        # either: a caller that also fires on a non-PR event (workflow_dispatch,
        # push) has no `github.event.pull_request`, so the action cannot infer a PR
        # and errors — an explicit allowlist skips those runs green instead.
        # Merge-queue safe: a caller that also triggers on `merge_group` (required
        # for repos with a merge queue, or the required check never reports and the
        # queue deadlocks) reaches this job with no PR context. The title was
        # already validated when the PR was opened/edited, so on `merge_group` this
        # step is skipped and the job succeeds, reporting the required check.
        # A `cancelled` prerequisite validates too (see the note step above and
        # #446): the action live-fetches the PR title, so a superseded run
        # reports the same answer its successor will.
        if: >-
          (inputs.prerequisite-result == 'success' ||
          inputs.prerequisite-result == 'cancelled') &&
          (github.event_name == 'pull_request' ||
          github.event_name == 'pull_request_target')
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: ${{ inputs.types }}
          scopes: ${{ inputs.scopes }}
          requireScope: ${{ inputs.require-scope }}
          subjectPattern: ${{ inputs.subject-pattern }}
          subjectPatternError: ${{ inputs.subject-pattern-error }}
          validateSingleCommit: ${{ inputs.validate-single-commit }}
          ignoreLabels: ${{ inputs.ignore-labels }}
