name: claude-review

# Reusable workflow: automated PR code review with anthropics/claude-code-action,
# running the org review plugin's command.
#
# Canonical caller (the caller owns triggers, concurrency and the permission
# grant; a called workflow can only downgrade the caller's grant):
#
#     on:
#       pull_request:
#         types: [opened, synchronize, ready_for_review, reopened]
#     concurrency:
#       group: claude-review-${{ github.event.pull_request.number }}
#       cancel-in-progress: true
#     jobs:
#       review:
#         permissions:
#           contents: read         # checkout + read the diff
#           pull-requests: write   # post the review + tracking comment
#           id-token: write        # OIDC for the Claude GitHub App token
#         uses: melodic-software/ci-workflows/.github/workflows/claude-review.yml@<sha>
#         secrets:
#           CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# SECURITY MODEL:
#   - Call it from `pull_request` only. pull_request_target and workflow_run
#     run with base-repo secrets over untrusted code; the `Reject privileged
#     triggers` step hard-fails both.
#   - Fork PRs get no secrets and a read-only token, so the job skips them.
#   - Bot actors are skipped: the action rejects any bot it was not told to
#     allow, and this lane allows none.
#   - Only the one named secret is accepted; the job token is least privilege.
#   - display_report stays off (public-repo log-leak risk).
#   - Dependabot's comments are withheld from the model's context
#     (exclude-comments-by-actor), as prompt-injection hygiene.
#   - The checkout must persist credentials until claude-code-action#1236
#     ships; the last step strips them.
#   - The last reviewed head is kept in a pull request comment this job writes
#     with its own token, so its author is github-actions[bot]; the lane reads
#     only that author's marker. Any workflow in the repository holding
#     `pull-requests: write` could write one and narrow a later incremental
#     review; same-repository writers already receive this lane's secret, so
#     the lane trusts them.
#
# REVIEW CADENCE: drafts are skipped. `opened`, `reopened` and
# `ready_for_review` review the whole pull request. A later push
# (`synchronize`) reviews only the files that changed since this lane's last
# completed review (`incremental-review`). It reviews the whole pull request
# instead when no earlier review is recorded, the recorded head is not an
# ancestor of the new head (force push or rebase), 300 or more files changed
# since, or a base-branch merge since then changed a file this pull request
# also changes (or 300 or more files, too many to check). A push that changes
# no file of the pull request is not reviewed again.
#
# One job reviews and reports. It is named `claude-review-status`, so its check
# is `<caller job> / claude-review-status`, and it goes red, naming the cause,
# when no review happened. A review that is not needed (nothing changed, or
# every file in scope matches `docs-only-paths`) stays green. Never make that
# check required.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label selected by the caller's governed selector.
        type: string
        default: ubuntu-24.04
      plugins:
        description: >-
          Newline-separated Claude Code plugins passed through to the action's
          `plugins` input.
        type: string
        default: |
          review@melodic-software
      plugin-marketplaces:
        description: >-
          Newline-separated marketplace Git URLs passed through to
          `plugin_marketplaces`.
        type: string
        default: |
          https://github.com/melodic-software/claude-code-plugins.git
      plugin-command:
        description: Slash command the review runs.
        type: string
        default: /review:code-review
      claude-args:
        description: >-
          Passed through to the Claude CLI (model, turn budget, allowed tools).
          A caller's value replaces this default. The inline-comment and
          plugin-command Skill grants are appended after it, so a caller
          cannot drop them.
        type: string
        default: >-
          --model claude-sonnet-5 --max-turns 75
          --allowedTools "Bash(gh pr diff:*)"
      exclude-comments-by-actor:
        description: >-
          Comma-separated actors whose comments are withheld from Claude's
          context (prompt-injection hygiene). Both Dependabot spellings are
          listed because the action matches the bare login for some comment
          kinds (upstream #1514).
        type: string
        default: dependabot,dependabot[bot]
      incremental-review:
        description: >-
          On a push to a reviewed pull request, review only the files changed
          since the last completed review. false reviews the whole pull
          request on every push.
        type: boolean
        default: true
      docs-only-paths:
        description: >-
          Newline-separated path globs (`*` within one path segment, `**`
          across segments). When every file in the review's scope matches one,
          no review runs and the check stays green. Empty never skips.
        type: string
        default: ""
    outputs:
      review-failed:
        description: >-
          'true' on an infrastructure failure, else 'false'. Empty when the
          review did not run.
        value: ${{ jobs.review.outputs.review-failed }}
      failure-class:
        description: >-
          auth | rate-limit | overloaded | other on a failure;
          skipped-validation when the action skipped itself; empty otherwise.
        value: ${{ jobs.review.outputs.failure-class }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Claude Code OAuth token (from `claude setup-token`).
        required: true

permissions:
  contents: read

jobs:
  review:
    name: claude-review-status
    runs-on: ${{ inputs.runner }}
    # The review step stops at 11 minutes (660 s); incremental scoping, not a
    # longer step, shortens the reviews that reached it. Outside that step,
    # 1,169 successful jobs on claude-code-plugins (2026-09-29 to 2026-10-01)
    # took p95 17 s, max 82 s, which leaves 38 s of 13 minutes (780 s) for the
    # scope and record steps.
    timeout-minutes: 13
    # The draft and fork tests are scoped to pull_request so a privileged
    # trigger still reaches the tripwire.
    if: >-
      ${{ !endsWith(github.actor, '[bot]')
          && (github.event_name != 'pull_request'
              || github.event.pull_request.draft == false)
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    outputs:
      review-failed: ${{ steps.review-outcome.outputs.review-failed }}
      failure-class: ${{ steps.review-outcome.outputs.failure-class }}
    steps:
      - name: Reject privileged triggers
        if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_run'
        run: |
          echo "::error::claude-review must not be called from '${{ github.event_name }}'." \
            "Call it from a 'pull_request' workflow. pull_request_target/workflow_run run" \
            "with base-repo secrets over untrusted code (token exfiltration risk)."
          exit 1

      # persist-credentials stays default until claude-code-action#1236 ships
      # (the action fetches before configuring git auth); the last step strips it.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: blob:none

      # Decides whole-PR, incremental, or no review (see REVIEW CADENCE). The
      # last head this lane finished reviewing is read from the lane's marker
      # comment on the PR. Any failure here leaves `review` unset, which
      # reviews the whole PR.
      - name: Scope the review
        id: scope
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LANE: claude-review
          INCREMENTAL: ${{ inputs.incremental-review }}
          DOCS_ONLY_PATHS: ${{ inputs.docs-only-paths }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DIFF_FILE: .claude-lane/incremental.diff
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const env = process.env;
            const { owner, repo } = context.repo;
            const head = env.HEAD_SHA;
            const FILE_CAP = 300;
            const MARKER = `<!-- claude-lane-reviewed-head lane=${env.LANE} sha=`;

            const globToRegExp = (glob) => {
              let out = "";
              for (let i = 0; i < glob.length; i += 1) {
                if (glob.startsWith("**/", i)) {
                  out += "(?:.*/)?";
                  i += 2;
                } else if (glob.startsWith("**", i)) {
                  out += ".*";
                  i += 1;
                } else if (glob[i] === "*") {
                  out += "[^/]*";
                } else if (glob[i] === "?") {
                  out += "[^/]";
                } else {
                  out += glob[i].replace(/[.+^$(){}|[\]\\]/u, "\\$&");
                }
              }
              return new RegExp(`^${out}$`, "u");
            };
            const docsOnly = (env.DOCS_ONLY_PATHS ?? "")
              .split("\n")
              .map((line) => line.trim())
              .filter(Boolean)
              .map(globToRegExp);
            const names = (file) => [file.filename, file.previous_filename].filter(Boolean);
            const isDocs = (file) => names(file).every((name) => docsOnly.some((re) => re.test(name)));
            const compare = async (basehead) =>
              (await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead })).data;

            // Returns { files, patches } for an incremental review, or { full: reason }.
            const sinceLastReview = async (prFiles, last) => {
              if (!/^[0-9a-f]{40}$/u.test(last)) return { full: "no earlier review is recorded" };
              if (last === head) return { files: [], patches: new Map() };
              const since = await compare(`${last}...${head}`);
              if (since.status !== "ahead") {
                return { full: `the last reviewed head ${last} is not an ancestor of ${head}` };
              }
              const changed = since.files ?? [];
              if (changed.length >= FILE_CAP) return { full: `${FILE_CAP} or more files changed since ${last}` };
              const prNames = new Set(prFiles.flatMap(names));
              const [before, now] = await Promise.all(
                [last, head].map(async (ref) => (await compare(`${env.BASE_REF}...${ref}`)).merge_base_commit.sha),
              );
              if (before !== now) {
                const moved = (await compare(`${before}...${now}`)).files ?? [];
                if (moved.length >= FILE_CAP) {
                  return { full: `a base-branch merge since the last review changed ${FILE_CAP} or more files` };
                }
                if (moved.some((file) => names(file).some((name) => prNames.has(name)))) {
                  return { full: "a base-branch merge since the last review changed a file this pull request changes" };
                }
              }
              const patches = new Map();
              for (const file of changed) for (const name of names(file)) patches.set(name, file);
              return { files: prFiles.filter((file) => names(file).some((name) => patches.has(name))), patches };
            };

            const writeDiff = (files, patches) => {
              const text = files.map((file) => {
                const change = patches.get(file.filename) ?? patches.get(file.previous_filename);
                return [
                  `diff --git a/${change.previous_filename ?? change.filename} b/${change.filename}`,
                  `status: ${change.status}`,
                  change.patch ?? "(no patch from the API; read the file at the head commit)",
                  "",
                ].join("\n");
              });
              fs.mkdirSync(path.dirname(env.DIFF_FILE), { recursive: true });
              fs.writeFileSync(env.DIFF_FILE, text.join("\n"));
            };

            // The newest marker comment this lane's job token wrote.
            const readMarker = async () => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: Number(env.PR_NUMBER),
                per_page: 100,
              });
              const marker = comments
                .filter((comment) => comment.user?.login === "github-actions[bot]" && comment.body?.startsWith(MARKER))
                .at(-1);
              if (!marker) return "";
              core.setOutput("marker-id", String(marker.id));
              return marker.body.slice(MARKER.length, MARKER.length + 40);
            };

            const incremental = env.INCREMENTAL === "true";
            try {
              const prFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: Number(env.PR_NUMBER),
                per_page: 100,
              });
              let scope = prFiles;
              let last = "";
              const recorded = incremental ? await readMarker() : "";
              if (incremental && env.EVENT_ACTION === "synchronize") {
                const result = await sinceLastReview(prFiles, recorded);
                if (result.full) {
                  core.info(`Reviewing the whole pull request: ${result.full}.`);
                } else {
                  last = recorded;
                  scope = result.files;
                  if (scope.length > 0) writeDiff(scope, result.patches);
                }
              }

              if (last && scope.length === 0) {
                core.setOutput("review", "false");
                core.setOutput("skip-reason", `no file of this pull request changed since the review of ${last}`);
              } else if (docsOnly.length > 0 && scope.length > 0 && scope.every(isDocs)) {
                core.setOutput("review", "false");
                core.setOutput("skip-reason", "every file in scope matches docs-only-paths");
              } else {
                core.setOutput("review", "true");
                if (last) {
                  const shown = scope.slice(0, 100).map((file) => `- ${file.filename}`);
                  if (scope.length > shown.length) shown.push(`- and ${scope.length - shown.length} more (see the diff file)`);
                  core.setOutput(
                    "note",
                    [
                      `REVIEW SCOPE: incremental. This lane last reviewed ${last}.`,
                      "Review only what changed since then, in these files:",
                      ...shown,
                      `That change is in ${env.DIFF_FILE}; read it, and use \`gh pr diff\` only for context.`,
                      `Every other file of this pull request is unchanged since ${last} and was reviewed then.`,
                    ].join("\n"),
                  );
                }
                core.info(last ? `Incremental review of ${scope.length} file(s) since ${last}.` : "Whole pull request review.");
              }
            } catch (error) {
              core.warning(`Scoping failed, reviewing the whole pull request: ${error.message}`);
              core.setOutput("review", "true");
            }
            if (incremental) core.setOutput("record", "true");

      # The inline-comment and plugin-command Skill grants go after the caller's
      # args so replacing claude-args cannot drop them; heredoc output as
      # claude-args may be multiline.
      - name: Compose Claude CLI arguments
        id: compose-args
        if: steps.scope.outputs.review != 'false'
        env:
          BASE_ARGS: ${{ inputs.claude-args }}
          PLUGIN_COMMAND: ${{ inputs.plugin-command }}
        run: |
          skill="${PLUGIN_COMMAND#/}"
          skill="${skill%% *}"
          args="$BASE_ARGS --allowedTools mcp__github_inline_comment__create_inline_comment --allowedTools \"Skill($skill)\""
          delimiter="gha_${RANDOM}${RANDOM}_EOF"
          {
            echo "args<<$delimiter"
            printf '%s\n' "$args"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # continue-on-error keeps an infrastructure failure from ending the job
      # before the outcome step classifies it; the last step carries the red.
      - name: Claude review
        id: claude-review
        if: steps.scope.outputs.review != 'false'
        continue-on-error: true
        timeout-minutes: 11
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          display_report: false
          exclude_comments_by_actor: ${{ inputs.exclude-comments-by-actor }}
          plugins: ${{ inputs.plugins }}
          plugin_marketplaces: ${{ inputs.plugin-marketplaces }}
          claude_args: ${{ steps.compose-args.outputs.args }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            ${{ steps.scope.outputs.note }}

            Invoke ${{ inputs.plugin-command }} now and follow its instructions exactly for this pull request.
            The REPO / PR NUMBER / HEAD SHA header above is authoritative context for the command.
            Do not substitute a different review procedure.

            Report findings as a pull request review: call
            mcp__github_inline_comment__create_inline_comment to anchor each
            finding to the changed line it is about. Keep your summary comment
            for the overview.

            A finding no changed line can carry (cross-file, or about the PR
            as a whole) goes in the summary instead; link its code
            locations to the commit blob (not the PR) with a line-numbered
            permalink:
            https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}/<path>#L<line>

      - name: Report review outcome
        id: review-outcome
        if: steps.scope.outputs.review != 'false'
        uses: melodic-software/ci-workflows/.github/actions/claude-lane-outcome@ac062650c46005edb4787aff378347746bf63804 # v0.27.0
        with:
          outcome: ${{ steps.claude-review.outcome }}
          execution-file: ${{ steps.claude-review.outputs.execution_file }}
          lane: Claude review

      # Only a completed review, or a review that was not needed, moves the
      # recorded head forward. A failure here costs the next push a whole
      # review, not this one its verdict.
      - name: Record the reviewed head
        if: >-
          steps.scope.outputs.record == 'true'
          && (steps.scope.outputs.review == 'false'
              || steps.review-outcome.outputs.review-ran == 'true')
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LANE: claude-review
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MARKER_ID: ${{ steps.scope.outputs.marker-id }}
        with:
          script: |
            const env = process.env;
            const { owner, repo } = context.repo;
            const body = [
              `<!-- claude-lane-reviewed-head lane=${env.LANE} sha=${env.HEAD_SHA} -->`,
              `${env.LANE} has reviewed this pull request through ${env.HEAD_SHA}; a later push is reviewed from there.`,
            ].join("\n");
            if (env.MARKER_ID) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: Number(env.MARKER_ID), body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: Number(env.PR_NUMBER), body });
            }

      # zizmor `artipacked` mitigation: scrub the token checkout persisted.
      - name: Strip persisted git credentials
        if: always()
        run: git config --unset-all http.https://github.com/.extraheader || true

      # Goes red whenever no review happened and none was skipped on purpose.
      # Every value reaches the script through env, never inline expressions.
      - name: Report the review status
        if: always()
        env:
          LANE: claude-review
          JOB_STATUS: ${{ job.status }}
          SKIP_REASON: ${{ steps.scope.outputs.skip-reason }}
          REVIEW_FAILED: ${{ steps.review-outcome.outputs.review-failed }}
          FAILURE_CLASS: ${{ steps.review-outcome.outputs.failure-class }}
        run: |
          if [ -n "$SKIP_REASON" ]; then
            echo "$LANE: no review needed: $SKIP_REASON." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$REVIEW_FAILED" ]; then
            FAILURE_CLASS=no-outcome
          elif [ "$REVIEW_FAILED" != "true" ] && [ "$FAILURE_CLASS" != "skipped-validation" ]; then
            echo "$LANE: no failure reported." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$FAILURE_CLASS" in
            auth) why="the Claude credential was rejected (401/402/403); check the OAuth token and the plan's usage" ;;
            rate-limit) why="the usage limit was hit (429); re-run once it resets" ;;
            overloaded) why="the Claude service was overloaded (5xx); re-run later" ;;
            skipped-validation) why="claude-code-action skipped itself because the caller workflow differs from the default branch's copy; nothing was reviewed" ;;
            no-outcome) why="the job ended ($JOB_STATUS) before the review reported an outcome; read the job log" ;;
            *) why="an unclassified failure; read the job log" ;;
          esac
          {
            echo "### $LANE failed: \`${FAILURE_CLASS:-unknown}\`"
            echo
            echo "$why."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=$LANE failed::failure-class=${FAILURE_CLASS:-unknown}: $why"
          exit 1
