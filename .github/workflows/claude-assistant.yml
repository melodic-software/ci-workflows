name: claude-assistant

# Reusable workflow — org @claude mention-responder, V1 answer/re-review only
# (ci-workflows#255). Humans mention `@claude` on issues/PRs; Claude answers
# questions and re-reviews. No autonomous edit/commit/push/merge/approve.
#
# CONSUMER CONTRACT (the caller owns these — they are NOT set here):
#   Triggers, `@claude` contains() guards, and the GITHUB_TOKEN permission
#   grant live in each consumer's thin caller (`workflow_call` cannot carry
#   `on:` and a called workflow can only DOWNGRADE permissions). Canonical
#   caller:
#
#     on:
#       issue_comment:
#         types: [created]
#       pull_request_review_comment:
#         types: [created]
#       workflow_dispatch:
#         inputs:
#           prompt:
#             description: Manual prompt (ops / dogfood when no mention event)
#             required: true
#             type: string
#     jobs:
#       assist:
#         if: >-
#           ${{ github.event_name == 'workflow_dispatch'
#               || (github.event_name == 'issue_comment'
#                   && contains(github.event.comment.body, '@claude'))
#               || (github.event_name == 'pull_request_review_comment'
#                   && contains(github.event.comment.body, '@claude')) }}
#         permissions:
#           contents: read          # V1: read-only workspace (tool allowlist is
#                                   # the real control; permissions are defense
#                                   # in depth — upstream #1289)
#           pull-requests: write    # tracking / inline comments on PRs
#           issues: write           # tracking comments on issues
#           id-token: write         # OIDC — mints the Claude GitHub App token
#         uses: melodic-software/ci-workflows/.github/workflows/claude-assistant.yml@<sha>
#         with:
#           prompt: ${{ inputs.prompt }}
#         secrets:
#           CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# V1 CAPABILITY ENVELOPE (locked — see
# docs/topics/claude-review-lanes/claude-assistant-ADR.md):
#   - Tool allowlist floor only: Read, Grep, Glob, Bash(gh pr|issue view/diff),
#     inline-comment MCP. No Edit/Write, no Bash(git commit|push|*), no merge.
#   - Auth: org CLAUDE_CODE_OAUTH_TOKEN (WIF rejected).
#   - allowed-bots default EMPTY (never '*' on a public repo — bot entries
#     bypass the write-permission check by design).
#   - allowed_non_write_users: NEVER passed (upstream tripwire idea).
#   - Self-trigger ban: skip-actors defaults include claude[bot] and org apps
#     (upstream #1445/#1481 denial-of-wallet loops).
#
# SECURITY MODEL (mirrors claude-review.yml):
#   - NEVER call from pull_request_target / workflow_run with secrets.
#   - Do not check out an untrusted PR head at workspace root before the
#     action (CVE-2026-47751 class — `.mcp.json` from PR head). The action's
#     own setupBranch owns PR-ref handling.
#   - display_report stays off on public repos (log-leak risk).

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label selected by the caller's governed selector.
        type: string
        default: ubuntu-24.04
      prompt:
        description: >-
          Optional instructions. Empty on mention events so the action uses the
          triggering `@claude` comment (tag mode). Required on workflow_dispatch
          when there is no comment payload — pass the ops prompt from the caller.
        type: string
        default: ""
      claude-args:
        description: >-
          Passed through to the Claude CLI. A caller's value REPLACES this
          default wholesale, so only overridable choices live here (model,
          turn budget, V1 system-prompt appendix). The tool-allowlist floor is
          appended by the compose step and cannot be dropped by replacing this
          input; a write-capable grant in the caller's value is rejected.
        type: string
        default: >-
          --model claude-sonnet-5 --max-turns 50
          --append-system-prompt "V1 answer/re-review only. Do not edit files, commit, push, merge, approve, or submit formal reviews. Use only the granted read and comment tools."
      allowed-bots:
        description: >-
          Comma-separated bot actors permitted to trigger (bots are blocked by
          default). Default empty — required posture for public repos. Never
          set '*' (rejected at runtime).
        type: string
        default: ""
      allowed-authors:
        description: >-
          Optional human/bot author allowlist (comma-separated, no spaces).
          Empty (default) allows any actor that passes the action's write-access
          gate and is not in skip-actors. When set, only listed actors proceed.
        type: string
        default: ""
      exclude-comments-by-actor:
        description: >-
          Comma-separated actors whose comments are withheld from Claude's
          context (prompt-injection hygiene), not a trigger gate.
        type: string
        default: dependabot,dependabot[bot]
      skip-actors:
        description: >-
          Comma-separated actors (no spaces) for whom the job skips entirely.
          Default bans self-trigger loops: Claude and org automation bots must
          never re-enter this lane from their own comments.
        type: string
        default: dependabot[bot],claude[bot],melodic-ai[bot],melodic-standards-sync[bot]
      timeout-minutes:
        description: Job timeout. Mention responses are short; default ~15m.
        type: number
        default: 15
      display-report:
        description: >-
          Write the Claude-authored report to the job step summary. Default off
          (public-repo log-leak risk). Private consumers may opt in.
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: >-
          Claude Code OAuth token (from `claude setup-token`). Supply as a
          same-org organization secret and pass this named secret explicitly.
        required: true

permissions:
  contents: read

jobs:
  assist:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Fleet kill-switches + actor gates. Comma-wrap skip/allow lists so a
    # substring of one actor cannot match another. Job-level concurrency sits
    # below so a skipped actor cannot cancel an in-progress assist.
    if: >-
      ${{ vars.CLAUDE_LANES_DISABLED != 'true'
          && vars.CLAUDE_ASSISTANT_DISABLED != 'true'
          && !contains(format(',{0},', inputs.skip-actors), format(',{0},', github.actor))
          && (inputs.allowed-authors == ''
              || contains(format(',{0},', inputs.allowed-authors), format(',{0},', github.actor))) }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    concurrency:
      group: claude-assistant-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Reject privileged triggers
        if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_run'
        run: |
          echo "::error::claude-assistant must not be called from '${{ github.event_name }}'." \
            "Call it from issue_comment / pull_request_review_comment / workflow_dispatch." \
            "pull_request_target/workflow_run run with base-repo secrets over untrusted" \
            "code (token exfiltration risk)."
          exit 1

      - name: Reject allowed-bots wildcard
        env:
          ALLOWED_BOTS: ${{ inputs.allowed-bots }}
        run: |
          set -euo pipefail
          # Bot entries bypass the write-permission check. '*' on a public repo
          # lets external Apps invoke this lane with attacker-controlled prompts
          # (upstream security docs). Refuse any wildcard entry.
          if [ -z "${ALLOWED_BOTS}" ]; then
            exit 0
          fi
          IFS=',' read -r -a bots <<< "${ALLOWED_BOTS}"
          for bot in "${bots[@]}"; do
            if [ "${bot}" = "*" ]; then
              echo "::error::allowed-bots must not contain '*' (ci-workflows#255)." \
                "Name specific bots, or leave the input empty."
              exit 1
            fi
          done

      - name: Reject write-capable Claude tool grants
        env:
          CLAUDE_ARGS: ${{ inputs.claude-args }}
        run: |
          set -euo pipefail
          # Tool allowlist is the real V1 control (upstream #1289). A caller
          # that replaces claude-args must not smuggle Edit/Write/git mutate
          # grants past the floor.
          if printf '%s\n' "${CLAUDE_ARGS}" | grep -Eq \
            -- '--allowedTools[^[:space:]]*[[:space:]"].*\b(Edit|Write|NotebookEdit)\b|\bBash\(git (add|commit|push|checkout|reset|rebase|merge)'; then
            echo "::error::claude-assistant V1 rejects write-capable --allowedTools" \
              "grants in claude-args (Edit/Write/NotebookEdit/Bash(git mutate))." \
              "Answer/re-review only — see claude-assistant-ADR.md."
            exit 1
          fi

      - name: Require a prompt on workflow_dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.prompt == ''
        run: |
          echo "::error::prompt is required on workflow_dispatch (no @claude comment payload)."
          exit 1

      # Do NOT pin ref to a PR head here — untrusted checkout-before-action is
      # the CVE-2026-47751 class. Mention events resolve to the default-branch
      # workflow SHA; the action's setupBranch owns any PR-ref handling.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # persist-credentials stays at its default (true) until upstream
          # claude-code-action#1236 ships; the strip step below scrubs it.
          filter: blob:none

      - name: Compose Claude CLI arguments
        id: compose-args
        env:
          BASE_ARGS: ${{ inputs.claude-args }}
        run: |
          set -euo pipefail
          # Floor tools (ci-workflows#255): caller's claude-args may replace
          # the default wholesale, so the allowlist floor is appended here and
          # cannot be dropped. Repeated --allowedTools flags accumulate.
          args="$BASE_ARGS"
          args="$args --allowedTools Read,Grep,Glob"
          args="$args --allowedTools Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)"
          args="$args --allowedTools mcp__github_inline_comment__create_inline_comment"
          delimiter="gha_${RANDOM}${RANDOM}_EOF"
          {
            echo "args<<$delimiter"
            printf '%s\n' "$args"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Claude assist
        id: claude-assist
        # Advisory: infra blips must not redden the job. Users re-mention
        # @claude (or re-dispatch) rather than relying on an automatic retry.
        continue-on-error: true
        timeout-minutes: 12
        uses: anthropics/claude-code-action@3f854a8fb5146b39d5cbf8b57f70d80810e1366f # v1.0.198
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Empty prompt on mention events → tag mode uses the @claude comment.
          # workflow_dispatch supplies inputs.prompt via the caller.
          prompt: ${{ inputs.prompt }}
          display_report: ${{ inputs.display-report }}
          allowed_bots: ${{ inputs.allowed-bots }}
          # Never pass allowed_non_write_users (V1 hard rule).
          exclude_comments_by_actor: ${{ inputs.exclude-comments-by-actor }}
          claude_args: ${{ steps.compose-args.outputs.args }}

      - name: Report outcome
        if: always() && !cancelled()
        env:
          OUTCOME: ${{ steps.claude-assist.outcome }}
        run: |
          set -euo pipefail
          if [ "${OUTCOME}" = "success" ]; then
            echo "Claude assistant completed. See the issue/PR tracking comment."
          elif [ "${OUTCOME}" = "skipped" ] || [ -z "${OUTCOME}" ]; then
            echo "Claude assistant step did not run."
          else
            echo "::warning::Claude assistant exited with: ${OUTCOME}" \
              "(infrastructure error, not a code-quality signal)." \
              "Re-mention @claude or re-dispatch to retry."
          fi

      # zizmor artipacked mitigation — scrub the GITHUB_TOKEN checkout
      # persisted into .git/config (forced on by #1236).
      - name: Strip persisted git credentials
        if: always()
        run: git config --unset-all http.https://github.com/.extraheader || true
