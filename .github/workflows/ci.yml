name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PR pushes cancel superseded runs (cancel-in-progress: true on the PR number
# group). Main pushes share group <workflow>-${{ github.ref }} with
# cancel-in-progress: false so the documented queue:single default cancels only
# superseded *pending* runs while the in-progress run finishes (main-push burst
# collapse; #122). Keying PRs on the number (not head_ref) keeps fork PRs that
# share a branch name from cancelling each other's required runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Dogfood: this repo is the first consumer of its own composite actions. Each
# lane checks out this repo and runs a lane action against either a root-native
# standards config or a small fixture-local contract input; the local ci-status
# gateway aggregates them into the single required check. Local (./) action refs
# work here because the checkout IS this repo.
#
# Change-scoped execution (dogfooding ./.github/actions/change-detection):
# file-type-scoped lanes gate on `changes` at JOB level, so a skipped lane
# still reports `skipped` under the always-running `ci-status` required check
# — never workflow-level `paths:`, which would wedge a required check Pending.
# Each gate reads `!= 'false'`, never `== 'true'`: with `!cancelled()` a
# failed or unset detection output runs the lane rather than skipping it, and
# `changes` itself is aggregated by `ci-status` so a broken detection goes
# red instead of riding fail-open to silent green forever. Content-agnostic
# cheapest hygiene checks (editorconfig, exec-bit, machine-specific-paths,
# eol-renormalize, comment-hygiene) share one `hygiene` lane with
# continue-on-error + final outcome aggregation. Other unconditional dogfood
# lanes (typos, gitleaks, links, action-metadata-filename) stay separate so
# each composite keeps a dedicated failure surface. osv-scanner is also
# ungated — see its job comment.
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      results: ${{ steps.detect.outputs.results }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect relevant lanes
        id: detect
        uses: ./.github/actions/change-detection
        with:
          # Conservative by design: every group includes `.github/**`, so any
          # change to a workflow, an action, or a bundled script re-runs every
          # scoped lane; language groups also glob their file types repo-wide,
          # not just the fixture trees the lanes currently point at.
          filters: |
            markdown:
              .github/**
              **/*.md
              **/.markdownlint*
            powershell:
              .github/**
              fixtures/composite-action/**
              **/*.ps1
              **/*.psm1
              **/*.psd1
            reference-integrity:
              .github/**
              fixtures/reference-integrity/**
            python:
              .github/**
              fixtures/python/**
              **/*.py
            typescript:
              .github/**
              fixtures/typescript/**
              **/*.js
              **/*.cjs
              **/*.mjs
              **/*.jsx
              **/*.ts
              **/*.tsx
              **/biome.json
              **/tsconfig.json
            dotnet:
              .github/**
              fixtures/dotnet/**
              **/*.cs
              **/*.csproj
              **/*.props
              **/*.targets
              **/packages.lock.json
              **/nuget.config
              **/NuGet.config
              **/NuGet.Config
              **/.editorconfig
              global.json
            shell:
              .github/**
              fixtures/shell/**
              **/*.sh
              **/*.bash
              **/.editorconfig
              .shellcheckrc
            actionlint:
              .github/**
              fixtures/composite-action/**
            lefthook-validate:
              .github/**
              **/lefthook.yml
            jsonschema:
              .github/**
            selector-contract:
              .github/**
            pester:
              .github/**
              fixtures/pester/**
            go:
              .github/**
              fixtures/go/**
              **/*.go
              **/go.mod
              **/go.sum
              **/.golangci.yml
            # Repo-wide `**/action.yml`, unlike the sibling lanes above: zizmor
            # is the only lane whose target discovery is not confined to
            # `.github/` — it runs with `paths: .` and audits composite-action
            # metadata wherever it lives, so a composite added outside
            # `.github/actions/` (say `tools/example/action.yml`) would
            # otherwise skip a lane that does audit it. `action.yml` alone is
            # the complete pattern because `action.yaml` is rejected repo-wide
            # by the always-run action-metadata-filename gate (#267).
            zizmor:
              .github/**
              fixtures/composite-action/**
              **/action.yml

  markdown:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['markdown'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint markdown
        uses: ./.github/actions/markdown

  powershell:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['powershell'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze PowerShell
        uses: ./.github/actions/powershell
      - name: Analyze composite action PowerShell
        # The lane action discovers *.ps1/*.psm1, so the pwsh embedded in
        # composite metadata is invisible to it — and to actionlint and the
        # bash/sh sibling check, which announces those blocks as skipped. Runs
        # here because the lane action already installed the pinned analyzer.
        run: pwsh -File .github/scripts/Invoke-CompositeRunPssa.ps1
      - name: Prove a broken composite pwsh block fails
        run: pwsh -File .github/scripts/Invoke-CompositeRunPssa.test.ps1

  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links and anchors (offline)
        uses: ./.github/actions/lychee-offline

  reference-integrity:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['reference-integrity'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve heading citations
        # Scope to the fixture corpus: the repo's own docs use no `file.md`
        # "Anchor" prose-cite convention, so the fixture is what exercises it.
        uses: ./.github/actions/reference-integrity
        with:
          globs: fixtures/reference-integrity/*.md

  ruff:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['python'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint and format-check Python
        uses: ./.github/actions/ruff
        with:
          paths: fixtures/python/good
          config: fixtures/python/good/ruff.toml

  pyright:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['python'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Type-check Python
        uses: ./.github/actions/pyright
        with:
          config: fixtures/python/good/pyrightconfig.json

  biome:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['typescript'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint and format-check JS/TS
        # Biome has no CLI exclude, so scope at the conforming fixture and the
        # selector's tested CommonJS source/generator/tests.
        uses: ./.github/actions/biome
        with:
          paths: fixtures/typescript/good .github/scripts
          config: fixtures/typescript/good/biome.json

  tsc:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['typescript'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Type-check TypeScript
        # Point tsc at a self-contained fixture project; this lane verifies the
        # action contract without mirroring the standards catalog.
        uses: ./.github/actions/tsc
        with:
          project: fixtures/typescript/good/tsconfig.json

  dotnet-build:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['dotnet'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build .NET contract fixture
        # Scope at a self-contained fixture project; this lane verifies the
        # action contract without mirroring the standards catalog.
        uses: ./.github/actions/dotnet-build
        with:
          project: fixtures/dotnet/good/good.csproj

  dotnet-format:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['dotnet'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify .NET whitespace
        uses: ./.github/actions/dotnet-format
        with:
          project: fixtures/dotnet/good/good.csproj

  typos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Spell-check
        uses: ./.github/actions/typos

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for secrets
        uses: ./.github/actions/gitleaks

  actionlint:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['actionlint'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: ./.github/actions/actionlint
      - name: Prove embedded scripts are checked by ShellCheck
        run: |
          set -euo pipefail
          expected_version="$(awk '
            $0 == "  shellcheck-version:" { in_input=1; next }
            in_input && /^  [^ ]/ { exit }
            in_input && /^    default: / { sub(/^    default: /, ""); print; exit }
          ' .github/actions/actionlint/action.yml)"
          actual_version="$(shellcheck --version | awk '$1 == "version:" { print $2 }')"
          if [[ -z "$expected_version" || "$actual_version" != "$expected_version" ]]; then
            echo "::error::Expected ShellCheck $expected_version, got $actual_version."
            exit 1
          fi
          output="$RUNNER_TEMP/actionlint-shellcheck.txt"
          if actionlint .github/actions/actionlint/fixtures/shellcheck.yml >"$output" 2>&1; then
            echo '::error::The intentional ShellCheck fixture unexpectedly passed actionlint.'
            exit 1
          fi
          cat "$output"
          grep -F '[shellcheck]' "$output"
          grep -F 'SC2086' "$output"
      - name: Lint composite action shell
        # actionlint covers workflows only, so this extends the same embedded-
        # shell contract to composite metadata, which it cannot read. Runs here
        # because the lane action already put the pinned ShellCheck on PATH.
        run: bash .github/scripts/composite-run-shellcheck.sh
      - name: Prove a broken composite shell block fails
        run: bash .github/scripts/composite-run-shellcheck.test.sh

  lefthook-validate:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['lefthook-validate'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate composed Lefthook config
        uses: ./.github/actions/lefthook-validate
        with:
          config-file: .github/actions/lefthook-validate/fixtures/good/lefthook.yml
      - name: Prove invalid extended fragments fail
        run: bash .github/scripts/lefthook-validate.test.sh

  jsonschema:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['jsonschema'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate dependabot.yml
        uses: ./.github/actions/check-jsonschema
        with:
          builtin-schema: vendor.dependabot
          files: .github/dependabot.yml
      - name: Validate workflows
        uses: ./.github/actions/check-jsonschema
        with:
          builtin-schema: vendor.github-workflows
          files: .github/workflows/*.yml
      - name: Validate composite actions
        uses: ./.github/actions/check-jsonschema
        with:
          builtin-schema: vendor.github-actions
          files: .github/actions/*/action.yml

  action-metadata-filename:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject action.yaml metadata (action.yml is enforced exclusively)
        uses: ./.github/actions/action-metadata-filename

  # Cheapest unconditional hygiene composites share one worker (#122). Each
  # check step is continue-on-error with an id; the final aggregation fails on
  # any steps.<id>.outcome == 'failure' (run-everything-fail-at-end). Language
  # / toolchain dogfood jobs stay separate so composite contracts keep a
  # dedicated failure surface.
  hygiene:
    runs-on: ubuntu-24.04
    # Sequential steps replace five formerly-parallel 15m jobs; 20m keeps
    # margin as the cheapest scans grow with the tree.
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check editorconfig conformance
        id: editorconfig
        continue-on-error: true
        uses: ./.github/actions/editorconfig
      - name: Verify shebang files are executable
        id: exec_bit
        continue-on-error: true
        uses: ./.github/actions/exec-bit
      - name: Check for machine-specific paths
        id: machine_specific_paths
        continue-on-error: true
        # The bundled pattern script contains the literal regex bodies, so skip
        # the action's own dir to avoid self-matching.
        uses: ./.github/actions/machine-specific-paths
        with:
          exclude: ':(exclude).github/actions/machine-specific-paths/**'
      - name: Check index-level EOL drift
        id: eol_renormalize
        continue-on-error: true
        uses: ./.github/actions/eol-renormalize
      - name: Verify prefilter is a superset of the policy library
        id: comment_hygiene_superset
        continue-on-error: true
        # Self-enforces the scan's load-bearing invariant: the coarse git-grep
        # prefilter must admit every line the bundled default policy flags, or
        # the gate fails open.
        shell: bash
        run: bash .github/actions/comment-hygiene/superset-test.sh
      - name: Scan comment hygiene
        id: comment_hygiene
        continue-on-error: true
        # The bundled scan and policy reference the literal marker tokens in
        # their own comments, so skip the action's source to avoid self-matching.
        uses: ./.github/actions/comment-hygiene
        with:
          exclude: ':(exclude).github/actions/comment-hygiene/**'
      - name: Aggregate hygiene checks
        if: always()
        shell: bash
        env:
          EDITORCONFIG: ${{ steps.editorconfig.outcome }}
          EXEC_BIT: ${{ steps.exec_bit.outcome }}
          MACHINE_SPECIFIC_PATHS: ${{ steps.machine_specific_paths.outcome }}
          EOL_RENORMALIZE: ${{ steps.eol_renormalize.outcome }}
          COMMENT_HYGIENE_SUPERSET: ${{ steps.comment_hygiene_superset.outcome }}
          COMMENT_HYGIENE: ${{ steps.comment_hygiene.outcome }}
        run: |
          set -euo pipefail
          failed=0
          report() {
            local name="$1"
            local outcome="$2"
            if [[ "$outcome" == failure ]]; then
              echo "::error::$name failed (outcome=$outcome)."
              failed=1
            else
              echo "$name: $outcome"
            fi
          }
          report editorconfig "$EDITORCONFIG"
          report exec-bit "$EXEC_BIT"
          report machine-specific-paths "$MACHINE_SPECIFIC_PATHS"
          report eol-renormalize "$EOL_RENORMALIZE"
          report comment-hygiene-superset "$COMMENT_HYGIENE_SUPERSET"
          report comment-hygiene "$COMMENT_HYGIENE"
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

  # Advisory (#208): reject hand-edits of sync-manifest-managed files. Not in
  # ci-status yet — promote after a clean soak. Exempts standards-sync labelled /
  # melodic-standards-sync[bot] PRs.
  managed-files-guard:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Guard managed files
        uses: ./.github/actions/managed-files-guard
        with:
          # standards#354 (dest-paths) on main.
          standards-ref: 3288035feb70d7985e1337c2e39421ae3c8b9655

  shellcheck:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['shell'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell scripts
        uses: ./.github/actions/shellcheck
      - name: Test ShellCheck discovery and scoped exclusions
        run: bash .github/actions/shellcheck/run.test.sh

  shfmt:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['shell'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell formatting
        # The root EditorConfig owns the same two-space, case-indented contract
        # as `shfmt -i 2 -ci`; include the selector/OSV shell sources so their
        # generated security boundary cannot bypass the required formatter.
        uses: ./.github/actions/shfmt
        with:
          paths: fixtures/shell/good .github/scripts .github/actions/pulumi-deploy-guard .github/actions/change-detection

  selector-contract:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['selector-contract'] != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Test selector and generated workflow contracts
        run: node --test .github/scripts/*.test.cjs
      - name: Test change-detection matcher
        run: bash .github/actions/change-detection/match.test.sh
      - name: Test Claude lane outcome classifier
        run: node --test .github/actions/claude-lane-outcome/*.test.cjs
      - name: Test OSV scan policy guard
        run: bash .github/scripts/osv-scan-guard.test.sh
      - name: Test OSV release digest parsing
        run: bash .github/scripts/osv-release-digest.test.sh
      - name: Test tracking-issue resolver
        run: bash .github/scripts/find-tracking-issue.test.sh
      - name: Test release/tag drift detection
        run: bash .github/scripts/release-tag-drift.test.sh
      - name: Test Gitleaks scan policy guard
        run: bash .github/actions/gitleaks/scan.test.sh
      - name: Test Pulumi deployment guard
        run: bash .github/actions/pulumi-deploy-guard/guard.test.sh
      - name: Test govulncheck SARIF classification
        run: bash .github/scripts/govulncheck-sarif-guard.test.sh

  zizmor:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['zizmor'] != 'false' }}
    permissions:
      contents: read
      # Reusable zizmor.yml always declares security-events: write (expressions
      # are illegal in that scope). Callers must grant it too — reusable
      # workflows cannot elevate. Dogfood stays annotations-only
      # (upload-sarif defaults false); grant write so the job can start, and
      # enable upload-sarif: true here when dogfooding code-scanning upload.
      security-events: write
    # Audit this repo's own workflows AND composite actions (paths: .) — strong
    # dogfood. Advisory: findings annotate without blocking ci-status.
    uses: ./.github/workflows/zizmor.yml
    with:
      paths: .

  osv-scanner:
    # Deliberately ungated: the scanner discovers every manifest and lockfile
    # format OSV supports, and a filter enumerating that set would drift as
    # upstream adds formats — an unlisted new lockfile type would then skip
    # the scan that covers it. Running always is the conservative posture.
    permissions:
      contents: read
    uses: ./.github/workflows/osv-scanner.yml
    with:
      # This public repository's hosted lane is free; private consumers must pass
      # their strict selector output instead.
      runner: ubuntu-24.04
      # This repo carries no dependency lockfiles, so declare it dependency-less
      # and let the empty scan pass: the dogfood proves the wrapper's wiring
      # (inputs forward, advisory posture holds) without inventing a fixture
      # manifest.
      allow-no-lockfiles: true

  pester:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['pester'] != 'false' }}
    permissions:
      contents: read
    # Dogfood the reusable Pester workflow on a minimal fixture suite — proves
    # the runner + pinned-Pester wiring (Windows by default). Blocking: a failing
    # assertion fails the lane.
    uses: ./.github/workflows/pester.yml
    with:
      run: Invoke-Pester -Path fixtures/pester -CI

  go-quality-dogfood:
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.results || '{}')['go'] != 'false' }}
    permissions:
      contents: read
    # A local reusable-workflow reference executes the workflow from this exact
    # commit. The fixture includes a Windows-only assertion that the test binary
    # was built with the race detector, so this is behavioral hosted-runner
    # evidence rather than a source-text contract alone.
    uses: ./.github/workflows/go-quality.yml
    with:
      config: .golangci.yml
      working-directory: fixtures/go/windows-race
      go-version-file: fixtures/go/windows-race/go.mod

  ci-status:
    if: always()
    # `changes` is aggregated alongside the lanes it gates: a failed detection
    # job fails ci-status even though every gated lane fails open and runs, so
    # a broken filter config cannot ride the fallback to green indefinitely.
    needs: [changes, markdown, powershell, links, reference-integrity, ruff, pyright, biome, tsc, dotnet-build, dotnet-format, typos, gitleaks, shellcheck, shfmt, selector-contract, actionlint, lefthook-validate, jsonschema, action-metadata-filename, hygiene, pester, go-quality-dogfood, zizmor, osv-scanner]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Aggregate lane results
        uses: ./.github/actions/ci-status
        with:
          results: ${{ needs.changes.result }} ${{ needs.markdown.result }} ${{ needs.powershell.result }} ${{ needs.links.result }} ${{ needs.reference-integrity.result }} ${{ needs.ruff.result }} ${{ needs.pyright.result }} ${{ needs.biome.result }} ${{ needs.tsc.result }} ${{ needs.dotnet-build.result }} ${{ needs.dotnet-format.result }} ${{ needs.typos.result }} ${{ needs.gitleaks.result }} ${{ needs.shellcheck.result }} ${{ needs.shfmt.result }} ${{ needs.selector-contract.result }} ${{ needs.actionlint.result }} ${{ needs.lefthook-validate.result }} ${{ needs.jsonschema.result }} ${{ needs.action-metadata-filename.result }} ${{ needs.hygiene.result }} ${{ needs.pester.result }} ${{ needs.go-quality-dogfood.result }} ${{ needs.zizmor.result }} ${{ needs.osv-scanner.result }}
