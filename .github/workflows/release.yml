name: release

# Cut a semantic-version release on demand: compute the next tag from the
# latest existing tag + the chosen bump, then create a tag + GitHub Release
# (auto-generated notes) at the current main HEAD.
#
# Why this shape:
#   - NO commit is pushed to main — only a tag is created — so the branch
#     `required_signatures` rule never applies and there is no bot-signing
#     problem. The tag references the already-signed HEAD commit.
#   - GITHUB_TOKEN only: no PAT, no GitHub App, no stored signing key (matches
#     this repo's GitHub-native, no-stored-secret posture). The tag itself is
#     therefore unsigned, but it points at a signed/verified commit and tags are
#     not covered by the commit-signing rule.
#   - Manual dispatch (not on: push) so releasing is a deliberate act — every
#     merge to main does NOT cut a release; you pick when and how much to bump.
#
# Consumers pin `ci-workflows` by SHA with a `# vX.Y.Z` comment; Dependabot
# bumps them to each new release. Cut a release whenever main changes so HEAD
# stays at the latest tag and Dependabot never falls back to tracking HEAD.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic-version increment for this release
        type: choice
        options: [patch, minor, major]
        default: minor
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the tag + GitHub Release
    steps:
      - name: Check out (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Read-only checkout: tag creation goes through gh (GH_TOKEN/API), not
          # git push, so no git credential needs to persist into .git/config.
          persist-credentials: false

      - name: Guard — releases only from main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Releases may only be cut from main (got ${GITHUB_REF})."
            exit 1
          fi

      # SINGLE SOURCE OF TRUTH: the newest PUBLISHED RELEASE, not the newest tag.
      #
      # These were two different artefacts until 2026-08-12. This step computed
      # from the newest tag, while the fleet's re-pin lane
      # (melodic-software/standards `components/claude-lanes/repin-callers.sh
      # resolve`) reads `releases/latest`. Tag `v0.13.0` (036c390) exists with no
      # Release, so it silently advanced the counter here — a `minor` bump on
      # 2026-08-12 produced `v0.14.0`, skipping a version the fleet could never
      # reach — and nothing alarmed on the divergence.
      #
      # A Release is the artefact both halves consume and the deliberate act
      # this workflow exists to perform; a tag is a side effect any pusher can
      # create out-of-band. So the Release wins, and a stray tag no longer moves
      # the counter. The "tag does not already exist" guard below then FAILS
      # CLOSED on a stray tag at the computed version: releases stop until the
      # operator reconciles it, rather than silently stepping over it.
      #
      # Selection is by highest SemVer among published releases, deliberately
      # NOT the `releases/latest` endpoint: that endpoint orders by `created_at`,
      # which GitHub sets from the tag target's COMMIT date, so a release cut
      # from an older commit would rank ahead of a newer version. Highest-SemVer
      # is the rule the re-pin lane's `resolve` now applies too, so both halves
      # share one artefact AND one ordering.
      - name: Compute next version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The API call is deliberately SEPARATE from the filtering pipe.
          # Folding them together and appending `|| true` — the earlier shape —
          # tolerated far more than intended: under `pipefail` that trailing
          # `|| true` masks a failing `gh api` (auth, rate limit, transient 5xx,
          # or a mid-pagination error on any of the additional sequential
          # requests `--paginate` makes) exactly as if grep had simply found no
          # releases. The run would then fall through to the `v0.0.0` default
          # and compute a version from the wrong baseline — cutting `v0.1.0` on
          # a repository that already has a v0.14.0, or colliding with an
          # existing tag. For the workflow that decides what the whole fleet
          # pins to, a transient API blip must never silently rebase the
          # version. So: an API failure aborts under errexit, and only grep's
          # expected exit 1 (no release matches, on a repository with none yet)
          # is tolerated.
          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          latest="$(printf '%s\n' "$releases" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          latest="${latest:-v0.0.0}"
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="v${major}.${minor}.${patch}"
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "Next release: ${next} (from newest published release ${latest}, bump=${BUMP})"

      # The checkout above is still `fetch-depth: 0` because this guard reads
      # local tags. It is now also the fail-closed half of the source-of-truth
      # change: with the version computed from Releases, a tag that exists
      # without one lands here as a hard stop instead of being stepped over.
      - name: Guard — tag does not already exist
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null; then
            echo "::error::Tag ${NEXT} already exists but is not a published Release, so the version computed from Releases collides with it. Reconcile the two — publish the missing Release for ${NEXT} or delete the stray tag — then re-run. See .github/workflows/release-tag-drift-check.yml and its tracking issue."
            exit 1
          fi

      - name: Create tag + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          gh release create "${NEXT}" \
            --target "${GITHUB_SHA}" \
            --title "${NEXT}" \
            --generate-notes
          echo "Released ${NEXT} at ${GITHUB_SHA}"
