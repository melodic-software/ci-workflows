name: release

# Cut a semantic-version release on demand: the next version is the highest
# SemVer among PUBLISHED Releases (not tags) plus the chosen bump, released as a
# tag + GitHub Release (auto-generated notes) at the current main HEAD.
#
# Why this shape:
#   - NO commit is pushed to main — only a tag is created — so the branch
#     `required_signatures` rule never applies and there is no bot-signing
#     problem. The tag references the already-signed HEAD commit.
#   - GITHUB_TOKEN only: no PAT, no GitHub App, no stored signing key (matches
#     this repo's GitHub-native, no-stored-secret posture). The tag itself is
#     therefore unsigned, but it points at a signed/verified commit and tags are
#     not covered by the commit-signing rule.
#   - Manual dispatch (not on: push) so releasing is a deliberate act — every
#     merge to main does NOT cut a release; you pick when and how much to bump.
#
# CUTTING A RELEASE REPINS NOTHING: it rewrites no `uses:` pin, here or in a
# consumer. Repins are separate reviewed pull requests: the standards
# `claude-lanes-repin.yml` lane for the callers `repin-callers.sh` enumerates,
# this repository's `github-actions` Dependabot group for its self-pins, and by
# hand everywhere else.
#
# Cut a release whenever main changes by something worth pinning to, so a
# repinner has a released SHA for the `# vX.Y.Z` comment form instead of the
# `# <short-sha> <YYYY-MM-DD>` fallback an unreleased commit forces.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic-version increment for this release
        type: choice
        options: [patch, minor, major]
        default: minor
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the tag + GitHub Release
    steps:
      - name: Check out (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Read-only checkout: tag creation goes through gh (GH_TOKEN/API), not
          # git push, so no git credential needs to persist into .git/config.
          persist-credentials: false

      - name: Guard — releases only from main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Releases may only be cut from main (got ${GITHUB_REF})."
            exit 1
          fi

      # SINGLE SOURCE OF TRUTH: the highest-SemVer PUBLISHED RELEASE, the same
      # artifact and ordering the fleet's re-pin lane `resolve` uses. A stray
      # tag must not move the counter. Not `releases/latest`: it orders by the
      # tag target's commit date.
      - name: Compute next version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The API call stays SEPARATE from the `|| true` pipe, so a failing
          # `gh api` aborts instead of falling through to the `v0.0.0` default.
          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          latest="$(printf '%s\n' "$releases" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          latest="${latest:-v0.0.0}"
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="v${major}.${minor}.${patch}"
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "Next release: ${next} (from newest published release ${latest}, bump=${BUMP})"

      # Reads local tags (hence `fetch-depth: 0`); fails closed on a stray tag
      # at the computed version rather than stepping over it.
      - name: Guard — tag does not already exist
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null; then
            echo "::error::Tag ${NEXT} already exists but is not a published Release, so the version computed from Releases collides with it. Reconcile the two — publish the missing Release for ${NEXT} or delete the stray tag — then re-run. See .github/workflows/release-tag-drift-check.yml and its tracking issue."
            exit 1
          fi

      - name: Create tag + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          gh release create "${NEXT}" \
            --target "${GITHUB_SHA}" \
            --title "${NEXT}" \
            --generate-notes
          echo "Released ${NEXT} at ${GITHUB_SHA}"
