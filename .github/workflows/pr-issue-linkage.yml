name: pr-issue-linkage

# Reusable workflow — requires the PR body to carry a native GitHub closing
# keyword (Closes/Fixes/Resolves #N), a non-closing "Refs: #N" / "Relates to:
# #N" marker, or the literal "No linked issue" / "No related issue:" when the
# PR relates to no issue at all, AND the four contract headers with content:
# "## Summary", "## Fix", "## Verification", and "## Related"
# (issue #153; consumer template alignment in claude-code-plugins#553).
# A closing keyword whose preceding words negate it ("does not close #N")
# fails the gate outright, because GitHub's own parser is negation-blind and
# auto-closes the issue on merge regardless of the disclaimer (issue #521).
# GATING by design: a caller that requires this check blocks the merge until
# the body is fixed. Generalizes melodic-software/provisioning's pr-body.yml
# (decisions #58/#59) into a shared reusable workflow, mirroring pr-title.yml's
# own shape (a repo-specific implementation first, then a shared reusable
# workflow consumers call).
#
# The caller must use `pull_request_target` (not `pull_request`): this runs
# the workflow definition from the base branch, not the PR head, so a
# fork/head cannot tamper with this gate. Trigger types must include `edited`
# so a body edit re-validates, matching semantic-pr.yml's `edited` requirement
# for re-titled PRs. The body is live-refetched from the API into `PR_BODY`
# via `GITHUB_ENV` (never spliced into the script/run text), so untrusted
# PR-author content cannot inject code. This is a standalone required check, NOT a
# ci-status lane: body edits should not re-run the file-lint lanes.
on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label selected by the caller for every prerequisite outcome.
          Direct callers that omit it use the public hosted default. A caller
          passing a dynamic expression must ensure it resolves to a non-empty
          label; the reusable applies no implicit fallback, so an empty value
          fails runner allocation.
        type: string
        default: ubuntu-24.04
      prerequisite-result:
        description: >-
          Result of an optional prerequisite job. Callers with `needs` must pass
          its exact result and use `if: always()`. `failure`, `skipped`, and any
          unrecognized value fail this required check before body validation
          (fail-closed: selector breakage stays loud). `cancelled` proceeds to
          validation only after the Actions Jobs API confirms the prerequisite
          truly concluded `cancelled`, not `timed_out` — GitHub collapses
          timeouts into `needs.*.result == cancelled` (#458). True cancel is
          the routine per-PR concurrency-supersede signal and this reporter is
          already running on the caller-resolved runner, so the check reports the
          real gate answer instead of a synthetic failure (#446). Lookup
          failure or missing `actions: read` fails closed.
        type: string
        default: success
      exempt-authors:
        description: >-
          Comma-separated exact PR-author logins that skip body validation
          (e.g. `dependabot[bot]`). Matched by exact equality against
          `github.event.pull_request.user.login` — never a `*[bot]` pattern, so
          an unknown future bot is not silently skipped. Fail-closed: the default
          empty string exempts no one, preserving current behavior for every
          existing consumer. Opt in per repo by listing the bots whose generated
          PR bodies cannot carry the closing-keyword + contract-header markers.
        type: string
        default: ""

permissions:
  pull-requests: read
  actions: read

jobs:
  # Job id, not the file-level `name:` above, is what forms the check context
  # together with the caller's job id (`<caller job id> / <this job id>`).
  # Kept equal to the caller's own job id (`pr-issue-linkage`, see README) so
  # the emitted context is `pr-issue-linkage / pr-issue-linkage`, matching the
  # convention semantic-pr / pr-title.yml and do-not-merge-gate already
  # established.
  pr-issue-linkage:
    # Always honor the caller-selected runner, including for a failed, skipped,
    # cancelled, or empty prerequisite result. The caller owns any recovery
    # fallback passed through `runner`; direct callers that omit it retain the
    # public `ubuntu-24.04` default above. The rejection step remains first so a
    # failed or skipped prerequisite fails closed before body validation, while
    # a cancelled prerequisite proceeds to real body validation (see the
    # cancelled-prerequisite step below and #446).
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - name: Reject failed prerequisite
        # `cancelled` is deliberately NOT rejected here — see the next step.
        # Every other non-success result (failure, skipped, empty/unrecognized)
        # still fails closed before body validation: those mean the runner
        # selector broke or the caller wired the contract wrong, and masking
        # that behind a green check would hide real infrastructure breakage.
        if: >-
          inputs.prerequisite-result != 'success' &&
          inputs.prerequisite-result != 'cancelled'
        env:
          PREREQUISITE_RESULT: ${{ inputs.prerequisite-result }}
        run: |
          echo "::error::Required prerequisite did not succeed (result: ${PREREQUISITE_RESULT})."
          exit 1

      - name: Resolve cancelled prerequisite
        # GitHub reports timed-out jobs as `needs.*.result == cancelled`. The
        # Actions Jobs API exposes the distinct `conclusion: timed_out`, so a
        # delivered cancellation must be resolved before validation proceeds
        # (#458). Implemented inline with actions/github-script — a local
        # `./.github/actions/...` path would resolve against the CALLER's
        # workspace (empty for reusable workflow_call jobs), not this repo.
        # Selector-dependent callers must grant `actions: read` on this job;
        # lookup failure fails closed. Algorithm mirrored by
        # `.github/scripts/resolve-cancelled-prerequisite.cjs` (unit-tested).
        if: ${{ inputs.prerequisite-result == 'cancelled' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const SELECTOR_JOB_NAME_PATTERN = /select[\s_-]?runner/i;
            function isSelectorLikeJobName(name) {
              return typeof name === "string" && SELECTOR_JOB_NAME_PATTERN.test(name);
            }
            function resolveCancelledPrerequisite(jobs) {
              if (!Array.isArray(jobs)) {
                return {
                  outcome: "fail",
                  reason: "lookup-failed",
                  detail: "workflow jobs response is not an array",
                };
              }
              const terminalJobs = jobs.filter(
                (job) =>
                  job &&
                  typeof job === "object" &&
                  (job.status === "completed" || typeof job.conclusion === "string"),
              );
              const selectorCandidates = terminalJobs.filter(
                (job) =>
                  isSelectorLikeJobName(job.name ?? "") &&
                  (job.conclusion === "timed_out" || job.conclusion === "cancelled"),
              );
              if (selectorCandidates.length > 0) {
                if (selectorCandidates.some((job) => job.conclusion === "timed_out")) {
                  return {
                    outcome: "fail",
                    reason: "timed_out",
                    detail: "selector-like prerequisite job concluded timed_out",
                  };
                }
                return {
                  outcome: "proceed",
                  reason: "cancelled",
                  detail: "selector-like prerequisite job concluded cancelled",
                };
              }
              if (terminalJobs.some((job) => job.conclusion === "timed_out")) {
                return {
                  outcome: "fail",
                  reason: "timed_out",
                  detail:
                    "no selector-like job matched; run contains a timed_out job (fail-closed heuristic)",
                };
              }
              return {
                outcome: "proceed",
                reason: "cancelled-ambiguous",
                detail:
                  "no selector-like job matched and no timed_out jobs; treating as true cancel",
              };
            }

            let jobs;
            try {
              jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              });
            } catch (error) {
              core.setFailed(
                "Could not resolve cancelled prerequisite via Actions API " +
                  `(actions: read required on the gate job): ${error.message}`,
              );
              return;
            }

            const resolution = resolveCancelledPrerequisite(jobs);
            if (resolution.outcome === "fail") {
              core.setFailed(
                "Prerequisite was cancelled in needs context but resolved to " +
                  `${resolution.reason}: ${resolution.detail}`,
              );
              return;
            }

            core.info(
              "Cancelled prerequisite resolved to true cancel " +
                `(${resolution.reason}): ${resolution.detail}`,
            );

      - name: Note cancelled prerequisite
        # A cancelled prerequisite is normal supersede behavior, not a fault:
        # the caller's per-PR `concurrency.cancel-in-progress` cancels the
        # in-flight run when a newer event arrives for the same PR, and the
        # caller's mandatory `if: always()` reporter contract (README) still
        # materializes this required check for the superseded run.
        #
        # Failing closed on `cancelled` (the pre-#446 behavior) turned every
        # routine supersede into a RED required check that operators had to
        # clear by hand-re-running jobs (observed fleet-wide 2026-08-12:
        # medley#1769, dotfiles#453). Passing vacuously instead (skip
        # validation, exit 0) would be worse: a cancelled result alone does
        # not prove a successor covers this check — a manual run cancellation
        # has no successor — so an unvalidated green could let an unchecked PR
        # through. Validating for real is strictly stronger than both: this
        # job is already running on the caller-resolved fallback runner, and
        # the step below live-refetches the PR body from the API (falling back
        # to the event payload only when the fetch fails), so it reports the
        # real gate answer — red only when the body actually violates the
        # contract.
        #
        # This ::notice keeps a superseded-run validation distinguishable in
        # the job log from an ordinary success-path run, and from the hard
        # `::error` above, for whoever debugs the next incident.
        if: ${{ inputs.prerequisite-result == 'cancelled' }}
        run: |
          echo "::notice::Prerequisite was cancelled in needs context and resolved to true cancel via the Actions Jobs API — routine concurrency supersede or a manual run cancellation. A timed-out prerequisite would have failed closed above (#458). Proceeding with body validation on the caller-resolved runner; this check reports the real validation result, not a synthetic prerequisite failure."

      - name: Load current PR body
        # Live-refetch matches do-not-merge-gate's label refetch and
        # semantic-pr's live title read: a superseded run validates the same
        # current body its successor will. PR_BODY lands in GITHUB_ENV with a
        # random heredoc delimiter so untrusted body text cannot corrupt env
        # ingestion; the Validate step inherits it rather than reading the
        # stale event payload directly.
        if: >-
          (inputs.prerequisite-result == 'success' ||
          inputs.prerequisite-result == 'cancelled') &&
          (github.event_name == 'pull_request_target' || github.event_name == 'pull_request')
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FALLBACK_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          delimiter="gha_${RANDOM}${RANDOM}_PR_BODY_EOF"
          body=""
          if ! body="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' 2>/dev/null)"; then
            body="${FALLBACK_BODY:-}"
          fi
          {
            echo "PR_BODY<<$delimiter"
            printf '%s\n' "$body"
            echo "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Validate PR body against the closing-keyword + contract-header convention
        # Skipped (job still green) on anything but the two PR-body-bearing
        # events -- the body was already validated when the PR was last
        # opened/edited, matching do-not-merge-gate.yml's merge_group guard.
        # A `cancelled` prerequisite validates too (see the note step above
        # and #446).
        if: >-
          (inputs.prerequisite-result == 'success' ||
          inputs.prerequisite-result == 'cancelled') &&
          (github.event_name == 'pull_request_target' || github.event_name == 'pull_request')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # PR_BODY is inherited from GITHUB_ENV (live-refetched above).
          # Env-passed, never spliced into the script text. The login is
          # GitHub-issued (not author-editable), but keeping the same shape
          # avoids a second pattern.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EXEMPT_AUTHORS: ${{ inputs.exempt-authors }}
        with:
          script: |
            // Exempt-author short-circuit, evaluated before any body parsing: a
            // caller opts specific bot logins out of validation because their
            // generated PR bodies cannot carry the closing-keyword + contract-
            // header markers (dependabot/renovate). Exact-login equality only --
            // never a `*[bot]` pattern -- so an unknown future bot is not silently
            // skipped on this merge gate. An empty list (the default) exempts no
            // one: fail-closed, identical behavior to before for existing consumers.
            const prAuthor = process.env.PR_AUTHOR || "";
            const exemptAuthors = (process.env.EXEMPT_AUTHORS || "")
              .split(",")
              .map((login) => login.trim())
              .filter((login) => login.length > 0);

            if (exemptAuthors.includes(prAuthor)) {
              core.info(
                `PR author "${prAuthor}" matches an exempt-authors entry; ` +
                  "skipping closing-keyword + contract-header body validation."
              );
            } else {
              // Strip rendered HTML comments before any check: GitHub's own closing-keyword
              // parser and rendered Markdown both ignore commented-out text, and a PR template
              // ships its instructional prose inside comments. Comment-looking text inside an
              // inline code span or fenced code block is rendered literally, though, so it must
              // not open a comment and hide valid metadata later in the body. Code contents are
              // masked from the returned text so example linkage markers cannot satisfy the gate.
              const rawBody = process.env.PR_BODY || "";

              function stripRenderedHtmlComments(text) {
                const lines = text.split(/\r?\n/);
                const output = [];
                let commentOpen = false;
                let fence = null;
                let inlineTicks = null;

                function hasClosingTickRun(startLine, startColumn, ticks) {
                  for (let lineIndex = startLine; lineIndex < lines.length; lineIndex += 1) {
                    const candidate = lines[lineIndex];
                    if (lineIndex > startLine && candidate.trim() === "") return false;
                    let column = lineIndex === startLine ? startColumn : 0;
                    while (column < candidate.length) {
                      if (candidate[column] !== "`") {
                        column += 1;
                        continue;
                      }
                      let end = column + 1;
                      while (candidate[end] === "`") end += 1;
                      if (end - column === ticks) return true;
                      column = end;
                    }
                  }
                  return false;
                }

                for (let lineIndex = 0; lineIndex < lines.length; lineIndex += 1) {
                  const line = lines[lineIndex];
                  if (!commentOpen && inlineTicks === null) {
                    const marker = /^ {0,3}(`{3,}|~{3,})(.*)$/.exec(line);
                    if (fence !== null) {
                      output.push("");
                      if (
                        marker !== null &&
                        marker[1][0] === fence.char &&
                        marker[1].length >= fence.length &&
                        /^\s*$/.test(marker[2])
                      ) {
                        fence = null;
                      }
                      continue;
                    }
                    if (
                      marker !== null &&
                      !(marker[1][0] === "`" && marker[2].includes("`"))
                    ) {
                      fence = { char: marker[1][0], length: marker[1].length };
                      output.push("");
                      continue;
                    }
                    if (/^(?: {4}|\t)/.test(line)) {
                      output.push("");
                      continue;
                    }
                  }

                  let rendered = "";
                  for (let index = 0; index < line.length; ) {
                    if (commentOpen) {
                      const close = line.indexOf("-->", index);
                      if (close === -1) {
                        index = line.length;
                        continue;
                      }
                      commentOpen = false;
                      index = close + 3;
                      continue;
                    }

                    if (line[index] === "`") {
                      let end = index + 1;
                      while (line[end] === "`") end += 1;
                      const ticks = end - index;
                      const wasInline = inlineTicks !== null;
                      if (
                        !wasInline &&
                        hasClosingTickRun(lineIndex, end, ticks)
                      ) {
                        inlineTicks = ticks;
                      }
                      else if (inlineTicks === ticks) inlineTicks = null;
                      if (!wasInline && inlineTicks === null) {
                        rendered += line.slice(index, end);
                      }
                      index = end;
                      continue;
                    }

                    if (inlineTicks === null && line.startsWith("<!--", index)) {
                      commentOpen = true;
                      index += 4;
                      continue;
                    }

                    if (inlineTicks === null) rendered += line[index];
                    index += 1;
                  }
                  output.push(rendered);
                }

                return output.join("\n");
              }

              // An actual unterminated comment (template edited mid-comment, or the closing
              // marker accidentally deleted) hides everything after it from GitHub's renderer,
              // so the state machine discards the rest rather than leaking metadata as live.
              const body = stripRenderedHtmlComments(rawBody);
              const errors = [];

              function extractSection(text, headingRe) {
                const lines = text.split(/\r?\n/);
                const start = lines.findIndex((l) => headingRe.test(l.trim()));
                if (start === -1) return null;
                // Only a heading at the same or higher level (fewer or equal #'s)
                // ends the section, so a nested subsection (more #'s) counts as
                // this section's content instead of prematurely closing it.
                const level = lines[start].trim().match(/^(#{1,6})\s+\S/)[1].length;
                const rest = lines.slice(start + 1);
                const end = rest.findIndex((l) => {
                  const heading = /^(#{1,6})\s+\S/.exec(l.trim());
                  return heading !== null && heading[1].length <= level;
                });
                return (end === -1 ? rest : rest.slice(0, end)).join("\n").trim();
              }

              // Four contract headers (Summary / Fix / Verification / Related): same
              // presence + non-empty rule Related already enforced. Heading match is
              // case-insensitive; content may be nested subsections (see extractSection).
              const requiredSections = [
                {
                  name: "Summary",
                  guidance:
                    "Describe what this PR changes and why, in a sentence or two.",
                },
                {
                  name: "Fix",
                  guidance:
                    "State the concrete change and how it addresses the problem.",
                },
                {
                  name: "Verification",
                  guidance:
                    "Record concrete evidence the change works (commands, gates, output).",
                },
                {
                  name: "Related",
                  guidance:
                    "List related PRs, ADRs, or decision-log entries this PR does not close.",
                },
              ];
              for (const section of requiredSections) {
                const content = extractSection(
                  body,
                  new RegExp(`^##\\s+${section.name}$`, "i"),
                );
                if (content === null) {
                  errors.push(
                    `Missing a "## ${section.name}" section. ${section.guidance}`,
                  );
                } else if (content.length === 0) {
                  errors.push(`The "## ${section.name}" section is empty.`);
                }
              }

              // Matches the same shape GitHub's own linkage parser accepts: one of the nine
              // closing keywords, an optional colon, and a `#N` or `owner/repo#N` tail.
              // Global so every occurrence on a line can be classified, not just the first.
              const CLOSING_KEYWORD =
                /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*(?:[\w.-]+\/[\w.-]+)?#\d+\b/gi;
              // First-class non-closing linkage: "this PR references issue N and deliberately
              // does not close it". Before #521 the only passing escape was the no-issue
              // opt-out, which is a lie when the PR plainly does relate to an issue, and the
              // honest prose alternative armed GitHub's parser. The shape is deliberately
              // strict -- colon required, at most three leading spaces (four opens an indented
              // code block), one marker per rendered line, no trailing prose -- so ordinary
              // sentences that happen to contain "refs" cannot satisfy a merge gate.
              const NON_CLOSING_MARKER =
                /^ {0,3}(?:refs|relates[ \t]+to):[ \t]*(?:[\w.-]+\/[\w.-]+)?#\d+[ \t]*$/i;
              // Accepts both phrasings: provisioning/pr-body.yml's original "No linked issue"
              // and claude-code-plugins/source-control:pull-request's independently-evolved
              // "No related issue:" opt-out marker (reference/create.md). Widened, not narrowed,
              // so this reusable workflow works as a caller for either repo's existing convention.
              const NO_ISSUE_MARKER = /\bno (?:linked|related) issue\b/i;

              // GitHub's parser reads the keyword and nothing around it, so a negated
              // closer still registers a live closing reference and still auto-closes
              // the issue on merge (observed on melodic-software/dotfiles#583). The gate
              // reads the words the parser ignores: at most five tokens immediately
              // before the keyword on the same rendered line, cut at the nearest
              // sentence break so an unrelated earlier clause cannot negate it.
              const NEGATION_WINDOW_WORDS = 5;
              const NEGATION_WORDS = new Set([
                "not",
                "never",
                "no",
                "without",
                "deliberately",
                "intentionally",
              ]);

              function isNegatedClosingReference(line, keywordIndex) {
                const preceding = line.slice(0, keywordIndex);
                const sentenceBreak = Math.max(
                  preceding.lastIndexOf("."),
                  preceding.lastIndexOf("!"),
                  preceding.lastIndexOf("?"),
                  preceding.lastIndexOf(";"),
                );
                const words =
                  preceding.slice(sentenceBreak + 1).match(/[A-Za-z][A-Za-z'\u2019]*/g) || [];
                const window = words.slice(-NEGATION_WINDOW_WORDS);
                return window.some((word, index) => {
                  const lower = word.toLowerCase();
                  // Correlative "not only … but" is affirmative ("not only
                  // documents but fixes #N"), not a disclaimer. "not" still
                  // counts when the next token is anything else.
                  if (lower === "not" && window[index + 1]?.toLowerCase() === "only") {
                    return false;
                  }
                  return NEGATION_WORDS.has(lower) || /n['\u2019]t$/i.test(word);
                });
              }

              let hasClosingKeyword = false;
              let hasNonClosingMarker = false;
              const negatedClosingReferences = [];
              for (const line of body.split(/\r?\n/)) {
                if (NON_CLOSING_MARKER.test(line)) hasNonClosingMarker = true;
                CLOSING_KEYWORD.lastIndex = 0;
                let match;
                while ((match = CLOSING_KEYWORD.exec(line)) !== null) {
                  if (isNegatedClosingReference(line, match.index)) {
                    negatedClosingReferences.push(match[0]);
                  } else {
                    hasClosingKeyword = true;
                  }
                }
              }

              // Fail-closed, never warn-only, and never excused by a valid marker elsewhere
              // in the body: the disclaimer does not stop the merge from closing the issue,
              // so the phrase itself has to go before this PR can merge.
              if (negatedClosingReferences.length > 0) {
                const quoted = [...new Set(negatedClosingReferences)]
                  .map((reference) => `"${reference}"`)
                  .join(", ");
                errors.push(
                  `Negated closing reference (${quoted}). GitHub's linkage parser ignores the ` +
                    "surrounding words, so this still registers a closing reference and still " +
                    "auto-closes the issue when this PR merges. Remove the closing keyword and " +
                    'use "Refs: #N" (or "Relates to: #N") on its own line instead.'
                );
              }

              // A negated closing reference deliberately does not count here either: the only
              // ways to satisfy linkage are a real closing keyword, an explicit non-closing
              // marker, or the no-issue opt-out.
              if (!hasClosingKeyword && !hasNonClosingMarker && !NO_ISSUE_MARKER.test(body)) {
                errors.push(
                  "Missing a native closing keyword (Closes/Fixes/Resolves #N). If this PR " +
                    'references an issue it must not close, put "Refs: #N" (or "Relates to: #N") ' +
                    'on its own line. If it relates to no GitHub issue at all, state ' +
                    '"No linked issue" (or "No related issue:") in the body instead.'
                );
              }

              if (errors.length > 0) {
                core.setFailed(errors.join("\n\n"));
              }
            }
