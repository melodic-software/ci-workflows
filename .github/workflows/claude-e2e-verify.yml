name: claude-e2e-verify

# Reusable workflow — Claude-powered end-to-end verification of a PR. The caller
# supplies a command that builds and serves its app; this workflow provisions a
# pinned Playwright browser toolchain, waits for the app to become healthy, then
# runs anthropics/claude-code-action to drive the running app through the
# caller's verification journeys and post its findings as a PR comment. A
# whole-job concern (own job permissions + a secrets interface), so a reusable
# workflow, not a composite action — mirrors claude-review.yml.
#
# ADVISORY posture: the verification agent step runs continue-on-error and posts
# findings as a PR comment; this lane is never wired into a gating ci-status
# check. Promotion path: flip to a selector-coupled required gate when the lane's
# findings prove precision over a sustained window — an earned promotion,
# mirroring the review lane's discipline.
#
# CONSUMER CONTRACT (the caller owns these — they are NOT set here):
#   The triggers and the GITHUB_TOKEN permission grant live in each consumer's
#   thin caller, because a reusable workflow's `on:` is `workflow_call` and the
#   caller's own `on:` decides which events invoke it; and because a called
#   workflow can only DOWNGRADE the caller's permission grant, never elevate it.
#   Canonical caller:
#
#     on:
#       pull_request:
#         types: [opened, synchronize, ready_for_review, reopened]
#     jobs:
#       e2e:
#         permissions:
#           contents: read         # checkout the PR head to build + serve it
#           pull-requests: write   # post the verification comment
#           id-token: write        # OIDC — mints the Claude GitHub App token
#                                  # (required even with an OAuth/API-key credential)
#         uses: melodic-software/ci-workflows/.github/workflows/claude-e2e-verify.yml@<sha>
#         with:
#           app-start-command: npm ci && npm run build && npm run start
#           app-url: http://localhost:3000
#         secrets:
#           CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# SECURITY MODEL (see CLAUDE.md for the full rationale; copied in spirit from
# claude-review.yml):
#   - Intended for `pull_request` (NEVER pull_request_target / workflow_run with
#     secrets — privileged context + untrusted fork code = token exfiltration).
#     The `reject-privileged-triggers` step is a tripwire that hard-fails those
#     two events; every other event is allowed (the consumer keeps flexibility).
#     This lane is MORE sensitive to that boundary than review: it BUILDS, SERVES,
#     and browser-drives the PR head, i.e. it executes PR-authored code on the
#     runner. Under `pull_request` a fork gets no secrets and a read-only token,
#     so that execution has nothing to exfiltrate; under a privileged trigger it
#     would. Keep it `pull_request`-only.
#   - Fork PRs receive no secrets and a read-only GITHUB_TOKEN by design
#     (authoritative: GitHub's forked-repository secret and GITHUB_TOKEN docs),
#     so there is no CLAUDE_CODE_OAUTH_TOKEN for the agent to run with. Precisely
#     what happens on a fork: the agent step is NOT fork-guarded — the job `if:`
#     carries only the two kill-switch conjuncts — so the build/serve steps run
#     (executing fork-authored code with no secrets present, as the unprivileged
#     user below) and the agent step EXECUTES and FAILS under continue-on-error
#     rather than being skipped. Fork PRs are simply not verified — correct, not
#     a gap to "fix" — but the mechanism is a failing agent step, not a no-op.
#   - One named secret (CLAUDE_CODE_OAUTH_TOKEN); broad secret inheritance is never used.
#   - Least privilege, re-declared on the job so an over-granting caller is still
#     narrowed here: contents:read + pull-requests:write + id-token:write.
#   - `display_report` / `show_full_output` stay off (public-repo log-leak risk);
#     failure reporting projects only structured SDK metadata fields, never the
#     model-authored last message.
#   - Caller-supplied strings (app-start-command, app-url, setup-command) reach
#     `run:` steps only through env vars, never inlined into a shell command
#     (template-injection discipline). github-context and input expressions
#     appear directly only in `with:`/env, where they are not shell-evaluated.
#   - PERSISTED-CREDENTIAL COEXISTENCE (acceptance DECLINED — mitigated in-job
#     by privilege separation; ruling on ci-workflows#288): this lane runs
#     PR-controlled code (the app build/serve — and, on any PR that installs
#     dependencies, third-party package install scripts, so the executing actor
#     is the SUPPLY-CHAIN actor, not just the branch author) in the same job as
#     four credentials:
#       1. GITHUB_TOKEN, persisted into .git/config by actions/checkout
#          (contents:read + pull-requests:write — low marginal impact for a
#          same-repo author, who already holds write).
#       2. CLAUDE_CODE_OAUTH_TOKEN, an Anthropic org secret with visibility
#          "all repositories" (verified live) — zero GitHub access, but a leak
#          from any repo's CI forces an org-wide rotation.
#       3. The OIDC minting capability (ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN),
#          injected into every step's environment and inherited by child
#          processes at spawn.
#       4. The Claude GitHub App installation token that claude-code-action
#          mints via OIDC and holds in its step environment (granted scope not
#          determinable from open source; deliberately not asserted).
#     A same-uid neighbour could reach those through .git/config, /proc environ
#     of later steps, and — strictly more reachable than either — by appending
#     to $GITHUB_ENV/$GITHUB_PATH, which the runner ingests between steps,
#     giving execution-path control over later steps (ci-workflows#298). That
#     coexistence is NOT accepted. Instead the app is privilege-separated
#     inside the job (a separate unprivileged JOB cannot work here: jobs run on
#     separate VMs, and the agent must reach the live app over localhost):
#       * The app and the caller's setup-command run as a dedicated
#         unprivileged user from a .git-free COPY of the checkout, so the
#         persisted token never enters the app's world.
#       * The runner-owned checkout is chmod'd o-rwx before any PR-controlled
#         code runs, closing the .git/config read.
#       * sudo's env_reset gives the app a clean environment — no
#         ACTIONS_ID_TOKEN_REQUEST_*, no step env.
#       * $GITHUB_ENV/$GITHUB_PATH and /proc environs of runner-uid steps are
#         unreachable across the uid boundary, closing #298's channel.
#     Remaining accepted residuals, on their merits: PR-authored code still
#     EXECUTES (unprivileged) on the runner — kernel and local-network surface
#     only; and the agent itself still holds credentials while reading
#     untrusted content (see INDIRECT PROMPT INJECTION below). The isolation
#     requires passwordless sudo + useradd (present on GitHub-hosted Ubuntu
#     images); a runner without them fails the isolation step closed rather
#     than falling back to same-uid execution.
#   - The final `Strip persisted git credentials` step is NOT an in-job
#     mitigation for any of the above (it runs at job end, after the app and
#     the agent). It stays on its own merits: zizmor `artipacked` compliance,
#     and a genuine cross-job scrub on self-hosted runners. The strip is NOT
#     moved ahead of the app because claude-code-action's setupBranch fetches
#     origin BEFORE it configures auth (claude-code-action#1236, open; its fix
#     PR reorders rather than catches), so an earlier strip makes that fetch
#     throw and aborts verification on private consumers while a public dogfood
#     stays green and masks it. Reversal is recorded against #1236.
#   - INDIRECT PROMPT INJECTION (recorded residual; ci-workflows#299): the
#     agent reads PR-authored text (the default e2e-spec points it at
#     `gh pr diff`) and browser-drives an app RENDERING PR-authored content —
#     two untrusted channels into an agent holding the credentials above, with
#     an authenticated `gh` and a turn budget. DECIDED: the default claude-args
#     deliberately carries NO --allowedTools. This lane's function requires the
#     agent to author and run Playwright scripts (node/bash) and post its own
#     PR comment (gh), so Bash cannot be excluded — and an allowlist that
#     includes Bash bounds nothing while implying it does. The honest boundary
#     is recorded instead: advisory posture (never gating), minimal token
#     permissions, the org-level can_approve_pull_request_reviews=false
#     setting, the bounded turn budget, and the privilege separation above.
#     Consumers wanting a tighter cage pass their own claude-args; unlike the
#     review lanes there is no exclude-comments-by-actor input because this
#     lane does not ingest issue comments.
#
# PIN NOTE: PLAYWRIGHT_VERSION below is an in-workflow tool pin with no package
# manifest, so Dependabot cannot see it (it bumps only `uses:` SHAs). The
# tool-version-drift-check conventions apply: such pins are watched by advisory
# tooling and the operator absorbs each bump deliberately.

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label selected by the caller (defaults to the hosted image).
          Must provide passwordless sudo and useradd (GitHub-hosted Ubuntu
          images do) — the unprivileged-app isolation model depends on them
          and fails closed without them.
        type: string
        default: ubuntu-24.04
      app-start-command:
        description: >-
          Command that builds and serves the app under test. Composed into a
          script through an env var (never shell-inlined), so a multi-line
          block works, and run in the background AS THE UNPRIVILEGED APP USER
          from an isolated .git-free copy of the checkout with a clean
          environment (no runner step env, no GITHUB_* vars — set anything the
          app needs inside the command). Must start a server that listens at
          `app-url`.
        type: string
        required: true
      app-url:
        description: >-
          URL the served app listens on. Health-checked (polled) before
          verification begins; the agent drives the app through this URL.
        type: string
        required: true
      e2e-spec:
        description: >-
          The verification instructions — the user journeys to drive. Default
          asks the agent to discover and smoke-test the primary journeys implied
          by the PR diff.
        type: string
        default: >-
          No explicit journeys were supplied. Inspect the PR diff (use
          `gh pr diff`) to infer the primary user journeys this change affects,
          then smoke-test those journeys against the running application. Prefer
          a few high-value end-to-end paths over exhaustive coverage.
      claude-args:
        description: >-
          Passed through to the Claude CLI (model, turn budget, allowed tools,
          system prompt, MCP config all ride here). Defaults mirror claude-review
          except that the default deliberately sets NO --allowedTools — see
          INDIRECT PROMPT INJECTION in the header for that recorded decision.
        type: string
        default: --model claude-sonnet-5 --max-turns 75
      setup-command:
        description: >-
          Optional dependency-install command, run before the browser toolchain
          and the app start. Empty (default) skips it. Composed through an env
          var and run AS THE UNPRIVILEGED APP USER inside the isolated copy of
          the checkout (same execution contract as app-start-command).
        type: string
        default: ""
      timeout-minutes:
        description: >-
          Timeout for each verification agent attempt (the automatic retry
          carries the same budget). The job ceiling is fixed at 60, so keep
          the retry formula 2 x this value + retry delay + 5 under it — at
          the defaults that is 2x20 + ~2 + 5 = 47 — or a slow first attempt
          converts this advisory lane into a red job timeout.
        type: number
        default: 20
      retry-delay-seconds:
        description: >-
          Base delay before the single automatic retry attempt, in seconds. A
          0-29 second random jitter is added on top so lanes retrying against
          the same contended seat do not re-collide in lockstep.
        type: number
        default: 90
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: >-
          Claude Code OAuth token (from `claude setup-token`). Supply as a
          same-org organization secret (live visibility: all repositories) and
          pass this named secret explicitly from the caller.
        required: true

permissions:
  contents: read

# Pinned Playwright CLI version. Installed globally so the `playwright` CLI is on
# PATH and NODE_PATH resolves the same install for agent-authored Node scripts,
# keeping the library version and its browser build revision in lockstep. See the
# PIN NOTE in the header for the drift-watch convention.
env:
  PLAYWRIGHT_VERSION: 1.62.1
  # The dedicated unprivileged account that executes ALL PR-controlled code
  # (setup-command + app-start-command) — the uid boundary the header's
  # persisted-credential section rests on.
  APP_USER: app-under-test
  # Written to the account's GECOS field at creation and re-checked before any
  # reuse, so a persistent runner can repeat the lane without the account
  # being adopted from whoever else may have created that login. No ':' —
  # the field is colon-delimited in /etc/passwd.
  APP_USER_MARKER: claude-e2e-verify app sandbox
  # Root-owned staging directory for the caller's command scripts. Outside
  # both $RUNNER_TEMP (unreadable to the app uid) and the app user's own home
  # (writable by it) — see the isolation step for the full reasoning.
  APP_SCRIPT_DIR: /opt/claude-e2e-verify

jobs:
  e2e-verify:
    runs-on: ${{ inputs.runner }}
    # Fleet kill-switches: Actions variables an operator flips to stop this
    # lane (CLAUDE_E2E_VERIFY_DISABLED) or every Claude lane at once
    # (CLAUDE_LANES_DISABLED) without touching workflow files. An absent
    # variable evaluates to '' — not 'true' — so the lane is enabled by
    # default, and a repo-level variable overrides an org-level one
    # (platform-verified). A kill-switched run is a name-stable job-level
    # SKIP, harmless to this advisory lane.
    if: >-
      ${{ vars.CLAUDE_LANES_DISABLED != 'true'
          && vars.CLAUDE_E2E_VERIFY_DISABLED != 'true' }}
    # Outer safety ceiling for the whole job (browser install + build + serve +
    # health poll + agent). Two agent attempts each carry their own
    # inputs.timeout-minutes below; this ceiling must stay above the retry
    # formula 2 x attempt budget + retry delay + 5 (47 at the defaults — see
    # the timeout-minutes input) so it never undercuts the attempts' own
    # timeouts.
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    concurrency:
      # Keyed per (PR, head SHA), not per PR: a run whose head was superseded
      # while it sat in a queue is not cancelled under a shared per-PR group
      # (GitHub orders a group by when runs start WAITING on it, not by event
      # time), so an older run could otherwise enter the group after the newer
      # head's verification started and cancel it. Runs for different heads
      # therefore never share a group; the freshness guard below retires a stale
      # run instead. Same-head duplicates (reopen, reruns) still supersede each
      # other harmlessly (identical content). Non-PR events degrade to a
      # per-commit group via the fallbacks.
      group: claude-e2e-verify-${{ github.event.pull_request.number || github.sha }}-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: true
    steps:
      # Tripwire: this workflow handles secrets AND executes PR code, so it must
      # never run in a privileged-context trigger that also exposes untrusted
      # fork code. We do not whitelist `pull_request` (a consumer may legitimately
      # use workflow_dispatch); we only hard-fail the two dangerous ones.
      - name: Reject privileged triggers
        if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_run'
        env:
          # Kept out of the run: shell per the template-injection discipline
          # above — even though github.event_name is an infra-controlled enum,
          # inlining a context expression in run: is the pattern to avoid.
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "::error::claude-e2e-verify must not be called from '${EVENT_NAME}'." \
            "Call it from a 'pull_request' workflow. pull_request_target/workflow_run run" \
            "with base-repo secrets over untrusted code (token exfiltration risk)."
          exit 1

      # A stale run must retire itself, not rely on being cancelled: with the
      # per-head concurrency key above, nothing cancels a run whose head was
      # superseded while it queued. Ask the live API whether this event's head is
      # still the PR's head; when it is not, a newer run owns the verification, so
      # every runner-consuming step below skips (building/serving/driving an
      # obsolete head and commenting on it is worse than doing nothing). Fails
      # open — the `!= 'true'` gates treat a missing output as fresh, and only a
      # 40-hex commit SHA may retire the run — so an API anomaly degrades to
      # verifying a possibly-stale head, never to silence.
      # actions/github-script rather than a `gh api` run step: this reusable
      # runs on whatever runner the caller selected, and a self-hosted image
      # is not guaranteed to ship the gh CLI. github-script executes on the
      # action's own bundled Node runtime, so the live freshness check has no
      # runner-image dependency (same pattern as do-not-merge-gate.yml).
      - name: Check whether this head is still current
        id: freshness
        if: github.event.pull_request.number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            let liveHead = "";
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });
              liveHead = pr.head.sha;
            } catch (error) {
              core.warning(`Could not refetch the PR head; treating this run as fresh: ${error.message}`);
            }
            const eventHeadSha = process.env.EVENT_HEAD_SHA ?? "";
            if (/^[0-9a-f]{40}$/.test(liveHead) && liveHead !== eventHeadSha) {
              core.notice(`Skipping verification: the PR head moved from ${eventHeadSha} to ${liveHead}, so a newer run owns it.`);
              core.setOutput("superseded", "true");
            } else {
              core.setOutput("superseded", "false");
            }

      # persist-credentials stays at its default (true) until upstream
      # claude-code-action#1236 ships: the action's setupBranch runs
      # `git fetch origin <ref>` BEFORE configuring git auth, so
      # persist-credentials:false makes that fetch fail. The final strip step
      # below scrubs the persisted token to restore zizmor `artipacked`
      # compliance. Reversible when #1236 lands.
      - name: Check out
        if: steps.freshness.outputs.superseded != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none

      # The uid boundary of the header's persisted-credential section: every
      # piece of PR-controlled code below runs as this unprivileged user, from
      # a .git-free COPY of the checkout, with a clean (sudo env_reset)
      # environment. The runner-owned checkout is made untraversable to that
      # uid so the token actions/checkout persisted into .git/config — and
      # anything else in the workspace — is out of the app's reach, and the
      # runner-uid step machinery ($GITHUB_ENV/$GITHUB_PATH, /proc environs)
      # is unreachable across the uid boundary. Fails CLOSED: a runner without
      # passwordless sudo/useradd must not degrade to same-uid execution.
      - name: Isolate the app from the job's credentials
        if: steps.freshness.outputs.superseded != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sudo >/dev/null 2>&1 || ! sudo -n true 2>/dev/null; then
            echo "::error::Passwordless sudo is required: the app-isolation model runs" \
              "PR-controlled code as a dedicated unprivileged user and must not fall" \
              "back to same-uid execution. GitHub-hosted images provide this; select" \
              "a runner that does."
            exit 1
          fi
          # A persistent runner keeps the account from earlier runs, so account
          # provisioning has to be repeatable. Reuse is gated on this lane's own
          # marker: an `app-under-test` this lane did not create belongs to
          # someone else, and adopting it would run PR-controlled code under
          # whatever that account already carries — group memberships, sudo
          # rules, existing files. Fail closed there, matching this step's
          # refusal to degrade to same-uid execution.
          if id -- "$APP_USER" >/dev/null 2>&1; then
            if [[ "$(getent passwd "$APP_USER" | cut -d: -f5)" != "$APP_USER_MARKER" ]]; then
              echo "::error::User '$APP_USER' exists but was not provisioned by this" \
                "lane. Refusing to execute PR-controlled code under an account whose" \
                "privileges and contents this lane does not control."
              exit 1
            fi
            # Reset to a clean slate: no survivor process from an earlier run
            # holding the port, no leftover tree.
            sudo pkill -KILL -u "$APP_USER" || true
            app_home="$(getent passwd "$APP_USER" | cut -d: -f6)"
            sudo rm -rf "$app_home/app"
          else
            sudo useradd --create-home --shell /bin/bash \
              --comment "$APP_USER_MARKER" "$APP_USER"
            app_home="$(getent passwd "$APP_USER" | cut -d: -f6)"
          fi
          sudo mkdir -p "$app_home/app"
          sudo cp -a "$GITHUB_WORKSPACE/." "$app_home/app/"
          sudo rm -rf "$app_home/app/.git"
          sudo chown -R "$APP_USER:$APP_USER" "$app_home/app"
          chmod o-rwx "$GITHUB_WORKSPACE"
          # The caller's command scripts are staged here instead of under
          # $RUNNER_TEMP, which the app uid cannot READ — the log fd is opened
          # by the runner and inherited precisely because runner-owned paths
          # are out of that uid's reach, and reads are barred just as writes
          # are. Root-owned, and deliberately not under $app_home: a script
          # placed in the app user's own home could be swapped by that user
          # before it runs, because the directory is app-owned. Recreated fresh
          # so a reused account never inherits an earlier run's script.
          sudo rm -rf "$APP_SCRIPT_DIR"
          sudo install -d -m 0755 -o root -g root "$APP_SCRIPT_DIR"

      - name: Install application dependencies
        if: inputs.setup-command != '' && steps.freshness.outputs.superseded != 'true'
        shell: bash
        env:
          # Caller string via env (never inlined) — template-injection
          # discipline. printf writes it into the script verbatim; nothing is
          # shell-evaluated at the runner's uid.
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: |
          set -euo pipefail
          setup_script="$RUNNER_TEMP/app-setup-command.sh"
          # Quoted heredoc: $HOME must expand in the app user's shell, not here.
          cat > "$setup_script" <<'PRELUDE'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$HOME/app"
          PRELUDE
          printf '%s\n' "$SETUP_COMMAND" >> "$setup_script"
          sudo install -m 0555 -o root -g root "$setup_script" "$APP_SCRIPT_DIR/setup.sh"
          sudo -u "$APP_USER" -H bash "$APP_SCRIPT_DIR/setup.sh"

      - name: Install pinned Playwright browsers
        if: steps.freshness.outputs.superseded != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "playwright@${PLAYWRIGHT_VERSION}"
          playwright install --with-deps chromium
          # Let agent-authored Node scripts `require('playwright')` against the
          # global install, so the library and its installed browser revision
          # never diverge from a different repo-local copy.
          echo "NODE_PATH=$(npm root --global)" >> "$GITHUB_ENV"

      - name: Start the application under test
        if: steps.freshness.outputs.superseded != 'true'
        shell: bash
        env:
          # Caller string via env (never inlined) — template-injection
          # discipline; composed into the script verbatim, like setup-command.
          APP_START_COMMAND: ${{ inputs.app-start-command }}
        run: |
          set -euo pipefail
          app_log="$RUNNER_TEMP/app-under-test.log"
          start_script="$RUNNER_TEMP/app-start-command.sh"
          # Quoted heredoc: $HOME must expand in the app user's shell, not here.
          cat > "$start_script" <<'PRELUDE'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$HOME/app"
          PRELUDE
          printf '%s\n' "$APP_START_COMMAND" >> "$start_script"
          sudo install -m 0555 -o root -g root "$start_script" "$APP_SCRIPT_DIR/start.sh"
          # Backgrounded as the unprivileged user. The log file is DELIBERATELY
          # opened by this (runner-uid) subshell — not by sudo — and the open fd
          # is inherited by the app, so the runner can tail the log later
          # without the app ever holding write access to runner-owned paths.
          # Teardown signals the whole uid, so no PID/session bookkeeping is
          # needed here.
          (
            exec > "$app_log" 2>&1
            exec sudo -u "$APP_USER" -H bash "$APP_SCRIPT_DIR/start.sh"
          ) &
          echo "APP_LOG=$app_log" >> "$GITHUB_ENV"

      - name: Wait for the application to become healthy
        if: steps.freshness.outputs.superseded != 'true'
        shell: bash
        env:
          # Caller string via env (never inlined) — template-injection discipline.
          APP_URL: ${{ inputs.app-url }}
        run: |
          set -uo pipefail
          # Bounded to ~5 minutes: app-start-command builds *then* serves, so the
          # server may not bind until its build finishes. Well under the job ceiling.
          for _ in $(seq 1 150); do
            if curl --fail --silent --show-error --output /dev/null --max-time 5 "$APP_URL"; then
              echo "Application is responding at the configured URL."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The application under test did not respond at $APP_URL within the health-check window."
          echo "----- application log (last 200 lines) -----"
          tail -n 200 "${APP_LOG:-/dev/null}" || true
          exit 1

      # The comment delivery path needs a PR to comment on. On workflow_dispatch
      # (or any event without a pull_request) there is none, so `gh pr comment`
      # would run with an empty number. Compose the reporting instruction to
      # match the context: post a PR comment when a PR number exists, otherwise
      # annotate the run's step summary. A shell step (not an inline expression
      # ternary) keeps the branch readable, mirroring claude-review's discipline.
      - name: Compose the reporting instruction
        id: report-instruction
        if: steps.freshness.outputs.superseded != 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          {
            echo "REPORT_INSTRUCTION<<REPORT_INSTRUCTION_EOF"
            if [ -n "$PR_NUMBER" ]; then
              printf '%s\n' \
                "Post your findings as a single PR comment — this is the only" \
                "delivery path, so you must post it yourself:" \
                "" \
                "  gh pr comment $PR_NUMBER --body \"<summary>\"" \
                "" \
                "The \`gh\` CLI is already authenticated in this environment."
            else
              printf '%s\n' \
                "This run has no associated pull request (it was triggered" \
                "manually), so there is nowhere to post a PR comment. Instead," \
                "append your findings as markdown to the GitHub step summary file" \
                "referenced by the GITHUB_STEP_SUMMARY environment variable."
            fi
            echo "REPORT_INSTRUCTION_EOF"
          } >> "$GITHUB_ENV"

      - name: Claude end-to-end verification
        id: claude-e2e
        if: steps.freshness.outputs.superseded != 'true'
        # The action exits non-zero only on infrastructure errors; verification
        # findings go to the PR comment, not the exit code. continue-on-error
        # keeps an OIDC/usage-limit/SDK blip (or a fork's missing token) from
        # showing as a red check — this lane is advisory.
        continue-on-error: true
        timeout-minutes: ${{ inputs.timeout-minutes }}
        uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7 # v1.0.206
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: ${{ inputs.claude-args }}
          # input/github-context expressions appear directly here (a `with:`
          # value is an action input, not a shell context), mirroring how
          # claude-review passes its consumer prompt body.
          prompt: |
            This is an automated, ADVISORY end-to-end verification pass for a
            pull request. Your findings are informational — never describe them
            as merge-blocking.

            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            The application under test has already been built and started by this
            workflow and is responding at:

              ${{ inputs.app-url }}

            A Playwright CLI (version ${{ env.PLAYWRIGHT_VERSION }}) with Chromium
            is installed globally and on PATH, and NODE_PATH points at the global
            module root so Node scripts you author can `require('playwright')`
            against that same pinned install. Drive the running application with
            it — author and run Playwright scripts (via `node`) or use the
            `playwright` CLI directly. Do not install a different Playwright
            version; its browsers would not be provisioned.

            Verification journeys to drive:

            ${{ inputs.e2e-spec }}

            Exercise each journey against the URL above, then report your
            findings as instructed here:

            ${{ env.REPORT_INSTRUCTION }}

            The findings must cover: the journeys you confirmed as passing, each
            failure with concrete reproduction steps, and a severity for each
            failure. Use advisory, non-merge-blocking wording throughout.

      # ONE bounded, gated retry: this lane is advisory, but a zero-turn blip
      # (usage-limit spike, OIDC failure, SDK instant-fail) otherwise silently
      # costs the PR its verification until someone notices and re-runs — and
      # the app under test is already built, serving, and healthy, so the
      # second attempt is cheap relative to the first.
      #
      # The gate retries ONLY when the execution file shows ZERO assistant
      # turns of real work and the failure is not auth-class. Zero real turns
      # is the artifact-safety condition: the agent posts nothing before its
      # first assistant turn, so attempt 2 cannot duplicate a findings comment
      # already on the PR. The auth exclusion skips the one class no retry
      # can clear — the credential needs an operator. A mid-verification
      # failure (assistant turns already spent) is deliberately NOT retried.
      # This lane does not set track_progress, so unlike the review lanes
      # there is no orphan tracking comment to clean up between attempts —
      # but it does post a findings comment, so a hard kill that loses the
      # execution file leaves the same duplicate risk the review lanes carry,
      # and the evidence guard is identical here. "Real work" is load-bearing
      # and not the same as "an assistant entry exists" — see the gate script
      # for why an API error manufactures an assistant turn that posted
      # nothing.
      #
      # The auth predicate covers classify.cjs's auth class in the
      # claude-lane-outcome composite — the authoritative sibling for the
      # status-to-class mapping. The composite is fetched at its pinned SHA and
      # the caller's checkout does not contain this repo's scripts, so
      # classify.cjs cannot be require()d at runtime and the predicate is
      # inlined here instead; keep the three auth statuses and three auth error
      # types identical in both. The gate is deliberately a SUPERSET of its
      # sibling on inputs, not on classes: classify.cjs reads only the last
      # entry because its job is to name the class of a completed run, while the
      # gate must also rule out an auth failure recorded on a synthetic turn
      # when no result entry was written. Do not widen classify.cjs to match —
      # that changes the fail-closed mapping.
      - name: Decide whether to retry the verification
        id: retry-gate
        if: >-
          steps.freshness.outputs.superseded != 'true' &&
          steps.claude-e2e.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXECUTION_FILE: ${{ steps.claude-e2e.outputs.execution_file }}
        with:
          script: |
            const fs = require("node:fs");
            core.setOutput("retry", "false");
            let entries;
            try {
              const parsed = JSON.parse(
                fs.readFileSync(process.env.EXECUTION_FILE, "utf8"),
              );
              if (Array.isArray(parsed)) entries = parsed;
            } catch {
              // Falls through to the evidence guard below.
            }
            // Retry only on EVIDENCE of zero real turns. A missing or
            // unparsable execution file proves nothing: a hard kill (step
            // timeout, OOM) can lose the file after turns were already spent,
            // and retrying then risks exactly the duplicate comment this gate
            // exists to prevent.
            if (entries === undefined) {
              core.notice(
                "Not retrying: no parseable execution file, so zero assistant turns cannot be proven.",
              );
              return;
            }
            // An API error does not end the stream quietly. Claude Code emits a
            // SYNTHETIC assistant turn carrying the error as ordinary text, so a
            // 429 that killed the run before any real work still records a
            // `type: "assistant"` entry. Counting those turns is what made this
            // gate unreachable for the dominant failure class. The
            // artifact-safety condition is about work that could have POSTED
            // something, so synthetic error turns do not count as work.
            //
            // `error` is carried by the SDK's published message union;
            // `isApiErrorMessage`, `apiErrorStatus`, and the `<synthetic>` model
            // sentinel are observed wire fields the types do not declare.
            // The three markers are OR'd, so ALL THREE would have to be
            // renamed before a synthetic turn counted as real work again —
            // renaming one is absorbed by the other two. Both drift shapes are
            // safe, for different reasons: under partial drift the turn stays
            // discounted, but `realTurns` is still 0, so nothing was posted and
            // nothing can be duplicated; under total drift the turn counts as
            // real and the gate declines outright. Neither shape produces
            // duplicate comments.
            const isSyntheticErrorTurn = (entry) =>
              typeof entry?.error === "string" ||
              entry?.isApiErrorMessage === true ||
              entry?.message?.model === "<synthetic>";
            const assistantTurns = entries.filter(
              (entry) => entry?.type === "assistant",
            );
            const realTurns = assistantTurns.filter(
              (entry) => !isSyntheticErrorTurn(entry),
            ).length;
            if (realTurns > 0) {
              core.notice(
                `Not retrying: attempt 1 recorded ${realTurns} assistant turn(s) of real work, ` +
                  "so it may already have posted a comment a second attempt would duplicate.",
              );
              return;
            }
            // Auth is read from the result entry AND from every synthetic error
            // turn. The result entry is the primary source, but the action also
            // writes the file from a path that produces NO result entry, and
            // discounting synthetic turns above would otherwise let an
            // auth-class failure through that hole — the one class this gate
            // must never retry.
            const last = entries.length > 0 ? entries[entries.length - 1] : undefined;
            const statuses = [
              last?.api_error_status,
              ...assistantTurns.map((entry) => entry?.apiErrorStatus),
            ].filter((status) => typeof status === "number");
            const errorText = (Array.isArray(last?.errors) ? last.errors : [])
              .map((error) => (typeof error === "string" ? error : JSON.stringify(error)))
              .join("\n");
            // A retry needs a PROVEN non-auth class, so an unreadable class is a
            // refusal rather than a default. This is not belt-and-braces: when
            // no result entry was written, `apiErrorStatus` on the synthetic
            // turn is the ONLY auth signal there is, and it is also one of the
            // markers that made the turn synthetic. A payload keeping `error`
            // or the `<synthetic>` sentinel but dropping the status would
            // otherwise discount the turn AND blind the auth check in one move,
            // and retry a credential death. An empty array lands here too: it
            // proves zero turns but nothing about the class, and the gate
            // requires both.
            if (statuses.length === 0 && !Array.isArray(last?.errors)) {
              core.notice(
                "Not retrying: no failure class could be read, so a non-auth class cannot be proven.",
              );
              return;
            }
            const auth =
              statuses.some(
                (status) => status === 401 || status === 402 || status === 403,
              ) ||
              errorText.includes('"type":"authentication_error"') ||
              errorText.includes('"type":"billing_error"') ||
              errorText.includes('"type":"permission_error"');
            if (auth) {
              core.notice(
                "Not retrying: auth-class failure — the credential needs an operator, and a retry cannot clear it.",
              );
              return;
            }
            core.setOutput("retry", "true");

      # Jittered so parallel lanes retrying against the same contended seat do
      # not re-collide in lockstep; the base delay rides the
      # retry-delay-seconds input.
      - name: Back off before the verification retry
        if: steps.retry-gate.outputs.retry == 'true'
        shell: bash
        env:
          RETRY_DELAY_SECONDS: ${{ inputs.retry-delay-seconds }}
        run: sleep "$((RETRY_DELAY_SECONDS + RANDOM % 30))"

      - name: Claude end-to-end verification (retry)
        id: claude-e2e-retry
        if: steps.retry-gate.outputs.retry == 'true'
        # Same rationale as the first attempt: an infra failure stays off the
        # check, and the same attempt budget keeps the retry inside the job
        # ceiling.
        continue-on-error: true
        timeout-minutes: ${{ inputs.timeout-minutes }}
        uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7 # v1.0.206
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: ${{ inputs.claude-args }}
          # input/github-context expressions appear directly here (a `with:`
          # value is an action input, not a shell context), mirroring how
          # claude-review passes its consumer prompt body.
          prompt: |
            This is an automated, ADVISORY end-to-end verification pass for a
            pull request. Your findings are informational — never describe them
            as merge-blocking.

            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            The application under test has already been built and started by this
            workflow and is responding at:

              ${{ inputs.app-url }}

            A Playwright CLI (version ${{ env.PLAYWRIGHT_VERSION }}) with Chromium
            is installed globally and on PATH, and NODE_PATH points at the global
            module root so Node scripts you author can `require('playwright')`
            against that same pinned install. Drive the running application with
            it — author and run Playwright scripts (via `node`) or use the
            `playwright` CLI directly. Do not install a different Playwright
            version; its browsers would not be provisioned.

            Verification journeys to drive:

            ${{ inputs.e2e-spec }}

            Exercise each journey against the URL above, then report your
            findings as instructed here:

            ${{ env.REPORT_INSTRUCTION }}

            The findings must cover: the journeys you confirmed as passing, each
            failure with concrete reproduction steps, and a severity for each
            failure. Use advisory, non-merge-blocking wording throughout.

      # Collapse the two attempts into the one pair of facts the outcome step
      # needs. Reading the retry's fields directly would be wrong: when it is
      # skipped its outcome is the literal `skipped` and its execution_file is
      # empty, so the first attempt's result has to be the fallback.
      - name: Resolve the effective verification attempt
        id: attempt
        # !cancelled(), not always(): cancellation is this lane's retirement
        # mechanism (cancel-in-progress on same-head duplicates), and a
        # retired run must not go on to report an outcome. The app-teardown
        # and credential-strip steps below keep always() — cleanup must run
        # even on cancellation.
        if: "!cancelled() && steps.freshness.outputs.superseded != 'true'"
        shell: bash
        env:
          FIRST_OUTCOME: ${{ steps.claude-e2e.outcome }}
          FIRST_FILE: ${{ steps.claude-e2e.outputs.execution_file }}
          RETRY_OUTCOME: ${{ steps.claude-e2e-retry.outcome }}
          RETRY_FILE: ${{ steps.claude-e2e-retry.outputs.execution_file }}
        run: |
          if [ "$RETRY_OUTCOME" = "skipped" ] || [ -z "$RETRY_OUTCOME" ]; then
            outcome="$FIRST_OUTCOME"
            execution_file="$FIRST_FILE"
          else
            echo "First attempt failed; reporting the retry's result instead."
            outcome="$RETRY_OUTCOME"
            execution_file="$RETRY_FILE"
          fi
          {
            echo "outcome=$outcome"
            echo "execution_file=$execution_file"
          } >>"$GITHUB_OUTPUT"

      # Advisory: annotate an infrastructure failure without failing the job
      # (the agent attempts are continue-on-error and this step exits 0). A
      # public repo, so the raw SDKResultMessage is NOT safe to publish — its
      # `result` field is model-authored free text. Project only the safe,
      # structured metadata fields, mirroring claude-review's failure
      # reporting. Consumes the resolved attempt, not the first one, so a
      # successful retry reports success.
      - name: Report verification outcome
        if: "!cancelled() && steps.freshness.outputs.superseded != 'true'"
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.attempt.outputs.outcome }}
          EXECUTION_FILE: ${{ steps.attempt.outputs.execution_file }}
        run: |
          set -uo pipefail
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            echo "End-to-end verification completed. Findings (if any) are in the PR comments."
            exit 0
          fi
          detail="(no execution file was produced)"
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            detail=$(jq -c '
              (.[-1] // empty) as $last
              | if $last == null then empty
                else $last | {subtype, is_error, num_turns, duration_ms, total_cost_usd}
                end
            ' "$EXECUTION_FILE" 2>/dev/null || true)
            [ -n "$detail" ] || detail="(execution file present but unparsable)"
          fi
          echo "::error::Claude end-to-end verification exited with: $VERIFY_OUTCOME" \
            "(infrastructure error, not a verification verdict — e.g. usage limit," \
            "OIDC failure, SDK crash, is_error result, or max-turns exhaustion)." \
            "Last SDK result: $detail"

      - name: Stop the application under test
        if: always() && steps.freshness.outputs.superseded != 'true'
        shell: bash
        run: |
          set -uo pipefail
          # Everything PR-controlled ran as the unprivileged user, so
          # signalling that uid tears down the entire served process tree.
          # Guarded: on a run that failed before the isolation step the user
          # does not exist.
          if id -- "$APP_USER" >/dev/null 2>&1; then
            sudo pkill -TERM -u "$APP_USER" || true
          fi

      # zizmor `artipacked` mitigation — scrub the GITHUB_TOKEN that checkout
      # persisted into .git/config (forced on by #1236, above). Drop this once
      # the checkout step can use persist-credentials:false again.
      - name: Strip persisted git credentials
        if: always()
        run: git config --unset-all http.https://github.com/.extraheader || true
