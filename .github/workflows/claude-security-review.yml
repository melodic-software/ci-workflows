name: claude-security-review

# Reusable workflow: dedicated LLM security review with
# anthropics/claude-code-action, running the org review plugin's security
# command. A sibling of claude-review.yml with the same secrets interface and
# safe-handling model. Findings are advisory: they never fail the job. It runs
# on every non-draft pull request.
#
# Canonical caller (the caller owns triggers, concurrency and the permission
# grant; a called workflow can only downgrade the caller's grant):
#
#     on:
#       pull_request:
#         types: [opened, synchronize, ready_for_review, reopened]
#     concurrency:
#       group: claude-security-review-${{ github.event.pull_request.number }}
#       cancel-in-progress: true
#     jobs:
#       security-review:
#         permissions:
#           contents: read         # checkout + read the diff
#           pull-requests: write   # post the review + tracking comment
#           id-token: write        # OIDC for the Claude GitHub App token
#         uses: melodic-software/ci-workflows/.github/workflows/claude-security-review.yml@<sha>
#         secrets:
#           CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# SECURITY MODEL:
#   - Call it from `pull_request` only. pull_request_target and workflow_run
#     run with base-repo secrets over untrusted code; the `Reject privileged
#     triggers` step hard-fails both.
#   - Fork PRs get no secrets and a read-only token, so the job skips them. A
#     human must review fork changes to security-sensitive surfaces.
#   - Bot actors are skipped: the action rejects any bot it was not told to
#     allow, and this lane allows none.
#   - Only the one named secret is accepted; the job token is least privilege.
#   - display_report stays off (public-repo log-leak risk).
#   - Dependabot's comments are withheld from the model's context
#     (exclude-comments-by-actor), as prompt-injection hygiene.
#   - The checkout must persist credentials until claude-code-action#1236
#     ships; the last step strips them.
#
# The review job stays green on an infrastructure failure. The
# `claude-security-review-status` job always runs after it and goes red,
# naming the failure class, when the review failed. Never make that check
# required.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label selected by the caller's governed selector.
        type: string
        default: ubuntu-24.04
      plugins:
        description: >-
          Newline-separated Claude Code plugins passed through to the action's
          `plugins` input.
        type: string
        default: |
          review@melodic-software
      plugin-marketplaces:
        description: >-
          Newline-separated marketplace Git URLs passed through to
          `plugin_marketplaces`.
        type: string
        default: |
          https://github.com/melodic-software/claude-code-plugins.git
      plugin-command:
        description: Slash command the review runs.
        type: string
        default: /review:security-review
      claude-args:
        description: >-
          Passed through to the Claude CLI (model, turn budget, allowed tools).
          A caller's value replaces this default. The inline-comment tool grant
          is appended after it, so a caller cannot drop it.
        type: string
        default: >-
          --model claude-sonnet-5 --max-turns 75
          --allowedTools "Bash(gh pr diff:*)"
      exclude-comments-by-actor:
        description: >-
          Comma-separated actors whose comments are withheld from Claude's
          context (prompt-injection hygiene). Both Dependabot spellings are
          listed because the action matches the bare login for some comment
          kinds (upstream #1514).
        type: string
        default: dependabot,dependabot[bot]
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Claude Code OAuth token (from `claude setup-token`).
        required: true

permissions:
  contents: read

jobs:
  security-review:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    # Skips bot actors, draft PRs and fork PRs. The draft and fork tests are
    # scoped to pull_request so a privileged trigger still reaches the tripwire.
    if: >-
      ${{ !endsWith(github.actor, '[bot]')
          && (github.event_name != 'pull_request'
              || github.event.pull_request.draft == false)
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    outputs:
      review-failed: ${{ steps.review-outcome.outputs.review-failed }}
      failure-class: ${{ steps.review-outcome.outputs.failure-class }}
    steps:
      - name: Reject privileged triggers
        if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_run'
        run: |
          echo "::error::claude-security-review must not be called from '${{ github.event_name }}'." \
            "Call it from a 'pull_request' workflow. pull_request_target/workflow_run run" \
            "with base-repo secrets over untrusted code (token exfiltration risk)."
          exit 1

      # persist-credentials stays at its default until claude-code-action#1236
      # ships (the action fetches before configuring git auth). The last step
      # strips the persisted token.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: blob:none

      # Appends the inline-comment grant after the caller's args, so replacing
      # the claude-args default cannot drop it. claude-args may be multiline,
      # hence the heredoc output form.
      - name: Compose Claude CLI arguments
        id: compose-args
        env:
          BASE_ARGS: ${{ inputs.claude-args }}
        run: |
          args="$BASE_ARGS --allowedTools mcp__github_inline_comment__create_inline_comment"
          delimiter="gha_${RANDOM}${RANDOM}_EOF"
          {
            echo "args<<$delimiter"
            printf '%s\n' "$args"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # continue-on-error keeps an infrastructure failure off this job so the
      # outcome step can classify it; the status job carries the red.
      - name: Claude security review
        id: claude-review
        continue-on-error: true
        timeout-minutes: 18
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          display_report: false
          exclude_comments_by_actor: ${{ inputs.exclude-comments-by-actor }}
          plugins: ${{ inputs.plugins }}
          plugin_marketplaces: ${{ inputs.plugin-marketplaces }}
          claude_args: ${{ steps.compose-args.outputs.args }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Invoke ${{ inputs.plugin-command }} now and follow its instructions exactly for this pull request.
            The REPO / PR NUMBER / HEAD SHA header above is authoritative context for the command.
            Do not substitute a different review procedure.

            When referencing specific code locations in findings, link to the
            commit blob (not the PR) using a permalink with line numbers:
            https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}/<path>#L<line>

      - name: Report review outcome
        id: review-outcome
        uses: melodic-software/ci-workflows/.github/actions/claude-lane-outcome@ac062650c46005edb4787aff378347746bf63804 # v0.27.0
        with:
          outcome: ${{ steps.claude-review.outcome }}
          execution-file: ${{ steps.claude-review.outputs.execution_file }}
          lane: Claude security review

      # zizmor `artipacked` mitigation: scrub the token checkout persisted.
      - name: Strip persisted git credentials
        if: always()
        run: git config --unset-all http.https://github.com/.extraheader || true

  # Reads the review job's outputs, never its log, and goes red when the review
  # failed. Empty outputs (the review job skipped) report green. The outputs
  # reach the script through env, never inline expressions.
  claude-security-review-status:
    needs: security-review
    if: always()
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report the review outcome
        env:
          LANE: claude-security-review
          REVIEW_FAILED: ${{ needs.security-review.outputs.review-failed }}
          FAILURE_CLASS: ${{ needs.security-review.outputs.failure-class }}
        run: |
          if [ "$REVIEW_FAILED" != "true" ]; then
            if [ -z "$REVIEW_FAILED" ]; then
              echo "$LANE: no verdict (the review did not run)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$LANE: no failure reported." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          case "$FAILURE_CLASS" in
            auth) why="the Claude credential was rejected (401/402/403); check the OAuth token and the plan's usage" ;;
            rate-limit) why="the usage limit was hit (429); re-run once it resets" ;;
            overloaded) why="the Claude service was overloaded (5xx); re-run later" ;;
            *) why="an unclassified failure; read the review job log" ;;
          esac
          {
            echo "### $LANE failed: \`${FAILURE_CLASS:-unknown}\`"
            echo
            echo "$why."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=$LANE failed::failure-class=${FAILURE_CLASS:-unknown}: $why"
          exit 1
