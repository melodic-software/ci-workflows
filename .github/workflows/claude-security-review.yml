name: claude-security-review

# Reusable workflow — dedicated LLM security-review pass with
# anthropics/claude-code-action. A sibling of claude-review.yml: same secrets
# interface and same safe-handling model, but a security-only prompt and an
# ADVISORY VERDICT. A whole-job concern (own job permissions + secrets
# interface), so a reusable workflow, not a composite action.
#
# POSTURE — advisory VERDICT, FAIL-CLOSED EXECUTION check:
#   This lane POSTS a security review as PR comments. The VERDICT (what the
#   review says) stays ADVISORY: findings never fail the job, and the intended
#   promotion path for the verdict itself is to flip to blocking on CRITICAL
#   findings once the lane's precision is proven over a sustained window — an
#   earned promotion (trust-before-scale), mirroring the guardrail-matrix
#   verification-promotion discipline.
#
#   EXECUTION is different, and it FAILS CLOSED. A consumer's ruleset may make
#   the `security-review` check REQUIRED, so the check's whole claim is that a
#   security pass RAN — or was judged not-applicable. When the PR IS in scope
#   and the review could not run at all (usage limit, dead credential, SDK
#   crash), the check therefore reports FAILURE: it cannot certify an execution
#   that did not happen. `success`, `neutral` and `skipped` all satisfy a
#   required check, so failure is the only conclusion that does not silently
#   authorize a merge on absent evidence.
#
#   CARVE-OUT — the claim holds for `pull_request` runs, and ONLY those.
#   Fork PRs and non-PR events (`merge_group`, `workflow_dispatch`, `schedule`)
#   cannot run the review at all — no secrets, or an event the action rejects —
#   so they keep the pass-through and their green is NOT execution evidence.
#   See the fork bullet below and the `Fail closed on an in-scope non-run`
#   step.
#
#   The merge-queue half of that carve-out is TRACKED, not accepted forever:
#   melodic-software/ci-workflows#272, blocked on claude-code-action supporting
#   `merge_group` (it throws `Unsupported event type` at the pinned SHA), with
#   the revisit trigger recorded there — any org repo adopting a merge queue on
#   a branch this check protects. Latent today: no org repo runs one, and the
#   only consumer requiring this check triggers on `pull_request` only. It
#   matters when it fires, because a merge queue IS the merge gate.
#
#   NARROWING AMENDMENT (#266, adjudicated; amends the #228 non-goal): infra
#   pass-through is ratified for ADVISORY lanes — claude-review.yml still passes
#   through, because a red check there gates nothing and an infra failure is not
#   a code-quality signal. That rationale reasons from merge-irrelevance and so
#   does not transfer here, where the check is the sole required security
#   context. Required execution-evidence contexts fail closed. Measured before
#   the change: 55 of 129 in-scope merges (42.6%) carried a green required check
#   with no security pass at the merge head.
#
#   Availability is bought back by break-glass, not by retrying: a sustained
#   outage is meant to be overridden by an explicit, logged, attributable
#   break-glass on the consumer's ruleset — never by a check that lies. The
#   bounded in-job retry below is a best-effort second chance at the sporadic
#   class, NOT a second availability mechanism, and this line previously
#   claimed otherwise. It has never been observed to absorb anything: across
#   251 lane attempts org-wide on 2026-07-29 the retry step executed zero
#   times, because the gate was unreachable for the dominant failure class in
#   the only lane carrying it and no consumer pin carried a retry at all. That
#   is a statement about reachability, not about efficacy — the mechanism has
#   not been measured either way. See the gate's own header for the constant.
#
# ALWAYS-REPORT SHAPE — the caller does NOT path-filter at workflow level:
#   A security pass on every PR is noise in a doc-heavy repo where most PRs are
#   prose, so this lane scopes itself to security-sensitive surfaces. A consumer
#   whose ruleset REQUIRES the execution check must NOT express that scope with
#   the caller's `on.pull_request.paths`: a workflow-level path miss leaves the
#   required check Pending forever and wedges every prose PR. Instead the caller
#   triggers on ALL pull_request events and passes the pattern list — inline via
#   `paths`, or by pointing `paths-file` at a repo-owned pattern file; the
#   `changes` job evaluates it with a job-level conditional, so a not-applicable
#   PR yields a name-stable SKIPPED `security-review` job — which a ruleset reads
#   as success, satisfying the required check. The check context is
#   `<caller-job-id> / security-review`. Both inputs empty (the default) means
#   "every call is relevant", so a consumer that passes nothing is unaffected.
#
# CONSUMER CONTRACT (the caller owns these — they are NOT set here):
#   The triggers and the GITHUB_TOKEN permission grant live in each consumer's
#   thin caller, because a reusable workflow's `on:` is `workflow_call` and the
#   caller's own `on:` decides which events invoke it; and because a called
#   workflow can only DOWNGRADE the caller's permission grant, never elevate it.
#   Canonical caller — trigger on all PR events (NO workflow-level `paths:`) and
#   scope the review with the conventional per-repo paths file:
#
#     on:
#       pull_request:
#         types: [opened, synchronize, ready_for_review, reopened]
#       # NO `merge_group:` — deliberately not recommended, see #272. The pinned
#       # action cannot serve that event (it throws `Unsupported event type`), so
#       # adding the trigger buys a check that reports GREEN WITHOUT REVIEWING.
#       # On a merge queue — which IS the merge gate — that is worse than not
#       # reporting: it looks like execution evidence and is not. A consumer who
#       # enables a merge queue anyway should read #272 first; without the
#       # trigger the check simply never reports for queued PRs.
#     # cancel-in-progress: false is DELIBERATE, not an omission: a cancelled
#     # run of a REQUIRED check is not a skip and does not read success, so
#     # cancelling an in-flight review can wedge the merge behind a void check.
#     # It is the live value on the one consumer whose ruleset requires this
#     # check (claude-code-plugins). And NO job-level queue group initially: a
#     # queue is added only if overflow smoke-testing proves a cancelled
#     # overflow arrival cannot wedge the required check (a full queue CANCELS
#     # new arrivals). These are per-LANE values, deliberately different from
#     # the code-review caller's (which cancels superseded runs and queues
#     # repo-wide) — do not normalize the two.
#     concurrency:
#       group: claude-security-review-${{ github.event.pull_request.number || github.run_id }}
#       cancel-in-progress: false
#     jobs:
#       security-review:
#         permissions:
#           contents: read         # checkout + read the diff
#           pull-requests: write   # post the security review + tracking comment
#           id-token: write        # OIDC — mints the Claude GitHub App token
#                                  # (required even with an OAuth/API-key credential)
#         uses: melodic-software/ci-workflows/.github/workflows/claude-security-review.yml@<sha>
#         with:
#           # Each repo OWNS its pattern file at this conventional path:
#           # root-anchored gitignore patterns, one per line (`#` comments and
#           # blank lines ignored; `!`, `?` and `+` are REJECTED — see the
#           # `paths` input's MATCHER note) — the repo's security-sensitive
#           # surfaces
#           # (workflows, scripts, auth/token-touching source, network-call
#           # sites). Ordinary `*` / `**` globs mean what an Actions `paths:`
#           # author expects, which is every pattern worth writing here. It is
#           # read from the PR's BASE branch, never the head, and an absent
#           # file FAILS OPEN: every PR is reviewed until the repo commits one.
#           # The inline `paths` input still exists and, when non-empty, wins
#           # over the file.
#           paths-file: .github/claude-security-paths
#         secrets:
#           CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# SECURITY MODEL (see CLAUDE.md for the full rationale — identical to
# claude-review's, because both run an AI agent with an org credential on a
# public repo):
#   - Intended for `pull_request` (NEVER pull_request_target / workflow_run with
#     secrets — privileged context + untrusted fork code = token exfiltration).
#     The `reject-privileged-triggers` step is a tripwire that hard-fails those
#     two events; every other event is allowed (the consumer keeps flexibility).
#   - Fork PRs receive no secrets and a read-only token by design, so they are
#     simply not reviewed — that is correct, not a gap to "fix". The job SKIPS
#     them at job level rather than letting a doomed, secretless action run: with
#     the fail-closed mapping above, running would turn every fork PR red for a
#     cause no push can fix. A skipped job is name-stable and a ruleset reads it
#     as success, exactly as for an out-of-scope PR — so a required check does
#     NOT prove a fork PR was reviewed, and a human must review fork changes to
#     security-sensitive surfaces before merge.
#   - The action gates triggering on the actor's write access; bots are blocked
#     unless named in `allowed_bots`.
#   - `display_report` / `show_full_output` stay off (public-repo log-leak risk).
#
# KILL-SWITCH SCOPE NOTE: REVIEW.md scopes security findings out of the
#   code-review lane wherever THIS workflow FILE exists — static prose that
#   cannot see Actions variables. Disabling this lane via
#   CLAUDE_SECURITY_REVIEW_DISABLED while the file exists therefore opens a
#   window in which NO lane reports security findings — the code-review lane
#   does not pick the scope back up; re-enabling this lane closes the window.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label selected by the caller's governed selector.
        type: string
        default: ubuntu-24.04
      paths:
        description: >-
          Newline-separated path patterns naming this consumer's
          security-sensitive surfaces (use a `|` literal block to preserve
          newlines). When a PR changes at least one matching file the review
          runs; when it matches none, the `security-review` job skips — a
          name-stable check verdict a required-check ruleset reads as success.
          Blank lines and `#` comments are ignored. Non-empty, this input wins
          over `paths-file`. Empty (the default) with an empty `paths-file`
          means no filtering — every call is relevant, so a consumer that
          passes nothing is unaffected. Consulted only on `pull_request`
          events; other events are always relevant.

          MATCHER: patterns are ROOT-ANCHORED GITIGNORE patterns, not GitHub
          Actions `paths:` patterns — the `changes` job matches with
          `git check-ignore` (see the `Determine security relevance` step).
          Plain `*` / `**` globs and `[a-z0-9]` character classes mean the same
          thing under both, and that covers every pattern worth writing here.
          The three that do NOT are REJECTED as a configuration error rather
          than silently mismatched: `!` negation (gitignore cannot re-include
          below an excluded directory, so `.github/**` + `!.github/docs/**`
          still matches), and `?` / `+`, which Actions defines as
          zero-or-one / one-or-more of the PRECEDING character but gitignore
          does not — `*.jsx?` matches `page.js` and `page.jsx` for Actions and
          NEITHER here. Those two fail toward matching fewer files, i.e. toward
          skipping the review, so they fail loudly instead. Two remaining
          differences are harmless and permitted: a trailing-slash directory
          pattern (`scripts/`) works here though Actions does not document it,
          and `docs/*` matches at any depth here versus root-only for Actions
          — matching MORE than intended only costs an extra review.
        type: string
        default: ''
      paths-file:
        description: >-
          Repo-relative path to a file whose CONTENT is the same
          newline-separated pattern list `paths` takes — same gitignore matcher
          and same negation rejection, see that input's MATCHER note — so a
          consumer can keep its security-sensitive-surface list in its own tree
          instead of inlining it in the caller. Conventional location:
          `.github/claude-security-paths`. The file is read from the PR's BASE
          repository at the base branch — never the PR head — so a PR cannot
          edit the file's CONTENT to skip its own security review. (A PR can
          still repoint this input in the caller workflow, exactly as it could
          rewrite an inline `paths` list — either tampering is a visible
          caller diff, which is the existing trust boundary.) Consulted only when
          `paths` is empty; a file that is absent or unreadable FAILS OPEN
          (every call relevant, with a warning), matching the `changes` job's
          fail-open discipline. Empty (the default) means no file is consulted.
        type: string
        default: ''
      prompt:
        description: >-
          The security-review-criteria body. A REPO / PR NUMBER / HEAD SHA
          header and commit-permalink guidance are prepended automatically, so
          this input is just the instructions for what to look for.
        type: string
        default: >-
          Perform a security review of THIS pull request. Review ONLY the files
          changed in this PR: use `gh pr diff` to see what changed, then read
          those files. Do not audit unrelated parts of the codebase.


          Hunt for vulnerabilities that static analysis misses: logic flaws,
          authorization and access-control gaps, injection surfaces (command,
          SQL, path, template), unsafe handling of tokens / secrets /
          credentials, and dangerous GitHub Actions patterns —
          `pull_request_target` or `workflow_run` used with secrets over
          untrusted code, script injection through the `github` context inside
          `run:` blocks, permission-widening changes to a workflow's
          `permissions:` or to settings / config, and supply-chain risk from
          loosened or unpinned action / dependency pins.


          Report findings as a pull request review. Tag each finding with a
          severity (CRITICAL / IMPORTANT / SUGGESTION) and, separately, a
          confidence level (how sure you are the finding is real and
          exploitable). Report security issues only — no style, formatting,
          naming, test-coverage, or general code-quality commentary. Also defer
          to zizmor's advisory lane for what it already covers statically —
          supply-chain / unpinned-action risk, dangerous trigger patterns,
          excessive permissions, and template injection: do not re-report those
          findings here. This lane's value is the logic, architecture,
          data-flow, and trust-boundary security reasoning static analysis
          cannot reach. If you find no security issues, say so plainly.
      claude-args:
        description: >-
          Passed through to the Claude CLI. The universal extension point: model,
          turn budget, allowed tools, system prompt, MCP config all ride here
          (the standalone model / max_turns / allowed_tools action inputs are
          deprecated upstream). The default allows the inline-comment MCP tool
          so findings can land as line-anchored review comments.
        type: string
        default: >-
          --model claude-sonnet-5 --max-turns 75
          --allowedTools "mcp__github_inline_comment__create_inline_comment"
      exclude-comments-by-actor:
        description: >-
          Comma-separated actors whose comments are withheld from Claude's
          context (prompt-injection hygiene), not a trigger gate. Both
          Dependabot spellings are listed because the action matches the
          bare login for some comment kinds (upstream #1514).
        type: string
        default: dependabot,dependabot[bot]
      skip-actors:
        description: >-
          Comma-separated actors (no spaces) for whom the job skips entirely, to
          save runner minutes on PRs that never need review.

          Empty reviews all — but removing the default `dependabot[bot]` carries
          a SECRET CONTRACT. A Dependabot-triggered run reads from the separate
          Dependabot secrets store, never from Actions or organization secrets
          (GitHub: "When a Dependabot event triggers a workflow, the only secrets
          available to the workflow are Dependabot secrets"). Unless the consumer
          mirrors CLAUDE_CODE_OAUTH_TOKEN into that store, the review cannot
          authenticate, and because this lane FAILS CLOSED the required check
          then blocks every Dependabot PR until an operator provisions it.
          Mirror the secret first, or keep dependabot[bot] in this list.

          The default also bans self-triggering: Claude and the org's
          automation bots must never trigger their own review lanes.
        type: string
        default: dependabot[bot],claude[bot],melodic-ai[bot],melodic-standards-sync[bot]
      retry-delay-seconds:
        description: >-
          Base delay before the single automatic retry attempt, in seconds. A
          0-29 second random jitter is added on top so lanes retrying against
          the same contended seat do not re-collide in lockstep.
        type: number
        default: 90
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: >-
          Claude Code OAuth token (from `claude setup-token`). Supply as a
          same-org organization secret (live visibility: all repositories) and
          pass this named secret explicitly from the caller.
        required: true

permissions:
  contents: read

jobs:
  # Relevance gate for the ALWAYS-REPORT SHAPE (see header): decides whether
  # this PR touches a security-sensitive surface, so `security-review` can skip
  # and still report a name-stable check — instead of the caller path-filtering
  # at workflow level, which would wedge a required check Pending. Both pattern
  # inputs empty, or any non-pull_request event, is always relevant.
  changes:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    # Deliberately NO checkout: the job reads only the PR file listing
    # (pull-requests) and, when `paths-file` is set, that one file via the
    # contents API (contents) — fetching a single blob from the base branch
    # instead of checking out a tree keeps the job checkout-free.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # actions/github-script rather than a `gh api` run step: this job runs
      # on whatever runner the caller selected, and a self-hosted image is not
      # guaranteed to ship the gh CLI. Only the API reads live here — the PR
      # file listing and the optional `paths-file` fetch; the pattern-matching
      # step below still shells out, but only to `git check-ignore`, which
      # every runner needs anyway for actions/checkout to function, so it
      # carries no comparable availability risk.
      - name: List changed files
        id: changed-files
        if: >-
          github.event_name == 'pull_request'
          && (inputs.paths != '' || inputs.paths-file != '')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PATHS_INPUT: ${{ inputs.paths }}
          PATHS_FILE: ${{ inputs.paths-file }}
        with:
          script: |
            const fs = require("node:fs");
            const outputPath = `${process.env.RUNNER_TEMP}/security-review-changed-files.txt`;
            try {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
              const names = files.flatMap((file) => [file.filename, file.previous_filename].filter(Boolean));
              fs.writeFileSync(outputPath, names.length > 0 ? `${names.join("\n")}\n` : "", "utf8");
              core.setOutput("path", outputPath);
              core.setOutput("failed", "false");
            } catch (error) {
              core.warning(`Could not list PR files: ${error.message}`);
              core.setOutput("failed", "true");
            }

            // Resolve `paths-file` only when it would actually be consulted:
            // a non-empty explicit `paths` input wins, so no fetch then. The
            // file is read from the BASE repository at the BASE branch — for a
            // pull_request event that is context.repo — and never from the PR
            // head: a head read would let a PR edit the paths file to skip its
            // own security review. A missing (404) or unreadable file fails
            // OPEN via the failed flag; the pattern-matching step turns it
            // into relevant=true with a warning.
            const pathsFile = (process.env.PATHS_FILE ?? "").trim();
            const explicitPaths = (process.env.PATHS_INPUT ?? "").trim();
            core.setOutput("paths-file-failed", "false");
            if (pathsFile !== "" && explicitPaths === "") {
              const patternsPath = `${process.env.RUNNER_TEMP}/security-review-paths-file.txt`;
              try {
                const response = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: pathsFile,
                  ref: context.payload.pull_request.base.ref,
                  mediaType: { format: "raw" },
                });
                if (typeof response.data !== "string") {
                  throw new Error("not a readable file (is it a directory or submodule?)");
                }
                fs.writeFileSync(patternsPath, response.data, "utf8");
                core.setOutput("paths-file-path", patternsPath);
              } catch (error) {
                core.warning(
                  `Could not read paths file '${pathsFile}' from the base branch: ${error.message}`,
                );
                core.setOutput("paths-file-failed", "true");
              }
            }

      - name: Determine security relevance
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PATHS: ${{ inputs.paths }}
          PATHS_FILE: ${{ inputs.paths-file }}
          PATHS_FILE_PATH: ${{ steps.changed-files.outputs.paths-file-path }}
          PATHS_FILE_FAILED: ${{ steps.changed-files.outputs.paths-file-failed }}
          FILES_LIST_PATH: ${{ steps.changed-files.outputs.path }}
          FILES_LIST_FAILED: ${{ steps.changed-files.outputs.failed }}
        run: |
          set -euo pipefail

          # A non-PR event is always relevant.
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "relevant=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve the effective pattern list. Precedence: a non-empty
          # explicit `paths` input wins (unchanged semantics for existing
          # consumers); else a non-empty `paths-file` supplies the patterns,
          # fetched from the base branch by the step above; else no filter —
          # the backward-compatible default for a consumer that passes nothing.
          # An unreadable or absent paths file fails OPEN, like every other
          # fault in this job: a run wasted on an out-of-scope PR beats a
          # silently skipped security review.
          if [ -n "$(printf '%s' "$PATHS" | tr -d '[:space:]')" ]; then
            effective_paths="$PATHS"
          elif [ -n "$(printf '%s' "$PATHS_FILE" | tr -d '[:space:]')" ]; then
            if [ "$PATHS_FILE_FAILED" = "true" ] || [ -z "$PATHS_FILE_PATH" ]; then
              echo "::warning::Could not read paths file '$PATHS_FILE'; treating PR as security-relevant."
              echo "relevant=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            effective_paths="$(cat "$PATHS_FILE_PATH")"
          else
            echo "relevant=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # Reject the pattern characters this matcher cannot honor as GitHub
          # Actions defines them, BEFORE matching. Its own pass rather than an
          # arm in the loop below, so the check reads in one place and runs
          # once. (An `exit 1` inside that `printf | while` subshell WOULD
          # still fail the step under `set -e` — the pipeline returns the
          # subshell's status — but a single up-front guard is clearer.)
          #
          # `!`, `?` and `+` are all documented GitHub Actions filter syntax
          # for PATH filters (docs: "You can use special characters in path,
          # branch, and tag filters"), and this job matches with gitignore
          # rules instead, where each means something different:
          #
          #   `!`  Actions re-includes a previously excluded path. Under
          #        gitignore an anchored `!` cannot re-include below an already
          #        excluded directory, so `.github/**` + `!.github/docs/**`
          #        still matches `.github/docs/notes.md`.
          #   `?`  Actions: zero-or-one of the PRECEDING character — the docs'
          #        own path example `*.jsx?` matches `page.js` and `page.jsx`.
          #        Gitignore: exactly one of ANY character, so it matches
          #        NEITHER, and matches `page.jsxx` instead.
          #   `+`  Actions: one-or-more of the preceding character, so
          #        `v[0-9]+/**` matches `v1/` and `v10/`. Gitignore treats it
          #        as a literal, matching neither.
          #
          # `?` and `+` fail in the DANGEROUS direction: the pattern silently
          # matches fewer files than the caller wrote, so a security-relevant
          # PR reads as out-of-scope and the review never runs. On a lane whose
          # check can be REQUIRED that is a silent evidence gap, which is
          # exactly what this job exists to prevent — so an unhonorable pattern
          # is a hard configuration error, not a quiet mismatch.
          #
          # Failing this job does NOT create an evidence gap: `security-review`
          # gates on `!cancelled()`, a status function that overrides the
          # default needs-failure skip, and a failed `changes` leaves
          # `relevant` unset ('') which is not 'false' — so the review still
          # runs and reviews everything. This guard therefore fails OPEN, like
          # every other fault in this job.
          #
          # `[a-z0-9]` character classes are documented by Actions AND behave
          # the same here, so they are allowed.
          #
          # A LITERAL `+` or `?` in a real filename (`src/c++/**`) is rejected
          # too. Accepted deliberately: it is rare, the rejection is loud and
          # names the fix, and the alternative — parsing intent out of a glob —
          # is exactly the silent guesswork this guard replaces. Use `*`
          # (`src/c*/**`).
          # Here-strings, NOT `printf ... | grep -q`. `grep -q` exits at its
          # first match, and on a pattern list larger than the pipe buffer
          # that kills the still-writing producer with SIGPIPE; under
          # `pipefail` the pipeline then returns 141 and the `if` reads the
          # rejected character as ABSENT — silently restoring the mismatch
          # these guards exist to prevent. Reproduced at ~170 KB with the
          # negation on line 1. A here-string has no producer to kill.
          if grep -qE '^[[:space:]]*!' <<<"$effective_paths"; then
            echo "::error::The security-relevance paths filter contains a '!' negation. This matcher uses gitignore rules, where '!' does not re-include as GitHub Actions defines it. Narrow the positive patterns instead. See the 'paths' input description."
            exit 1
          fi
          # Two steps for the same reason: chaining these into one pipeline
          # reintroduces the SIGPIPE race. `|| true` because grep exits 1 when
          # every line is a comment, which is not an error here.
          uncommented_paths="$(grep -vE '^[[:space:]]*(#|$)' <<<"$effective_paths" || true)"
          if grep -qE '[?+]' <<<"$uncommented_paths"; then
            echo "::error::The security-relevance paths filter contains '?' or '+'. Both are valid GitHub Actions path-filter syntax but mean something different under this matcher's gitignore rules, and they silently match FEWER files — which would skip the security review. Rewrite with '*' / '**' globs. See the 'paths' input description."
            exit 1
          fi

          # Build a root-anchored gitignore matcher in a throwaway repo — no
          # checkout of the caller's code. Actions `paths:` patterns are
          # root-anchored; gitignore patterns without a leading slash match at
          # any depth, so anchor each pattern with a leading '/'.
          scratch="$(mktemp -d)"
          # Persistent self-hosted runners accumulate /tmp; clean up on any exit.
          # Single quotes defer expansion to trap time (avoids SC2064).
          trap 'rm -rf "$scratch"' EXIT
          ignore="$scratch/.gitignore"
          git init -q "$scratch"
          : >"$ignore"
          printf '%s\n' "$effective_paths" | while IFS= read -r pattern; do
            pattern="${pattern%$'\r'}"
            pattern="${pattern#"${pattern%%[![:space:]]*}"}"
            pattern="${pattern%"${pattern##*[![:space:]]}"}"
            [ -n "$pattern" ] || continue
            # No `!` arm: negation is rejected by the guard above.
            case "$pattern" in
              \#*) continue ;;
              /*) printf '%s\n' "$pattern" >>"$ignore" ;;
              *) printf '/%s\n' "$pattern" >>"$ignore" ;;
            esac
          done

          # Every line was blank or a `#` comment, so the filter is effectively
          # empty — fail OPEN rather than skip every PR on a vacuous filter.
          if [ ! -s "$ignore" ]; then
            echo "::warning::paths filter has no usable patterns; treating PR as security-relevant."
            echo "relevant=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # The listing step above already failed OPEN to relevant on error;
          # this only covers the case where it ran but could not reach GitHub.
          if [ "$FILES_LIST_FAILED" = "true" ]; then
            echo "::warning::Could not list PR files; treating PR as security-relevant."
            echo "relevant=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # check-ignore prints matching paths; exit 0 = at least one match,
          # 1 = none, >1 = fatal. A fatal error fails OPEN, never reads as "no
          # match", so a matcher fault cannot silently skip the review.
          matches="$(git -C "$scratch" check-ignore --stdin --no-index <"$FILES_LIST_PATH")" && rc=0 || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::warning::check-ignore failed (rc=$rc); treating PR as security-relevant."
            echo "relevant=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$matches" ]; then
            echo "relevant=true" >>"$GITHUB_OUTPUT"
          else
            echo "relevant=false" >>"$GITHUB_OUTPUT"
          fi

  security-review:
    needs: changes
    runs-on: ${{ inputs.runner }}
    # Two review attempts plus the backoff share this budget, sized by the
    # retry formula 2 x attempt timeout + retry delay + 5 slack (2x18 + ~2 + 5
    # = 43) so a slow first attempt cannot starve the retry into a
    # timeout-shaped red check.
    timeout-minutes: 45
    # The two vars clauses are the fleet kill-switches: Actions variables an
    # operator flips to stop this lane (CLAUDE_SECURITY_REVIEW_DISABLED) or
    # every Claude lane at once (CLAUDE_LANES_DISABLED) without touching
    # workflow files. An absent variable evaluates to '' — not 'true' — so the
    # lane is enabled by default, and a repo-level variable overrides an
    # org-level one (platform-verified). They gate THIS job only, never
    # `changes`: a kill-switched run is a name-stable job-level SKIP, which a
    # required-check ruleset reads as success — deliberate, because a switch
    # that reddened the required check would block every merge for the whole
    # outage it exists to manage. See the KILL-SWITCH SCOPE NOTE in the header
    # for the REVIEW.md coverage window this opens.
    #
    # Skip configured bot/automation actors (saves runner minutes). The action's
    # own write-access gate is the security control; this is just an optimization.
    # Comma-wrap both sides so a substring of one actor can't match another.
    #
    # `!cancelled() && needs.changes.outputs.relevant != 'false'` is the
    # always-report gate: relevant=false (no security-sensitive path changed)
    # skips this job, and a skipped required check reads as success — the
    # name-stable not-applicable verdict. It FAILS OPEN: a failed/errored
    # `changes` job leaves relevant unset (''), which is not 'false', so the
    # review still runs. A silent skip would let unreviewed security-relevant
    # changes merge, so paying for a run beats a silent evidence gap. always()
    # is deliberately avoided — a cancelled workflow should still stop.
    #
    # The fork clause is load-bearing for the FAIL-CLOSED mapping (see POSTURE):
    # a fork-triggered pull_request run gets no secrets, so the SDK call cannot
    # succeed no matter how often it is retried. Without this skip the mapping
    # would pin every fork PR red permanently.
    #
    # It is scoped to `pull_request` for a security reason, not a stylistic one.
    # An unscoped fork test also matches a fork PR arriving via
    # pull_request_target / workflow_run — the two privileged triggers this
    # workflow exists to reject — and would skip the job before `Reject
    # privileged triggers` could hard-fail it, turning a consumer's dangerous
    # misconfiguration into a green skipped check. Every non-pull_request event
    # must reach that tripwire; the ones it allows through then take the
    # pass-through path past `Fail closed on an in-scope non-run`.
    if: >-
      ${{ !cancelled()
          && vars.CLAUDE_LANES_DISABLED != 'true'
          && vars.CLAUDE_SECURITY_REVIEW_DISABLED != 'true'
          && needs.changes.outputs.relevant != 'false'
          && !contains(format(',{0},', inputs.skip-actors), format(',{0},', github.actor))
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    concurrency:
      # Job-level (not workflow-level): a workflow-level group would cancel
      # before the `if` above evaluates, so a skipped actor could cancel an
      # in-progress review.
      #
      # Keyed per (PR, head SHA), not per PR: GitHub orders a concurrency
      # group by when jobs start WAITING on it, not by event time, and callers
      # gate this job behind a runner-selector job whose queue delay varies
      # per run. Under a shared per-PR group, an older run whose selector was
      # delayed could enter the group AFTER the newer head's review had
      # started, cancel it, and review an obsolete head. Runs for different
      # heads therefore never share a group; the superseded-head guard step
      # below is what retires a stale run instead. Same-head duplicates
      # (reopen, ready_for_review, reruns) still supersede each other — there
      # the entry order is harmless because every member reviews identical
      # content. Non-PR events degrade to a per-commit group via the fallbacks.
      group: claude-security-review-${{ github.event.pull_request.number || github.sha }}-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: true
    steps:
      # Tripwire: this workflow handles secrets, so it must never run in a
      # privileged-context trigger that also exposes untrusted fork code. We do
      # not whitelist `pull_request` (a consumer may legitimately use
      # workflow_dispatch / schedule); we only hard-fail the two dangerous ones.
      - name: Reject privileged triggers
        if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_run'
        run: |
          echo "::error::claude-security-review must not be called from '${{ github.event_name }}'." \
            "Call it from a 'pull_request' workflow. pull_request_target/workflow_run run" \
            "with base-repo secrets over untrusted code (token exfiltration risk)."
          exit 1

      # A stale run must retire itself, not rely on being cancelled: with the
      # per-head concurrency key above, nothing cancels a run whose head was
      # superseded while it sat in a queue. The composite owns the live-head
      # check and its fail-open contract — downstream `!= 'true'` gates treat
      # a missing output as fresh. Pinned to this repo's own merged SHA: a
      # local ./ ref resolves against the CALLER's checkout in a reusable
      # workflow and cannot work.
      - name: Check whether this head is still current
        id: freshness
        uses: melodic-software/ci-workflows/.github/actions/claude-lane-freshness@b5d54bf7cb386b1f2c35426c6c5fb8d1686671bd # b5d54bf 2026-07-27

      # persist-credentials stays at its default (true) until upstream
      # claude-code-action#1236 ships: the action's setupBranch runs
      # `git fetch origin <ref>` BEFORE configuring git auth, so
      # persist-credentials:false makes that fetch fail and leaves an orphan
      # tracking comment. The final strip step below scrubs the persisted token
      # to restore zizmor `artipacked` compliance. Reversible when #1236 lands.
      - name: Check out
        if: steps.freshness.outputs.superseded != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          filter: blob:none

      - name: Claude security review
        id: claude-review
        if: steps.freshness.outputs.superseded != 'true'
        # claude-code-action exits non-zero only on infrastructure errors; review
        # findings go to PR comments, not the exit code.
        #
        # continue-on-error stays, but its job here is NOT to hide the failure
        # (this lane fails closed — see POSTURE). It keeps the ACTION step from
        # ending the job so the retry below gets its turn and `Report review
        # outcome` can classify the failure into a machine-readable class. The
        # red conclusion is raised deliberately by that outcome step, on the one
        # signal that means "in scope and did not run", instead of incidentally
        # by whichever step happened to exit first.
        #
        # The step timeout bounds each attempt so the job budget above always
        # leaves room for the retry (see the retry formula there).
        continue-on-error: true
        timeout-minutes: 18
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A clean security pass otherwise produces no visible output (upstream
          # #1071); the tracking comment guarantees a "no findings" signal.
          track_progress: true
          # Off on this public lane (log-leak risk); hardcoded, not a flippable
          # input, so a consumer cannot turn it on.
          display_report: false
          allowed_bots: dependabot[bot]
          exclude_comments_by_actor: ${{ inputs.exclude-comments-by-actor }}
          claude_args: ${{ inputs.claude-args }}
          # github-context expressions must appear directly in the step (a value
          # carried in via inputs.prompt is NOT re-evaluated), so the structural
          # header + permalink guidance live here and wrap the consumer's body.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            ${{ inputs.prompt }}

            When referencing specific code locations in findings, link to the
            commit blob (not the PR) using a permalink with line numbers:
            https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}/<path>#L<line>

      # ONE bounded, gated retry, because this lane fails closed: a sporadic
      # failure that a re-run would clear must not block a merge.
      #
      # THE DELAY IS NOT CALIBRATED, and the citation that used to appear here
      # could not calibrate it. That citation read: "run 30217744377 failed in
      # 25s with api_error_status 429 and returned a real verdict in 3m17s on a
      # manual re-run." Both numbers are real; neither is a delay. Attempt 1's
      # lane job ran 19:52:02Z -> 19:52:27Z (25s, the failure). Attempt 2's ran
      # 21:20:05Z -> 21:23:22Z, so 3m17s is that attempt's DURATION. The gap
      # between them — how long recovery actually took — is 87m27s, and it is
      # bounded below by when a human happened to press re-run, so it does not
      # measure the outage either. The run says nothing about how long to wait.
      #
      # What the population does say: on 2026-07-29 a 4h36m blackout
      # (02:00:56Z-06:37:43Z) produced zero successful lane runs org-wide, and
      # of 92 failed attempts NONE had any lane attempt anywhere in the org
      # succeed within 150s of it — wider than this delay's 90-119s window. So
      # no in-job delay rescues a blackout, which is what POSTURE already says
      # break-glass is for. Whether one rescues a genuinely SPORADIC 429 is
      # unmeasured: the retry step executed zero times in 251 attempts that day
      # because this gate refused every one of them (see below).
      #
      # 90s is therefore kept as-is rather than re-derived — there is no
      # measurement to derive a different number from, and inventing one would
      # repeat the error above. REVISIT TRIGGER: a lane failure whose retry
      # step executes and whose second attempt succeeds. That instance
      # calibrates the constant. If 429s keep recurring and no such instance
      # appears once this gate is reachable, the mechanism is refuted and
      # retiring it in favor of break-glass alone becomes the supported call.
      #
      # The gate retries ONLY when the execution file shows ZERO assistant
      # turns of real work and the failure is not auth-class. Zero real turns
      # is the artifact-safety condition: the action posts nothing
      # review-shaped before its first assistant turn, so attempt 2 cannot
      # duplicate inline comments already on the PR. The auth exclusion skips
      # the one class no retry can clear — the credential needs an operator. A
      # mid-review failure (assistant turns already spent, comments possibly
      # posted) is deliberately NOT retried: the duplicate-comment risk
      # outweighs the second chance, and the re-run and break-glass paths
      # remain. "Real work" is load-bearing and not the same as "an assistant
      # entry exists" — see the gate script for why an API error manufactures
      # an assistant turn that posted nothing.
      #
      # Deliberately ONE retry, not a loop: Actions cannot loop a `uses:` step,
      # so every attempt is a verbatim copy of the step above, and each copy is a
      # place where the two can silently diverge (the wiring test asserts they do
      # not). The measured failure population does not justify more — sustained
      # multi-hour blackouts dominate, and no in-job backoff survives those. They
      # are meant to be handled by the consumer's break-glass, not by retrying.
      # Gated on being a pull_request too: on the events the action rejects
      # outright the first attempt always fails, so retrying only spends a
      # runner and a minute of wall clock to throw again.
      #
      # The auth predicate covers classify.cjs's auth class in the
      # claude-lane-outcome composite — the authoritative sibling for the
      # status-to-class mapping. The composite is fetched at its pinned SHA and
      # the caller's checkout does not contain this repo's scripts, so
      # classify.cjs cannot be require()d at runtime and the predicate is
      # inlined here instead; keep the three auth statuses and three auth error
      # types identical in both. The gate is deliberately a SUPERSET of its
      # sibling on inputs, not on classes: classify.cjs reads only the last
      # entry because its job is to name the class of a completed run, while the
      # gate must also rule out an auth failure recorded on a synthetic turn
      # when no result entry was written. Do not widen classify.cjs to match —
      # that changes the fail-closed mapping.
      - name: Decide whether to retry the review
        id: retry-gate
        if: >-
          steps.freshness.outputs.superseded != 'true' &&
          steps.claude-review.outcome == 'failure' &&
          github.event.pull_request.number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        with:
          script: |
            const fs = require("node:fs");
            core.setOutput("retry", "false");
            let entries;
            try {
              const parsed = JSON.parse(
                fs.readFileSync(process.env.EXECUTION_FILE, "utf8"),
              );
              if (Array.isArray(parsed)) entries = parsed;
            } catch {
              // Falls through to the evidence guard below.
            }
            // Retry only on EVIDENCE of zero turns. A missing or unparsable
            // execution file proves nothing: a hard kill (step timeout, OOM)
            // can lose the file after turns were already spent, and retrying
            // then risks exactly the duplicate comments this gate exists to
            // prevent.
            if (entries === undefined) {
              core.notice(
                "Not retrying: no parseable execution file, so zero assistant turns cannot be proven.",
              );
              return;
            }
            // An API error does not end the stream quietly. Claude Code emits a
            // SYNTHETIC assistant turn carrying the error as ordinary text, so a
            // 429 that killed the run before any real work still records a
            // `type: "assistant"` entry. Counting those turns is what made this
            // gate unreachable for the dominant failure class. The
            // artifact-safety condition is about work that could have POSTED
            // something, so synthetic error turns do not count as work.
            //
            // `error` is carried by the SDK's published message union;
            // `isApiErrorMessage`, `apiErrorStatus`, and the `<synthetic>` model
            // sentinel are observed wire fields the types do not declare.
            // Depending on them is safe in one direction only, and that is the
            // direction taken here: if upstream renames any of them the turn
            // counts as real, `realTurns` rises above zero, and the gate
            // declines. Drift degrades to not retrying, never to duplicate
            // comments.
            const isSyntheticErrorTurn = (entry) =>
              typeof entry?.error === "string" ||
              entry?.isApiErrorMessage === true ||
              entry?.message?.model === "<synthetic>";
            const assistantTurns = entries.filter(
              (entry) => entry?.type === "assistant",
            );
            const realTurns = assistantTurns.filter(
              (entry) => !isSyntheticErrorTurn(entry),
            ).length;
            if (realTurns > 0) {
              core.notice(
                `Not retrying: attempt 1 recorded ${realTurns} assistant turn(s) of real work, ` +
                  "so it may already have posted comments a second attempt would duplicate.",
              );
              return;
            }
            // Auth is read from the result entry AND from every synthetic error
            // turn. The result entry is the primary source, but the action also
            // writes the file from a path that produces NO result entry, and
            // discounting synthetic turns above would otherwise let an
            // auth-class failure through that hole — the one class this gate
            // must never retry.
            const last = entries.length > 0 ? entries[entries.length - 1] : undefined;
            const statuses = [
              last?.api_error_status,
              ...assistantTurns.map((entry) => entry?.apiErrorStatus),
            ];
            const errorText = (Array.isArray(last?.errors) ? last.errors : [])
              .map((error) => (typeof error === "string" ? error : JSON.stringify(error)))
              .join("\n");
            const auth =
              statuses.some(
                (status) => status === 401 || status === 402 || status === 403,
              ) ||
              errorText.includes('"type":"authentication_error"') ||
              errorText.includes('"type":"billing_error"') ||
              errorText.includes('"type":"permission_error"');
            if (auth) {
              core.notice(
                "Not retrying: auth-class failure — the credential needs an operator, and a retry cannot clear it.",
              );
              return;
            }
            // track_progress posts its tracking comment BEFORE the first
            // assistant turn, so a zero-turn failure strands an orphan the
            // retry will not adopt. Best-effort delete, identified by author
            // + this run's URL. The tracking comment is authored by
            // claude[bot] (the App identity, verified against live PRs);
            // github-actions[bot] is accepted too in case upstream ever
            // posts it with the workflow token. This run has posted nothing
            // else yet, so the run-URL conjunct scopes deletion safely.
            // Fork PRs run with a read-only token and must never fail the
            // gate.
            const trackingAuthors = new Set(["claude[bot]", "github-actions[bot]"]);
            const pr = context.payload.pull_request;
            if (pr?.number) {
              try {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  per_page: 100,
                });
                for (const comment of comments) {
                  if (
                    trackingAuthors.has(comment.user?.login ?? "") &&
                    (comment.body ?? "").includes(`/actions/runs/${context.runId}`)
                  ) {
                    await github.rest.issues.deleteComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: comment.id,
                    });
                    core.info(`Deleted attempt 1's orphan tracking comment (id ${comment.id}).`);
                  }
                }
              } catch (error) {
                core.warning(`Could not delete attempt 1's tracking comment: ${error.message}`);
              }
            }
            core.setOutput("retry", "true");

      # Jittered so parallel lanes retrying against the same contended seat do
      # not re-collide in lockstep; the base delay rides the
      # retry-delay-seconds input.
      - name: Back off before the review retry
        if: steps.retry-gate.outputs.retry == 'true'
        env:
          RETRY_DELAY_SECONDS: ${{ inputs.retry-delay-seconds }}
        run: sleep "$((RETRY_DELAY_SECONDS + RANDOM % 30))"

      - name: Claude security review (retry)
        id: claude-review-retry
        if: steps.retry-gate.outputs.retry == 'true'
        # Same rationale as the first attempt: the outcome step owns the red,
        # and the same step timeout keeps the retry inside the job budget.
        continue-on-error: true
        timeout-minutes: 18
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A clean security pass otherwise produces no visible output (upstream
          # #1071); the tracking comment guarantees a "no findings" signal.
          track_progress: true
          # Off on this public lane (log-leak risk); hardcoded, not a flippable
          # input, so a consumer cannot turn it on.
          display_report: false
          allowed_bots: dependabot[bot]
          exclude_comments_by_actor: ${{ inputs.exclude-comments-by-actor }}
          claude_args: ${{ inputs.claude-args }}
          # github-context expressions must appear directly in the step (a value
          # carried in via inputs.prompt is NOT re-evaluated), so the structural
          # header + permalink guidance live here and wrap the consumer's body.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            ${{ inputs.prompt }}

            When referencing specific code locations in findings, link to the
            commit blob (not the PR) using a permalink with line numbers:
            https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}/<path>#L<line>

      # Collapse the two attempts into the one pair of facts the outcome step
      # needs. Reading the retry's fields directly would be wrong: when it is
      # skipped its outcome is the literal `skipped` and its execution_file is
      # empty, so the first attempt's result has to be the fallback.
      - name: Resolve the effective review attempt
        id: attempt
        # !cancelled(), not always(): cancellation is this lane's retirement
        # mechanism (cancel-in-progress on same-head duplicates), and a
        # retired run must not go on to report an outcome, raise the
        # fail-closed red, or touch the newer run's PR comment state.
        if: "!cancelled() && steps.freshness.outputs.superseded != 'true'"
        env:
          FIRST_OUTCOME: ${{ steps.claude-review.outcome }}
          FIRST_FILE: ${{ steps.claude-review.outputs.execution_file }}
          RETRY_OUTCOME: ${{ steps.claude-review-retry.outcome }}
          RETRY_FILE: ${{ steps.claude-review-retry.outputs.execution_file }}
        run: |
          if [ "$RETRY_OUTCOME" = "skipped" ] || [ -z "$RETRY_OUTCOME" ]; then
            outcome="$FIRST_OUTCOME"
            execution_file="$FIRST_FILE"
          else
            echo "First attempt failed; reporting the retry's result instead."
            outcome="$RETRY_OUTCOME"
            execution_file="$RETRY_FILE"
          fi
          {
            echo "outcome=$outcome"
            echo "execution_file=$execution_file"
          } >>"$GITHUB_OUTPUT"

      # Also gated on the guard: a superseded run has no outcome to report, and
      # skipping this step leaves review-failed empty so the fail-closed step
      # and both marker-comment steps below skip too — a retired run must not
      # touch the newer run's PR comment state. The composite owns the
      # classification (classify.cjs — the sole reader of the execution file's
      # free-text fields) and the machine-readable `class=<token>` annotation;
      # it records the failure WITHOUT failing, so the fail-closed step below
      # owns the red.
      - name: Report review outcome
        id: review-outcome
        if: "!cancelled() && steps.freshness.outputs.superseded != 'true'"
        uses: melodic-software/ci-workflows/.github/actions/claude-lane-outcome@b5d54bf7cb386b1f2c35426c6c5fb8d1686671bd # b5d54bf 2026-07-27
        with:
          outcome: ${{ steps.attempt.outputs.outcome }}
          execution-file: ${{ steps.attempt.outputs.execution_file }}
          lane: Claude security review

      # FAIL CLOSED (#266). Failure is the only conclusion a required check
      # does not accept — `neutral` and `skipped` both read as success, so
      # neither can express "in scope and did not run". The composite above
      # already wrote the class and detail outputs, and both marker-comment
      # steps below are `!cancelled()`-gated, so the PR still gets its
      # infra-status comment.
      #
      # Only a pull_request run gates a merge, so only a pull_request run
      # fails closed. The action rejects other events outright — `merge_group`
      # is not a supported event type at all, and `track_progress` (hardcoded
      # on above) rejects every non-PR event — so those runs fail for a reason
      # the head cannot fix and no retry can clear. Reddening them would wedge
      # a consumer's merge queue permanently, and the comment steps below are
      # PR-gated too, so the red would carry no explanation. They keep the
      # historical pass-through: still annotated, still classified, not fatal.
      #
      # Reached only when the review was in scope, the head is still current,
      # and both attempts failed. The three legitimate no-verdict paths never
      # arrive here: out-of-scope and fork/skip-actor PRs skip the whole job,
      # and a superseded head skips the outcome step above, leaving
      # review-failed unset — which skips this step too.
      - name: Fail closed on an in-scope non-run
        if: >-
          !cancelled() && steps.review-outcome.outputs.review-failed == 'true' &&
          github.event.pull_request.number != ''
        run: |
          echo "The security review was in scope and did not run; the required check cannot report success (see POSTURE)."
          exit 1

      # Runs only on a genuine infra failure (never on a clean review). The
      # composite owns the ID-safe marker lifecycle, the fork guard, and the
      # no-PR no-op — clobbering an unrelated bot comment is the failure mode
      # the marker-by-ID contract exists to prevent. The body-copy lines carry
      # their own `> ` blockquote-continuation prefixes (the composite
      # prefixes only the first line).
      - name: Comment on genuine review failure
        if: "!cancelled() && steps.review-outcome.outputs.review-failed == 'true'"
        # Reporting an outage must never become one: this step only annotates
        # a PR, and a rejected API call must not fail the job on top of the
        # deliberate red the fail-closed step already raised.
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/claude-lane-marker-comment@b5d54bf7cb386b1f2c35426c6c5fb8d1686671bd # b5d54bf 2026-07-27
        with:
          marker: "<!-- claude-security-review-infra-status -->"
          mode: post-failure
          headline: Automated security review did not complete
          failure-class: ${{ steps.review-outcome.outputs.failure-class }}
          review-detail: ${{ steps.review-outcome.outputs.review-detail }}
          body-copy: |-
            **The check is red on purpose.** It certifies that a security pass ran, and this one did not complete, so it cannot report success. Where this check is required, merging is blocked until a review actually finishes.
            >
            > Re-running the job, or pushing a new commit, will retry the review. An automatic retry may already have run — it is skipped when a partial review could duplicate comments, or when the failure class needs an operator.
            >
            > Re-running does NOT help for every class:
            > - `rate-limit` that persists across re-runs, or `auth` — the credential or usage budget needs an **operator**; retrying will not clear it.
            > - a run that exhausted its turn budget (`"subtype":"error_max_turns"` above) will exhaust it again. **As the PR author**, split the change into smaller PRs; raising `--max-turns` is a change to the *caller workflow*, not something you can set on this PR.

      # Symmetric counterpart to the failure step above: a transient infra
      # failure (e.g. an OIDC blip) can leave the marker comment behind on the
      # PR. Once a retry (rerun or new push) succeeds, clear that stale
      # warning so it is not mistaken for a still-open problem.
      - name: Clear stale failure comment after successful review
        if: "!cancelled() && steps.review-outcome.outputs.review-failed == 'false'"
        # Tidying a stale comment is housekeeping, and a rejected API call
        # during it must not turn a successful review red.
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/claude-lane-marker-comment@b5d54bf7cb386b1f2c35426c6c5fb8d1686671bd # b5d54bf 2026-07-27
        with:
          marker: "<!-- claude-security-review-infra-status -->"
          mode: clear-on-success

      # zizmor `artipacked` mitigation — scrub the GITHUB_TOKEN that checkout
      # persisted into .git/config (forced on by #1236, above). Drop this once
      # the checkout step can use persist-credentials:false again.
      - name: Strip persisted git credentials
        if: always()
        run: git config --unset-all http.https://github.com/.extraheader || true
