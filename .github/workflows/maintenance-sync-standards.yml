name: Maintenance Sync Standards

# Reusable workflow for exact-file standards distribution. The standards
# checkout owns the schema-v2 manifest and its interpreter; this workflow owns
# GitHub orchestration only: resolve one immutable source SHA, mint a narrowly
# scoped App token, materialize each target, open a reviewed signed PR, and
# (unless the manifest opts a target out via `automerge: false`) arm auto-merge
# on a sync PR that was never armed or whose head this run just changed.
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label selected by the caller's governed selector.
        type: string
        default: ubuntu-24.04
      manifest:
        description: Repository-relative manifest path in the standards checkout.
        type: string
        default: distribution/sync-manifest.yml
      standards-ref:
        description: Ref (branch, tag, or SHA) of standards to distribute.
        type: string
        default: main
      dry-run:
        description: Validate and print the plan without checking out targets or opening PRs.
        type: boolean
        default: true
      targets:
        description: Comma-separated exact target allowlist; empty selects all manifest targets.
        type: string
        default: ''
      refs:
        description: >-
          Optional comma- or newline-separated issue references (for example
          `melodic-software/claude-code-plugins#18899`, or `#18899` when
          `targets` selects a single repository) to emit as `Refs: <ref>` lines
          at the top of the sync PR body when a sync carries an authorized
          change. Multi-target syncs require `owner/repo#N`. Empty emits
          `No related issue: ...`.
        type: string
        default: ''
      environment:
        description: >-
          Caller-repository environment that holds the App secrets under the
          names STANDARDS_SYNC_APP_CLIENT_ID and STANDARDS_SYNC_APP_PRIVATE_KEY;
          an environment secret overrides the passed secret of the same name.
          Environment secret names cannot contain hyphens. Restrict its
          deployments to the default branch. The jobs that use the App set
          `deployment: false`, so the environment must not use custom protection
          rules. A job naming a nonexistent environment creates it, unprotected.
        type: string
        default: standards-sync
    secrets:
      STANDARDS_SYNC_APP_CLIENT_ID:
        description: GitHub App client ID for cross-repository sync.
        required: false
      STANDARDS_SYNC_APP_PRIVATE_KEY:
        description: GitHub App private key for cross-repository sync.
        required: false

permissions:
  contents: read

# One fixed PR branch is updated per target. Queue invocations so two source
# revisions cannot race while refreshing those branches. Dry runs touch no
# branch, so they queue separately and never hold up or wait on a real sync.
concurrency:
  group: standards-sync-${{ inputs.dry-run && 'dry-run' || 'apply' }}
  cancel-in-progress: false

jobs:
  build-sync-matrix:
    name: Build Sync Matrix
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      expected-repositories: ${{ steps.build.outputs.expected-repositories }}
      matrix: ${{ steps.build.outputs.matrix }}
      sha: ${{ steps.resolve.outputs.sha }}
      target-count: ${{ steps.build.outputs.target-count }}
    steps:
      - name: Check out standards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: melodic-software/standards
          ref: ${{ inputs.standards-ref }}
          persist-credentials: false

      # --ignore-scripts is a standing control: no npm lifecycle script may run in this workflow.
      - name: Detect the engine flavor
        id: engine
        run: |
          set -euo pipefail
          if [[ -f distribution/sync-manifest.mjs ]]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
            echo "Pinned standards ref predates the Node engine — skipping Node prep."
          fi
      - name: Set up Node
        if: steps.engine.outputs.node == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install engine dependencies
        if: steps.engine.outputs.node == 'true'
        run: |
          set -euo pipefail
          npm ci --prefix distribution \
            --omit=dev --ignore-scripts --no-audit --no-fund \
            --fetch-retries=8 --fetch-retry-mintimeout=1000 \
            --fetch-retry-maxtimeout=60000

      - name: Resolve standards commit
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate manifest and build target matrix
        id: build
        env:
          MANIFEST: ${{ inputs.manifest }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          matrix="$(
            bash distribution/sync-manifest.sh matrix \
              --source-root . \
              --manifest "$MANIFEST" \
              --targets "$TARGETS"
          )"
          full_matrix="$(
            bash distribution/sync-manifest.sh matrix \
              --source-root . \
              --manifest "$MANIFEST"
          )"
          expected_repositories="$(
            jq --compact-output --exit-status '
              [.include[].repo]
              | if length == 0 then error("manifest contains no targets") else . end
              | if length == (unique | length) then sort else error("manifest contains duplicate targets") end
            ' <<< "$full_matrix"
          )"
          target_count="$(jq '.include | length' <<< "$matrix")"
          {
            echo "expected-repositories=$expected_repositories"
            echo "matrix=$matrix"
            echo "target-count=$target_count"
          } >> "$GITHUB_OUTPUT"

      - name: Log distribution plan
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          MANIFEST: ${{ inputs.manifest }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          echo "dry-run=${DRY_RUN}"
          bash distribution/sync-manifest.sh plan \
            --source-root . \
            --manifest "$MANIFEST" \
            --targets "$TARGETS"

  attest:
    name: Attest
    needs: build-sync-matrix
    if: ${{ !inputs.dry-run }}
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      unreachable-repositories: ${{ steps.attestation.outputs.unreachable-repositories }}
    steps:
      - name: Require App credentials
        env:
          APP_CLIENT_ID: ${{ secrets.STANDARDS_SYNC_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.STANDARDS_SYNC_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::STANDARDS_SYNC_APP_CLIENT_ID and STANDARDS_SYNC_APP_PRIVATE_KEY are required when dry-run is false"
            exit 1
          fi

      - name: Mint read-only App token for installation attestation
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.STANDARDS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.STANDARDS_SYNC_APP_PRIVATE_KEY }}
          owner: melodic-software # zizmor: ignore[github-app] attesting the App identity and its repository access needs an org-wide metadata read
          permission-metadata: read

      - name: Attest App identity and target repository access
        id: attestation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP_CLIENT_ID: ${{ secrets.STANDARDS_SYNC_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.STANDARDS_SYNC_APP_PRIVATE_KEY }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          EXPECTED_APP_SLUG: melodic-standards-sync
          EXPECTED_INSTALLATION_ID: '144867070'
          EXPECTED_OWNER: melodic-software
          EXPECTED_REPOSITORIES: ${{ needs.build-sync-matrix.outputs.expected-repositories }}
          TRUST_ROOT_REPOSITORIES: melodic-software/azure-iac
          # The calling repository, the sync source: the App opens its re-pin PR there.
          SOURCE_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          INSTALLATION_ID: ${{ steps.token.outputs.installation-id }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const { createSign } = require('node:crypto');
            const REQUEST_TIMEOUT_MILLISECONDS = 30_000;

            const fail = (message) => {
              throw new Error(`Standards sync App attestation failed: ${message}`);
            };
            const required = (name) => {
              const value = process.env[name];
              if (typeof value !== 'string' || value.length === 0) {
                fail(`${name} is missing`);
              }
              return value;
            };
            const expectedSlug = required('EXPECTED_APP_SLUG');
            const expectedInstallationId = required('EXPECTED_INSTALLATION_ID');
            const expectedOwner = required('EXPECTED_OWNER');
            const actualSlug = required('APP_SLUG');
            const actualInstallationId = required('INSTALLATION_ID');
            const privateKey = required('APP_PRIVATE_KEY');
            if (actualSlug !== expectedSlug) {
              fail(`token App slug ${actualSlug} does not equal ${expectedSlug}`);
            }
            if (actualInstallationId !== expectedInstallationId) {
              fail(`token installation ${actualInstallationId} does not equal ${expectedInstallationId}`);
            }

            let expected;
            try {
              expected = JSON.parse(required('EXPECTED_REPOSITORIES'));
            } catch (error) {
              fail(`EXPECTED_REPOSITORIES is not valid JSON: ${error.message}`);
            }
            if (!Array.isArray(expected) || expected.length === 0) {
              fail('expected repository set must be a non-empty array');
            }
            const repositoryNamePattern = new RegExp(
              `^${expectedOwner.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\/[A-Za-z0-9_.-]+$`,
            );
            const expectedSet = new Set();
            for (const repository of expected) {
              if (typeof repository !== 'string' ||
                  !repositoryNamePattern.test(repository)) {
                fail(`invalid expected repository: ${String(repository)}`);
              }
              if (expectedSet.has(repository)) {
                fail(`duplicate expected repository: ${repository}`);
              }
              expectedSet.add(repository);
            }

            const base64url = (value) =>
              Buffer.from(JSON.stringify(value), 'utf8').toString('base64url');
            const now = Math.floor(Date.now() / 1000);
            const unsignedJwt = `${base64url({ alg: 'RS256', typ: 'JWT' })}.${base64url({
              iat: now - 60,
              exp: now + 540,
              iss: required('APP_CLIENT_ID'),
            })}`;
            const signer = createSign('RSA-SHA256');
            signer.update(unsignedJwt);
            signer.end();
            const normalizedPrivateKey = privateKey.includes('\n')
              ? privateKey
              : privateKey.replace(/\\n/g, '\n');
            const jwt = `${unsignedJwt}.${signer
              .sign(normalizedPrivateKey)
              .toString('base64url')}`;
            core.setSecret(jwt);

            const apiUrl = required('GITHUB_API_URL').replace(/\/+$/g, '');
            let appResponse;
            try {
              appResponse = await fetch(
                `${apiUrl}/app/installations/${encodeURIComponent(expectedInstallationId)}`,
                {
                  headers: {
                    accept: 'application/vnd.github+json',
                    authorization: `Bearer ${jwt}`,
                    'user-agent': 'standards-sync-attestation',
                    'x-github-api-version': '2026-03-10',
                  },
                  method: 'GET',
                  redirect: 'error',
                  signal: AbortSignal.timeout(REQUEST_TIMEOUT_MILLISECONDS),
                },
              );
            } catch (error) {
              fail(`installation metadata request failed: ${error.message}`);
            }
            if (appResponse.status !== 200) {
              fail(`installation metadata request failed with HTTP ${appResponse.status}`);
            }
            let installation;
            try {
              installation = await appResponse.json();
            } catch (error) {
              fail(`installation metadata response is not valid JSON: ${error.message}`);
            }
            if (!installation || typeof installation !== 'object' || Array.isArray(installation)) {
              fail('installation metadata response is malformed');
            }
            if (String(installation.id) !== expectedInstallationId ||
                installation.app_slug !== expectedSlug ||
                installation.repository_selection !== 'selected' ||
                installation.target_type !== 'Organization' ||
                installation.account?.login !== expectedOwner ||
                installation.suspended_at !== null) {
              fail('installation metadata does not match the approved active selected-repository App');
            }

            const readRepositorySnapshot = async () => {
              const seenIds = new Set();
              const snapshot = new Set();
              let totalCount;
              // The first page's total and unique 100-entry non-final pages make this bound exhaustive.
              let maximumPages = 1;
              for (let page = 1; page <= maximumPages; page += 1) {
                const response = await github.request('GET /installation/repositories', {
                  page,
                  per_page: 100,
                  headers: {
                    accept: 'application/vnd.github+json',
                    'x-github-api-version': '2026-03-10',
                  },
                  request: { timeout: REQUEST_TIMEOUT_MILLISECONDS },
                });
                const data = response?.data;
                if (!data || typeof data !== 'object' || Array.isArray(data) ||
                    !Number.isSafeInteger(data.total_count) || data.total_count < 0 ||
                    !Array.isArray(data.repositories) || data.repositories.length > 100) {
                  fail(`repository page ${page} is malformed`);
                }
                if (totalCount === undefined) {
                  totalCount = data.total_count;
                  maximumPages = Math.max(1, Math.ceil(totalCount / 100));
                } else if (data.total_count !== totalCount) {
                  fail(`repository total_count changed on page ${page}`);
                }
                if (data.repositories.length === 0 && snapshot.size < totalCount) {
                  fail(`repository pagination ended early on page ${page}`);
                }
                for (const repository of data.repositories) {
                  const id = repository?.id;
                  const fullName = repository?.full_name;
                  if (!Number.isSafeInteger(id) || id <= 0 || typeof fullName !== 'string' ||
                      !repositoryNamePattern.test(fullName) ||
                      repository?.owner?.login !== expectedOwner) {
                    fail(`repository page ${page} contains a malformed or foreign entry`);
                  }
                  if (seenIds.has(id) || snapshot.has(fullName)) {
                    fail(`repository page ${page} contains a duplicate entry`);
                  }
                  seenIds.add(id);
                  snapshot.add(fullName);
                }
                if (snapshot.size > totalCount) {
                  fail(`repository pagination exceeded total_count on page ${page}`);
                }
                if (snapshot.size === totalCount) {
                  break;
                }
                if (data.repositories.length < 100) {
                  fail(`repository page ${page} is incomplete`);
                }
              }
              return [...snapshot].sort();
            };

            const firstSnapshot = await readRepositorySnapshot();
            const secondSnapshot = await readRepositorySnapshot();
            if (JSON.stringify(firstSnapshot) !== JSON.stringify(secondSnapshot)) {
              fail('repository access changed between consecutive observations');
            }
            const actualSet = new Set(secondSnapshot);
            const missing = [...expectedSet].filter((repository) => !actualSet.has(repository)).sort();
            const excess = secondSnapshot.filter((repository) => !expectedSet.has(repository));
            // A trust root in reach of this write-capable App is the one over-grant that stops every target.
            const trustRoots = required('TRUST_ROOT_REPOSITORIES').split(',').map((name) => name.trim());
            const reachableTrustRoots = excess.filter((repository) => trustRoots.includes(repository));
            if (reachableTrustRoots.length > 0) {
              fail(`trust root ${reachableTrustRoots.join(', ')} is selected on installation ${expectedInstallationId}; remove it under Repository access before any sync runs`);
            }
            // The sync source is expected access; any other excess is reported, never blocking.
            const sourceRepository = required('SOURCE_REPOSITORY');
            const overGranted = excess.filter((repository) => repository !== sourceRepository);
            // A missing target fails only its own sync job.
            core.setOutput('unreachable-repositories', JSON.stringify(missing));
            // One annotation per kind: GitHub caps warning annotations per step.
            if (missing.length > 0) {
              core.warning(`Standards sync App cannot reach manifest targets ${missing.join(', ')}; their sync jobs will fail.`);
            }
            if (overGranted.length > 0) {
              core.warning(`Standards sync App over-grant: ${overGranted.join(', ')} selected on installation ${expectedInstallationId} but not manifest targets. Remove them under Repository access.`);
            }
            const sourceNote = overGranted.length < excess.length ? `; sync source ${sourceRepository} selected as expected` : '';
            core.info(`Attested ${expectedSet.size - missing.length} of ${expectedSet.size} manifest targets for ${expectedSlug} (${overGranted.length} over-granted${sourceNote}).`);

  sync:
    name: Sync (${{ matrix.repo }})
    needs: [build-sync-matrix, attest]
    if: ${{ !inputs.dry-run }}
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    runs-on: ${{ inputs.runner }}
    # Covers the merge-queue wait (MAX_POLLS x POLL_SECONDS = 30 minutes) plus the sync itself.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-sync-matrix.outputs.matrix) }}
    steps:
      - name: Require App access to this target
        env:
          TARGET: ${{ matrix.repo }}
          UNREACHABLE: ${{ needs.attest.outputs.unreachable-repositories }}
        run: |
          set -euo pipefail
          if ! jq --exit-status 'type == "array"' <<< "$UNREACHABLE" > /dev/null; then
            echo "::error::The attest job reported no unreachable-repositories list."
            exit 1
          fi
          if jq --exit-status --arg target "$TARGET" 'any(.[]; . == $target)' <<< "$UNREACHABLE" > /dev/null; then
            echo "::error::The melodic-standards-sync App cannot reach $TARGET: select it under Repository access on installation 144867070, then re-run all jobs (a re-run of this job alone reuses the old attestation), or let the next sync carry it."
            exit 1
          fi

      - name: Require App credentials
        env:
          APP_CLIENT_ID: ${{ secrets.STANDARDS_SYNC_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.STANDARDS_SYNC_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::STANDARDS_SYNC_APP_CLIENT_ID and STANDARDS_SYNC_APP_PRIVATE_KEY are required when dry-run is false"
            exit 1
          fi

      - name: Mint App token scoped to target
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.STANDARDS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.STANDARDS_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ matrix.repo_owner }}
          repositories: ${{ matrix.repo_name }}
          permission-contents: write
          permission-pull-requests: write
          # The mint fails unless the melodic-standards-sync App holds Workflows
          # read/write, approved on installation 144867070.
          permission-workflows: write

      - name: Check out exact standards source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: melodic-software/standards
          ref: ${{ needs.build-sync-matrix.outputs.sha }}
          path: .standards-src
          persist-credentials: false

      # The install runs AFTER the App-token mint, so --ignore-scripts keeps
      # dependency lifecycle scripts out of the credentialed job.
      - name: Detect the engine flavor
        id: engine
        run: |
          set -euo pipefail
          if [[ -f .standards-src/distribution/sync-manifest.mjs ]]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
            echo "Pinned standards ref predates the Node engine — skipping Node prep."
          fi
      - name: Set up Node
        if: steps.engine.outputs.node == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .standards-src/.node-version
      - name: Install engine dependencies
        if: steps.engine.outputs.node == 'true'
        run: |
          set -euo pipefail
          npm ci --prefix .standards-src/distribution \
            --omit=dev --ignore-scripts --no-audit --no-fund \
            --fetch-retries=8 --fetch-retry-mintimeout=1000 \
            --fetch-retry-maxtimeout=60000

      # A merge queue refuses pushes to a queued PR's branch, so wait for the
      # previous sync PR to merge or drop out before checking the target out:
      # a merge lands first and this run then opens a fresh PR on top of it.
      - name: Wait for a queued sync PR to leave the merge queue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BRANCH: chore/standards-sync
          MAX_POLLS: '60'
          OWNER: ${{ matrix.repo_owner }}
          POLL_SECONDS: '30'
          REPO: ${{ matrix.repo_name }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const owner = process.env.OWNER;
            const repo = process.env.REPO;
            const headRefName = process.env.BRANCH;
            const maxPolls = Number(process.env.MAX_POLLS);
            const pollSeconds = Number(process.env.POLL_SECONDS);
            if (!Number.isInteger(maxPolls) || maxPolls < 1 || !(pollSeconds > 0)) {
              core.setFailed(`MAX_POLLS (${process.env.MAX_POLLS}) and POLL_SECONDS (${process.env.POLL_SECONDS}) must be positive numbers.`);
              return;
            }

            const queuedPulls = async () => {
              const { repository } = await github.graphql(
                `query($owner: String!, $repo: String!, $headRefName: String!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequests(headRefName: $headRefName, states: [OPEN], first: 10) {
                      nodes {
                        number
                        isInMergeQueue
                        headRepositoryOwner { login }
                        timelineItems(last: 1, itemTypes: [ADDED_TO_MERGE_QUEUE_EVENT, REMOVED_FROM_MERGE_QUEUE_EVENT]) {
                          nodes { __typename }
                        }
                      }
                    }
                  }
                }`,
                { owner, repo, headRefName },
              );
              // The token holds no merge-queues permission, so the latest
              // queue event backs up isInMergeQueue; pull-requests read covers it.
              const queued = (pull) =>
                pull.isInMergeQueue ||
                pull.timelineItems?.nodes?.at(-1)?.__typename === 'AddedToMergeQueueEvent';
              return (repository?.pullRequests?.nodes ?? [])
                .filter((pull) => queued(pull) && pull.headRepositoryOwner?.login === owner)
                .map((pull) => `#${pull.number}`);
            };

            for (let poll = 0; ; poll += 1) {
              let queued;
              try {
                queued = await queuedPulls();
              } catch (error) {
                // An unreadable queue state must not block the sync it guards.
                core.warning(`Could not read the merge-queue state of ${owner}/${repo}:${headRefName}: ${error.message}`);
                return;
              }
              if (queued.length === 0) {
                if (poll > 0) core.info(`${owner}/${repo}:${headRefName} left the merge queue.`);
                return;
              }
              if (poll >= maxPolls) {
                core.setFailed(
                  `${owner}/${repo} ${queued.join(', ')} on ${headRefName} is still in the merge queue ` +
                  `after ${maxPolls * pollSeconds}s. Re-run this failed job once it leaves the queue; otherwise ` +
                  'the next push to standards main or the weekly reconciliation carries this target.',
                );
                return;
              }
              core.info(`${owner}/${repo} ${queued.join(', ')} is in the merge queue; checking again in ${pollSeconds}s.`);
              await new Promise((resolve) => setTimeout(resolve, pollSeconds * 1000));
            }

      - name: Check out target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          token: ${{ steps.token.outputs.token }}
          path: .target
          persist-credentials: false

      - name: Apply managed components
        env:
          MANIFEST: ${{ inputs.manifest }}
          TARGET: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          bash .standards-src/distribution/sync-manifest.sh apply \
            --source-root .standards-src \
            --manifest "$MANIFEST" \
            --target "$TARGET" \
            --target-root .target

      - name: Build reviewed sync PR body
        env:
          MANIFEST: ${{ inputs.manifest }}
          PR_BODY: ${{ github.workspace }}/.standards-sync-pr-body.md
          REFS: ${{ inputs.refs }}
          STANDARDS_REF: ${{ inputs.standards-ref }}
          STANDARDS_SHA: ${{ needs.build-sync-matrix.outputs.sha }}
          TARGET: ${{ matrix.repo }}
          TARGET_COUNT: ${{ needs.build-sync-matrix.outputs.target-count }}
        run: |
          set -euo pipefail
          qualified_ref_pattern='^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]+$'
          bare_ref_pattern='^#[0-9]+$'
          linkage_lines=()
          if [[ -n "${REFS//[[:space:],]/}" ]]; then
            while IFS= read -r raw_ref; do
              raw_ref="${raw_ref#"${raw_ref%%[![:space:]]*}"}"
              raw_ref="${raw_ref%"${raw_ref##*[![:space:]]}"}"
              [[ -n "$raw_ref" ]] || continue
              if [[ "$raw_ref" =~ ^[0-9]+$ ]]; then
                raw_ref="#${raw_ref}"
              fi
              if [[ "$raw_ref" =~ $qualified_ref_pattern ]]; then
                linkage_lines+=("Refs: ${raw_ref}")
              elif [[ "$raw_ref" =~ $bare_ref_pattern ]]; then
                if [[ "${TARGET_COUNT:-0}" != '1' ]]; then
                  echo "::error::Bare issue ref '${raw_ref}' is ambiguous across ${TARGET_COUNT:-unknown} sync targets; use owner/repo#N or narrow targets to one repository." >&2
                  exit 1
                fi
                linkage_lines+=("Refs: ${raw_ref}")
              else
                echo "::error::Invalid refs entry '${raw_ref}'; expected owner/repo#N (or #N for a single target)." >&2
                exit 1
              fi
            done < <(printf '%s\n' "$REFS" | tr ',' '\n')
          else
            linkage_lines+=('No related issue: recurring automated distribution, not tied to a tracked change.')
          fi
          {
            printf '%s\n' "${linkage_lines[@]}"
            printf '\n## Summary\n\n'
            printf 'Automated exact-file synchronization from '
            printf "[\`melodic-software/standards@%s\`](https://github.com/melodic-software/standards/commit/%s)" \
              "$STANDARDS_SHA" "$STANDARDS_SHA"
            printf " (requested ref \`%s\`).\n\n" "$STANDARDS_REF"
            printf '## Fix\n\n'
            printf "Managed component mappings applied to \`%s\`:\n\n" "$TARGET"
            bash .standards-src/distribution/sync-manifest.sh mappings \
              --source-root .standards-src \
              --manifest "$MANIFEST" \
              --target "$TARGET"
            printf '\n## Verification\n\n'
            printf 'Review and merge this PR normally. '
            printf 'Do not hand-edit these managed files downstream; change their standards source instead.\n\n'
            printf '## Related\n\n'
            printf -- "- [\`melodic-software/standards@%s\`](https://github.com/melodic-software/standards/commit/%s) — source commit this sync distributes.\n" \
              "$STANDARDS_SHA" "$STANDARDS_SHA"
          } > "$PR_BODY"

      # The tree the PR step will commit: the default branch plus the applied
      # components, staged into a copy of the checkout's index: .target stays
      # untouched, and unchanged files are not re-hashed, as in the PR step.
      - name: Compute the prepared sync tree
        id: prepared
        working-directory: .target
        env:
          GIT_INDEX_FILE: ${{ runner.temp }}/standards-sync-prepared.index
        run: |
          set -euo pipefail
          cp "$(git rev-parse --absolute-git-dir)/index" "$GIT_INDEX_FILE"
          git add -A
          base_sha="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse 'HEAD^{tree}')"
          tree="$(git write-tree)"
          {
            echo "base-sha=$base_sha"
            echo "base-tree=$base_tree"
            echo "tree=$tree"
          } >> "$GITHUB_OUTPUT"

      # A target whose ruleset refuses this token any update of the sync branch
      # gets a fresh branch instead: close its open sync PR, delete the branch,
      # and let the PR step create both anew. It runs only when the PR step
      # would otherwise write the existing ref, and never force-updates it.
      - name: Replace the sync branch when the target refuses its update
        id: replace
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_SHA: ${{ steps.prepared.outputs.base-sha }}
          BASE_TREE: ${{ steps.prepared.outputs.base-tree }}
          BRANCH: chore/standards-sync
          OWNER: ${{ matrix.repo_owner }}
          PREPARED_TREE: ${{ steps.prepared.outputs.tree }}
          REPO: ${{ matrix.repo_name }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const owner = process.env.OWNER;
            const repo = process.env.REPO;
            const branch = process.env.BRANCH;
            const target = `${owner}/${repo}:${branch}`;
            core.setOutput('branch-operation', 'kept');

            // The rules endpoint lists the rules on the branch, not whether this
            // token bypasses them, so an `update` rule means replace, never update.
            let updateRules;
            try {
              const { data: rules } = await github.request(
                'GET /repos/{owner}/{repo}/rules/branches/{branch}',
                { owner, repo, branch },
              );
              updateRules = rules.filter((rule) => rule.type === 'update');
            } catch (error) {
              core.warning(`Could not read the rules on ${target}; updating the branch in place: ${error.message}`);
              return;
            }
            if (updateRules.length === 0) return;
            const shas = ['BASE_SHA', 'BASE_TREE', 'PREPARED_TREE'];
            const malformed = shas.filter((name) => !/^[0-9a-f]{40}$/u.test(process.env[name] ?? ''));
            if (malformed.length > 0) {
              core.setFailed(`${malformed.join(', ')} for ${target} is not a commit or tree id; nothing was closed or deleted.`);
              return;
            }
            const ruleNames = updateRules
              .map((rule) => `${rule.ruleset_source} ruleset ${rule.ruleset_id}`)
              .join(', ');

            let head;
            try {
              ({ data: { commit: head } } = await github.rest.repos.getBranch({ owner, repo, branch }));
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            // The PR step leaves a branch alone only when it already holds the
            // prepared tree as one commit on the current default branch.
            const preparedTree = process.env.PREPARED_TREE;
            const unchanged = preparedTree !== process.env.BASE_TREE &&
              head.commit.tree.sha === preparedTree &&
              head.parents.length === 1 &&
              head.parents[0].sha === process.env.BASE_SHA;
            if (unchanged) {
              core.info(`${target} already holds this sync; leaving it alone.`);
              return;
            }

            const { data: pulls } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`, per_page: 100,
            });
            const syncPulls = pulls.filter((pull) => pull.head?.repo?.full_name === `${owner}/${repo}`);
            // Delete first: a refused delete then leaves the sync PR open and
            // its review intact. Deleting a PR's head branch closes the PR; the
            // explicit close below only confirms it.
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              core.setFailed(`Could not delete ${target}, which ${ruleNames} refuses this token any update of; no PR was closed: ${error.message}`);
              return;
            }
            const closed = [];
            for (const pull of syncPulls) {
              try {
                await github.rest.pulls.update({ owner, repo, pull_number: pull.number, state: 'closed' });
              } catch (error) {
                core.warning(`Could not confirm #${pull.number} closed after deleting its head branch: ${error.message}`);
              }
              closed.push(`#${pull.number}`);
            }
            const closedNote = closed.length > 0 ? `, closing ${closed.join(', ')},` : '';
            // With nothing left to sync the PR step opens no PR: its `closed`.
            const operation = preparedTree === process.env.BASE_TREE ? 'closed' : 'replaced';
            core.setOutput('branch-operation', operation);
            const next = operation === 'replaced'
              ? 'for the PR step to create afresh'
              : 'and no new PR opens, since the default branch already holds this sync';
            const message = `${operation === 'replaced' ? 'Replaced' : 'Closed'} ${target}: ${ruleNames} refuses this token any update of it, so it was deleted${closedNote} ${next}.`;
            core.info(message);
            await core.summary.addRaw(`${message}\n`).write();

      - name: Open or update reviewed sync PR
        id: cpr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          path: .target
          token: ${{ steps.token.outputs.token }}
          # API-created commits are signed by GitHub as the installation bot,
          # satisfying target signature rules without direct default-branch pushes.
          sign-commits: true
          branch: chore/standards-sync
          commit-message: "chore: sync standards components (${{ needs.build-sync-matrix.outputs.sha }})"
          title: "chore: sync standards components"
          body-path: ${{ github.workspace }}/.standards-sync-pr-body.md
          labels: standards-sync

      # Arm when the PR was never armed (a PR opened while opted out still gets armed
      # later) or this run pushed a new head. On an unchanged head a reviewer's
      # disarm holds. The arm targets the head GitHub reports for the PR, which can
      # lag the commit this run just created or sit on a commit another actor
      # added; the merge itself still waits on the target's required checks.
      - name: Arm auto-merge on the sync PR
        if: steps.cpr.outputs.pull-request-number != '' && matrix.automerge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
          HEAD_RETRY_SECONDS: '5'
          OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
          OWNER: ${{ matrix.repo_owner }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          REPO: ${{ matrix.repo_name }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const owner = process.env.OWNER;
            const repo = process.env.REPO;
            const pull_number = Number(process.env.PR_NUMBER);
            const headChanged = ["created", "updated"].includes(process.env.OPERATION);
            const pushedHeadOid = process.env.HEAD_SHA;
            const retrySeconds = Number(process.env.HEAD_RETRY_SECONDS);
            const headMismatch = /expected head oid does not match the current head oid/iu;

            const readPull = async () => {
              const { repository } = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      id
                      headRefOid
                      autoMergeRequest { enabledAt }
                      timelineItems(first: 1, itemTypes: [AUTO_MERGE_ENABLED_EVENT, AUTO_SQUASH_ENABLED_EVENT, AUTO_REBASE_ENABLED_EVENT]) {
                        nodes { __typename }
                      }
                    }
                  }
                }`,
                { owner, repo, number: pull_number },
              );
              return repository?.pullRequest;
            };
            const pull = await readPull();
            if (!pull) {
              core.warning(`Could not read ${owner}/${repo}#${pull_number} to arm auto-merge.`);
              return;
            }
            // Read `nodes`, never `totalCount` (it ignores itemTypes). SQUASH arming
            // records AutoSquashEnabledEvent, so all three event types are listed.
            const everArmed = pull.autoMergeRequest || pull.timelineItems.nodes.length > 0;
            if (everArmed && !headChanged) {
              core.info(`Auto-merge was already armed on ${owner}/${repo}#${pull_number} and its head is unchanged; leaving its current state alone.`);
              return;
            }
            if (!pull.headRefOid) {
              core.warning(`No head oid for ${owner}/${repo}#${pull_number}; not arming auto-merge without a head check.`);
              return;
            }

            const arm = (expectedHeadOid) => {
              if (pushedHeadOid && expectedHeadOid !== pushedHeadOid) {
                core.info(`${owner}/${repo}#${pull_number} reports head ${expectedHeadOid}, not the ${pushedHeadOid} this run pushed; arming at the reported head.`);
              }
              return github.graphql(
                `mutation($pullRequestId: ID!, $expectedHeadOid: GitObjectID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId
                    mergeMethod: SQUASH
                    expectedHeadOid: $expectedHeadOid
                  }) {
                    pullRequest { autoMergeRequest { enabledAt } }
                  }
                }`,
                { pullRequestId: pull.id, expectedHeadOid },
              );
            };

            let disarmed = false;
            try {
              // Drop an arm made on an earlier head before arming at the current
              // head; if re-arming then fails, the PR is left disarmed.
              if (pull.autoMergeRequest) {
                await github.graphql(
                  `mutation($pullRequestId: ID!) {
                    disablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId }) {
                      pullRequest { id }
                    }
                  }`,
                  { pullRequestId: pull.id },
                );
                disarmed = true;
              }
              let armedHeadOid = pull.headRefOid;
              try {
                await arm(armedHeadOid);
              } catch (error) {
                if (!headMismatch.test(error.message)) throw error;
                // GitHub's PR head can trail a commit created a few seconds earlier,
                // so wait before the one re-read rather than re-reading the stale head.
                core.info(`Head of ${owner}/${repo}#${pull_number} moved before the arm; re-reading it once.`);
                await new Promise((resolve) => setTimeout(resolve, retrySeconds * 1000));
                armedHeadOid = (await readPull())?.headRefOid;
                if (!armedHeadOid) throw error;
                await arm(armedHeadOid);
              }
              core.info(`Armed auto-merge on ${owner}/${repo}#${pull_number} at ${armedHeadOid}.`);
            } catch (error) {
              // This run disarmed the PR, so a failed re-arm must be visible.
              if (disarmed) {
                core.setFailed(
                  `Disarmed auto-merge on ${owner}/${repo}#${pull_number} but could not re-arm it: ${error.message}`,
                );
                return;
              }
              // An already-mergeable PR (mergeStateStatus CLEAN) makes the mutation
              // error instead of no-op; never fail the sync over a first arm.
              core.warning(
                `Could not arm auto-merge on ${owner}/${repo}#${pull_number}: ${error.message}`,
              );
            }
