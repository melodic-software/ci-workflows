name: Claude Security Review

# Dogfood caller: this repo consumes its own claude-security-review reusable
# workflow with the canonical caller shape. Local `./` ref works because the
# checkout IS this repo. Do NOT add merge_group: the pinned action cannot serve
# that event (#272).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

# A new push to the same PR cancels the superseded review.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/claude-security-review.yml
    # Pass only the one named secret (least privilege) rather than `secrets:
    # inherit`, which would forward every parent secret to the called workflow.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
