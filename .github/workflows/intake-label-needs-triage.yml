name: intake-label-needs-triage

# Reusable workflow — applies a configured floor label (default bare
# `needs-triage`) to an issue that carries no label matching a configured
# prefix (default `priority:`). The floor is not a priority value. A real
# `priority:` tier already on the issue means urgency was set, so the floor
# is skipped. NON-GATING: this never fails a PR or blocks a
# merge; it is a best-effort intake guarantee so a forgotten priority label
# does not silently drop an issue out of the triage queue. It reads the
# issue's live labels, not the event payload, and also skips an issue that
# carries `human-label` (default `needs-human`), so a run that lands after the
# intake-triage lane does not re-add the floor the lane removed.
#
# The caller owns the trigger and MUST use `on: issues: types: [opened,
# reopened]` — `reopened` re-acquires the floor if the tier was cleared while
# the issue was closed. Explicit labels at creation win: the guard below is a
# label-SET membership check (any label starting with `label-prefix`), not a
# content/regex match, so `github/issue-labeler` and the regex-labeler family
# are the wrong primitive here.
#
# FAIL-CLOSED ON A MISSING LABEL, VERIFIED EMPIRICALLY. The raw `POST
# .../issues/{n}/labels` endpoint does NOT 404 on an unknown label name — it
# silently auto-creates a bare label (default gray, no description) and
# succeeds. Relying on that call to fail naturally would defeat the "never
# creates a label" contract, so this workflow calls `GET
# .../labels/{name}` first and hard-fails the job if that 404s, before ever
# calling addLabels. Label taxonomy is github-iac-managed; this workflow only
# APPLIES an existing label.
#
# LOOP SAFETY (no risk, two independent reasons): (1) adding a label emits
# `issues.labeled`, never `issues.opened`/`reopened`, so this cannot
# re-trigger itself; (2) except for `workflow_dispatch`/`repository_dispatch`,
# GITHUB_TOKEN-authored events do not start new workflow runs at all
# (https://docs.github.com/en/actions/reference/events-that-trigger-workflows).
#
# IDEMPOTENT: `addLabels` is a no-op when the label is already present, and
# the guard skips once any tier-prefixed label exists — including a tier a
# human triager applies after this workflow ran, which the triager (not this
# workflow) is responsible for reconciling with `label` (see README).
#
# RATE LIMITS: a 403 or 429 is a rate limit when it carries `retry-after`,
# `x-ratelimit-remaining: 0`, or a message naming a rate limit, the test
# pr-require-checks/gh-api.sh uses; any other 403 fails at once. A rate limit
# waits, then retries once, in gh-api.sh's order: `retry-after` seconds, else
# until `x-ratelimit-reset` when none remain, else 60 seconds. The step's
# waits, summed, stay within RATE_LIMIT_WAIT_SECONDS (10 minutes, inside the
# 15-minute job timeout), which covers the 5-7 minutes measured between a
# refusal and the reset in ci-workflows#855. A wait that does not fit, or a
# second rate limit, fails the job with the reset time, except on the label
# list, which falls back to the event payload as below. The job ends with
# the job token's api-calls and api-budget notices.
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label selected by the caller.
        type: string
        default: ubuntu-24.04
      label:
        description: >-
          Floor label applied when the issue carries no label matching
          label-prefix. Must already exist in the caller's repository — this
          workflow fails the job rather than create it.
        type: string
        default: 'needs-triage'
      label-prefix:
        description: >-
          Prefix defining the label set this workflow treats as "a priority
          tier is already present". Any existing label starting with this
          exact string (case-sensitive) skips application. Must be non-empty:
          an empty prefix would match trivially and the guard would never
          fire.
        type: string
        default: 'priority:'
      human-label:
        description: >-
          Label that routes an issue to a person (the intake-triage lane's
          escalation label). An issue that already carries it is routed, so
          the floor is skipped. Empty turns this check off.
        type: string
        default: 'needs-human'

permissions: {}

jobs:
  apply-label:
    name: Apply floor label when no priority tier is present
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      issues: write # Read the issue's current labels and add the floor label.
    steps:
      - name: Apply the floor label when no priority tier is present
        # Keeps the job a no-op if a caller broadens its trigger beyond
        # `opened`/`reopened`.
        if: >-
          github.event_name == 'issues' &&
          (github.event.action == 'opened' || github.event.action == 'reopened')
        timeout-minutes: 13
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_LABEL: ${{ inputs.label }}
          LABEL_PREFIX: ${{ inputs.label-prefix }}
          HUMAN_LABEL: ${{ inputs.human-label }}
          RATE_LIMIT_WAIT_SECONDS: "600"
        with:
          script: |
            // Each response's rate-limit reading and route, the line
            // report-api-budget's api-budget.cjs writes (a test holds them
            // equal), for the job's api-budget and api-routes notices. A failed
            // write only drops the reading.
            const budget = (status, headers, url) => {
              const values = ["limit", "remaining", "used", "reset", "resource"].map((key) => {
                const value = String(headers?.[`x-ratelimit-${key}`] ?? "");
                return (key === "resource" ? /^[a-z_]+$/u : /^\d+$/u).test(value) ? value : "na";
              });
              // api-budget.cjs's routeOf: the URL's path with no query, name or token.
              const words = new Set("api v3 repos orgs users user installation app graphql pulls issues comments reviews requested_reviewers git refs ref heads tags trees blobs commits compare merges merge check-runs check-suites statuses status labels assignees milestones events timeline actions runs jobs attempts artifacts logs rerun rerun-failed-jobs workflows dispatches variables secrets contents branches protection rules rulesets collaborators permission teams members hooks deployments environments releases search code reactions files rate_limit annotations repositories installations access_tokens pending_deployments cancel update-branch dismissals readme matching-refs languages notifications".split(" "));
              const text = String(url ?? "");
              const host = /^[a-z][a-z0-9+.-]*:\/\/([^/?#]*)([^?#]*)/iu.exec(text);
              const at = text.replace(/^[a-z][a-z0-9+.-]*:\/\/[^/?#]*/iu, "").replace(/[?#][\s\S]*$/u, "").replace(/^\/+/u, "").replace(/^api\/(v3\/)?/u, "").replace(/\/+$/u, "");
              const segments = at.split("/");
              const out = [];
              for (let i = 0, tail = false, name = false; i < segments.length; i++) {
                const seg = segments[i];
                const id = /^[0-9]+$/u.test(seg) ? "{n}" : /^[0-9a-f]{7,}$/iu.test(seg) ? "{sha}" : undefined;
                if (tail || name) {
                  out.push(id ?? "{x}");
                  name = false;
                } else if (i === 1 && segments[0] === "repos" && segments.length >= 3) {
                  out.push("{repo}");
                  i++;
                } else if (id) out.push(id);
                else if (words.has(seg) && !/^(api|v3|graphql)$/u.test(seg)) {
                  out.push(seg);
                  tail = /^(contents|ref|refs|matching-refs|readme|compare|trees)$/u.test(seg);
                  name = /^(labels|branches|tags|users|orgs|teams|members|collaborators|assignees|environments|secrets|variables|workflows|commits|blobs|statuses|releases)$/u.test(seg);
                } else out.push("{x}");
              }
              const route =
                host && !/^(api|uploads)\.github\.com$/iu.test(host[1]) && !/^\/api\//u.test(host[2])
                  ? "other"
                  : at === "graphql"
                    ? "graphql"
                    : at === "" || out.join("/").length > 80
                      ? "other"
                      : out.join("/");
              try {
                const dir = require("node:path").join(process.env.RUNNER_TEMP, "api-budget");
                require("node:fs").mkdirSync(dir, { recursive: true });
                require("node:fs").appendFileSync(require("node:path").join(dir, "github-token"), `${status} ${values.join(" ")} ${route}\n`);
              } catch {
                // No reading: the notice is only missing one.
              }
            };
            github.hook.after("request", (response) => budget(response.status, response.headers, response.url));
            github.hook.error("request", (error) => {
              if (error.response) budget(error.status ?? error.response.status, error.response.headers, error.response.url ?? error.request?.url);
              throw error;
            });

            // The header comment's rate-limit wait. A rate limit that is not
            // waited out throws an error marked rateLimited.
            const waitCap = Number(process.env.RATE_LIMIT_WAIT_SECONDS) || 0;
            let waited = 0;
            const call = async (what, request) => {
              for (let attempt = 0; ; attempt++) {
                try {
                  return await request();
                } catch (error) {
                  const header = (name) => String(error.response?.headers?.[name] ?? "");
                  const status = error.status ?? error.response?.status;
                  const limited =
                    (status === 403 || status === 429) &&
                    (header("retry-after") !== "" ||
                      header("x-ratelimit-remaining") === "0" ||
                      /rate limit/iu.test(String(error.message)));
                  if (!limited) throw error;
                  const reset = /^\d{1,10}$/u.test(header("x-ratelimit-reset")) ? Number(header("x-ratelimit-reset")) : null;
                  const resetAt = reset === null ? "an unknown time" : new Date(reset * 1000).toISOString();
                  const wait = /^\d{1,10}$/u.test(header("retry-after"))
                    ? Number(header("retry-after"))
                    : header("x-ratelimit-remaining") === "0" && reset !== null
                      ? Math.max(1, reset - Math.floor(Date.now() / 1000))
                      : 60;
                  const left = waitCap - waited;
                  if (attempt > 0 || wait > left) {
                    const why = attempt > 0 ? "again after one wait" : `and needs a ${wait}s wait, more than the ${left}s left of ${waitCap}s`;
                    throw Object.assign(
                      new Error(`${what} is rate limited (HTTP ${status}) ${why}. The limit resets at ${resetAt}.`),
                      { rateLimited: true },
                    );
                  }
                  core.warning(`${what} is rate limited (HTTP ${status}); waiting ${wait}s, then retrying once.`);
                  await new Promise((resolve) => setTimeout(resolve, wait * 1000));
                  waited += wait;
                }
              }
            };

            const targetLabel = process.env.TARGET_LABEL || "";
            const labelPrefix = process.env.LABEL_PREFIX || "";

            if (targetLabel.length === 0) {
              core.setFailed("The 'label' input must be non-empty.");
              return;
            }
            if (labelPrefix.length === 0) {
              core.setFailed(
                "The 'label-prefix' input must be non-empty -- an empty prefix " +
                  "would match every issue and the guard would never apply the floor label."
              );
              return;
            }

            // Read the live labels, not the event payload: the intake-triage
            // lane may already have triaged the issue and removed the floor.
            const humanLabel = process.env.HUMAN_LABEL || "";
            // A failed read falls back to the payload, which can only re-add
            // the floor, never drop it.
            let existingLabels;
            try {
              existingLabels = (
                await call("Listing the issue's labels", () =>
                  github.paginate(github.rest.issues.listLabelsOnIssue, {
                    ...context.repo,
                    issue_number: context.payload.issue.number,
                    per_page: 100,
                  })
                )
              ).map((l) => l.name);
            } catch (error) {
              core.warning(`Live labels unreadable, using the event payload: ${error.message}`);
              existingLabels = (context.payload.issue?.labels ?? []).map((l) => l.name);
            }
            if (existingLabels.some((name) => name.startsWith(labelPrefix))) {
              core.info(
                `Issue #${context.payload.issue.number} already carries a label matching ` +
                  `prefix '${labelPrefix}'; skipping.`
              );
              return;
            }
            if (humanLabel && existingLabels.includes(humanLabel)) {
              core.info(`Issue #${context.payload.issue.number} is routed to a person ('${humanLabel}'); skipping.`);
              return;
            }

            // addLabels auto-creates an unknown label, so check first: a 404 fails
            // closed, any other error is an infrastructure failure, not a skip.
            try {
              await call(`Reading label '${targetLabel}'`, () =>
                github.rest.issues.getLabel({ ...context.repo, name: targetLabel })
              );
            } catch (error) {
              if (error.rateLimited) {
                core.setFailed(error.message);
                return;
              }
              if (error.status === 404) {
                core.setFailed(
                  `Label '${targetLabel}' does not exist in ${context.repo.owner}/${context.repo.repo}. ` +
                    "Label taxonomy is github-iac-managed; this workflow only applies an " +
                    "existing label and never creates one -- create it there first."
                );
                return;
              }
              throw error;
            }

            try {
              await call(`Adding '${targetLabel}'`, () =>
                github.rest.issues.addLabels({
                  ...context.repo,
                  issue_number: context.payload.issue.number,
                  labels: [targetLabel],
                })
              );
            } catch (error) {
              if (!error.rateLimited) throw error;
              core.setFailed(error.message);
              return;
            }
            core.info(`Applied '${targetLabel}' to issue #${context.payload.issue.number}.`);

      # The job token's api-calls and api-budget notices, from the readings
      # the script's requests left. It spends no request.
      - name: Log the API budget
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: $/.github/actions/report-api-budget
        with:
          tokens: github-token
