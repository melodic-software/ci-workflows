name: issue-triage-label-self

# Dogfood caller of this repo's issue-triage-label reusable, pinned to its
# merged SHA, not a PR head, so a PR cannot redefine the reusable it runs.
# Uses the real `needs-triage` label, exercising the label-set guard and
# fail-closed existence check end to end.
on:
  issues:
    types: [opened, reopened]

permissions: {}

jobs:
  issue-triage-label:
    permissions:
      issues: write # Downgraded to exactly what the called reusable needs.
    uses: melodic-software/ci-workflows/.github/workflows/issue-triage-label.yml@ac062650c46005edb4787aff378347746bf63804 # v0.27.0
    with:
      label: needs-triage
