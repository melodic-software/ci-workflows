version: 2
updates:
  # Keep SHA-pinned actions current. pr-automerge-dependabot-queue.yml queues
  # patch and minor bumps of the standards dependabot-policy publishers
  # (actions/*, github/*, anthropics/*) once ci-status passes. Every other PR
  # waits for a person: melodic-software callers float on this repository's
  # main, so a merged bump runs next in their secret-holding lanes. The "/"
  # target scans .github/workflows; the glob target is required to also scan
  # the composite actions' own action.yml files (Dependabot does not descend
  # into .github/actions/<name>/ from "/" alone).
  #
  # Dependabot only updates `uses:` action SHAs. The tool versions pinned inside
  # the actions' run scripts and input defaults have no ecosystem manifest here;
  # .github/version-bump/policy.yaml lists them and
  # maintenance-bump-pinned-versions.yml moves them.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    labels: ["dependencies"]
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    # Delay version bumps so a compromised or yanked release is caught before we
    # adopt it; security updates bypass cooldown. Defense-in-depth for the
    # SHA-rewrite supply-chain risk that motivates SHA-pinning (architecture D5).
    cooldown:
      default-days: 3
    # Vendor bumps get their own PR so a community bump never blocks a vendor
    # one; a dependency joins the first group that matches it.
    groups:
      vendor-actions:
        patterns:
          - actions/*
          - github/*
          - anthropics/*
        # Majors fall through to the reviewed group below.
        update-types: [minor, patch]
      github-actions:
        patterns:
          - '*'

  # The check-dependabot-policy action's runtime (ajv, yaml), installed from its
  # own lockfile in each caller's job. Cooldown per the standards
  # dependabot-policy change classes; majors fall through to their own group.
  - package-ecosystem: npm
    directory: /.github/actions/check-dependabot-policy
    labels: ["dependencies"]
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      check-dependabot-policy:
        patterns:
          - '*'
        update-types: [minor, patch]
      check-dependabot-policy-major:
        patterns:
          - '*'
