version: 2
updates:
  # Keep SHA-pinned actions current. Every PR here is reviewed by hand, the
  # vendor-actions group included: melodic-software callers float on this
  # repository's main, so a merged bump runs next in their secret-holding
  # lanes, and no workflow here arms auto-merge. The "/"
  # target scans .github/workflows; the glob target is required to also scan
  # the composite actions' own action.yml files (Dependabot does not descend
  # into .github/actions/<name>/ from "/" alone).
  #
  # Dependabot only updates `uses:` action SHAs. The tool versions pinned inside
  # the actions' run scripts and input defaults have no ecosystem manifest here
  # and are tracked manually at the weekly review.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    labels: ["dependencies"]
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    # Delay version bumps so a compromised or yanked release is caught before we
    # adopt it; security updates bypass cooldown. Defense-in-depth for the
    # SHA-rewrite supply-chain risk that motivates SHA-pinning (architecture D5).
    cooldown:
      default-days: 3
    # Held on v1.0.253: every Bash call in a review lane fails with a bwrap error
    # on the melodic-review Docker workers, seen after the bump to 2.1.311; cause
    # unconfirmed (https://github.com/melodic-software/ci-workflows/issues/938).
    # Remove this once a release starts on those workers.
    ignore:
      - dependency-name: anthropics/claude-code-action
    # Vendor bumps get their own PR so a community bump never blocks a vendor
    # one; a dependency joins the first group that matches it.
    groups:
      vendor-actions:
        patterns:
          - actions/*
          - github/*
          - anthropics/*
        # Majors fall through to the reviewed group below.
        update-types: [minor, patch]
      github-actions:
        patterns:
          - '*'
