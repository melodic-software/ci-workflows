version: 2
updates:
  # Keep SHA-pinned actions current. Merge lanes per the standards
  # dependabot-policy component: the vendor-actions group (non-major only) is
  # the auto-merge lane once its shared workflow is wired in; every other PR is
  # reviewed by hand. The "/"
  # target scans .github/workflows; the glob target is required to also scan
  # the composite actions' own action.yml files (Dependabot does not descend
  # into .github/actions/<name>/ from "/" alone).
  #
  # Dependabot only updates `uses:` action SHAs. The tool versions pinned inside
  # the actions' run scripts and input defaults have no ecosystem manifest here
  # and are tracked manually at the weekly review.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    labels: ["dependencies"]
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    # Delay version bumps so a compromised or yanked release is caught before we
    # adopt it; security updates bypass cooldown. Defense-in-depth for the
    # SHA-rewrite supply-chain risk that motivates SHA-pinning (architecture D5).
    cooldown:
      default-days: 3
    # Vendor bumps get their own PR so a community bump never blocks the
    # auto-merge lane; a dependency joins the first group that matches it.
    groups:
      vendor-actions:
        patterns:
          - actions/*
          - github/*
          - anthropics/*
        # Majors fall through to the reviewed group below.
        update-types: [minor, patch]
      github-actions:
        patterns:
          - '*'
